"use strict";
/* 当夜微调：删一段、插一段、拉长缩短、平移。不重跑排班；只做简单冲突提示。
   同一台望远镜同一时刻两段 = 冲突（不能保存）；其余只提醒。保存时工作台再做一次合法性审核（只检查，不重排）。 */
const TE = {
  dragged: false, drag: null,
  clone(x){ return JSON.parse(JSON.stringify(x)); },
  members(g){ return g === "F32" ? TELS.map(t => t[0]) : TELS.filter(t => t[3] === g).map(t => t[0]); },
  memOf(v){ return v.members && v.members.length ? v.members : TE.members(v.group); },
  iso(ms){ return new Date(Math.round(ms / 6e4) * 6e4).toISOString().replace(".000Z", "Z"); },
  frozen(v){ return U.ms(v.start_utc) <= Date.now(); },
  limits(T){
    const L = T.limits || {}, P = (T.inputs && T.inputs.parameters) || {};
    return {minVisit: L.min_visit_min ?? P.min_visit_min ?? WBPolicy.get("min_visit"),
      minRun: L.min_run_min ?? P.min_run_min ?? WBPolicy.get("min_run"),
      slew: g => { const s = L.max_slew_s && (L.max_slew_s[g] ?? L.max_slew_s.F32); return U.fin(s) ? s / 60 : null; }};
  },
  begin(w){
    const s = TN.st(), T = w.tonight;
    if (!s.draft) s.draft = {visits: TE.clone(T.visits || []), support: TE.clone(T.support || []), edits: []};
    s.mode = "edit";
  },
  orig(w, id){ return (w.tonight.visits || []).find(v => v.visit_id === id) || null; },
  entry(s, id){ return s.draft.edits.find(e => e.visit_id === id); },
  /* 记一笔修改：同一段的多次修改合成一条，before 永远是原计划 */
  note(w, id, after){
    const s = TN.st(), o = TE.orig(w, id);
    let e = TE.entry(s, id);
    if (!e) { e = {op: o ? "move" : "insert", visit_id: id, before: o ? {start_utc: o.start_utc, end_utc: o.end_utc, group: o.group} : null, after: null, _sup: []}; s.draft.edits.push(e); }
    e.after = after;
    if (!after) e.op = "delete";
    else if (e.before) {
      const ds = U.ms(after.start_utc) - U.ms(e.before.start_utc), de = U.ms(after.end_utc) - U.ms(e.before.end_utc);
      e.op = ds === de ? "move" : "resize";
      if (ds === 0 && de === 0) TE.undo(w, id, true);
    }
    return e;
  },
  clean(v){ for (const k of ["runs", "run_id", "zenith_deg", "azimuth_deg", "azimuth_unwrapped_deg", "azimuth_unwrapped_by_group_deg", "grid_utc"]) delete v[k];
    v.expected = Object.assign({}, v.expected || {}, {credit_status: "unassessed"}); v.credit_status = "unassessed"; },
  /* 改动的段所占的望远镜、时段里原有的转向/拆合阵动作要让开 */
  clearSupport(w, v){
    const s = TN.st(), mem = new Set(TE.memOf(v)), A = U.ms(v.start_utc), B = U.ms(v.end_utc), e = TE.entry(s, v.visit_id);
    s.draft.support = s.draft.support.filter(r => {
      const hit = TE.members(r.group === "all" ? "F32" : r.group).some(x => mem.has(x)) && U.ms(r.start_utc) < B && U.ms(r.end_utc) > A;
      if (hit && e) e._sup.push(r);
      return !hit;
    });
  },
  setTimes(w, id, A, B){
    const s = TN.st(), v = s.draft.visits.find(x => x.visit_id === id); if (!v) return;
    if (B - A < 6e4) return;
    v.start_utc = TE.iso(A); v.end_utc = TE.iso(B); TE.clean(v);
    const e = TE.note(w, id, {start_utc: v.start_utc, end_utc: v.end_utc, group: v.group});
    if (e && TE.entry(s, id)) TE.clearSupport(w, v);
  },
  remove(w, id){
    const s = TN.st(), v = s.draft.visits.find(x => x.visit_id === id); if (!v) return;
    s.draft.visits = s.draft.visits.filter(x => x !== v);
    const e = TE.entry(s, id);
    if (e && !e.before) { s.draft.edits = s.draft.edits.filter(x => x !== e); return; } // 插入后又删 = 没发生
    TE.note(w, id, null);
    s.sel = null;
  },
  insert(w, g, taskId, targetId, A, B){
    const s = TN.st(), t = Data.task(taskId, w); if (!t) return;
    let n = 1; const ids = new Set(s.draft.visits.map(v => v.visit_id)); while (ids.has("M" + String(n).padStart(2, "0"))) n++;
    const id = "M" + String(n).padStart(2, "0");
    const field = targetId && t.fields ? t.fields.find(f => t.id + ":" + f.id === targetId || f.id === targetId) : null;
    const src = field ? {ra_deg: field.ra_deg, dec_deg: field.dec_deg} : {ra_deg: t.ra_deg, dec_deg: t.dec_deg};
    const same = (w.tonight.visits || []).find(v => (v.target_id || v.task_id) === (targetId || t.id) && v.pointing);
    const pointing = same ? TE.clone(same.pointing) : {ra_deg: src.ra_deg, dec_deg: src.dec_deg + 0.5, frame: "icrs", source_icrs: src, wobble: {offset_deg: 0.5, pa_deg: 0}};
    if (pointing.runs) delete pointing.runs;
    const v = {visit_id: id, group: g, members: TE.members(g), task_id: t.id, target_id: targetId || t.id, pointing,
      start_utc: TE.iso(A), end_utc: TE.iso(B), sky: null, expected: {credit_status: "unassessed"}, credit_status: "unassessed", prereq: "人工插入"};
    s.draft.visits.push(v);
    TE.note(w, id, {start_utc: v.start_utc, end_utc: v.end_utc, group: g});
    TE.clearSupport(w, v);
    s.sel = id; s.ins = null;
  },
  undo(w, id, silent){
    const s = TN.st(), e = TE.entry(s, id); if (!e) return;
    s.draft.edits = s.draft.edits.filter(x => x !== e);
    s.draft.visits = s.draft.visits.filter(v => v.visit_id !== id);
    const o = TE.orig(w, id); if (o) s.draft.visits.push(TE.clone(o));
    s.draft.support = s.draft.support.concat(e._sup || []);
  },
  /* 冲突与提醒（工作台保存时以服务端为准） */
  check(w, T, m){
    const s = TN.st(), vs = T.visits || [], out = {conflicts: [], warns: [], conflictIds: new Set(), warnIds: new Set()};
    const L = TE.limits(T), edited = new Set(((s.draft && s.draft.edits) || []).filter(e => e.after).map(e => e.visit_id));
    for (let i = 0; i < vs.length; i++) for (let j = i + 1; j < vs.length; j++) {
      const a = vs[i], b = vs[j];
      const A = Math.max(U.ms(a.start_utc), U.ms(b.start_utc)), B = Math.min(U.ms(a.end_utc), U.ms(b.end_utc));
      if (B <= A) continue;
      const mb = new Set(TE.memOf(b)); if (!TE.memOf(a).some(x => mb.has(x))) continue;
      out.conflicts.push({a: a.visit_id, b: b.visit_id, A, B, msg: `${a.group === b.group ? a.group : a.group + " 与 " + b.group} 在 ${U.span(A, B)} 同时有两段（${Data.name(a.target_id || a.task_id, w)}、${Data.name(b.target_id || b.task_id, w)}）`});
      out.conflictIds.add(a.visit_id); out.conflictIds.add(b.visit_id);
    }
    const warn = (v, msg) => { out.warns.push({vid: v.visit_id, msg: Data.name(v.target_id || v.task_id, w) + "（" + v.group + " " + U.span(v.start_utc, v.end_utc) + "）：" + msg}); out.warnIds.add(v.visit_id); };
    const elig = id => { const e = T.eligible_tonight; if (e && !Array.isArray(e)) return e[id]; const p = (T.progress || []).find(r => r.task_id === id); return p && p.eligible_tonight; };
    for (const v of vs) {
      if (!edited.has(v.visit_id)) continue;
      const A = U.ms(v.start_utc), B = U.ms(v.end_utc), dur = (B - A) / 6e4, mem = new Set(TE.memOf(v)), base = String(v.task_id).split(":")[0];
      if (dur < L.minVisit) warn(v, `只有 ${U.n(dur)} 分钟，短于最短访问 ${L.minVisit} 分钟`);
      if (m.dark[0] != null && (A < m.dark[0] || B > m.dark[1])) warn(v, "超出暗夜时段 " + U.span(m.dark[0], m.dark[1]));
      const lim = T.inputs?.parameters?.max_zenith_deg ?? WBPolicy.get("max_zenith"), tr = m.tracks[base];
      if (tr) { const zs = [A, (A + B) / 2, B].map(t => Geom.at(tr, t)).filter(Boolean).map(p => p.z); const zmax = Math.max(...zs);
        if (U.fin(lim) && zmax > lim) warn(v, `天顶角到 ${U.n(zmax, 0)}°，超过几何上限 ${lim}°` + (m.approx ? "（页面近似）" : "")); }
      const el = elig(base);
      if (Array.isArray(el)) { const mode = v.group === "F32" ? "F32" : "S8"; const ok = el.some(r => r.mode === mode && U.ms(r.start_utc) <= A && U.ms(r.end_utc) >= B); if (!ok) warn(v, "不在今晚的合格时段内"); }
      // 与同一批望远镜的前后段之间来不及转向 / 需要拆合阵
      const near = vs.filter(x => x !== v && TE.memOf(x).some(t => mem.has(t)));
      const prev = near.filter(x => U.ms(x.end_utc) <= A).sort(U.by(x => -U.ms(x.end_utc)))[0], next = near.filter(x => U.ms(x.start_utc) >= B).sort(U.by(x => U.ms(x.start_utc)))[0];
      const need = L.slew(v.group);
      for (const [x, gap] of [[prev, prev && (A - U.ms(prev.end_utc)) / 6e4], [next, next && (U.ms(next.start_utc) - B) / 6e4]]) {
        if (!x || (x.target_id || x.task_id) === (v.target_id || v.task_id)) continue; // 同一目标接续的 run 不需要大转向
        if (gap < need) warn(v, `与 ${Data.name(x.target_id || x.task_id, w)} 之间只空 ${U.n(gap, 1)} 分钟，可能来不及转向（${T.limits ? "登记上界" : "按 2 分钟估"} ${U.n(need, 1)} 分钟）`);
        if ((x.group === "F32") !== (v.group === "F32") && gap < need + 4) warn(v, `与 ${Data.name(x.target_id || x.task_id, w)} 之间要${v.group === "F32" ? "合阵" : "拆阵"}，空档可能不够`);
      }
    }
    for (const e of ((s.draft && s.draft.edits) || [])) if (!e.after && e.before) {
      const o = TE.orig(w, e.visit_id); const p = o && (T.progress || []).find(r => r.task_id === String(o.task_id).split(":")[0]);
      if (p && (p.monitoring_due_tonight || p.too || /ToO|采样/.test(p.tonight_label || ""))) out.warns.push({vid: e.visit_id, msg: Data.name(o.target_id || o.task_id, w) + "：删掉了今晚到期的采样或 ToO，将记失窗"});
    }
    return out;
  },
  ghosts(w, T, m, g){
    const s = TN.st();
    return ((s.draft && s.draft.edits) || []).filter(e => e.before && e.before.group === g).map(e => {
      const l = TN.pct(m, U.ms(e.before.start_utc)), wd = TN.pct(m, U.ms(e.before.end_utc)) - l;
      return `<div class="ghost" style="left:${l}%;width:${wd}%" title="原位置 ${U.span(e.before.start_utc, e.before.end_utc)}"></div>`;
    }).join("");
  },
  fromHM(hm, ref){
    const mt = /^\s*(\d{1,2})[:：]?(\d{2})\s*$/.exec(hm || ""); if (!mt) return null;
    const h = +mt[1], mi = +mt[2]; if (h > 23 || mi > 59) return null;
    const bj = U.bj(ref); const day = Date.UTC(bj.getUTCFullYear(), bj.getUTCMonth(), bj.getUTCDate());
    let t = day + (h * 60 + mi) * 6e4 - 8 * 3600e3;
    while (t - ref > 12 * 3600e3) t -= 864e5; while (ref - t > 12 * 3600e3) t += 864e5;
    return t;
  },

  editor(w, T, m, s){
    const box = c => `<div style="border-top:1px solid var(--rule);margin-top:14px;padding-top:12px">${c}</div>`;
    if (s.ins) {
      const t = Data.task(s.ins.task, w) || Data.tasks(w)[0];
      const fields = t && t.fields ? t.fields : null;
      return box(`<b>在 ${s.ins.group} 插入一段</b>

/* 拖动：整段平移 / 两端改时长，按 1 分钟取整 */
document.addEventListener("pointerdown", ev => {
  const b = ev.target.closest && ev.target.closest(".blk.edit"); if (!b || ev.button !== 0) return;
  const w = Data.ws(), s = TN.st(), v = s.draft && s.draft.visits.find(x => x.visit_id === b.dataset.vid); if (!v) return;
  const lane = b.parentElement.getBoundingClientRect(), br = b.getBoundingClientRect(), x = ev.clientX - br.left, m = Geom.night(w);
  const mode = x < 7 ? "l" : x > br.width - 7 ? "r" : "move";
  TE.drag = {b, id: v.visit_id, mode, x0: ev.clientX, A: U.ms(v.start_utc), B: U.ms(v.end_utc), k: (m.x1 - m.x0) / lane.width, m, moved: false, tip: null};
  b.setPointerCapture(ev.pointerId);
});
document.addEventListener("pointermove", ev => {
  const d = TE.drag; if (!d) return;
  const dx = ev.clientX - d.x0; if (!d.moved && Math.abs(dx) < 4) return;
  d.moved = true; d.b.classList.add("dragging");
  const dt = Math.round(dx * d.k / 6e4) * 6e4, now = Date.now();
  let A = d.A, B = d.B;
  if (d.mode === "move") { A += dt; B += dt; } else if (d.mode === "l") A = Math.min(A + dt, B - 6e4); else B = Math.max(B + dt, A + 6e4);
  if (A < now) { if (d.mode === "move") { B += now - A; } A = Math.ceil(now / 6e4) * 6e4; }
  d.nA = A; d.nB = B;
  d.b.style.left = TN.pct(d.m, A) + "%"; d.b.style.width = Math.max(.3, TN.pct(d.m, B) - TN.pct(d.m, A)) + "%";
  if (!d.tip) { d.tip = document.createElement("div"); d.tip.className = "drag-tip"; document.body.appendChild(d.tip); }
  d.tip.textContent = U.span(A, B) + " · " + U.n((B - A) / 6e4) + " min"; d.tip.style.left = (ev.clientX + 12) + "px"; d.tip.style.top = (ev.clientY - 30) + "px";
});
document.addEventListener("pointerup", () => {
  const d = TE.drag; if (!d) return; TE.drag = null;
  if (d.tip) d.tip.remove();
  if (!d.moved) return;
  TE.dragged = true; setTimeout(() => { TE.dragged = false; }, 80);
  const w = Data.ws(), s = TN.st(); s.sel = d.id;
  TE.setTimes(w, d.id, d.nA, d.nB); keepY(App.render);
});

/* ==== 41zz-replan.js ==== */
"use strict";

const ManualReplan = {
  plans: new Map(),
  button(w, plan){
    if (Data.replayView || !Data.server.on || w.origin !== "server" || plan.kind !== "tonight" ||
        w.status !== "confirmed") return "";
    const draft = ManualReplan.plans.get(plan.plan_id);
    return `<button class="btn" data-act="previewRemainingNight" ${draft?.busy ? "disabled" : ""}>重排余夜</button>`;
  },
  changed(before, after){
    const ties = new Map();
    const key = row => JSON.stringify([row.group, row.task_id, row.target_id,
      row.pointing?.ra_deg, row.pointing?.dec_deg]);
    for (const row of after.visits) {
      const id = key(row);
      if (!ties.has(id)) ties.set(id, []);
      ties.get(id).push([U.ms(row.start_utc), U.ms(row.end_utc)]);
    }
    const rows = [];
    for (const row of before.visits) {
      let start = U.ms(row.start_utc);
      const end = U.ms(row.end_utc);
      const put = (a,b) => rows.push({visit_id:row.visit_id, group:row.group, task_id:row.task_id,
        target_id:row.target_id, start_utc:new Date(a).toISOString(), end_utc:new Date(b).toISOString()});
      for (const [a,b] of (ties.get(key(row)) || []).sort((x,y) => x[0]-y[0])) {
        if (b <= start || a >= end) continue;
        if (a > start) put(start,a);
        start = Math.max(start,b);
      }
      if (end > start) put(start,end);
    }
    return rows;
  },
  render(w, plan, model){
    const draft = ManualReplan.plans.get(plan.plan_id);
    if (!draft || Data.replayView) return "";
    const head = '<div class="card-h"><h2>余夜重排草案</h2></div>';
    if (draft.busy) return `<section class="card" aria-live="polite">${head}<p class="note">正在后台计算，原计划继续执行。</p></section>`;
    if (draft.error) return `<section class="card" role="status">${head}<p class="note">${U.esc(draft.error)}</p></section>`;
    const removed = ManualReplan.changed(plan,draft.plan), added = ManualReplan.changed(draft.plan,plan);
    const bars = (rows, group, ghost) => rows.filter(row => row.group === group).map(row => {
      const left = TN.pct(model, Math.max(U.ms(row.start_utc), model.x0));
      const right = TN.pct(model, Math.min(U.ms(row.end_utc), model.x1));
      if (right <= left) return "";
      const name = Data.name(row.task_id, w), color = Data.color(row.task_id,w);
      const tip = `${name} · ${U.span(row.start_utc,row.end_utc)}`;
      return `<span class="${ghost ? "ghost-blk" : "solid-blk"}" title="${U.esc(tip)}"
        style="left:${left}%;width:${right-left}%;--source-color:${color};${ghost ? "" : "background:"+color}"></span>`;
    }).join("");
    return `<section class="card" data-manual-replan-comparison>${head}
      <p class="note">待值班确认。浅色虚线为移出或截短的 ON，实色为新增的 ON。</p>
      ${["F32","A8","B8","C8","D8"].filter(g => [...removed,...added].some(row => row.group === g)).map(group =>
        `<div class="row" style="gap:8px;align-items:center"><b>${group}</b><div class="lane grow">
          ${bars(removed,group,true)}${bars(added,group,false)}</div></div>`).join("")}
      <details class="foldnote"><summary>逐段对照，移出 ${removed.length} 段，新增 ${added.length} 段</summary>
        ${ReplayToo.table(w,"原计划移出或截短的 ON",removed,"removed")}
        ${ReplayToo.table(w,"新增的 ON",added,"added")}</details>
      <div class="row">
        <button class="btn primary" data-act="confirmRemainingNight" ${draft.confirming ? "disabled" : ""}>确认并替换原计划</button>
        <button class="btn" data-act="discardRemainingNight" ${draft.confirming ? "disabled" : ""}>关闭草案</button>
      </div>${draft.confirmError ? `<p class="note" role="status">${U.esc(draft.confirmError)}</p>` : ""}</section>`;
  }
};

App.acts.previewRemainingNight = async () => {
  if (App.needOperator()) return;
  const id = Data.ws()?.tonight?.plan_id;
  if (!id || ManualReplan.plans.get(id)?.busy) return;
  const draft = {busy:true};
  ManualReplan.plans.set(id,draft);
  keepY(App.render);
  try {
    const started = await Data.api("/api/preview-replan",{source_plan_id:id,operator:App.state.operator});
    draft.jobId = started.job.id;
    for (;;) {
      const job = await Data.api("/api/jobs/" + encodeURIComponent(draft.jobId));
      if (job.status === "succeeded") {
        draft.plan = job.results.find(row => row.name === "night.json")?.result;
        if (!draft.plan) throw new Error("审核结果未提供余夜草案");
        break;
      }
      if (!["running","queued"].includes(job.status)) throw new Error(job.error || "后台计算未完成");
      await new Promise(resolve => setTimeout(resolve,1000));
    }
  } catch (error) {
    draft.error = error.message;
  } finally {
    draft.busy = false;
    if (App.state.route === "tonight" && Data.ws()?.tonight?.plan_id === id) keepY(App.render);
  }
};

App.acts.confirmRemainingNight = async () => {
  if (App.needOperator()) return;
  const id = Data.ws()?.tonight?.plan_id, draft = ManualReplan.plans.get(id);
  if (!draft?.plan || draft.confirming) return;
  draft.confirming = true;
  keepY(App.render);
  try {
    const result = await Data.api("/api/jobs/" + encodeURIComponent(draft.jobId) + "/confirm-replan",
      {operator:App.state.operator});
    await Data.refreshServer();
    if (Data.ws()?.tonight?.plan_id === id) Data.select("ver:" + result.plan_id);
    ManualReplan.plans.delete(id);
  } catch (error) {
    draft.confirmError = error.message;
  } finally {
    draft.confirming = false;
    if (App.state.route === "tonight") keepY(App.render);
  }
};

App.acts.discardRemainingNight = () => {
  ManualReplan.plans.delete(Data.ws()?.tonight?.plan_id);
  keepY(App.render);
};

"use strict";
/* 全年：夜历（每夜一列）、按月的时间账、源 × 月。 */
const YR = {
  st(){ if (!App.state.yr) App.state.yr = {sel: null, sim: -1}; return App.state.yr; },
  workspaces(w){
    if (["latest", "server"].includes(w.origin)) return Data.list.filter(v => v.origin === w.origin);
    if (w.origin === "bundle") return Data.list.filter(v => v.origin === w.origin && v.sub === w.sub);
    return [w];
  },
  seasons(w){
    if (w.origin === "latest") return Data._latestSeasons || [];
    return w.origin === "bundle" ? Data._bundleSeasons || [] : [];
  },
  basis(w){
    const date = w.long?.night_local_date || Data.workspaceNight(w);
    const replay = !!Data.replayView;
    const reportDates = replay && date ? Data.list.filter(v => v.meta?.preferred && !v.meta.no_report_note &&
      U.fin(v.meta.replay?.simulated_on_union_min) && v.meta.date < date).map(v => v.meta.date).sort() : [];
    const annuals = Object.values(w.annuals || (w.annual ? {current: w.annual} : {}));
    const reportDate = reportDates.at(-1);

  },
  /* 有全年账（自然年）时按自然年看，1—12 月；只有全期结果时按规划期看朔望月 */
  natural(w){ return !!(w && (w.annuals ? Object.keys(w.annuals).length : w.annual)); },
  years(w){

  },
  year(w){

  dates(w){

      else { const P = Data.anyPlan(w); const y = P ? +P.night_local_date.slice(0, 4) : new Date().getFullYear(); a = y + "-01-01"; b = y + "-12-31"; }

  },
  /* 当前选中自然年的全年账（只读，不计算） */
  merged(w){

    if (!d || !(d.months || []).length) return null;

  },
  /* 每夜：后端 annual.nights 优先，否则页面近似 */
  nights(w){
    const dates = YR.dates(w), an = YR.merged(w), dd = Data.darkDef(), site = Data.site(w);
    const key = (w ? w.id : "") + dates[0] + dates.length + (an && an.nights ? "n" : "a") + dd.sun;
    if (YR._key === key) return YR._n;
    let list, approx = false;
    if (an && Array.isArray(an.nights) && an.nights.length) {
      const map = new Map(an.nights.map(n => [n.night_local_date, n]));

  /* 按月的账：新版全年账（自然月）> 旧版全年账（自然月）> 全期结果（朔望月） */
  months(w){

        const spA = ((m.selected_plan || {})[sc] || {}).allocated_wall_min;

      })};
    }
    if (an && Array.isArray(an.months) && an.months.length && an.months[0].availability) {
      return {kind: "natural-old", src: "全年账（自然月，旧格式）", rows: an.months.map(m => {
        const a = m.availability || {}, p = (m.selected_plan || {}).exp || {}, u = m.usage || {};
        const segs = [{c: "var(--used)", v: u.used_wall_min, l: "已用"}, {c: "var(--tier1)", v: p.allocated_wall_min, l: "已分配"}, {c: "free", v: p.annual_remaining_min, l: "未分配"}];

};

        ${U.fin(r.capPess) ? `<span class="cap" style="left:${r.capPess / max * 100}%"></span>` : ""}
      </div>
      <div class="r3 num small" style="text-align:right">${U.h(r.capExp, 0)} h<span class="muted"> · 悲观 ${U.h(r.capPess, 0)}</span></div>`).join("");
    const ord = c => ["var(--used)", "var(--tier1)", "var(--tier2)", "var(--tier3)", "var(--tierx)", "free", "notgt"].indexOf(c);
    const keys = U.uniq(M.rows.filter(r => !r.closed && !r.outside).flatMap(r => r.segs.filter(x => U.fin(x.v) && x.v > 0).map(x => x.c + "|" + x.l))).sort(U.by(k => ord(k.split("|")[0])));
    const legend = keys.map(k => { const [c, l] = k.split("|"); const st = c === "free" ? "background:var(--card);box-shadow:inset 0 0 0 1px var(--axis)" : c === "notgt" ? "background:repeating-linear-gradient(135deg,var(--hatch) 0 2px,var(--card) 2px 5px)" : "background:" + c; return `<span><i class="key" style="${st}"></i>${U.esc(l)}</span>`; }).join("");
    // 口径：从结果里的数反推三层关系，只用来解释

    const eff = r0 ? r0.capExp / r0.obs : null, ratio = r0 && U.fin(r0.capPess) ? r0.capPess / r0.capExp : null, of = r0 && r0.of;

  },

  sourceMonths(w, M){
    const tasks = Data.tasks(w), an = YR.merged(w), L = w.long;
    let cols = [], cell = () => null;
    if (an && an.task_months && M && M.kind !== "lunation") {
      cols = M.rows.map(r => r.label);
      cell = (t, j) => {
        const month = +M.rows[j].monthKey.slice(5, 7);
        const r = (an.task_months[t.id] || []).find((row, index) => +(row?.month || index + 1) === month) || {};
        const pc = r.planned_credit_f32 || {};
        return {exp: pc.exp, pess: pc.pess, obs: r.accepted_credit_f32, outside: M.rows[j].outside};
      };
    } else if (L && L.months) {
      const y = YR.natural(w) ? String(YR.year(w)) : null;
      const lm = y ? L.months.filter(m => m.first_night.slice(0, 4) === y || m.last_night.slice(0, 4) === y) : L.months;
      const cal = lm.length && lm[0].period_unit === "calendar_month";
      cols = lm.map(m => cal ? (+String(m.month || m.period_id).slice(5, 7)) + " 月" : U.md(m.first_night));
      cell = (t, j) => {
        const pr = (L.progress || []).find(p => p.task_id === t.id); if (!pr) return null;
        const al = pr.allocations || [], mm = lm[j];
        const match = a => a.period_unit ? (a.month || a.period_id) === (mm.month || mm.period_id) : a.lunation === mm.plan_lunation_index;
        const pick = sc => U.sum(al.filter(a => a.scenario === sc && match(a)), a => a.credit_f32);
        return {exp: pick("exp"), pess: pick("pess")};
      };
    } else return missing("各源每月计划", "需要全期结果（kind = long_term）或全年账 task_months");
    const prog = (L && L.progress) || [];
    const tint = (c, a) => `color-mix(in srgb,${c} ${(U.clamp(a, 0, 1) * 100).toFixed(0)}%,transparent)`;
    const booked = cols.length && tasks.some(t => cols.some((_, j) => cell(t, j)?.obs > 0));
    const obsWord = Data.isReplay(w) ? "已入账（模拟）" : "已入账";
    const rows = tasks.map(t => {
      const cells = cols.map((_, j) => cell(t, j));
      const pr = prog.find(p => p.task_id === t.id) || {};
      const observed = U.sum(cells, c => c?.obs), future = U.sum(cells, c => c?.exp);
      const accepted = U.fin(observed) ? pr.accepted_min : null;
      const progress = U.fin(accepted) && t.approved_min > 0 ? accepted / t.approved_min : null;
      const elsewhere = YR.natural(w) && future === 0 && Object.values(w.annuals || {}).some(a => a.year !== an?.year &&
        (a.task_months?.[t.id] || []).some(r => r?.planned_credit_f32?.exp > 0));
      const status = future === 0 ? (progress >= 1 ? "已达批准量" : elsewhere ? "计划在其他年份" : "本年无新增计划") : (pr.exit_label || "");
      const tight = pr.urgency_grade && pr.urgency_grade !== "ok";
      // 每月格：源色，深浅 = 这个源各月里的相对多少；实色 = 已入账，浅色斜纹 = 未来计划（同一月两样都有时左右分开）
      const mx = Math.max(1e-9, ...cells.map(c => (c?.obs > 0 ? c.obs : 0) + (c?.exp > 0 ? c.exp : 0)));
      const renderCell = c => {
        const o = c?.obs > 0 ? c.obs : 0, e = c?.exp > 0 ? c.exp : 0, v = o + e;
        if (!v) return `<td class="c ym-td${c?.outside ? " ym-out" : ""}"${c?.outside ? ' title="规划期外"' : ""}></td>`;
        const al = .22 + .68 * v / mx, solid = tint(t.color, al), soft = tint(t.color, .14 + .42 * v / mx);
        const cut = (o / v * 100).toFixed(1);
        const bg = !e ? solid : !o ? soft : `linear-gradient(90deg,${solid} 0 ${cut}%,${soft} ${cut}%)`;
        const ink = !e && al > .55 ? "#fff" : "var(--ink)";

  /* GCN 公告表的时刻：北京时间“11/10 14:42:32”，原文放悬停 */
  bjTime(t){ const s = t && U.ms(t) != null ? ReplayToo.time(t) : ""; return s ? s.slice(5).replace("-", "/") : "—"; },
  /* 只留有值的字段：dd 里除了“—”、单位和分隔符什么都没有的那一行不显示（11-24） */
  dropEmpty(html){
    return String(html).replace(/<dt>([^<]*)<\/dt>\s*<dd([^>]*)>([\s\S]*?)<\/dd>/g, (all, k, attr, v) =>
      v.replace(/<[^>]+>/g, "").replace(/[—\-–\s·\/°%=+±→]|分钟|分|TeV|τ|ΔV|Y|已用|剩余|未提供/g, "") === "" ? "" : all);
  },
  /* 没有首块时说明为什么没有首块、价值和转向 */
  notPlaced(info){
    const st = AL.decision(info), why = info.decision?.reason;
    const pending = /待批|待复核|等窗口|已排队|待合并|待确认/.test(st || "");
    return pending ? `还没有排入（${st}），排入后才有首块、价值和转向。`
      : `这个告警没有排入当夜计划${st ? "（" + st + (why ? "：" + (AL.WHY[why] || why) : "") + "）" : ""}，所以没有首块、价值和转向。`;
  },
  /* 被打断的记录里，那个源之后又接着看的（修正后的计划里没有真的停下）不算打断，不画 */
  cuts(e, T){
    const visits = (T && T.visits) || [];
    return (e.interrupted || []).filter(x => {
      const at = U.ms(x.at_utc), base = String(x.task_id).split(":")[0];
      if (at == null) return true;
      return !visits.some(v => String(v.task_id).split(":")[0] === base && v.group === x.group &&
        U.ms(v.start_utc) <= at + 5 * 6e4 && U.ms(v.end_utc) > at + 6e4);
    });
  },
  st(){ if (!App.state.al) App.state.al = {sel: null, busy: false, details: new Map()}; return App.state.al; },
  serverEvents(w = Data.ws()){
    if (Data.replayView || Data.isReplay(w)) return [];
    const night = Data.night();
    return (Data.server.events || []).filter(event => {
      if (event.night_local_date != null) return event.night_local_date === night;
      return !!event.plan_id && ((event.plan_id === w?.tonight?.plan_id && Data.workspaceNight(w) === night)
        || Data.server.versions?.some(plan => plan.plan_id === event.plan_id && plan.night_local_date === night));
    });
  },
  events(){
    const w = Data.ws(), T = w && w.tonight, map = new Map();
    for (const e of ((T && T.events) || [])) map.set(e.event_id, {...e});
    for (const e of AL.serverEvents(w)) map.set(e.event_id, {...map.get(e.event_id), ...e});
    const rows=[...map.values()].sort(U.by(e => -(U.ms(e.decided_utc || e.received_utc) || 0)));
    const approvedCandidates=new Set();
    const aliases=new Set();
    const revisions=new Set();
    const provenance=[T?.alert,...Object.values(T?.alert_history || {})].filter(Boolean);
    for (const info of provenance) {
      const contract=info.contract;
      const candidateId=contract?.provenance?.candidate_id;
      if (candidateId) approvedCandidates.add(candidateId);
      const aliased=new Set();
      for (const item of info.notices || []) {
        if (item.event_id!==contract?.event_id || item.source!==contract?.source) aliased.add([item.source,item.event_id].join("|"));
      }
      for (const item of info.merge_log || []) {
        if (item.kind==="split") for (const detached of item.detached_notices || []) aliased.delete([detached.source,detached.event_id].join("|"));
      }
      for (const id of aliased) aliases.add(id);
    }
    return rows.filter(e=>{
      const key=[e.source,e.alert_id].join("|");
      if (e.superseded_by || aliases.has(key) || approvedCandidates.has(e.alert_id) && e.candidate) return false;
      if (!e.project && !e.candidate || !e.alert_id) return true;
      if (revisions.has(key)) return false;
      revisions.add(key);
      return true;
    });
  },
  info(T,e){
    const saved = [T?.alert,...Object.values(T?.alert_history || {})].find(info =>
      info?.contract?.event_id === e.alert_id && info?.contract?.source === e.source &&
      (!info.decision?.assessed_utc || info.decision.assessed_utc === e.decided_utc));
    const detail = AL.st().details.get(e.event_id);
    return {...e, ...e.too, ...e.grb, ...saved, ...(!Data.isReplay() && e.plan_id && detail?.plan === e.plan_id ? detail.value : null)};
  },
  decision(e){
    const state = AL.state(e) || (e.candidate ? "candidate" : "");
    return AL.openingLabel(e.opening_plan) || AL.DECISION[state] || state || (e.alert_class === "afterglow" ? "按余辉处理" : "");
  },
  openingLabel(mode){
    return mode === "approved" ? "开夜前批准 · 进入当晚计划" : mode === "accepted" ? "开夜前通过 · 进入当晚计划" : "";
  },
  computeText(w, T, info){
    if (!Data.replayView) return "";
    const selected = T?.alert;
    const corrected = String(w?.id || "").startsWith("correction:") && selected?.contract?.event_id != null &&
      selected.contract.event_id === info.contract?.event_id && selected.decision?.assessed_utc === info.decision?.assessed_utc;
    const elapsed = info.replay_compute_seconds ?? (corrected ? T.solver?.wall_s : null);
    return [U.fin(elapsed) ? `实测计算 ${U.n(elapsed, 0)} s` : "",
      U.fin(info.replay_opening_seconds) ? `重编当夜计划 ${U.n(info.replay_opening_seconds, 0)} s` : ""].filter(Boolean).join(" · ");
  },
  // 显示名统一走 Data.alertLabel（规则见 10-data.js）；公告候选用候选目标名
  label(e){ return (e.candidate && (e.candidate.target || e.candidate.target_name)) || Data.alertLabel(e) || e.alert_name || e.alert_id || e.event_id; },
  /* 阵列状态的写法和当夜页组道一致：F32 时写“F32 全阵”；真正分四组看才写“四组：A8·B8·C8·D8” */
  arrayText(e, info){
    const cfg = info?.selected_configuration ?? e?.selected_configuration ?? e?.first_block?.configuration;
    const g = [...new Set((e?.groups || info?.selected_groups || []).map(String))];
    if (cfg === "F32" || g.includes("F32")) return "F32 全阵";
    if (!g.length) return cfg ? String(cfg) : "—";
    return (g.length === 4 ? "四组：" : "8 台组：") + g.join("·");
  },
  // 排班程序给“等一等”的理由是英文短句；常见的几句翻成中文，其余照原文
  waitReason(text){
    const t = String(text || "").trim();
    if (!t) return "—";
    const known = [
      [/^wait for (the )?interrupted current runs?,? then (the )?realized slew\.?$/i, "等正在执行的 run 结束，再加实际转向时间"],
      [/^wait for (the )?current runs? to (finish|end)\.?$/i, "等正在执行的 run 结束"],
      [/^wait for (the )?(target|source) to rise\.?$/i, "等目标升起"],
    ];
    const hit = known.find(([re]) => re.test(t));
    return hit ? hit[1] : t;
  },
  state(e){ return e.decision?.state || e.decision_state || e.state || e.candidate?.state; },
  pending(e){ return ["manual","needs_approval","needs_review","candidate","pending_merge"].includes(AL.state(e)) || !!e.pending_merges?.length; },
  approvalStatus(info){
    const approval=info.simulated_approval, status=approval?.status;
    if (status === "approved" && approval.withdrawn) return "已批准 · 后续撤回";
    return {approved:"已批准",scheduled:"已抽中，待到模拟批准时刻",not_selected:"未抽中",
      timed_out:"已超时",not_observable:"不可观测，未抽取",cancelled:"已取消"}[status];
  },
  approvalDetails(info){
    const approval=info.simulated_approval, status=AL.approvalStatus(info);
    if (!approval || !status) return "";
    const when=approval.approved_utc || approval.due_utc;
    const forecast=approval.status === "approved" ? null : info.if_approved;
    const window=forecast?.start_utc && forecast?.end_utc ? U.span(forecast.start_utc,forecast.end_utc) : "无完整合格窗口";
    const rank=forecast?.recommendation?.level || forecast?.rank;
    return `<section class="card" data-simulated-approval="${U.esc(approval.status)}"><div class="card-h">
      <h2>模拟审批</h2><span class="pill sim">${U.esc(status)}</span></div>
      <dl class="kv"><dt>操作人</dt><dd>${U.esc(approval.operator || "模拟值班（随机抽取）")}</dd>
      <dt>抽取设置</dt><dd>种子 ${U.esc(approval.seed ?? "—")} · 批准概率 ${U.pct(approval.probability,1)} · 延迟 ${U.n(approval.latency_min,1)} 分钟</dd>
      ${when && approval.selected ? `<dt>${approval.approved_utc ? "模拟批准 UTC" : "拟批准 UTC"}</dt><dd class="num">${U.esc(when)}</dd>` : ""}
      ${forecast ? `<dt>若批准</dt><dd>${window} · 天顶角 ${U.n(forecast.zenith_deg,1)}° · 预计覆盖 ${U.pct(forecast.expected_coverage,1)}${rank ? " · " + U.esc(AL.RECOMMEND[rank] || rank) : ""}</dd>` : ""}
      </dl></section>`;
  },
  remaining(deadline,reference){
    const elapsed = Math.ceil((U.ms(deadline) - reference) / 1000);
    return elapsed <= 0 ? "已超时" : elapsed >= 3600 ? `${Math.floor(elapsed / 3600)} 小时 ${Math.floor(elapsed % 3600 / 60)} 分` : `${Math.floor(elapsed / 60)} 分 ${elapsed % 60} 秒`;
  },
  clock(deadline, reference){
    if (U.ms(deadline) == null) return "";
    return `<span class="pill plain" title="截止 ${U.esc(deadline)}" data-too-until="${U.esc(deadline)}">${AL.remaining(deadline,reference)}</span>`;
  },
  reference(w, info){ return Data.isReplay(w) ? U.ms(info.decision?.assessed_utc || info.decided_utc || info.received_utc) ?? Date.now() : Date.now(); },
  stepRows(info){
    const names = ["项目","接收与合并","筛选","紧迫度","方式与状态","块循环","记账"];
    const steps = Array.isArray(info.steps) ? info.steps : Object.entries(info.steps || {}).map(([key, value]) => ({key, ...value}));
    return steps.map((step, i)=>{
      const state=step.state ?? step.result ?? step.status ?? step.outcome ?? step.urgency ?? step.method ?? step.project;
      const outcome=typeof state==="object" ? state?.state || state?.kind || "" : state;
      const reasons=[step.reason, step.rule, step.configuration, ...(step.states || []), ...(Array.isArray(step.reasons) ? step.reasons : [])]
        .filter(Boolean).map(x=>AL.WHY[x] || AL.RULE[x] || x);
      if (U.fin(step.notice_count)) reasons.push(`${step.notice_count} 条通知 · ${step.pending_merges?.length || 0} 条待合并`);
      if (step.blocks?.length) reasons.push(`${step.blocks.length} 条重判记录`);
      if (U.fin(step.used_on?.total_min)) reasons.push(`已用 ${U.n(step.used_on.total_min,1)} 分`);
      if (U.fin(step.pool?.remaining_min)) reasons.push(`池余额 ${U.n(step.pool.remaining_min,1)} 分`);
      const outcomeLabel=AL.DECISION[outcome] || AL.URGENCY[outcome] || AL.PROJECT[outcome] || {greedy:"贪心铺场",wobble:"单场 wobble"}[outcome] || outcome;
      return `<li><b>${U.esc(step.label || names[(step.step || i+1)-1] || step.key || "")}</b>${outcome ? ` <span class="pill plain">${U.esc(outcomeLabel)}</span>` : ""}${reasons.length ? `<div class="small muted">${reasons.map(U.esc).join(" · ")}</div>` : ""}</li>`;
    }).join("");
  },
  chain(w, info, inner=false){
    const notices=Array.isArray(info.notices) ? info.notices : [];
    const merged=Array.isArray(info.merge_log) ? info.merge_log : [];
    const blocks=info.block_recalculations || info.block_log || [];
    const steps=AL.stepRows(info);
    const forecast=info.forecast || {}, recommendation=info.recommendation || info.candidate?.recommendation || {};
    const candidate=info.candidate || {};
    if (!(steps || notices.length || info.project || info.candidate || info.forecast)) return inner ? null : "";
    const project=info.project || info.decision?.project, urgency=info.urgency || info.decision?.urgency;
    const context=[AL.PROJECT[project] || project, AL.URGENCY[urgency] || urgency].filter(Boolean).join(" · ");
    const reasonList=[...(recommendation.reasons || []), ...(candidate.reasons || [])].map(x=>AL.WHY[x] || x);
    const later=AL.clock(info.manual_deadline_utc || info.decision?.manual_deadline_utc, AL.reference(w,info));
    const mapAt=info.map_replacement?.at_utc;
    const field=(name,value)=>`<dt>${name}</dt><dd>${value}</dd>`;
    const stateReason=info.decision?.reason || info.start_utc_reason || candidate.reason;
    const title = info.candidate ? (AL.state(info)==="parse_failed" ? "公告解析记录" : "公告候选") : "事件判定";
    const pill = `<span class="pill">${U.esc(context || AL.decision(info) || "待确认")}</span>`;
    const nSteps = (steps.match(/<li>/g) || []).length;
    const dl = `<dl class="kv">
      ${field("当前状态", U.esc(AL.decision(info) || "—") + (stateReason ? " · " + U.esc(AL.WHY[stateReason] || stateReason) : "") + (later ? ` · ${later}` : ""))}
      ${info.forecast ? field("观测预报", `${forecast.start_utc ? `${U.ymd(forecast.start_utc)} ${U.hm(forecast.start_utc)}` : "—"} · 天顶角 ${U.n(forecast.zenith_deg,1)}° · 覆盖 ${U.pct(forecast.probability,1)} · ${U.n(forecast.duration_min,1)} 分`) : ""}
      ${recommendation.level ? field("推荐", `${U.esc(AL.RECOMMEND[recommendation.level] || recommendation.level)}${reasonList.length ? ` · ${reasonList.map(U.esc).join(" · ")}` : ""}`) : ""}
      ${info.candidate && U.fin(candidate.ra_deg) && U.fin(candidate.dec_deg) ? field("坐标", `${U.n(candidate.ra_deg,4)}° / ${U.n(candidate.dec_deg,4)}°`) : ""}
      ${info.candidate && /^https?:\/\//i.test(candidate.source_url || "") ? field("公告", `<a href="${U.esc(candidate.source_url)}" target="_blank" rel="noopener noreferrer">${U.esc(candidate.source || "查看来源")}</a>`) : ""}
      ${mapAt ? field("官方天图替换", `${U.ymd(mapAt)} ${U.hm(mapAt)} · 已看场在新图上重算 ${U.pct(info.map_replacement.recomputed_covered_probability,1)}`) : ""}
      </dl>`;
    const rest = `${steps ? `<details class="too-steps-d"><summary>七步判定 · ${nSteps} 步</summary><ol class="too-steps" aria-label="ToO 七步">${steps}</ol></details>` : ""}
      ${notices.length ? `<details><summary>通知历史 · ${notices.length} 条</summary><div class="scroll-x"><table class="t"><thead><tr><th>仪器</th><th>通知</th><th>收到</th><th>定位</th></tr></thead><tbody>${notices.map(item=>`<tr title="${U.esc(["编号", item.event_id, item.trigger_id].filter(Boolean).join(" "))}"><td>${U.esc(item.instrument || item.source || "—")}</td><td>${U.esc(item.notice_type || item.type || "—")}${item.trigger_id && !Data.internalName(item.trigger_id) ? " · 触发号 " + U.esc(item.trigger_id) : ""}</td><td>${U.hm(item.arrival_utc || item.received_utc)}</td><td>${U.n(item.ra_deg,3)}° / ${U.n(item.dec_deg,3)}°</td></tr>`).join("")}</tbody></table></div></details>` : ""}
      ${merged.length ? `<details><summary>合并依据 · ${merged.length} 条</summary><ul>${merged.map(item=>`<li>${U.esc({auto_merge:"自动合并",manual_merge:"值班合并",manual_split:"值班拆开"}[item.action] || item.action || item.kind || "")} · ${U.esc(item.reason || item.basis || "")} ${U.esc(item.notice_event_id || item.peer_event_id || item.event_id || "")}${U.fin(item.trigger_delta_s) ? ` · 相差 ${U.n(item.trigger_delta_s,1)} 秒${item.inside_region ? " · 精定位落在粗定位区内" : ""}` : ""}${item.operator ? ` · ${U.esc(App.opName(item.operator))}` : ""}</li>`).join("")}</ul></details>` : ""}
      ${blocks.length ? `<details><summary>块边界记录 · ${blocks.length} 条</summary><ul>${blocks.map(item=>`<li>${U.hm(item.boundary_utc || item.at_utc || item.end_utc)} · ${U.esc(item.channel || "")} · ${U.esc(item.action || item.state || (item.outcome==="qualified_forecast" ? "预报合格" : item.outcome) || "")} ${U.esc(item.reason || "")}</li>`).join("")}</ul></details>` : ""}`;
    if (inner) return {title, pill, dl, rest};
    return `<section class="card" data-too-section="event"><div class="card-h"><h2>${title}</h2>${pill}</div>${dl}${rest}</section>`;
  },
  /* 事件判定 + 观测时长与跟进 合成一张卡：两列字段并排，七步、通知历史、块边界等收进展开 */
  judge(w, info){

      <dl class="kv too-judge">${AL.dropEmpty((c.dl + d.dl).replace(/<\/?dl[^>]*>/g, ""))}</dl>${d.note || ""}<div class="too-more">${c.rest}${d.rest || ""}</div></section>`;

  poolCard(pools, months=[]){

  operatorPanel(info, active){

  },
  chart(points, {name, unit, band=null, limits=[], step=false, comparison=[]}){
    const valid = points.filter(([x,y]) => U.fin(x) && U.fin(y) && x >= 0 && y >= 0 && y <= 1);
    if (!valid.length) return "";
    const actual = comparison.filter(([a,b]) => U.fin(a)&&U.fin(b)&&a>=0);
    const w=520, h=164, x0=38, y0=126, xmax=Math.max(1,...[...valid,...actual].map(([x])=>x));
    const x = t => x0 + U.clamp(t/xmax,0,1)*(w-x0-16);
    const y = v => y0 - U.clamp(v,0,1)*(y0-12);
    const shade = Array.isArray(band) && band.length===2 && band.every(U.fin)
      ? `<rect x="${x(band[0])}" y="12" width="${Math.max(0,x(band[1])-x(band[0]))}" height="${y0-12}" fill="var(--accent)" opacity=".14"/>` : "";
    const ticks = [0,.5,1].map(v=>`<path d="M${x0} ${y(v)}H${w-16}" stroke="var(--border)"/><text x="${x0-5}" y="${y(v)+4}" text-anchor="end" class="axl">${U.pct(v)}</text>`).join("");
    const cuts = limits.filter(v=>U.fin(v)&&v>=0&&v<=xmax).map(v=>`<path d="M${x(v)} 12V${y0}" stroke="var(--warn)" stroke-dasharray="4 3"/>`).join("");
    const line = values => values.flatMap(([a,b], i) => {
      const point = `${x(a)},${y(b)}`;
      return step && i ? [`${x(a)},${y(values[i-1][1])}`, point] : [point];
    }).join(" ");
    return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${U.esc(name)}" style="width:100%;max-width:650px">
      ${ticks}${shade}${cuts}<polyline points="${line(valid)}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${actual.length ? `<polyline data-alert-actual-coverage points="${line(actual)}" fill="none" stroke="var(--tier2)" stroke-width="2.5" stroke-dasharray="4 3"/>` : ""}
      <text x="${x0}" y="${h-12}" class="axl">0</text><text x="${w-16}" y="${h-12}" text-anchor="end" class="axl">${U.n(xmax,1)} ${unit}</text></svg>`;
  },
  duration(info, inner=false){
    const n=info.neutrino;
    if (n) {
      const region=n.localization_region || {};
      const urgency=info.decision?.urgency;
      const deadline=U.ms(n.deadline_utc);
      const reference=Data.isReplay() ? (U.ms(info.decision?.assessed_utc || info.decided_utc) ?? Date.now()) : Date.now();
      const remaining=deadline==null ? null : Math.max(0,(deadline-reference)/3600000);
      const npill = `<span class="pill">${U.esc(AL.URGENCY[urgency] || "不打断")}</span>`;
      const ndl = `<dl class="kv">
        <dt>信号度</dt><dd>${U.pct(n.signalness,1)} · ${U.esc({gold:"金级",bronze:"铜级"}[n.tier] || n.tier || "—")}</dd>
        <dt>误差区</dt><dd>${U.pct(n.localization_cl,0)} · ${U.n(n.error_radius_deg,2)}° · ${U.esc(n.localization_model || region.kind || region.shape || "圆形")}</dd>
        <dt>有效期</dt><dd>${n.deadline_utc ? U.ymd(n.deadline_utc)+" "+U.hm(n.deadline_utc) : "—"} · 剩余 ${U.n(remaining,1)} 小时</dd>
        <dt>全季预算</dt><dd>已用 ${U.n(n.season_budget?.used_min,1)} / 剩余 ${U.n(n.season_budget?.remaining_min,1)} 分钟</dd>
        ${n.next_night ? `<dt>待排观测夜</dt><dd>${U.esc(n.next_night)}</dd>` : ""}
        ${info.stop_reason ? '<dt>停止原因</dt><dd>'+U.esc(AL.STOP[info.stop_reason] || info.stop_reason)+'</dd>' : ""}
        ${info.duration_basis && AL.STOP[info.duration_basis] ? '<dt>时长依据</dt><dd>'+U.esc(AL.STOP[info.duration_basis])+'</dd>' : ""}
        </dl>`;
      if (inner) return {title: "中微子跟进", pill: npill, dl: ndl, note: AL.suggestion(n.followup_suggestion)};
      return `<section class="card"><div class="card-h"><h2>中微子跟进</h2>${npill}</div>${ndl}${AL.suggestion(n.followup_suggestion)}</section>`;
    }
    const d=info.duration || info;
    const budget=info.season_budget || d.season_budget || {}, ebl=d.ebl_check || {};
    const decision=info.decision || {};
    const z=info.redshift || info.contract?.redshift;
    const corrected = Data.ws()?.meta?.too?.find(row=>row.event_id===info.contract?.event_id)?.end_limit;
    const basis=corrected?.duration_basis || d.duration_basis;
    const stop=corrected?.stop_reason || d.stop_reason || info.stop_reason;
    const history=info.block_recalculations || [];
    const has = basis != null || stop != null || AL.decision(info) || d.planned_end_utc != null;
    if (!has) return inner ? null : missing("此事件的时长和块边界记录");
    const drow = `<dt>决定</dt><dd>${U.esc(AL.decision(info) || "—")}${decision.reason ? " · "+U.esc(AL.WHY[decision.reason] || decision.reason):""}</dd>`;
    const ddl = `<dl class="kv">${inner ? "" : drow}
      <dt>结束（北京时间）</dt><dd>${d.planned_end_utc ? U.ymd(d.planned_end_utc)+" "+U.hm(d.planned_end_utc) : "—"}</dd>
      <dt>时长依据</dt><dd>${U.esc(AL.BASIS[basis] || AL.STOP[basis] || basis || "—")} · ${U.n(d.duration_min,1)} 分钟</dd>
      <dt>已用时长</dt><dd>${U.n(info.used_on?.total_min ?? decision.used_budget_min,1)} 分钟
        ${info.used_on?.unreported_prefix_min>0 ? ` · 含 ${U.n(info.used_on.unreported_prefix_min,1)} 分钟未回报前缀` : ""}</dd>
      <dt>开始天顶角 / 可覆盖概率</dt><dd>${U.n(decision.start_zenith_deg ?? info.start_zenith_deg ?? info.geometry?.target_zenith_deg,1)}° / ${U.pct(decision.coverable_probability ?? info.coverable_probability,1)}</dd>
      <dt>红移</dt><dd>${typeof z === "object" && z ? U.n(z.value,4)+(z.error==null?"":" ± "+U.n(z.error,4))+" · "+U.esc(z.source || "") : U.n(z,4)}</dd>
      <dt>EBL 检查</dt><dd>${U.n(ebl.energy_tev ?? ebl.threshold_tev,3)} TeV · τ ${U.n(ebl.tau,3)}${ebl.conclusion || ebl.status ? " · "+U.esc(ebl.conclusion || ebl.status):""}</dd>
      <dt>季节余额</dt><dd>已用 ${U.n(budget.used_min ?? budget.spent_min,1)} / 剩余 ${U.n(budget.remaining_min,1)} 分钟</dd>
      <dt>停止原因</dt><dd>${U.esc(AL.STOP[stop] || stop || "—")}</dd>
      ${info.alert_update && !info.simulated_approval ? `<dt>值班记录</dt><dd>${U.esc(AL.ACTION[info.alert_update.kind] || info.alert_update.kind)} · ${U.esc(App.opName(info.alert_update.operator))} · ${U.esc(info.alert_update.at_utc || "")}</dd>` : ""}
      ${info.planned_nights?.length ? `<dt>已排观测夜</dt><dd>${U.esc(info.planned_nights.join("、"))}</dd>` : ""}
      </dl>`;
    const drest = history.length ? `<details><summary>块边界重算（${history.length}）</summary><ul>${history.map(h=>`<li>${U.esc(h.boundary_utc || h.at_utc || "")} → ${U.esc(h.planned_end_utc || "—")} · ${U.esc(AL.STOP[h.stop_reason] || h.stop_reason || AL.BASIS[h.duration_basis] || AL.STOP[h.duration_basis] || h.duration_basis || "")}</li>`).join("")}</ul></details>` : "";
    if (inner) return {title: "观测时长", dl: ddl, note: AL.suggestion(info.followup_suggestion), rest: drest};
    return `<section class="card"><div class="card-h"><h2>观测时长与跟进</h2></div>${ddl}${AL.suggestion(info.followup_suggestion)}${drest}</section>`;
  },
  suggestion(suggestion){
    if (!suggestion || suggestion.status !== "suggested") return "";
    const evidence=suggestion.evidence;
    const reasons=suggestion.reasons || (evidence ? [{...evidence,kind:"rta_sigma",value:evidence.rta_sigma}] : []);
    const rows=reasons.map(row=>`<li>${U.esc(AL.EVIDENCE[row.kind] || row.kind)}${typeof row.value==="number"?" "+U.n(row.value,4):""} · ${U.esc(row.source)} · ${U.esc(row.at_utc)}</li>`).join("");
    return `<div class="note"><strong>建议延长或安排后续夜</strong>
      ${suggestion.effective_utc ? `<div>生效时间 ${U.esc(suggestion.effective_utc)}</div>` : ""}
      ${rows ? `<ul>${rows}</ul>` : ""}</div>`;
  },
  controls(e,info){
    if (!Data.server.on || !AL.serverEvents().some(row=>row.event_id===e.event_id) || e.revoked) return "";
    const z=info.redshift || info.contract?.redshift || {};
    const disabled = AL.st().busy ? "disabled" : "";
    const button = k => `<button class="btn" data-act="alAction" data-arg="${k}" ${disabled}>${AL.ACTION[k]}</button>`;
    const n=info.neutrino, suggestion=(n || info).followup_suggestion;
    const evidence=`<div class="row"><label>跟进证据 <select data-al-evidence-kind><option value="rta_sigma">实时显著性（σ）</option>
      ${n?"":'<option value="lat_detected">LAT 探测</option><option value="xrt_flux_cgs">XRT 流量（erg cm⁻² s⁻¹）</option>'}</select></label>
      <label>数值（LAT 填 1 或 0） <input data-al-evidence-value type="number" min="0" step="any"></label>
      <label>来源 <input data-al-evidence-source type="text" maxlength="240"></label>
      <label>测量时间（北京时间） <input data-al-evidence-time type="datetime-local"></label>
      ${button("followup_evidence")} <label class="btn">导入证据<input data-al-evidence-file class="hidden" type="file" accept=".json,application/json" ${disabled}></label>
      ${suggestion?.status==="suggested" ? button("ignore_suggestion") : ""}</div>`;
    return `<section class="card grb-controls"><div class="card-h"><h2>值班操作</h2></div>
      ${n ? "" : `<div class="row"><label>红移 <input data-al-z type="number" min="0" step="any" value="${U.esc(z.value ?? "")}"></label>
      <label>误差 <input data-al-z-error type="number" min="0" step="any" value="${U.esc(z.error ?? "")}"></label>
      <label>测量 <select data-al-z-type><option value="spectroscopic" ${z.type==="spectroscopic"?"selected":""}>光谱</option><option value="photometric" ${z.type==="photometric"?"selected":""}>测光</option></select></label>
      <label>来源 <input data-al-z-source type="text" maxlength="240" value="${U.esc(z.source || "")}"></label>
      ${button("redshift")} <label class="btn">读红移文件<input data-al-z-file class="hidden" type="file" accept=".json,application/json" ${disabled}></label></div>`}
      ${evidence}<div class="row">${n?"":button("block_boundary")+button("end")}<label>总时长（分钟） <input data-al-duration type="number" min="1" step="any"></label>${button("extend")}
      <label>后续夜 <input data-al-night type="date" value="${U.esc(n?.next_night || "")}"></label>${button("second_night")}</div></section>`;
  }
};

App.screens.alert = {
  title: "告警",
  async mount(){
    if (App.state.arg === "gcn" || Data.isReplay()) return;
    const s=AL.st(), e=AL.serverEvents().find(row=>row.event_id===s.sel);
    if (!Data.server.on || !e || s.details.has(e.event_id) && s.details.get(e.event_id)?.plan === e.plan_id) return;
    const entry={plan:e.plan_id};
    s.details.set(e.event_id,entry);
    try {
      entry.value=(await Data.api("/api/events/" + encodeURIComponent(e.event_id) + "/detail")).alert;
    } catch (error) {
      entry.error=error.message;
    }
    if (App.state.route==="alert" && App.state.arg!=="gcn" && !Data.isReplay() && s.sel===e.event_id && s.details.get(e.event_id)===entry) keepY(App.render);
  },
  render(arg){
    if (arg === "gcn" && !Data.replayView) return GCNReplay.render();
    const s = AL.st(), evs = AL.events(), w = Data.ws(), T = w && w.tonight, replay=Data.isReplay(w);
    if (!evs.some(x=>x.event_id===s.sel)) s.sel = evs[0]?.event_id ?? null;
    const e = evs.find(x => x.event_id === s.sel);
    const replayLink = Data.replayView ? "" : `<a class="btn gcn-link${evs.length ? "" : " primary"}" href="#alert/gcn">查看 GCN 回放案例</a>`;
    const head = `<div class="head"><div class="t"><h1>${replay?"本夜告警回放":"告警"}</h1></div>
      ${replay?'<a class="btn" href="#tonight">查看本夜计划</a>':""}
      ${evs.length ? replayLink : ""}
      ${Data.server.on && !replay ? `<button class="btn" data-act="alRefresh">刷新事件</button>` : ""}</div>
      ${Shell.replayNote(w)}${App.screens.alert.replayNotices(w)}${ReplayToo.render(w)}
      ${App.flash ? `<div class="missing" style="margin-bottom:14px">${App.flash}</div>` : ""}`;
    const selected = e ? AL.info(T,e) : {};
    const pool = AL.poolCard(selected.project_pools || T?.project_pools || T?.alert?.project_pools ||
      evs.map(x=>AL.info(T,x).project_pools).find(Boolean), w?.long?.months || []);
    if (!evs.length && w?.meta?.too?.length) return head + pool;
    if (!evs.length) return head + `<div class="stack"><section class="card"><div class="empty">
      <p style="margin:0 0 12px">${replay ? "本夜基线计划没有告警插入。" : T ? "这一夜的结果里没有告警事件。" : "所选日期暂无告警记录。"}</p>
      ${replayLink}${T ? "" : Shell.nightChips()}</div>
      ${!replay && T && !Array.isArray(T.events) ? missing("告警决定记录 events（打断了谁、首块价值、等一等的代价、天空中的转向）", "第 1.5 节；结果的 events[]，工作台 GET /api/events") : ""}</section>${replay || Data.replayView ? "" : AL.intake()}${pool}</div>`;
    const pending = evs.filter(x => !x.revoked && AL.pending(AL.info(T,x)));
    const pendingIds = new Set(pending.map(x=>x.event_id));
    const list = rows => rows.map(x => {
      const info = AL.info(T,x), time = AL.clock(info.manual_deadline_utc || info.decision?.manual_deadline_utc,
        AL.reference(w,info));
      const lat = U.fin(U.ms(x.decided_utc)) && U.fin(U.ms(x.received_utc)) ? (U.ms(x.decided_utc) - U.ms(x.received_utc)) / 1e3 : null;
      const compute = AL.computeText(w, T, info);
      return `<button class="opt" data-act="alSel" data-arg="${U.esc(x.event_id)}" aria-pressed="${x.event_id === s.sel}" style="flex-direction:column;gap:2px">
        <div class="al-ev-h"><b>${U.esc(AL.label(info))}</b>${x.revoked ? '<span class="pill plain">已撤销</span>' : x.published?.at_utc ? `<span class="pill">${x.published.mode === "auto" ? "自动发布" : "已确认"}</span>` : `<span class="pill plain">${U.esc(AL.decision(info) || "待确认")}</span>`}</div>
        <div class="small muted">${U.esc(AL.PROJECT[info.project] || AL.CLASS[x.alert_class] || x.alert_class || "")} ${U.esc(AL.URGENCY[info.urgency] || "")}${info.pending_merges?.length ? " · 待合并" : ""}</div>
        <div class="small num">${x.received_utc ? "收到 " + U.hm(x.received_utc) : ""}${lat != null ? " · " + (Data.replayView ? "模拟 " : "") + U.n(lat, 0) + " s 后决定" : ""}${compute ? " · " + compute : ""}${x.start_utc ? " · " + U.hm(x.start_utc) + " 开始" : ""}${(x.groups || []).length || info.selected_configuration ? " · " + U.esc(AL.arrayText(x, info)) : ""} ${time}</div></button>`;
    }).join("");
    return head + `<div class="row"><div class="side stack" style="flex:1 1 310px">
      <section class="card" data-too-section="queue" aria-label="待批队列"><div class="card-h"><h2>待批队列</h2><span class="pill plain">${pending.length}</span></div>${pending.length ? list(pending) : '<p class="note">当前没有待批事项。</p>'}</section>
      ${evs.some(x=>!pendingIds.has(x.event_id)) ? `<section class="card" aria-label="事件"><div class="card-h"><h2>事件记录</h2></div>${list(evs.filter(x=>!pendingIds.has(x.event_id)))}</section>` : ""}
      ${replay || Data.replayView ? "" : AL.intake()}${pool}</div><div class="grow stack">${e ? AL.approvalDetails(selected) + App.screens.alert.detail(w, T, e) : ""}</div></div>`;
  },

  replayNotices(w){
    if (!Data.isReplay(w) || !w.meta?.replay?.gcn?.length) return "";
    const rows=w.meta.replay.gcn.map(row=>{
      const circular=String(row.circular ?? "");

      const state=AL.openingLabel(row.opening_plan) || AL.DECISION[row.decision] || row.decision;

      const audit=row.audit_passed===true?" · 独立审核通过":row.audit_passed===false?" · 重排副本审核未通过":"";
      const degrees=value=>U.fin(value)?U.n(value,3)+"°":"未提供";
      const details=row.plan_id || row.screening_only ?`<details class="small"><summary>定位与审核</summary><dl class="kv">
        <dt>赤经 / 赤纬</dt><dd>${degrees(row.ra_deg)} / ${degrees(row.dec_deg)}</dd>
        <dt>误差半径 / 置信度</dt><dd>${degrees(row.error_radius_deg)} / ${U.fin(row.localization_cl)?U.pct(row.localization_cl,1):"未提供"}</dd>
        <dt>公告时太阳 / 目标高度</dt><dd>${degrees(row.sun_alt_deg)} / ${degrees(row.target_alt_deg)}</dd>
        <dt>决定依据</dt><dd>${U.esc(row.reason || "未提供")}</dd>
        ${row.plan_id?`<dt>重排副本</dt><dd class="mono tiny">${U.esc(row.plan_id)}</dd>`:""}
        ${row.error?`<dt>重排副本审核记录</dt><dd style="overflow-wrap:anywhere">${U.esc(row.error)}</dd>`:""}
      </dl></details>`:"";

    }).join("");
    return `<section class="card" style="margin-bottom:16px"><div class="card-h"><h2>本夜的官方 GCN</h2></div>
      <p class="note">${w.meta.replay.simulated_approval ? "时间为北京时间（悬停看原始 UTC）。模拟审批结果记在对应事件里。" : "时间为北京时间（悬停看原始 UTC）。告警筛查和重排审核单独记录。"}</p>
      <div class="scroll-x"><table class="t"><thead><tr><th>事件</th><th>官方公告</th><th>触发</th><th>发布</th><th>筛查与审核</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  },

  detail(w, T, e){
    const fb = e.first_block || {}, vc = e.value_curve || {}, g = e.geometry, av = e.alert_value || {}, mc = e.merge_choice;
    const info = AL.info(T,e);
    const loc = info.localization_selection || info.localization_forecast || info.probability_map;
    const canRevoke = Data.server.on && AL.serverEvents(w).some(row=>row.event_id===e.event_id);
    const active = canRevoke && !Data.isReplay(w) && !e.revoked && !AL.st().busy;
    if (info.candidate) return AL.chain(w,info) + AL.operatorPanel(info,active);
    const cand = `<dl class="kv">
        <dt>来源</dt><dd>${U.esc([e.source, Data.alertFacts(e)?.facts.notice_type].filter(Boolean).join(" · ") || "—")}</dd>
        <dt>编号</dt><dd class="mono tiny muted" style="overflow-wrap:anywhere" title="${U.esc(Data.alertIds(e) || e.alert_id || e.event_id || "")}">${U.esc((Data.alertIds(e) || e.alert_id || e.event_id || "—").replace(/([0-9a-f]{8})[0-9a-f]{16,}([0-9a-f]{6})/gi, "$1…$2"))}</dd>
        <dt>触发</dt><dd>${e.trigger_utc ? U.ymd(e.trigger_utc) + " " + U.hm(e.trigger_utc) : "—"}</dd>

        <dt>规则</dt><dd title="${U.esc(e.rule || "")}">${U.esc(AL.openingLabel(info.opening_plan) || AL.RULE[e.rule] || AL.DECISION[e.rule] || AL.WHY[e.rule] || e.rule || "—")}</dd>

        <dt>价值</dt><dd>Y = ${U.n(av.Y, 3)}${U.fin(av.delta_V) ? " · ΔV = " + U.n(av.delta_V, 3) : ""}</dd>
        ${mc ? `<dt>合并选择</dt><dd>${U.fin(mc.Y_now) || U.fin(mc.R_Y_later) ? `现在 ${U.n(mc.Y_now, 3)} · 稍后 ${U.n(mc.R_Y_later, 3)} → ` : ""}${U.esc({merge_first: "先合阵再看", start_now: "现在就看", now: "现在就看", later: "稍后再看", wait: "稍后再看"}[mc.chosen] || mc.chosen || "—")}${mc.chosen ? ` <span class="mono tiny muted">${U.esc(mc.chosen)}</span>` : ""}</dd>` : ""}
        ${e.published?.at_utc ? `<dt>发布</dt><dd>${e.published.mode === "auto" ? "自动" : "确认"} · ${U.hm(e.published.at_utc)}${e.published.operator ? " · " + U.esc(App.opName(e.published.operator)) : ""}</dd>` : ""}
        ${e.revoked ? `<dt>撤销</dt><dd>${U.esc(typeof e.revoked === "object" ? (U.hm(e.revoked.at_utc) + " · " + App.opName(e.revoked.operator)) : "已撤销")}</dd>` : ""}

async function submitAlertAction(kind, payload={}){
  const s=AL.st(), id=s.sel;
  if (s.busy || !AL.serverEvents().some(event=>event.event_id===id) || App.needOperator()) return;
  s.busy = true;
  try {
    const response = await Data.api("/api/events/" + encodeURIComponent(id) + "/action", {kind, operator:App.state.operator, ...payload});
    const job=response.job;
    if (!job) {
      await Data.refreshServer();
      s.details.clear();
      App.flash=AL.ACTION[kind]+"已记录。";
      return;
    }
    if (App.state.route==="alert") App.toast("已提交" + AL.ACTION[kind] + "，等待审核。");
    let state = job;
    while (state.status === "queued" || state.status === "running"){
      await new Promise(resolve=>setTimeout(resolve,850));
      state = await Data.api("/api/jobs/" + encodeURIComponent(job.id));
    }
    if (state.status !== "succeeded") throw new Error(state.error || state.status);
    await Data.refreshServer();
    s.details.clear();
    if (App.state.route==="alert" && s.sel===id){
      const result=state.results?.find(row=>row.name==="night.json")?.result;
      const updated=result?.events?.find(e=>e.alert_update?.at_utc===result.alert?.alert_update?.at_utc &&
        e.alert_update?.kind===kind && e.alert_update?.operator===App.state.operator);
      if (updated) s.sel=updated.event_id;
      const status=result?.alert?.decision?.state;
      const why=result?.alert?.decision?.reason;
      App.flash=state.publication_pending ? "已记录，版本仍待确认。" : AL.ACTION[kind]+"已处理。"
        +(status ? U.esc(AL.DECISION[status] || status)+(why ? " · "+U.esc(why) : "") : "")
        +(kind==="second_night" && payload.night ? " · "+U.esc(payload.night) : "");
    }
  } catch (e) {
    if (App.state.route==="alert") App.flash = "告警操作失败：" + U.esc(e.message);
  } finally {
    s.busy = false;
    if (App.state.route==="alert") keepY(App.render);
  }
}
App.acts.alAction = kind => {
  if (Data.isReplay()) return;

    const reason=input("reason")?.value.trim(), peer=input("peer")?.value;
    if (["override","merge","split"].includes(kind) && !reason) return App.toast("请填写值班理由。");
    if (["merge","split"].includes(kind) && !peer) return App.toast("请选择要处理的另一条事件。");
    return submitAlertAction(kind,{...(["override","merge","split"].includes(kind) ? {reason} : {}),...(["merge","split"].includes(kind) ? {peer_event_id:peer} : {})});
  }
  if (kind==="redshift"){
    const value=input("z").value, error=input("z-error").value, source=input("z-source").value.trim();
    if (value==="" || +value<0 || (error!=="" && +error<0) || !source) return App.toast("请填写有效的红移和来源。");
    return submitAlertAction(kind,{redshift:{value:+value,error:error===""?null:+error,type:input("z-type").value,source,at_utc:new Date().toISOString()}});
  }

    const night=input("night").value;
    if (!night) return App.toast("请选择后续观测夜。");

  }

    const source=input("evidence-source").value.trim(), at=input("evidence-time").value;
    if (!source || !at || !Number.isFinite(value) || value<0 || key==="lat_detected" && ![0,1].includes(value))
      return App.toast("请填写有效的证据数值、来源和测量时间。");
    return submitAlertAction(kind,{evidence:{[key]:key==="lat_detected" ? value===1 : value,source,at_utc:new Date(at+"+08:00").toISOString()}});
  }
  return submitAlertAction(kind);

function tooRequest(form){
  const data=new FormData(form), get=name=>String(data.get(name) || "").trim();
  const value=name=>get(name)==="" ? null : +get(name);
  const target=get("target"), eventId=get("event_id") || target;
  let ra=value("ra_deg"), dec=value("dec_deg");
  if (target && (ra!=null || dec!=null)) throw new Error("请选择任务目标，或手填 ICRS 坐标。");
  if (!eventId) throw new Error("请填写事件编号。");
  if (target && !Data.server.on) {
    const option=form.elements.target.selectedOptions[0];
    ra=Number(option?.dataset.ra); dec=Number(option?.dataset.dec);
  }
  if ((!target || !Data.server.on) &&
      !(U.fin(ra) && ra>=0 && ra<360 && U.fin(dec) && Math.abs(dec)<=90))
    throw new Error("请填写有效的 ICRS 赤经、赤纬。");
  const position=target && Data.server.on ? {target} : {ra_deg:ra,dec_deg:dec};
  const request={event_id:eventId, ...position,
    project:get("project"),too_kind:get("too_kind"),request_min:value("request_min"),
    deadline_utc:new Date(get("deadline_utc")+"+08:00").toISOString(),
    requester:get("requester"),approver:get("approver") || null,energy_band_tev:[value("band_lo"),value("band_hi")]};
  if (!(request.energy_band_tev[0] > 0 && request.energy_band_tev[1] > request.energy_band_tev[0])) throw new Error("能段上限必须大于下限。");
  if (value("error_radius_deg")!=null) request.error_radius_deg=value("error_radius_deg");
  return request;
}

  document.querySelectorAll("[data-too-until]").forEach(el=>{ el.textContent=AL.remaining(el.dataset.tooUntil,Date.now()); });
},1000);
document.addEventListener("change", async ev=>{
  if (!ev.target?.matches?.("[data-al-z-file], [data-al-evidence-file]") || !ev.target.files?.length) return;
  const selected=AL.events().find(e=>e.event_id===AL.st().sel);
  try {
    const file=JSON.parse(await ev.target.files[0].text());
    if (!selected || AL.st().sel!==selected.event_id || ![selected.event_id,selected.alert_id].includes(file.event_id))
      throw new Error("文件的事件编号与当前告警不符");
    if (ev.target.matches("[data-al-evidence-file]")){
      if (!file.evidence || typeof file.evidence!=="object" || Array.isArray(file.evidence))
        throw new Error("文件缺少证据对象");
      await submitAlertAction("followup_evidence",{evidence:file.evidence});
      return;
    }
    const z=file.redshift;
    if (!z || !U.fin(z.value) || z.value<0 || (z.error!=null && (!U.fin(z.error)||z.error<0)) ||
        !["spectroscopic","photometric"].includes(z.type) || typeof z.source!=="string" || !z.source.trim() ||
        typeof z.at_utc!=="string" || !z.at_utc.endsWith("Z") || U.ms(z.at_utc)==null) throw new Error("文件缺少有效的红移、类型、来源或 UTC 时间");
    await submitAlertAction("redshift",{redshift:z});
  } catch (e) { App.toast("读取告警更新失败：" + U.esc(e.message)); }
});
App.acts.alRevoke = async id => {
  if (!AL.serverEvents().some(event=>event.event_id===id) || App.needOperator()) return;
  try {
    const r = await Data.api("/api/events/" + encodeURIComponent(id) + "/revoke", {operator: App.state.operator});
    await Data.refreshServer(); Data.server.events = (await Data.api("/api/events")).events || [];
    if (r.current_plan_id) Data.select("ver:" + r.current_plan_id);
    App.flash = "已撤销。" + (r.head_rolled_back ? "当前版本回到告警前的版本。" : "");
  } catch (e) { App.flash = "没能撤销：" + U.esc(e.message); }
  keepY(App.render);
};
