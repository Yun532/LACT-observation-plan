<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LACT 观测规划台</title>
<!-- 公开版，由 lact_scheduler/docs/app-src/build.py --public 生成，不要直接改这个文件；改 docs/app-src/ 里的源文件后重新生成。 -->
<style>
/* LACT 排班工作台 · 样式。颜色只用 token；深色模式在下方重定义。 */
:root{
  --ground:#F5F4EF; --card:#FFFFFF; --sunk:#FAF9F6; --sunk2:#F1F0EA; --seg:#ECEBE4;
  --border:#E4E2D9; --border2:#DAD8CF; --rule:#EFEDE6; --axis:#B9BDB6;
  --ink:#1D2525; --ink2:#4A5450; --muted:#66706B; --faint:#8C948F;
  --accent:#2E5E4E; --accent-ink:#1F4337; --accent-soft:#E6EFEA;
  --danger:#B4442E; --danger-soft:#F9ECE8; --warn:#9A6A12; --warn-soft:#FBF6EA;
  --over-veil:rgba(255,255,255,.5); --over-line:rgba(255,255,255,.75);
  --night:#22303D; --moon:#6E8196; --twilight:#DCE0E3; --sel:#E9C77B;
  --tier1:#5E8676; --tier2:#9DBAAE; --tier3:#CFDFD8; --tierx:#7FA596; --used:#2F3B39;
  --zone8:#F6F5F0; --zonex:#EDECE6; --hatch:#DAD8CF; --shadow:0 1px 2px rgba(0,0,0,.06);
  --moonline:#A89A6A; --moonfill:#E9DFB8;
  --site-ed:#E3E1D8; --site-md:#D8D5CA; --site-wcda:#EEF1EE; --site-line:#D6DAD4; --site-text:#A4AAA5;
  --cat-task:#C2553B; --cat-tevcat:#4F7CAC; --cat-lhaaso:#B8893A; --cat-fermi:#8A6AA8; --cat-private:#3F8C96;
  --heat:var(--tier1); --heat-soft:var(--accent-soft); --heat-ink:#FFFFFF; --reach50:#4F7FA8; --zone-in:#E6EEF7; --zone-ring:#EAF3EB;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#151A1A; --card:#1D2323; --sunk:#192020; --sunk2:#232A2A; --seg:#262E2E;
    --border:#2E3636; --border2:#3A4343; --rule:#283030; --axis:#56605D;
    --ink:#E6E9E4; --ink2:#BCC3BE; --muted:#929C97; --faint:#76807B;
    --accent:#7FB8A2; --accent-ink:#A6D3C1; --accent-soft:#213430;
    --danger:#E0846E; --danger-soft:#3A2522; --warn:#D9AE5B; --warn-soft:#352D1C; --over-veil:rgba(22,26,25,.5); --over-line:rgba(22,26,25,.6);
    --night:#0B1117; --moon:#4D5F73; --twilight:#36414A; --sel:#C9A75B;
    --tier1:#6FA08C; --tier2:#4F7366; --tier3:#34493F; --tierx:#5C8778; --used:#D6DDD8;
    --zone8:#202727; --zonex:#262D2D; --hatch:#3A4343; --shadow:0 1px 2px rgba(0,0,0,.4);
    --moonline:#B9AA74; --moonfill:#6B6345;
    --site-ed:#283030; --site-md:#2E3737; --site-wcda:#1F2828; --site-line:#323C3C; --site-text:#58625F;
    --cat-task:#E58A72; --cat-tevcat:#7FA6D0; --cat-lhaaso:#D9AE5B; --cat-fermi:#B59AD0; --cat-private:#6FB9C2;
    --heat:var(--tier1); --heat-soft:var(--accent-soft); --heat-ink:#0E1513; --reach50:#86AED0; --zone-in:#1F2B35; --zone-ring:#22312A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#151A1A; --card:#1D2323; --sunk:#192020; --sunk2:#232A2A; --seg:#262E2E;
  --border:#2E3636; --border2:#3A4343; --rule:#283030; --axis:#56605D;
  --ink:#E6E9E4; --ink2:#BCC3BE; --muted:#929C97; --faint:#76807B;
  --accent:#7FB8A2; --accent-ink:#A6D3C1; --accent-soft:#213430;
  --danger:#E0846E; --danger-soft:#3A2522; --warn:#D9AE5B; --warn-soft:#352D1C; --over-veil:rgba(22,26,25,.5); --over-line:rgba(22,26,25,.6);
  --night:#0B1117; --moon:#4D5F73; --twilight:#36414A; --sel:#C9A75B;
  --tier1:#6FA08C; --tier2:#4F7366; --tier3:#34493F; --tierx:#5C8778; --used:#D6DDD8;
  --zone8:#202727; --zonex:#262D2D; --hatch:#3A4343; --shadow:0 1px 2px rgba(0,0,0,.4);
  --moonline:#B9AA74; --moonfill:#6B6345;
  --site-ed:#283030; --site-md:#2E3737; --site-wcda:#1F2828; --site-line:#323C3C; --site-text:#58625F;
    --cat-task:#E58A72; --cat-tevcat:#7FA6D0; --cat-lhaaso:#D9AE5B; --cat-fermi:#B59AD0; --cat-private:#6FB9C2;
    --heat:var(--tier1); --heat-soft:var(--accent-soft); --heat-ink:#0E1513; --reach50:#86AED0; --zone-in:#1F2B35; --zone-ring:#22312A;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink)}
body{font:14px/1.5 "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)} a:hover{color:var(--accent-ink)}
button,input,select,textarea{font:inherit;color:inherit}
/* 表单控件的统一底样：:where() 不加权重，页面里已有的专门样式照旧生效 */
:where(select,textarea,input:not([type=checkbox],[type=radio],[type=range],[type=file],[type=color])){background:var(--card);border:1px solid var(--border2);border-radius:7px;padding:4px 8px;min-height:30px;font-size:13px;min-width:0}
:where(select,textarea,input:not([type=checkbox],[type=radio],[type=range],[type=file])):hover{border-color:var(--axis)}
:where(input[type=checkbox],input[type=radio]){accent-color:var(--accent);width:15px;height:15px;margin:0 5px 0 0;vertical-align:-2px;flex:none}
:where(details>summary){cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ink2{color:var(--ink2)} .warn{color:var(--warn)} .danger{color:var(--danger)} .ok{color:var(--accent)}
.small{font-size:12px} .tiny{font-size:11px}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* —— 顶栏 —— */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;padding:0 28px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:baseline;gap:10px;padding:13px 0}
.brand b{font-size:16px;letter-spacing:.02em}
.nav{display:flex;flex-wrap:wrap;gap:2px;flex:1 1 420px}
.nav a{padding:15px 9px 12px;font-size:14px;text-decoration:none;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.nav a[aria-current="page"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.nav a:hover{color:var(--ink)}
.nav .sep{width:1px;height:16px;background:var(--border2);align-self:center;margin:0 8px;flex:none}
.top-right{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2);flex-wrap:wrap;padding:6px 0}
.night-controls{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-width:0}
.night-controls :is(input,select){font-size:12px;min-height:28px;padding:2px 6px}
.night-controls .night-version{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.night-controls select.night-version{background:var(--card);color:var(--ink)}
/* 页眉“⋯”：桌面宽时不显示，里面的控件照常排在页眉右侧 */
.top-right .top-more{display:none}
.top-extra{display:contents}
.top-extra .top-status{display:none}
/* 页眉“结果来源”：回放批次用模拟的斜纹底，悬停写口径 */
.src-pick{display:inline-flex;align-items:center;border:1px solid var(--border2);border-radius:20px;background:var(--card);overflow:hidden;font-size:12px;max-width:220px}
.src-pick select{border:0;background:transparent;min-height:26px;padding:2px 4px 2px 8px;font-size:12px;color:var(--ink);max-width:130px;text-overflow:ellipsis;cursor:pointer}
.src-pick.sim{border:1px dashed var(--axis);background:repeating-linear-gradient(135deg,var(--sunk2) 0 4px,var(--card) 4px 8px)}
.src-pick.sim select{font-weight:600}
.src-pick:focus-within{border-color:var(--accent)}
.src-sec .seg{flex-wrap:wrap}
.night-step{padding:3px 9px;line-height:1.2}
.night-pick{position:relative}
.night-pick>summary{list-style:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border-color:var(--border2);background:var(--card)}
.night-pick>summary::-webkit-details-marker{display:none}
.night-pick>summary b{font-size:13px;color:var(--ink)}
.night-pick[open]>summary{border-color:var(--accent)}
.night-menu{position:absolute;z-index:40;top:calc(100% + 6px);right:0;width:318px;max-height:70vh;overflow:auto;padding:10px 12px 12px;background:var(--card);border:1px solid var(--border2);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.16)}
.night-menu-h{font-size:11px;color:var(--muted);margin:2px 2px 4px}
.night-menu .opt{margin-top:6px;padding:7px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.night-menu .opt b{white-space:nowrap}
.night-menu .opt .muted{text-align:right}
@media (max-width:640px){.night-pick{position:static}.night-controls{position:relative}.night-menu{left:0;right:auto;width:min(318px,calc(100vw - 32px))}}
/* 观测夜日历 */
.ncal{margin:2px 0 4px}
.ncal-h{display:flex;align-items:center;justify-content:space-between;margin:0 2px 6px}
.ncal-h b{font-size:13px}
.ncal-nav{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--ink2);cursor:pointer;font-size:15px;line-height:1}
.ncal-nav:hover{border-color:var(--axis)}
.ncal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.ncal-wd{font-size:10.5px;color:var(--muted);text-align:center;padding:2px 0}
.ncal-d{position:relative;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:5px 0 0;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;color:var(--muted);font:inherit}
.ncal-d:hover{border-color:var(--axis)}
.ncal-d.has{color:var(--ink)}
.ncal-d .ncal-n{font-size:12.5px;line-height:1.1}
.ncal-d.has .ncal-n{font-weight:600}
.ncal-d.today .ncal-n{box-shadow:0 1.5px 0 var(--ink2)}
.ncal-d.obs{background:var(--accent-soft)}
.ncal-d.obs.sim{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 4px,transparent 4px 7px);border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent)}
.ncal-d.wx{background:var(--sunk2)}
.ncal-d.sel,.ncal-d.sel.obs.sim{border:2px solid var(--accent);padding-top:4px}
.ncal-m{display:flex;gap:3px;align-items:center;height:9px}
.cm{display:inline-block;flex:none;vertical-align:middle}
.cm-plan{width:6px;height:6px;border-radius:50%;background:var(--accent)}
svg.cm-cloud{width:12px;height:8px;fill:var(--muted);stroke:var(--muted);stroke-width:1}
svg.cm-cloud.part{fill:none}
svg.cm-grb{width:9px;height:9px;fill:var(--danger)}
svg.cm-grb[data-gcn-state]{width:11px;height:11px}
svg.cm-grb[data-gcn-state="notice"]{fill:none;stroke:var(--danger);stroke-width:1.4;stroke-linejoin:round}
.ncal-empty{margin:8px 2px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ncal-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:10px 2px 0;font-size:11px}
.ncal-legend span{display:inline-flex;align-items:center;gap:4px}
.ncal-sw{width:14px;height:10px;border-radius:3px;display:inline-block}
.ncal-sw.obs{background:var(--accent-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
.ncal-sw.obs.sim{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 3px,transparent 3px 5px);box-shadow:none;border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent)}
.night-jump{display:flex;flex-wrap:wrap;gap:6px}
.night-jump .chip{display:inline-flex;gap:5px;align-items:baseline;font-size:12px;padding:3px 9px}
.night-jump .chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.night-menu .night-menu-h{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule)}
.night-menu-f{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:12px;padding-top:10px;border-top:1px solid var(--rule)}
.night-menu-f label{display:inline-flex;align-items:center;gap:6px}
.night-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:12px;justify-content:center}
/* 模拟数据的统一标记：斜纹底 + 虚线框，和“警告”分开 */
.pill.sim,.tag.sim{background:repeating-linear-gradient(135deg,var(--sunk2) 0 4px,transparent 4px 8px);color:var(--ink2);border:1px dashed var(--axis)}
.pill.sim{padding:1px 9px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 11px;border-radius:20px;border:1px solid var(--border2);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
.chip:hover{border-color:var(--axis)}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.danger{background:var(--danger-soft);color:var(--danger)} .pill.plain{background:var(--sunk2);color:var(--ink2)}

/* —— 版面 —— */
main{max-width:1440px;margin:0 auto;padding:24px 28px 64px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:18px}
.head .t{flex:1 1 420px;min-width:0}
.eyebrow{font-size:12px;color:var(--muted);margin-bottom:4px;overflow-wrap:anywhere}
h1{margin:0;font-size:25px;font-weight:600;letter-spacing:.01em}
h2{margin:0;font-size:16px;font-weight:600}
h3{margin:0;font-size:14px;font-weight:600}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;min-width:0}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.stack{display:flex;flex-direction:column;gap:20px}
.grow{flex:999 1 720px;min-width:0} .side{flex:1 1 340px;min-width:0}
.note{margin:10px 0 0;font-size:12px;color:var(--muted);line-height:1.65}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:20px}
.kpi{padding:15px 20px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0 -1px -1px 0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:27px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.25}
.kpi .v small{font-size:13px;font-weight:400;color:var(--muted)}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}

.seg{display:inline-flex;padding:3px;background:var(--seg);border-radius:9px;gap:2px;flex-wrap:wrap}
.seg button{font-size:13px;padding:5px 14px;border:0;border-radius:7px;background:transparent;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.seg.full{display:flex} .seg.full button{flex:1}
.btn{font-size:13px;padding:6px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--axis)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
a.btn{text-decoration:none;display:inline-block}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--card)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-size:inherit}
.linkbtn:hover{color:var(--accent-ink);text-decoration:underline}
.key{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--ink2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:-1px;margin-right:5px}

/* —— 表格 —— */
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{font-weight:500;font-size:12px;color:var(--muted);text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--sunk)}
table.t tr.sel td{background:var(--accent-soft)}

/* —— 缺数据提示 —— */
.missing{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:9px;padding:8px 12px;line-height:1.6}
.missing b{font-weight:600}
.missing code,.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:11.5px}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty.slim{padding:14px 18px;text-align:left}
/* 原计划里没执行的部分（告警页时间轴等）：画在执行色块下面，浅色加虚线框 */
:root{--ghost-fill:18%;--ghost-line:65%}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ghost-fill:34%;--ghost-line:85%}}
:root[data-theme="dark"]{--ghost-fill:34%;--ghost-line:85%}
.ghost-blk{position:absolute;top:4px;bottom:4px;border-radius:6px;box-sizing:border-box;border:1px dashed color-mix(in srgb,var(--source-color) var(--ghost-line),transparent);background:color-mix(in srgb,var(--source-color) var(--ghost-fill),var(--sunk))}
.solid-blk{position:absolute;top:4px;bottom:4px;border-radius:6px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:5px;background:var(--sunk2);color:var(--ink2);white-space:nowrap}
.tag.approx{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--border2);font-weight:400}

/* —— 抽屉 —— */
.scrim{position:fixed;inset:0;background:rgba(10,15,15,.28);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--card);border-left:1px solid var(--border);z-index:41;overflow-y:auto;padding:20px 22px 40px;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
.drawer h2{margin-bottom:4px}
.drawer section{margin-top:22px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-top:8px;cursor:pointer;background:var(--card);width:100%;text-align:left}
.opt:hover{border-color:var(--axis)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.checklist{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px}
.checklist li{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.checklist .mk{width:16px;flex:none;text-align:center;font-weight:700}
.drop{border:1.5px dashed var(--axis);border-radius:10px;padding:16px;text-align:center;color:var(--muted);font-size:13px}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* —— 当夜 —— */
.tn-sources{margin-top:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(174px,100%),1fr));gap:12px}
.scard{text-align:left;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 15px;cursor:pointer;position:relative;overflow:hidden}
.scard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.scard[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.tn-unplanned{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.cards + .tn-unplanned{margin-top:8px}

.lane{position:relative;height:40px;background:var(--sunk);border-radius:7px}
.blk{position:absolute;top:4px;bottom:4px;border-radius:5px;overflow:hidden;padding:2px 6px;font-size:11px;line-height:1.35;white-space:nowrap;cursor:pointer;border:0;text-align:left;color:#fff}

.blk.on{box-shadow:0 0 0 2px var(--ink)}
.lanes{display:grid;grid-template-columns:62px minmax(0,1fr);gap:6px 8px;align-items:center}

input[type=range]{width:100%;accent-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}

/* —— 全年 —— */
.mbar{display:grid;grid-template-columns:86px minmax(0,1fr) 120px;gap:8px 12px;align-items:center;font-size:12.5px}

.mbar .bars i{display:block;height:100%}

.mbar .mrow{display:contents}

@media (max-width:720px){
  .top{padding:0 16px;position:static;gap:0 10px}
  /* 手机页眉：第一行站名 + 观测夜 + ⋯，第二行导航；版本、结果来源、结果、操作人收在 ⋯ 里 */

}
@media (max-width:480px){

  main{padding:18px 16px 48px}
  h1{font-size:21px}

  .mbar{grid-template-columns:64px minmax(0,1fr)}

}
@media print{.top,.drawer,.scrim{display:none} body{background:#fff}}
svg .axl{font-size:11px;fill:var(--muted)}
/* —— 微调 —— */
.lane.editing{cursor:copy;background:repeating-linear-gradient(90deg,var(--sunk) 0 24px,var(--sunk2) 24px 25px)}
.blk.edit{cursor:grab;touch-action:none}
.blk.edit::before,.blk.edit::after{content:"";position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize}
.blk.edit::before{left:0} .blk.edit::after{right:0}
.blk.edit:hover{box-shadow:inset 3px 0 0 rgba(255,255,255,.55),inset -3px 0 0 rgba(255,255,255,.55)}
.blk.frozen{cursor:not-allowed;filter:saturate(.5)}
.blk.conflict{outline:2px solid var(--danger);outline-offset:1px;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 3px,transparent 3px 7px)!important}
.blk.warned{outline:2px dashed var(--warn);outline-offset:1px}
.blk.dragging{opacity:.85;cursor:grabbing;z-index:3}
.ghost{position:absolute;top:2px;bottom:2px;border:1.5px dashed var(--faint);border-radius:6px;pointer-events:none}
.drag-tip{position:fixed;z-index:50;background:var(--ink);color:var(--card);font-size:12px;padding:3px 8px;border-radius:6px;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.issue{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--rule);font-size:13px}
.issue .mk{width:16px;flex:none;text-align:center;font-weight:700}
input.hm{width:92px;padding:4px 6px;border:1px solid var(--border2);border-radius:6px;background:var(--card);font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.field input:not([type=checkbox]),.field select{font-size:13px;color:var(--ink);padding:5px 8px;border:1px solid var(--border2);border-radius:7px;background:var(--card);min-width:0;width:100%}

/* —— 当夜：未来几夜、逐夜小柱 —— */
.tn-future{border-top:1px solid var(--rule);margin-top:16px;padding-top:14px}
.tn-future .card-h{margin-bottom:8px}
.fut-lanes{gap:5px 8px}
.fut-lanes .lbl .linkbtn{color:var(--ink)}
.fut-lanes .lbl .linkbtn[aria-pressed="true"]{color:var(--accent)}
.fut-lane{position:relative;height:30px;background:var(--sunk);border-radius:6px;cursor:pointer;overflow:hidden}
.fut-lane:hover{background:var(--sunk2)}
.fut-lane.preview{outline:1px dashed var(--axis);outline-offset:-1px}
.fut-lane.near{height:24px}
.fut-lane.on{box-shadow:inset 0 0 0 2px var(--accent)}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:26px;vertical-align:middle}
.spark span{display:flex;flex-direction:column;justify-content:flex-end;width:9px;height:100%;background:var(--sunk2);border-radius:2px;overflow:hidden}
.spark i{display:block;width:100%}
.spark i.na{height:100%;background:repeating-linear-gradient(135deg,var(--hatch) 0 2px,transparent 2px 5px)}
.mlabel{color:var(--ink);font-size:13px}
.mlabel[aria-pressed="true"]{color:var(--accent);text-decoration:underline}

/* —— 审核页首的结论 —— */
.verdict{border:1px solid var(--border);border-left:4px solid var(--axis);border-radius:12px;background:var(--card);padding:14px 18px;margin-bottom:20px}
.verdict.ok{border-left-color:var(--accent)} .verdict.warn{border-left-color:var(--warn)} .verdict.bad{border-left-color:var(--danger)}
.verdict-h{display:flex;align-items:center;gap:10px;font-size:17px}
.verdict-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 28px;margin-top:12px;padding-top:12px;border-top:1px solid var(--rule)}
.vitem .vk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.vitem .vk b{color:var(--ink);font-size:14px}
.vitem .small{margin:3px 0 0 28px;line-height:1.5}
.vmark{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:700;flex:none;background:var(--sunk2);color:var(--muted)}
.vmark.ok{background:var(--accent-soft);color:var(--accent)} .vmark.warn{background:var(--warn-soft);color:var(--warn)} .vmark.bad{background:var(--danger-soft);color:var(--danger)}
.verdict-h .vmark{width:26px;height:26px;font-size:15px}
.foldnote{margin-top:14px;font-size:12.5px;color:var(--ink2)}
.foldnote>summary{color:var(--accent)}
.foldnote>div{margin-top:8px;padding:12px 14px;background:var(--sunk);border-radius:10px;line-height:1.75}
.rp-allok{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:2px 0;font-size:14px}
.rp-allok .muted{font-size:12.5px}
.rp-allok a{font-size:12.5px;margin-left:auto}
.steps{margin:8px 0 10px;padding-left:22px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;font-size:13px;color:var(--ink2)}
.steps .btn{padding:4px 12px}
.too-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:10px;margin:8px 0 14px}
.too-fields label{display:grid;align-content:start;gap:4px;font-size:.85rem;color:var(--muted)}
.too-fields :is(input,select,textarea){width:100%;min-width:0;box-sizing:border-box}
.too-fields .too-wide{grid-column:1/-1}
.too-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px 20px;padding-left:20px}
.too-steps li{padding:3px 0;overflow-wrap:anywhere}
.too-steps-d .too-steps{margin:8px 0 0}
/* 事件判定 · 观测时长：两对字段一行，窄屏一对一行 */
.kv.too-judge{grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);column-gap:14px}
.kv.too-judge dt:nth-of-type(2n){padding-left:14px;border-left:1px solid var(--rule)}
.too-more{display:flex;flex-wrap:wrap;gap:0 22px;align-items:flex-start}
.too-more>details{flex:0 0 auto;max-width:100%} .too-more>details[open]{flex-basis:100%}
@media (max-width:860px){.kv.too-judge{grid-template-columns:auto minmax(0,1fr)} .kv.too-judge dt:nth-of-type(2n){padding-left:0;border-left:0}}
[data-too-section] details{margin-top:9px}
[data-too-section="pools"] .scroll-x + .scroll-x{margin-top:10px}

/* 点开的小提示（悬停说明的触屏版） */
.taptip{position:fixed;z-index:60;max-width:min(320px,calc(100vw - 16px));padding:7px 10px;border-radius:8px;background:var(--ink);color:var(--card);font-size:12px;line-height:1.5;white-space:pre-line;box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:auto}

/* 审核页求解表：手机宽时“说明”给足宽度，去掉“接近上界”条（说明里已写结果） */

@media (max-width:720px){.au-bar{display:none}}

/* 告警页：定位图和覆盖曲线并排；场号压在圈中心、带底色描边 */
.loc-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:8px 28px;align-items:start}
.loc-map svg{max-width:none!important}

@media (max-width:860px){.loc-grid{grid-template-columns:minmax(0,1fr)}}
/* “现在上，还是等一等”：没有等一等的选项时只占一行 */

/* 全年 · 各源入账与计划：源色热力格（实色已入账、斜纹计划）+ 进度条 */
.ym-table td.ym-td{padding:4px 3px;min-width:50px}

.is-public [data-act="wbAddSource"],.is-public a[href^="#inputs"],.is-public a[href^="#report"],.is-public a[href^="#audit"],.is-public .top-more,

.is-public [data-act="previewRemainingNight"],.is-public [data-act="discardRemainingNight"],.is-public [data-act="confirmRemainingNight"],
.is-public [data-act="tnFillerFetch"],.is-public [data-act="tnFillerAdd"],.is-public [data-act="yrFillerMonth"],
.is-public [data-act="alAction"],.is-public [data-act="alRevoke"],.is-public [data-act="alRefresh"],.is-public .seg:has([data-act="tnMode"]){display:none!important}

/* Gamma atlas, station sky, and exposure overlays use the workbench tokens. */

.wb-focus-mark{width:15px;height:15px;display:inline-block;vertical-align:middle;margin-inline-end:4px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
.wb-sky-target{cursor:pointer}
.wb-sky-target circle{fill:none;stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}
.wb-sky-target path{stroke:var(--ink);stroke-width:2;stroke-linecap:round;vector-effect:non-scaling-stroke}
.wb-sky-target text{font-size:12px;font-weight:650;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.wb-atlas-sun{fill:var(--warn);stroke:var(--card)}
.wb-atlas-moon{fill:var(--moon);stroke:var(--card)}
.wb-atlas-moonzone{fill:var(--moonfill);fill-opacity:.2;stroke:var(--moonline);stroke-width:1.2;stroke-dasharray:3 3}
.wb-solar-events{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 12px;margin:6px 0;color:var(--ink2)}
.wb-solar-events div{display:flex;flex-wrap:wrap;gap:4px 10px}
.wb-solar-events time{font-variant-numeric:tabular-nums}
.wb-ground-trail path{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:5 3;vector-effect:non-scaling-stroke}
.wb-ground-trail circle{fill:var(--warn);stroke:var(--card);stroke-width:1;vector-effect:non-scaling-stroke}
.wb-atlas-neighbor{border-top:1px solid var(--border);margin-top:10px;padding-top:5px}
.wb-neighbor-chart{width:min(100%,460px);margin:auto}
.wb-neighbor-chart svg{width:100%;display:block}
.wb-atlas-neighbor-bg{fill:var(--sunk);stroke:var(--axis)}
.wb-atlas-localstar{fill:var(--warn);opacity:.83}
.wb-exposure-dialog{width:min(96vw,1100px);max-width:calc(100vw - 10px);max-height:90dvh;background:var(--card);color:var(--ink);border:1px solid var(--border2);overflow:auto}
.wb-exposure-dialog::backdrop{background:color-mix(in srgb,var(--night) 72%,transparent)}
.wb-exposure-dialog form{margin-left:auto}
.wb-exposure-panel{margin-top:20px}
.wb-exposure-panel + .kpis,.wb-exposure-panel + .card{margin-top:20px}
.wb-sky-grid .wb-atlas-neighbor .wb-object-legend{display:none}
.wb-exposure-pixel:hover,.wb-exposure-pixel:focus-visible{stroke:var(--sel);stroke-width:2.5}
.wb-exposure-info .chip{margin:0 4px 4px 0}
@media(max-width:600px){
  .wb-atlas-expanded{inset:1vh 1vw}
  .wb-exposure-dialog{width:96vw;padding:8px}
  .wb-atlas-controls,.wb-atlas-layers{gap:4px 8px}
}

/* —— 11-11 整理：控件收纳、图例、台站天空两栏 —— */
.wb-atlas-card .card-h{align-items:center}
.wb-atlas-actions{display:flex;gap:8px;flex-wrap:wrap}
.wb-atlas-controls{margin:0 0 10px}
.wb-atlas-controls label{color:var(--muted)}
.wb-atlas-controls select{min-height:28px;padding-block:2px}
.wb-zoom{display:inline-flex;gap:4px;margin-left:auto}
.wb-zoom .chip{padding:3px 10px}
.wb-layer-menu{position:relative;font-size:12px}
.wb-layer-menu>summary{list-style:none;display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border:1px solid var(--border2);border-radius:7px;background:var(--card);color:var(--ink);min-height:28px}
.wb-layer-menu>summary::-webkit-details-marker{display:none}
.wb-layer-menu>summary::after{content:"▾";color:var(--muted)}
.wb-layer-menu[open]>summary{border-color:var(--accent);color:var(--accent)}
.wb-layer-list{position:absolute;z-index:6;top:calc(100% + 4px);left:0;min-width:200px;display:grid;gap:7px;padding:10px 12px;background:var(--card);border:1px solid var(--border2);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.14)}
.wb-layer-list label{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink2);white-space:nowrap}
.wb-layer-list input[type=range]{width:90px}
.wb-atlas-map{background:var(--sunk);border-radius:10px}
.wb-atlas-source.is-task{stroke:var(--ink);stroke-width:1.4}
.wb-atlas-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;margin-top:8px}
.wb-atlas-legend{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin:0;color:var(--ink2)}
.wb-heat-key{display:inline-block;width:46px;height:8px;border-radius:4px;margin-right:5px;vertical-align:0;background:linear-gradient(90deg,color-mix(in srgb,var(--heat) 15%,var(--card)),var(--heat))}
.wb-key-plane,.wb-key-reach,.wb-key-reach50{display:inline-block;width:18px;margin-right:5px;vertical-align:middle}
.wb-key-plane{border-top:2px dashed var(--moonline)}
.wb-key-reach{height:9px;border-radius:2px;background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px dashed var(--accent)}
.wb-atlas-legend .wb-key-reach.is-clear{background:var(--zone-ring)}
.wb-key-reach50{height:9px;border-radius:2px;background:var(--zone-in);border:1px dashed var(--reach50)}
[data-wb-atlas-detail] .wb-atlas-controls{margin:10px 0 0}
.wb-sky-time{align-items:center}
.wb-sky-slider{flex:1 1 260px;display:flex!important;align-items:center;gap:8px}
.wb-sky-slider output{font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;min-width:46px}
.wb-sky-slider input[type=range]{flex:1;max-width:none!important}
.wb-sky-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:8px 24px;align-items:start;margin-top:10px}
.wb-sky-grid .wb-atlas-neighbor{border-top:0;margin-top:0;padding-top:0}
.wb-sky-grid .wb-object-legend{justify-content:center}
.wb-sky-hint{padding:36px 16px;text-align:center;color:var(--ink2);background:var(--sunk);border-radius:10px}
.wb-solar-fold{margin-top:10px;font-size:12px;color:var(--ink2)}
.wb-solar-fold summary{color:var(--accent)}
.wb-station-disk{width:min(100%,520px)}
@media(max-width:820px){ .wb-sky-grid{grid-template-columns:minmax(0,1fr)} .wb-zoom{margin-left:0} }

/* —— 曝光图 —— */
:root{--exp-1:#F2E6B8;--exp-2:#E5B955;--exp-3:#86B38B;--exp-4:#2E8179;--exp-5:#163E57;--plan-line:#B4442E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--exp-1:#22414B;--exp-2:#2E7F78;--exp-3:#7DB58C;--exp-4:#E3BB58;--exp-5:#FBF1C7;--plan-line:#F0A08C}}
:root[data-theme="dark"]{--exp-1:#22414B;--exp-2:#2E7F78;--exp-3:#7DB58C;--exp-4:#E3BB58;--exp-5:#FBF1C7;--plan-line:#F0A08C}
.wb-exposure-grid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}
.wb-exposure-mapcol{min-width:0}
.wb-exposure-mapcol .wb-atlas-map{cursor:grab}
.wb-exposure-mapcol .wb-atlas-map[data-wb-dragging],.wb-exposure-mapcol .wb-atlas-map[data-wb-dragging] *{cursor:grabbing}
.wb-exposure-mapcol .wb-atlas-legend{margin-top:6px}
.wb-exposure-side{display:grid;gap:0;font-size:12.5px}
.wb-exposure-side section{padding:11px 0;border-top:1px solid var(--rule)}
.wb-exposure-side section:first-child{border-top:0;padding-top:0}
.wb-exposure-side h3{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px}
.wb-exposure-date{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
.wb-exposure-time{display:flex;align-items:center;gap:8px}
.wb-exposure-time .btn{padding:3px 10px}
.wb-exposure-time input[type=range]{flex:1;min-width:0}
.wb-exposure-check{display:flex;align-items:center;margin-top:8px;color:var(--ink2)}
.wb-exposure-bar{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--exp-1),var(--exp-2),var(--exp-3),var(--exp-4),var(--exp-5))}
.wb-exposure-ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);margin:3px 0 2px}
.wb-exposure-planrow{display:flex;align-items:center;gap:7px;margin-top:9px;color:var(--ink2)}
.wb-exposure-hatch{display:inline-block;flex:none;width:26px;height:12px;border-radius:3px;border:1px solid var(--plan-line);background:repeating-linear-gradient(135deg,var(--plan-line) 0 1px,transparent 1px 5px)}
.wb-exposure-goto{display:flex;flex-wrap:wrap;gap:6px}
.wb-exposure-goto .chip{padding:3px 10px}
.wb-exposure-goto .chip[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.wb-exposure-info{display:grid;gap:4px;min-height:74px;color:var(--ink2);font-size:12px;overflow-wrap:anywhere}
.wb-exposure-info .chip{margin:0 4px 4px 0}
.wb-exposure-pixel{stroke-width:.6;stroke-linejoin:round;vector-effect:non-scaling-stroke;cursor:pointer}
.wb-exposure-pixel.is-planned{stroke:none}
.wb-exposure-pixel.is-planned.is-over{pointer-events:none}
.wb-exposure-pixel:hover,.wb-exposure-pixel:focus-visible{stroke:var(--ink)!important;stroke-width:1.6}
.wb-plan-bg{fill:var(--plan-line);fill-opacity:.07}
.wb-plan-line{stroke:var(--plan-line);stroke-width:1.1;stroke-opacity:.85}
.wb-exposure-name{font-weight:600;fill:var(--ink)}
.wb-atlas-field{stroke-width:.6}
@media(max-width:900px){ .wb-exposure-grid{grid-template-columns:minmax(0,1fr)} }

.wb-atlas-alert-region{fill:none;stroke:var(--tier2);stroke-width:1;vector-effect:non-scaling-stroke}
.wb-atlas-alert-90{stroke-width:1.6;stroke-dasharray:4 3}

/* 雨季天区：暖色柔和底，按雨季占比分三档加深，整体模糊成自然过渡 */
.wb-atlas-summer{pointer-events:none}
.wb-atlas-summer path{fill:var(--warn)}
.wb-atlas-summer .t0{fill-opacity:.12} .wb-atlas-summer .t1{fill-opacity:.09} .wb-atlas-summer .t2{fill-opacity:.09} .wb-atlas-summer .t3{fill-opacity:.1}
.wb-key-summer{display:inline-block;width:22px;height:9px;margin-right:5px;vertical-align:middle;border-radius:5px;background:linear-gradient(90deg,color-mix(in srgb,var(--warn) 10%,transparent),color-mix(in srgb,var(--warn) 38%,transparent))}

/* 源与窗口天图：天顶角始终 > 70° 的天区不上色（11-24 用户定） */
.wb-atlas-globe.is-dim{fill:var(--card)}
/* 源与窗口天图的天顶角分区：≤ 50° 浅蓝、50°—70° 浅绿（方案二，用户 11-24 选） */
.wb-atlas-globe.is-dim~g .wb-atlas-reach .wb-atlas-band-fill{fill:var(--zone-ring);fill-opacity:1}
.wb-atlas-globe.is-dim~g .wb-atlas-reach50 .wb-atlas-band-fill{fill:var(--zone-in);fill-opacity:1}

.wb-cat-toolbar{display:flex;gap:.55rem .85rem;align-items:center;flex-wrap:wrap;margin:.6rem 0}
.wb-cat-toolbar label{display:inline-flex;align-items:center;gap:.35rem;flex-wrap:wrap}
[data-wb-source-input],[data-wb-fermi],[data-wb-private],[data-wb-import]{margin:0 0 1rem}
[data-wb-import] textarea{box-sizing:border-box;width:100%}
[data-wb-source-info] dd{margin:0 0 .35rem;overflow-wrap:anywhere}
[data-wb-source-info] dl{display:grid;grid-template-columns:minmax(5.5rem,.25fr) minmax(0,1fr);gap:.35rem .7rem}
[data-wb-source-info] ul{padding-inline-start:1.3rem}
.wb-cat-entry{margin:0;gap:6px 8px}
.wb-cat-entry .btn{padding:5px 12px}

/* 源信息里的别名：一个一个分开 */
.si-aliases{display:flex;flex-wrap:wrap;gap:4px 6px}
.si-aliases span{padding:1px 8px;border-radius:10px;background:var(--sunk2);font-size:12px;line-height:1.6;overflow-wrap:anywhere}

/* 原计划里没执行的部分：画在同一条组道、执行色块的下面 */
:root{--ghost-fill:18%;--ghost-fill-wx:14%;--ghost-line:65%}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ghost-fill:34%;--ghost-fill-wx:26%;--ghost-line:85%}}
:root[data-theme="dark"]{--ghost-fill:34%;--ghost-fill-wx:26%;--ghost-line:85%}
.blk.replay-ghost{padding:0;cursor:default;border:1px dashed color-mix(in srgb,var(--source-color) var(--ghost-line),transparent);background:color-mix(in srgb,var(--source-color) var(--ghost-fill),var(--sunk))}
.blk.replay-ghost.wx{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--muted) 45%,transparent) 0 1.5px,transparent 1.5px 5px),color-mix(in srgb,var(--source-color) var(--ghost-fill-wx),var(--sunk))}
.blk.replay-ghost.replay-weather-piece{inset-block:0;cursor:pointer}
.replay-weather-label{pointer-events:none;text-shadow:0 0 3px #21262c,0 1px 2px #21262c}
.key.replay-ghost-key{display:inline-block;width:18px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:3px;--source-color:var(--ink2);border:1px dashed color-mix(in srgb,var(--source-color) var(--ghost-line),transparent);background:color-mix(in srgb,var(--source-color) var(--ghost-fill),var(--sunk))}
.key.replay-ghost-key.wx{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--muted) 45%,transparent) 0 1.5px,transparent 1.5px 5px),color-mix(in srgb,var(--source-color) var(--ghost-fill-wx),var(--sunk))}
.replay-ghost-name{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* 被替代的原计划：和天气停观同一种画法（同高、虚线框、斜纹），斜纹用被替代那个源的颜色；天气停观是灰斜纹（11-24）。不写字，源名、时段、原因在悬停里 */
.blk.replay-ghost:not(.wx),.key.replay-ghost-key:not(.wx){background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--source-color) 60%,transparent) 0 1.5px,transparent 1.5px 5px),color-mix(in srgb,var(--source-color) var(--ghost-fill),var(--sunk))}

/* —— 源与窗口 —— */
.win-tabs{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:14px}
.win-tabs .seg button{padding:6px 18px;font-size:14px}
.win-tabs .note{margin:0}
.win-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,400px);gap:20px;align-items:start}
.win-main{min-width:0}
.win-side{position:sticky;top:64px;max-height:calc(100vh - 84px);overflow-y:auto;padding:16px 18px;scrollbar-width:thin}
.win-side-empty{padding:28px 6px;text-align:center;color:var(--ink2)}
.win-side-empty .note{margin-top:6px}
.win-side-h{display:flex;gap:10px;align-items:flex-start}
.win-side-h .t{flex:1;min-width:0}
.win-side-h h2{font-size:18px;overflow-wrap:anywhere;line-height:1.3}
.win-side-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.win-sec{border-top:1px solid var(--rule);margin-top:14px;padding-top:12px}
.win-sec .card-h{margin-bottom:8px;align-items:center}
.win-sec .card-h .note{margin:0}
.win-inline{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.win-kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 0}
.win-kv3>div{background:var(--sunk);border-radius:8px;padding:7px 10px}
.win-kv3 dt{font-size:11px;color:var(--muted)}
.win-kv3 dd{margin:0;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.win-kv3 dd small{font-size:11px;font-weight:400;color:var(--muted)}

.win-controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end}
.win-controls label:not(.win-check):not(.win-upload):not(.win-inline){display:grid;gap:3px;font-size:12px;color:var(--muted)}
.win-controls input[type=number]{width:94px}
.win-controls input[type=search]{min-width:180px;width:100%}
.win-controls .win-grow{flex:1 1 180px}
.win-row2{margin-top:10px;align-items:center}
.win-check{display:inline-flex;align-items:center;min-height:30px;font-size:13px;color:var(--ink2);cursor:pointer}
.win-upload{position:relative;cursor:pointer}
.win-upload input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.win-upload:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.win-stepper{display:inline-flex;align-items:center;gap:4px}
.win-stepper .btn{padding:4px 10px;min-height:30px;line-height:1}
.win-stepper b{min-width:44px;text-align:center;font-size:14px}
.win-more{border:0;background:none;color:var(--accent);font-size:13px;cursor:pointer;padding:4px 0}
.win-morebox{margin-top:10px;padding:12px 14px;background:var(--sunk);border-radius:10px}
.win-conditions{margin-top:12px}
.win-conditions h3{font-size:13px;margin-bottom:6px}
.win-conditions dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:12px;margin:0 0 10px}
.win-conditions dt{color:var(--muted)}
.win-conditions dd{margin:0;color:var(--ink2)}

.win-table-wrap{margin-top:14px}
.win-table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}
.win-table th,.win-table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:middle}
.win-table thead th{color:var(--muted);font-size:12px;font-weight:500;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card)}
.win-table th.num,.win-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.win-table tbody th{font-weight:500}
.win-table tr.click{cursor:pointer}
.win-table tr.click:hover>*{background-color:var(--sunk)}
.win-table tr.sel>th:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.win-table tr.sel>th,.win-table tr.sel>td:not(.win-heat){background-color:var(--accent-soft)}
.win-year tr.sel>th:first-child{box-shadow:none}
.win-year tr.sel .win-link{color:var(--accent)}
.win-meta{font-size:11px;color:var(--muted);line-height:1.3;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.win-link{color:var(--ink);border:0;background:none;padding:0;font-weight:600;cursor:pointer;text-align:left;max-width:230px;overflow:hidden;text-overflow:ellipsis;display:block}
.win-link:hover,.win-link[aria-current]{color:var(--accent)}
/* 全年窗口表：圆角色块、行间不画线，和“全年”页的月条一个画法 */
.win-year th,.win-year td{border-bottom:0}
.win-year thead th{border-bottom:1px solid var(--border)}
.win-year tbody tr:first-child>*{padding-top:8px}
.win-year td.win-heat{padding:2px 1.5px;min-width:42px;font-size:12.5px}
.win-table th.win-mcol{text-align:center}
.win-tile{display:block;padding:7px 4px 6px;border-radius:6px;text-align:center;background-color:var(--sunk);--c:color-mix(in srgb,var(--heat) var(--heat-p,0%),transparent);background-image:linear-gradient(var(--c),var(--c))}
.win-tile.hot{color:var(--heat-ink)}
.win-year tr.click:hover>td.win-heat{background-color:transparent}
.win-year tbody th,.win-year td.win-starcell,.win-year td.win-total{border-radius:6px}
.win-year .rainy .win-tile:not(.hot){color:var(--muted)}
.win-year thead th.rainy .win-mh{color:var(--faint);font-style:italic}
.win-mh{border:0;background:none;padding:2px 0;cursor:pointer;color:var(--muted);font-size:12px}
.win-mh:hover{color:var(--ink)}
.win-mh[aria-pressed=true]{color:var(--ink);font-weight:700}
.win-table thead th:first-child .win-mh{font-size:12px}
.win-total{font-weight:600}
.win-year td.win-t5{color:var(--ink2);border-radius:6px;padding-left:12px}
.win-year td.win-t5.is-long,.win-year td.win-t5.is-none{color:var(--faint)}
.win-year th.win-t5h{padding-left:12px}
.dt-how{margin-top:4px}
.dt-how>summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none}
.dt-how>summary::-webkit-details-marker{display:none}
.dt-how>summary::before{content:"▸ "}
.dt-how[open]>summary::before{content:"▾ "}
.dt-how>summary:hover{color:var(--ink)}
.win-starcell{white-space:nowrap;padding-inline:2px!important}
.win-focus{border:0;background:none;cursor:pointer;color:var(--axis);font-size:15px;line-height:1;padding:4px}
.win-focus:hover{color:var(--warn)}
.win-focus[aria-pressed=true]{color:var(--warn)}
.win-focus.big{font-size:22px;padding:0 2px}
.win-prio{font-size:11px;color:var(--warn);font-variant-numeric:tabular-nums}
.win-priority{width:64px}
.win-pagination{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px;font-size:12px;color:var(--ink2)}
.win-pagination .win-grow{flex:1}
.win-pagination .btn{padding:4px 12px}
.win-scale{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.win-scale i{display:inline-block;width:64px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--sunk),var(--heat))}

.win-bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px}
.win-bars button{display:grid;gap:2px;justify-items:center;min-width:0;background:none;border:0;border-radius:6px;padding:3px 0;color:var(--muted);font-size:11px;cursor:pointer}
.win-bars button small{font-size:10.5px;color:var(--ink2)}
.win-bars button:hover{background:var(--sunk)}
.win-bars button[aria-pressed=true]{background:var(--heat-soft);color:var(--ink);font-weight:700}
.win-bars button.rainy small{color:var(--faint)}
.win-bar{height:64px;width:100%;display:flex;align-items:end;justify-content:center}
.win-bar i{width:66%;min-height:2px;height:var(--bar,0%);background:var(--tier2);border-radius:4px}
.win-bars button[aria-pressed=true] .win-bar i{background:var(--heat)}
.win-bars button.rainy .win-bar i{background:repeating-linear-gradient(135deg,var(--tier2) 0 2px,transparent 2px 5px)}
.win-nights{display:grid;gap:1px;max-height:300px;overflow-y:auto;scrollbar-width:thin;margin-top:4px}
.win-night{display:grid;grid-template-columns:38px minmax(0,1fr) 34px;gap:8px;align-items:center;border:0;background:none;padding:2px 4px;border-radius:4px;font-size:11.5px;color:var(--ink2);cursor:pointer;text-align:right}
.win-night>span:first-child{text-align:left;color:var(--muted)}
.win-night:hover,.win-night.on{background:var(--sunk2);color:var(--ink)}
.win-track{display:block;position:relative;height:8px;min-width:80px;background:var(--sunk2);border-radius:4px;overflow:hidden}
.win-track i{position:absolute;inset-block:0;background:var(--heat);border-radius:4px}
.win-track b{position:absolute;inset-block:0;width:2px;background:var(--ink)}
.win-trackcell{min-width:220px}
.win-trackcell .win-track{margin-bottom:3px}
.win-nighttable td,.win-nighttable th{padding-block:7px}

[data-wi-tracks] svg{display:block;width:min(100%,850px);margin-top:12px}
[data-wi-tracks] svg text{fill:var(--ink2);font-size:12px}
.win-legend{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.win-legend i{height:3px;width:15px}
.win-zenith h3{margin:0}
.win-zenith .legend{margin-block:6px}
.win-z-row{display:grid;grid-template-columns:52px minmax(50px,1fr) minmax(64px,auto);align-items:center;gap:8px;margin-block:5px;font-size:12px;color:var(--ink2)}
.win-z-row .num{text-align:right}
.win-z-bars{display:grid;grid-template-rows:7px 7px;gap:2px;background:var(--sunk);border-radius:3px;overflow:hidden}
.win-z-bars i{display:block;border-radius:3px}
.win-z-available{background:var(--tier2)}
.win-z-planned{background:var(--accent)}
.win-skywrap .wb-sky-date,.win-skywrap [data-wb-now]{display:none}

.zm{display:grid;grid-template-columns:46px repeat(12,minmax(0,1fr)) 64px;gap:2px;align-items:center;font-size:11px}
.zm-m{border:0;background:none;padding:2px 0;font-size:11px;color:var(--muted);cursor:pointer;border-radius:4px}
.zm-m:hover{background:var(--sunk2);color:var(--ink)}
.zm-m.on{color:var(--ink);font-weight:700;background:var(--heat-soft)}
.zm-m.rainy{font-style:italic;color:var(--faint)}
.zm-h{text-align:right;color:var(--muted)}
.zm-l{color:var(--ink2);white-space:nowrap}
.zm-c{display:block;height:17px;border-radius:4px;background-color:var(--sunk);--c:color-mix(in srgb,var(--heat) var(--heat-p,0%),transparent);background-image:linear-gradient(var(--c),var(--c));text-align:center;font-style:normal;color:var(--faint);line-height:17px}
.zm-c.on{box-shadow:0 0 0 1px var(--heat)}
.zm-v{position:relative;height:17px;text-align:right}
.zm-v span{position:absolute;right:0;top:2px;bottom:2px;background:var(--heat-soft);border-radius:3px}
.zm-v b{position:relative;font-weight:500;padding-right:3px;line-height:17px}
.win-sec .seg button{padding:3px 10px;font-size:12px}
.win-fold>summary{list-style:none;display:flex;align-items:center;gap:6px}
.win-fold>summary::-webkit-details-marker{display:none}
.win-fold>summary::before{content:"▸";color:var(--muted);font-size:12px}
.win-fold[open]>summary::before{content:"▾"}
.win-fold>summary h3{display:inline}
@media (max-width:1080px){
  .win-layout{grid-template-columns:minmax(0,1fr)}
  .win-side{position:static;max-height:none}
}
@media (max-width:720px){
  .win-year thead th:nth-child(2),.win-year td.win-starcell{display:none}
  .win-link,.win-meta{max-width:150px}
  .win-year td.win-heat{min-width:36px}
  .win-year tbody th{position:sticky;left:0;background:var(--card);z-index:1}
  .win-year thead th:first-child{left:0;z-index:2}
}

/* 右栏：延展度与指向 */
.win-kv{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:2px 10px;padding:6px 0;border-top:1px solid var(--rule);font-size:13px;align-items:baseline}
.win-kv:first-of-type{border-top:0}
.win-kv>span:first-child{color:var(--muted);font-size:12px}
.win-kv>b{font-weight:500;color:var(--ink)}
.win-kv>span.muted{grid-column:2;font-size:11.5px}

/* 坐标输入 */
.win-coord{display:flex;gap:6px;align-items:flex-end;margin:0}
.win-coord input{width:12em}

/* 源详情页（目录源 / 任务）：头和右栏同一写法，源卡内容在宽屏排成两列 */
.head.src-page{display:block}
.src-head{align-items:flex-start}
.src-head h1{margin:2px 0 4px;overflow-wrap:anywhere}
.head.src-page .win-side-actions{margin-top:10px}
.src-sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:0 32px;align-items:start}
.src-sheet>.win-sec{margin-top:0;border-top:0;padding-top:4px}
.src-sheet>.win-sec+.win-sec{margin-top:0}
.src-sheet>.win-fold{grid-column:1/-1;border-top:1px solid var(--rule);margin-top:14px;padding-top:12px}
.src-sheet>.note[role=status]{grid-column:1/-1}

/* 公开版：手排这一晚（演示） */
.mp-add{margin-inline-start:6px;padding:1px 8px;font-size:11px;vertical-align:1px}
.mp-card .tag{font-size:11px;font-weight:500;vertical-align:2px}
.mp-chart{margin:4px 0 2px;overflow-x:auto}
@media (max-width:600px){.mp-chart svg{min-width:640px}}
.mp-chart svg{display:block;width:100%;height:auto;user-select:none}
.mp-ax{font-size:10px;fill:var(--muted)}
.mp-name{font-size:10.5px;font-weight:600;paint-order:stroke;stroke:var(--sunk);stroke-width:3px}
.mp-block{cursor:grab;touch-action:none}
.mp-block:active{cursor:grabbing}
.mp-block .mp-label{font-size:11px;font-weight:600;fill:#fff;pointer-events:none}
.mp-block .mp-edge{cursor:ew-resize}
.mp-block.is-bad rect:first-of-type{stroke:var(--danger);stroke-width:2.5}
.mp-block.is-sel rect:first-of-type{stroke:var(--ink);stroke-width:2}
.mp-block.is-bad.is-sel rect:first-of-type{stroke:var(--danger);stroke-width:3}
.mp-edit{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:6px 0 4px;font-size:13px}
.mp-edit input{font:inherit;padding:3px 6px;border:1px solid var(--border2);border-radius:6px;background:var(--card);color:var(--ink)}
.mp-edit input[type=number]{width:72px}
.mp-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;vertical-align:0}
.mp-table td,.mp-table th{white-space:nowrap}
.mp-table .ok{color:var(--accent)}
.mp-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.mp-upload input{display:none}

/* 这一晚能看哪些亮星（56-stars.js） */
.card-h.sii-head{justify-content:flex-start;gap:6px 10px;margin-bottom:0}
.sii-head .win-grow{flex:1}
[data-part="windowStars"] .sii-head + .note{margin-top:8px}
.sii-table th[scope=row]{font-weight:500;white-space:nowrap}
.sii-axis{display:block;position:relative;height:14px;margin-top:4px;font-weight:400;font-size:11px;color:var(--muted)}
.sii-axis span{position:absolute;transform:translateX(-50%)}
.sii-axis span:first-child{transform:none}
.sii-table tr.sii-off th,.sii-table tr.sii-off td{color:var(--faint)}
.mp-msg{margin:0 0 10px;padding:8px 12px;border-radius:8px;background:var(--sunk);font-size:13px}
.mp-msg.is-bad{color:var(--danger)}
.win-track em.sii-moon{position:absolute;inset-block:0;background:var(--moon);opacity:.28}

</style>
</head>

"use strict";
/* LACT 排班工作台 · 核心：工具函数、状态、路由、事件委托。
   不依赖任何库；用普通 <script> 方式加载，本地 file:// 可直接打开。 */

const U = {
  esc(s){ return s == null ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); },
  fin(v){ return typeof v === "number" && isFinite(v); },
  n(v, d = 0){ return U.fin(v) ? v.toLocaleString("zh-CN", {minimumFractionDigits:d, maximumFractionDigits:d}) : "—"; },
  h(min, d = 1){ return U.fin(min) ? U.n(min / 60, d) : "—"; },
  pct(v, d = 0){ return U.fin(v) ? U.n(v * 100, d) + "%" : "—"; },
  sum(a, f = x => x){ let s = 0, any = false; for (const x of a || []) { const v = f(x); if (U.fin(v)) { s += v; any = true; } } return any ? s : null; },
  ms(iso){ if (iso == null) return null; const t = Date.parse(iso); return isFinite(t) ? t : null; },
  // 北京时间（UTC+8）显示
  bj(ms){ return ms == null ? null : new Date(ms + 8 * 3600e3); },
  hm(x){ const ms = typeof x === "number" ? x : U.ms(x); if (ms == null) return "—"; const d = U.bj(ms); return String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0"); },
  ymd(x){ const ms = typeof x === "number" ? x : U.ms(x); if (ms == null) return "—"; const d = U.bj(ms); return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0"); },
  md(dateStr){ if (!dateStr) return "—"; const p = dateStr.split("-"); return (+p[1]) + "/" + (+p[2]); },
  dayMs(dateStr){ const p = dateStr.split("-").map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); },
  isDay(value){ return /^\d{4}-\d{2}-\d{2}$/.test(value || "") && U.addDays(value, 0) === value; },
  addDays(dateStr, k){ const d = new Date(U.dayMs(dateStr) + k * 864e5); return d.toISOString().slice(0, 10); },
  span(a, b){ return U.hm(a) + "—" + U.hm(b); },
  mins(a, b){ const x = U.ms(a), y = U.ms(b); return x != null && y != null ? (y - x) / 6e4 : null; },
  clamp(v, a, b){ return Math.max(a, Math.min(b, v)); },
  attr(o){ return U.esc(JSON.stringify(o)); },
  uniq(a){ return [...new Set(a)]; },
  by(f){ return (a, b) => { const x = f(a), y = f(b); return x < y ? -1 : x > y ? 1 : 0; }; },
  store: {
    get(k, d){ try { const v = localStorage.getItem("lact-wb:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v){ try { localStorage.setItem("lact-wb:" + k, JSON.stringify(v)); } catch (e) {} }
  }
};

/* 源的颜色：只用于区分源。后端给 display_color 时优先用后端的。 */
const PALETTE = ["#4F7CAC", "#B8893A", "#4E8A6E", "#8A6AA8", "#B5655B", "#7A8A3C", "#3F8C96", "#9B7E6B", "#A35C7E", "#C2703D", "#5F7F8E", "#6E7F3A"];
const GROUPS = ["F32", "A8", "B8", "C8", "D8"];
const SUB = ["A8", "B8", "C8", "D8"];

/* 缺数据提示：所有“后端还没给”的地方统一用这个 */
function missing(what, how){
  return `<div class="missing" role="note"><span aria-hidden="true">◌</span><div><b>未提供：</b>${U.esc(what)}${how ? `<div class="mono">${U.esc(how)}</div>` : ""}</div></div>`;
}
function approxTag(text){ return `<span class="tag approx" title="后端没有给出这项，页面用低精度天文公式近似计算，仅用于显示">${U.esc(text || "≈ 页面估算")}</span>`; }
function simTag(){ return `<span class="tag sim" title="来自整季模拟，不是真实观测">模拟</span>`; }

const App = {
  screens: {},   // id -> {title, render(), parts?:{name:()=>html}, mount?()}
  acts: {},      // data-act 处理
  state: {
    route: "windows", arg: null,
    drawer: null,             // "data" | "operator" | null
    theme: U.store.get("theme", "auto"),
    operator: U.store.get("operator", null),
    // 操作人：[{id, name}]；连上工作台时用工作台的名单（operators.json）
    operators: U.store.get("operators", [{id: "duty-a", name: "值班员甲"}, {id: "duty-b", name: "值班员乙"}]).map(o => typeof o === "string" ? {id: o, name: o} : o),
  },
  opName(id){ const o = App.state.operators.find(x => x.id === (id === undefined ? App.state.operator : id)); return o ? o.name : (id === undefined ? App.state.operator : id); },
  needOperator(){ if (App.state.operator && App.state.operators.some(o => o.id === App.state.operator)) return false; App.flash = "先选操作人（右上角），保存和确认都会记下操作人。"; App.state.drawer = "operator"; App.render(); return true; },
  toast(msg){ App.flash = msg; const y = window.scrollY; App.render(); window.scrollTo(0, y); },
  set(patch, parts){ Object.assign(App.state, patch); App.render(parts); },
  go(hash){ if (location.hash !== "#" + hash) location.hash = hash; else App.route(); },
  nightly(){
    const {route, arg} = App.state;
    return ["tonight", "report", "alert", "audit"].includes(route) && arg !== "gcn";
  },
  annualView(){ return ["year", "annual_source"].includes(App.state.route); },
  setNight(date){
    App.state.observingNight = date;
    if (App.nightly() && U.isDay(App.state.arg) && App.state.arg !== date) {
      App.state.arg = date;
      history.replaceState(null, "", "#" + App.state.route + "/" + date);
    }
  },
  independent(){
    const {route, arg} = App.state;
    return route === "windows" || route === "catalog_source" || (route === "alert" && arg === "gcn");
  },
  route(){
    // 首页：有排班结果时先看当夜；没有结果时从“源与窗口”开始
    const hasPlan = (typeof Data !== "undefined" && Data.list.length > 0) || (window.LACT_LATEST && (window.LACT_LATEST.cases || []).length > 0);
    const home = !globalThis.LACT_PUBLIC && hasPlan && App.screens.tonight ? "tonight" : App.screens.windows ? "windows" : "year";
    let h = (location.hash || "#" + home).slice(1);
    // 公开版替换了旧观测规划台：旧链接 #overview、#night 落到“源与窗口”的全年窗口、某一晚
    let legacyNight = false;
    if (globalThis.LACT_PUBLIC && /^(overview|night)$/.test(h)) { legacyNight = h === "night"; h = "windows"; history.replaceState(null, "", "#windows"); }
    const [r, ...rest] = h.split("/");
    App.flash = null; App.state.topMore = false;
    App.state.route = App.screens[r] ? r : home;
    App.state.arg = rest.length ? decodeURIComponent(rest.join("/")) : null;
    if (App.nightly() && U.isDay(App.state.arg)) App.state.observingNight = App.state.arg;

  },
  render(parts){
    const scr = App.screens[App.state.route];
    if (parts && scr.parts) {
      for (const p of [].concat(parts)) {
        const el = document.querySelector(`[data-part="${p}"]`);
        if (el && scr.parts[p]) el.innerHTML = scr.parts[p]();
      }
      return;
    }
    document.getElementById("top").innerHTML = Shell.top();
    let html;

    const independent = App.independent();
    if (App.state.route === "report" && !Data.ready) {
      html = '<div class="card empty">正在读取回报…</div>';
    }
    else if (!independent && cw && cw.caseFile && !cw.loaded) {
      if (!cw.loading && !cw.error) Data.loadCase(cw);
      html = `<div class="card empty">${cw.error ? `<span class="danger">${U.esc(cw.error)}</span>` : "正在读取 " + U.esc(cw.label) + " …"}</div>`;
    }
    else if (!independent && cw && cw.lazy && !cw.loaded && !cw.error) {
      if (!cw.loading) Data.loadServerJob(cw);
      html = '<div class="card empty">正在读取本机结果 …</div>';
    }
    else try { html = scr.render(App.state.arg); }
    catch (e) { console.error(e); html = `<div class="card"><h2>这一屏出错了</h2><p class="note">${U.esc(e && e.stack || e)}</p></div>`; }

    document.getElementById("view").innerHTML = (globalThis.LACT_PUBLIC && !independent ? Shell.publicBanner() : "") + html;
    document.getElementById("overlay").innerHTML = Shell.drawer();
    document.title = (scr.title || "") + (globalThis.LACT_PUBLIC ? " · LACT 观测规划台" : " · LACT 排班工作台");

  },
  applyTheme(){
    const t = App.state.theme;
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
  },
  init(){
    // 公开版（build.py --public）：只有“源与窗口”和源信息，没有排班结果
    if (globalThis.LACT_PUBLIC) document.documentElement.classList.add("is-public");
    App.applyTheme();
    document.addEventListener("click", ev => {
      const el = ev.target.closest("[data-act]");
      if (!el) return;
      // 触屏上点带提示的格子只看提示，不触发整行的操作（点源名等其他地方照常）
      if (!el.matches("[data-tap]") && ev.target.closest("[data-tap]") && el.contains(ev.target.closest("[data-tap]")) && matchMedia("(hover: none)").matches) return;
      const fn = App.acts[el.dataset.act];
      if (!fn) return;
      ev.preventDefault();
      fn(el.dataset.arg, el, ev);
    });
    document.addEventListener("input", ev => {
      const el = ev.target.closest("[data-input]");
      if (el && App.acts[el.dataset.input]) App.acts[el.dataset.input](el.value, el, ev);
    });
    document.addEventListener("change", ev => {
      const el = ev.target.closest("[data-change]");
      if (el && App.acts[el.dataset.change]) App.acts[el.dataset.change](el.value, el, ev);
    });
    document.addEventListener("keydown", ev => { if (ev.key === "Escape" && App.state.drawer) App.set({drawer: null}); });
    // 只在悬停里的信息：带 data-tap 的元素点一下也显示同样的内容（触屏没有悬停）
    document.addEventListener("click", ev => {
      const el = ev.target.closest("[data-tap]"), text = el && (el.dataset.tapText || el.getAttribute("title"));
      if (text) TapTip.show(text, ev.clientX, ev.clientY); else if (!ev.target.closest(".taptip")) TapTip.hide();
    });
    document.addEventListener("keydown", ev => { if (ev.key === "Escape") TapTip.hide(); });
    window.addEventListener("scroll", () => TapTip.hide(), {passive: true});
    window.addEventListener("resize", () => TapTip.hide());
    window.addEventListener("hashchange", () => TapTip.hide());
    window.addEventListener("hashchange", App.route);
    Data.boot().then(() => App.route());
    App.route();
  }
};

App.acts.go = arg => App.go(arg);

App.acts.addOperator = async () => {

};
App.acts.delOperator = async id => {
  const list = App.state.operators.filter(x => x.id !== id);
  if (Data.server.on) {
    try { App.state.operators = await Data.api("/api/operators", {operators: list, operator: App.state.operator}); }

  } else { App.state.operators = list; U.store.set("operators", list); }
  if (App.state.operator === id) { App.state.operator = null; U.store.set("operator", null); }

};

"use strict";
/* Offline window geometry. Rotation/ephemeris follow the old site; LACT masks
   and the left-end minute grid follow the scheduler's registered conventions. */
const WBPolicy = {
  items: Object.fromEntries((globalThis.LACT_REGISTRY?.groups || []).flatMap(g => g.items.map(i => [i.id, i]))),
  get(id){ const i = WBPolicy.items[id]; return i?.code ?? i?.value ?? null; },
  display(){ return WBPolicy.get("window_display"); },
  bounds(date){
    const p = WBPolicy.display(), d = U.dayMs(date) - p.utc_offset_hours * 3600e3;
    return [d + p.night_start_local_hour * 3600e3, d + 864e5 + p.night_end_local_hour * 3600e3];
  },
};

const WBGeo = (() => {
  const R = Math.PI / 180, MIN = 6e4, DAY = 864e5;
  const cache = new Map();
  const clamp = x => Math.max(-1, Math.min(1, x));

  const iso = t => new Date(t).toISOString();
  const vec = (ra,dec) => [Math.cos(dec*R)*Math.cos(ra*R), Math.cos(dec*R)*Math.sin(ra*R), Math.sin(dec*R)];
  const source = s => {
    const ra = s.ra_deg ?? s.ra, dec = s.dec_deg ?? s.dec;
    return U.fin(ra) && U.fin(dec) && ra >= 0 && ra < 360 && Math.abs(dec) <= 90 ? vec(ra,dec) : null;
  };
  const states = ["F32","S8"];
  const thresholdTables = Object.fromEntries(states.map(state => [state,Object.entries(WBPolicy.get(state==="F32"?"eth_f32":"eth_8") || {})
    .map(([z,value])=>[+z,value]).sort((a,b)=>a[0]-b[0])]));
  function threshold(z,table){
    if (!table?.length) return null;
    if (table.length===1 || z<=table[0][0]) return table[0][1];
    let k=1;
    while(k<table.length-1&&z>table[k][0])k++;
    const [a,x]=table[k-1], [b,y]=table[k];
    return x+(z-a)*(y-x)/(b-a);

    if (!Array.isArray(draft.energy_band_tev) && typeof WBCatalog!=="undefined"){
      try {draft=WBCatalog.draft(s);} catch(e){return null;}
    }
    const band=draft.energy_band_tev, rule=WBPolicy.get("qual_rule")?.edge;
    if (!Array.isArray(band) || band.length!==2 || !band.every(U.fin) || !["upper","lower"].includes(rule)) return null;
    return {edge:band[rule==="upper"?1:0],states:new Set(draft.allowed_states||states)};
  }

  }
  function closed(month){return (WBPolicy.get("rainy")||[]).includes(month)||WBPolicy.get("obs_fraction")?.[month]===0;}

    const s = WBPolicy.get("site"), dark = WBPolicy.get("dark_def"), p = WBPolicy.display();

      sep:preview?.moon ?? WBPolicy.get("moon_sep"), z:preview?.zenith ?? WBPolicy.get("max_zenith"),

      const y = Astronomy.Horizon(time, observer, x.ra, x.dec, ""); return {alt:y.altitude,az:y.azimuth}; };
    const sun = h("Sun"), moon = h("Moon"), mh = vec(-moon.az,moon.alt);

    if (cache.has(key)) return cache.get(key);

  function dark(f,c){ return f.sun.alt<c.sun && f.moon.alt<c.moonAlt; }

    const c = config(preview), N = frames(date,c), up = Math.cos(c.z*R), moonMax = Math.cos(c.sep*R);
    const usable = N.rows.map(f=>dark(f,c)), moonCutArr = N.rows.map(f=>moonCut(f,c));

      let best=null, bestTime=null, sep=null, begin=null, duration=0, wZ=null, wSep=null;
      const counts=Object.fromEntries(states.map(k=>[k,contract&&thresholdTables[k].length?0:null]));
      const blocking={sun:0,moon_alt:0,zenith:0,moon:0};
      for (let i=0;i<=N.rows.length;i++) {
        const f = N.rows[i], z = f && dot(f.zenith,v), m = f && dot(f.moonEqj,v);
        const yes = f && usable[i] && z >= up && (!moonCutArr[i] || m <= moonMax);
        const t = N.start+i*minMs;
        if (f&&!yes) blocking[f.sun.alt>=c.sun?"sun":f.moon.alt>=c.moonAlt?"moon_alt":z<up?"zenith":"moon"]+=c.step;
        if (track && f) zenith.push(Math.acos(clamp(z))/R);
        if (!yes && begin != null) {
          windows.push({start_utc:iso(begin),end_utc:iso(t),best_zenith_deg:wZ,min_moon_sep_deg:wSep});
          begin=null;
        } else if (yes) {
          const zz=Math.acos(clamp(z))/R, mm=Math.acos(clamp(m))/R;
          if(best==null||zz<best){best=zz;bestTime=t;}
          if(!disabled)for(const k of states)if(qualified(contract,k,zz))counts[k]+=c.step;

          duration+=c.step;
          if (begin==null) { begin=t; wZ=zz; wSep=mm; }
          else { wZ=Math.min(wZ,zz); wSep=Math.min(wSep,mm); }
        }
      }
      const reasons={moon_alt:"月高度超过登记值",zenith:"天顶角超过上限",moon:"离月不足"};
      const ranked=Object.keys(reasons).sort((a,b)=>blocking[b]-blocking[a]);
      const reason=duration>0?null:blocking.sun===N.rows.length*c.step?"无满足太阳高度条件的暗夜":reasons[ranked[0]];

        best_zenith_deg:best,best_utc:bestTime==null?null:iso(bestTime),
        blocking:reason,blocking_minutes:blocking,min_moon_sep_deg:sep,
        start_utc:windows[0]?.start_utc ?? null,end_utc:windows.at(-1)?.end_utc ?? null,windows, ...(track ? {zenith,start_ms:N.start,end_ms:N.end} : {})}];
    });
  }
  function zenithDistribution(date, source, preview, visits = null) {
    const row = fill(date,[source],preview,true)[0];
    if (!row) return null;
    const ranges = windows => windows.map(w=>[U.ms(w.start_utc),U.ms(w.end_utc)])
      .filter(([a,b])=>Number.isFinite(a)&&Number.isFinite(b)&&b>a)
      .sort((a,b)=>a[0]-b[0]).reduce((merged,range)=>{
        const prior=merged.at(-1);
        if(prior&&prior[1]>=range[0])prior[1]=Math.max(prior[1],range[1]);
        else merged.push(range);
        return merged;
      },[]);
    const available=ranges(row.windows), planned=visits&&ranges(visits);
    const overlap=(xs,a,b)=>xs.reduce((total,[start,end])=>total+Math.max(0,Math.min(b,end)-Math.max(a,start)),0)/MIN;
    const step=WBPolicy.display().window_step_min*MIN;
    const bins=[0,30,50].map((min,i)=>({min,max:[30,50,90][i],available:0,planned:planned?0:null}));
    for (const [i,z] of row.zenith.entries()) {
      if(z>90)continue;
      const bin=bins[z<=30?0:z<=50?1:2], a=row.start_ms+i*step, b=Math.min(row.end_ms,a+step);
      bin.available+=overlap(available,a,b);
      if(planned)bin.planned+=overlap(planned,a,b);
    }
    return bins;
  }
  async function year(y, sources, {mode="LACT",preview=null,progress=()=>{},signal=null,includeStates=false}={}){
    const c=config(preview), rows=sources.flatMap(s=>{
      const v=source(s), contract=includeStates&&mode==="LACT"?qualifier(s):null;
      return v?[{id:s.id,v,months:Array(12).fill(0),ra:s.ra_deg??s.ra,dec:s.dec_deg??s.dec,contract,
        F32:contract&&thresholdTables.F32.length?Array(12).fill(0):null,S8:contract&&thresholdTables.S8.length?Array(12).fill(0):null}]:[];
    });
    const first=Date.UTC(y,0,1), end=Date.UTC(y+1,0,1), total=(end-first)/DAY;
    const up=Math.cos(c.z*R), moonMax=Math.cos(c.sep*R);
    for(let d=0;d<total;d++){
      if(signal?.aborted) return null;
      const cal=new Date(first+d*DAY), month=cal.getUTCMonth(), date=cal.toISOString().slice(0,10);
      if(mode==="LHAASO"){
        const observer=new Astronomy.Observer(c.site.lat_deg,c.site.lon_deg,c.site.height_m);
        const local0=+cal-WBPolicy.display().utc_offset_hours*3600e3;
        const r=Astronomy.Rotation_EQJ_HOR(Astronomy.MakeTime(new Date(local0)),observer).rot;
        const z0=[r[0][2],r[1][2],r[2][2]], e0=[-r[0][1],-r[1][1],-r[2][1]], zlim=Math.cos(WBPolicy.display().lhaaso_zenith_max_deg*R);
        const duration=2*Math.PI*1.00273790935;
        const endRotation=Astronomy.Rotation_EQJ_HOR(Astronomy.MakeTime(new Date(local0+DAY)),observer).rot;
        const lat=c.site.lat_deg*R, decAngle=Math.atan2(r[2][2],Math.hypot(r[0][2],r[1][2]));
        const trueDuration=2*Math.PI+Math.atan2(z0[0]*endRotation[1][2]-z0[1]*endRotation[0][2],z0[0]*endRotation[0][2]+z0[1]*endRotation[1][2]);
        for(const row of rows){
          const dec=row.dec*R, a=Math.sin(dec)*Math.sin(lat), b=Math.cos(dec)*Math.cos(lat), q=(zlim-a)/b;
          if(q<=-1){row.months[month]+=24;continue;} if(q>=1)continue;
          const h=Math.atan2(dot(e0,row.v), dot(z0,row.v)-Math.sin(decAngle)*row.v[2]), half=Math.acos(q), angle=Number.isFinite(trueDuration)?trueDuration:duration;
          let range=0; for(let k=-1;k<=2;k++) range+=Math.max(0,Math.min(angle,h+2*k*Math.PI+half)-Math.max(0,h+2*k*Math.PI-half));
          row.months[month]+=24*range/angle;
        }
      } else {
        const open=!closed(month+1);
        for(const f of frames(date,c,false).rows) {
          if(!dark(f,c)) continue;
          const mc=moonCut(f,c);
          for(const row of rows) {
            const zen=dot(f.zenith,row.v);
            if(zen<up || (mc && dot(f.moonEqj,row.v)>moonMax))continue;
            row.months[month]+=c.step/60;
            if(open&&row.contract){const z=Math.acos(clamp(zen))/R;

      if(d%3===0 || d+1===total){progress(d+1,total); await new Promise(resolve=>setTimeout(resolve,0));}

    return includeStates?{geometry,f32:Object.fromEntries(rows.map(x=>[x.id,x.F32])),
      s8:Object.fromEntries(rows.map(x=>[x.id,x.S8]))}:geometry;
  }
  function solarEvents(date){
    const c=config(null), site=c.site, observer=new Astronomy.Observer(site.lat_deg,site.lon_deg,site.height_m);
    const start=U.dayMs(date)+(12-WBPolicy.display().utc_offset_hours)*3600e3;
    const cross=(altitude,direction)=>{
      const found=Astronomy.SearchAltitude("Sun",observer,direction,new Date(start),1,altitude);
      return found?.date ? iso(+found.date) : null;

  /* 一个源全年各月的天顶角分布：几何可见时间（太阳、月亮、天顶角上限，同 fill 的判据）按源中心天顶角分档。

  async function zenithMonths(y, s, preview, {months=null, step=6, binDeg=10, signal=null, onMonth=()=>{}}={}){
    const c=config(preview), v=source(s);
    if(!v) return null;
    const observer=new Astronomy.Observer(c.site.lat_deg,c.site.lon_deg,c.site.height_m);
    const up=Math.cos(c.z*R), moonMax=Math.cos(c.sep*R), nBins=Math.ceil(c.z/binDeg), hours=step/60;
    const out={bin_deg:binDeg, zenith_max_deg:c.z, step_min:step, months:{}};

      for(let d=1;d<=count;d++){

        const date=`${y}-${String(month).padStart(2,"0")}-${String(d).padStart(2,"0")}`, [start,end]=WBPolicy.bounds(date);
