"use strict";
/* Probability and physical-pointing products, shared by the alert page and sky map. */
const AlertLocalization = {
  point(row){
    const p = row?.pointing || row;
    const [ra,dec,mass] = Array.isArray(p) ? p : [p?.ra_deg ?? p?.ra, p?.dec_deg ?? p?.dec, row?.probability ?? row?.p ?? row?.weight];
    return U.fin(ra) && U.fin(dec) ? {ra, dec, mass} : null;
  },
  model(loc, event){
    if (!loc) return null;
    const contract = event.contract || {};
    const centre = AlertLocalization.point(contract) || AlertLocalization.point(loc);
    const evidence = loc.display_points || loc.points || loc.localization || contract.localization;
    const samples = Array.isArray(evidence) ? evidence.map(AlertLocalization.point).filter(Boolean) : [];
    const candidates = new Map((loc.candidates || loc.candidate_fields || []).map(row => [row.id, row]));
    const selected = loc.selected || loc.selected_fields || loc.tiles || loc.visits || [];
    let previous = loc.initial_covered_probability || 0;
    const fields = selected.map((visit, i) => {
      const field = candidates.get(visit.field_id);
      const point = AlertLocalization.point({...field, ...visit});
      const cumulative = visit.cumulative_probability ?? visit.cumulative;
      const gain = visit.gain_probability ?? (U.fin(cumulative) ? cumulative - previous : null);
      if (U.fin(cumulative)) previous = cumulative;
      const order = U.fin(visit.field_index) ? visit.field_index : U.fin(visit.sequence) ? visit.sequence : i + 1;
      return {...visit, ...point, order, group: visit.group || visit.channel,
        radius: visit.radius_deg ?? field?.radius_deg ?? loc.radius_deg,
        cumulative, gain};
    });
    // Old 90%-confidence Gaussian plans already saved the reference radius in the notice.
    const r90 = loc.r90_deg ?? (loc.basis === "gaussian_approximation" && contract.localization_cl === .9
      ? contract.error_radius_deg : null);
    return {loc, centre: centre || samples[0] || fields.find(f=>U.fin(f.ra)), samples, fields,
      edges: loc.credible90_edges || [], r90};
  },
  matches(a,b){
    return a && b && Math.abs(((a.ra-b.ra+540)%360)-180)<1e-6 && Math.abs(a.dec-b.dec)<1e-6;
  },
  intervals(rows, start=-Infinity, end=Infinity){
    return rows.map(pair => [U.ms(pair[0]), U.ms(pair[1])])
      .filter(([a,b])=>a!==null && b!==null && b>a && b>start && a<end)
      .map(([a,b])=>[Math.max(start,a),Math.min(end,b)]).sort((a,b)=>a[0]-b[0]);
  },
  minutes(rows){
    let end=-Infinity, total=0;
    for (const [a,b] of rows) {
      total += Math.max(0,b-Math.max(end,a));
      end = Math.max(end,b);
    }
    return total/60000;
  },
  reports(w,event){
    const identities = new Set([event.task_id,...(event.localization_update?.retired_task_ids || [])].filter(Boolean));
    const rows = new Map();
    const choose = rep => {
      if (!identities.has(rep.task_id) && ![...identities].some(id=>rep.target_id===id || rep.target_id?.startsWith(id+":"))) return;
      const key=rep.physical_run_id || rep.run_id || [rep.plan_id,rep.visit_id,rep.start_utc,rep.group].join("|");
      const old=rows.get(key);
      if (!old || (rep.revision || 0)>=(old.revision || 0)) rows.set(key,rep);
    };
    for (const rep of w?.reports?.reports || []) choose(rep);
    for (const rep of Object.values(w?.ledger?.reports || {})) choose(rep);
    return [...rows.values()];
  },
  actual(model,reports){
    const fields = (model.loc.coverage_fields || []).map(AlertLocalization.point);
    const atoms = model.loc.coverage_atoms;
    if (!fields.length || !Array.isArray(atoms)) return null;
    const arrivals = new Map();
    let tracked = false;
    for (const rep of reports){
      const p = AlertLocalization.point(rep);
      if (!p || !Array.isArray(rep.qualified_gti)) continue;
      const i = fields.findIndex(f=>AlertLocalization.matches(f,p));
      if (i < 0) continue;
      tracked = true;
      // Each spatial footprint counts once at the end of its first qualified GTI.
      const first = AlertLocalization.intervals(rep.qualified_gti)[0];
      if (first) arrivals.set(i,Math.min(first[1],arrivals.get(i) ?? Infinity));
    }
    if (!tracked) return null;
    const at = new Map();
    for (const [coveredBy,mass] of atoms){
      const end = Math.min(...coveredBy.map(i=>arrivals.get(i) ?? Infinity));
      if (Number.isFinite(end)) at.set(end,(at.get(end) || 0)+mass);
    }
    let total = 0;
    return [...at].sort((a,b)=>a[0]-b[0]).map(([ms,mass])=>[ms,total+=mass]);
  },
  paths(model,project,scale){
    const {centre,r90,edges,samples}=model;
    const colour = "var(--tier2)";
    let region = "";
    if (r90>0 && centre) {
      const [x,y]=project(centre);
      const r=r90*scale, inner=r*Math.sqrt(Math.log(.5)/Math.log(.1));
      region = '<defs><radialGradient id="alert-gaussian"><stop stop-color="var(--tier2)" stop-opacity=".37"/><stop offset="1" stop-color="var(--tier2)" stop-opacity=".04"/></radialGradient></defs>'
        + '<circle data-alert-r90 cx="'+x+'" cy="'+y+'" r="'+r+'" fill="url(#alert-gaussian)" stroke="'+colour+'"/>'
        + '<circle cx="'+x+'" cy="'+y+'" r="'+inner+'" fill="none" stroke="'+colour+'" stroke-dasharray="3 3"/>';
    } else if (samples.length || edges.length) {
      const peak=samples.reduce((top,p)=>Math.max(top,p.mass || 0),1e-15);
      const shade=samples.slice(0,4096).map(p=>{
        const [x,y]=project(p), opacity=.055 + .3*Math.sqrt(Math.max(0,p.mass || 0)/peak);
        return '<circle cx="'+x+'" cy="'+y+'" r="2.3" fill="'+colour+'" opacity="'+opacity+'"/>';
      }).join("");
      const edge=edges.map(points=>points.map(([ra,dec],i)=>(i?"L":"M")+project({ra,dec}).join(",")).join("")).join("");
      const outline=edge ? '<path d="'+edge+'" fill="none" stroke="'+colour+'" stroke-width="1.3"/>' : "";
      region = '<g data-alert-probability-points>'+shade+outline+'</g>';
    }
    return region;
  },
  projection(centre,points,minRadius){
    const cos=Math.cos(centre.dec*Math.PI/180);
    const delta=p=>[(((p.ra-centre.ra+540)%360)-180)*cos,p.dec-centre.dec];
    const span=points.reduce((size,p)=>Math.max(size,...delta(p).map(x=>Math.abs(x)+(p.radius || 0))),minRadius);
    const scale=128/span;
    return {scale, project:p=>{const [x,y]=delta(p);return [235-x*scale,145-y*scale];}};
  },
  axes(){
    return '<path d="M24 145H436 M235 18V272" stroke="var(--border2)"/><text x="25" y="137" class="axl">东</text><text x="278" y="20" class="axl">北</text>';
  },
  wide(loc,event,w){
    const model = AlertLocalization.model(loc,event);
    if (!model) return "";
    const {centre,samples,fields,edges,r90}=model;
    const positioned = fields.filter(f=>U.fin(f.ra)&&U.fin(f.dec));
    const groups = [...new Set(fields.map(f=>f.group).filter(Boolean))];
    const colours = ["var(--accent)","var(--tier2)","var(--tier3)","var(--warn)"];
    const laneColour = group => colours[groups.indexOf(group)%colours.length] || "var(--ink2)";
    let sky = "", notes = "";
    if (centre) {
      const edgePoints=edges.flatMap(line=>line.map(([ra,dec])=>({ra,dec})));
      const {scale,project}=AlertLocalization.projection(centre,[...samples,...positioned,...edgePoints],Math.max(1,r90 || 0));
      const marks=positioned.map(p=>{
        const [x,y]=project(p);
        return '<circle cx="'+x+'" cy="'+y+'" r="'+(p.radius>0?p.radius*scale:4)+'" fill="none" stroke="'+laneColour(p.group)+'" stroke-width="1.5"/>'+
          '<text x="'+x+'" y="'+(y+3.5)+'" text-anchor="middle" class="axl loc-num">'+p.order+'</text>';
      }).join("");
      sky = '<svg data-alert-probability-map viewBox="0 0 460 290" role="img" aria-label="局部定位概率及观测场" style="width:100%;max-width:600px">'
        + AlertLocalization.axes()+AlertLocalization.paths(model,project,scale)+marks
        + (AlertLocalization.point(event.contract) ? '<path d="M229 145h12M235 139v12" stroke="var(--ink)" stroke-width="1.5"><title>通报参考坐标</title></path>' : "")+'</svg>';
      if (r90>0) notes += '<p class="note">高斯误差圆 · 90% '+U.n(r90,2)+'° · 虚线为 50%</p>';
      else if (edges.length) notes += '<p class="note">浅色为定位概率 · 轮廓为 90% 可信区（天图像元显示分辨率）</p>';
      else if (samples.length) notes += '<p class="note">色深对应已保存的定位概率点</p>';
      // 场的圆和当夜页“指向”图用同一个半径：铺场覆盖半径（结果里的 radius_deg），另注相机视场
      const camR = w?.viz?.camera?.fov_radius_deg ?? WBPolicy.get("camera")?.fov_radius_deg;
      notes += '<p class="note" data-tile-radius>圆为铺场覆盖半径 '+(U.fin(loc.radius_deg) ? U.n(loc.radius_deg,1)+'°' : '未提供')+'，相机视场 '+(U.fin(camR) ? U.n(camR,1)+'°' : '未提供')+'；圆里的数字是场号（按观测先后）；十字为通报参考坐标</p>';
      if (groups.length > 1) notes += '<div class="legend">'+groups.map(g=>'<span><i class="key" style="background:'+laneColour(g)+'"></i>'+U.esc(g)+'</span>').join("")+'</div>';
    }
    const reports = AlertLocalization.reports(w,event);
    const actual = AlertLocalization.actual(model,reports);
    const raw = loc.coverage_series || loc.cumulative_coverage || loc.probability_trace
      || fields.map(f=>({at_utc:f.end_utc,probability:f.cumulative}));
    const anchor = U.ms(loc.start_utc || fields[0]?.start_utc || raw[0]?.at_utc);
    const first = Math.min(anchor ?? Infinity, actual?.[0]?.[0] ?? Infinity);
    const zero = U.fin(first) ? first : null;
    const curve = raw.map(r=>Array.isArray(r) ? r : [
      r.elapsed_min ?? (zero===null ? null : U.mins(new Date(zero).toISOString(),r.at_utc || r.end_utc || r.time_utc)),
      r.covered_probability ?? r.cumulative_probability ?? r.probability ?? r.cumulative]);
    if (curve.length && U.fin(curve[0][0]) && curve[0][0]>0) curve.unshift([0,loc.initial_covered_probability ?? 0]);
    const line = actual && zero!==null ? [[0,0],...actual.map(([t,mass])=>[(t-zero)/60000,mass])] : [];
    // Keep a zero-coverage observation trace visible across the plan's time range.
    if (line.length===1 && curve.length) line.push([curve.at(-1)[0],0]);
    const formatTime = t=>t ? U.md(U.ymd(t))+" "+U.hm(t) : "—";
    const listed = fields.length ? '<details data-alert-fields><summary>逐场表 · '+fields.length+' 场</summary><div class="scroll-x"><table class="t"><thead><tr>'
      +'<th>场号</th><th>通道</th><th>起止（北京时间）</th><th>场心（ICRS）</th><th>离参考坐标</th><th>本场增益</th><th>累计覆盖</th><th>状态</th><th>实际 ON（min）</th>'
      +'</tr></thead><tbody>'+fields.map(f=>{
        const a=U.ms(f.start_utc), b=U.ms(f.end_utc);
        const matches=reports.filter(row=>row.group===f.group && AlertLocalization.matches(AlertLocalization.point(row),f)
          && U.ms(row.start_utc)<b && U.ms(row.end_utc)>a);
        const known=matches.some(row=>Array.isArray(row.gti));
        const minutes=known ? AlertLocalization.minutes(AlertLocalization.intervals(matches.flatMap(row=>row.gti || []),a,b)) : null;
        const status=minutes>0 ? "已观测" : known ? "无 ON" : matches.length ? "回报未定" : "计划";
        const distance=centre && U.fin(f.ra) && U.fin(f.dec) ? U.n(Astro.sep(centre.ra,centre.dec,f.ra,f.dec),1)+"°" : "—";
        return '<tr data-alert-field="'+f.order+'"><td>'+f.order+'</td><td>'+U.esc(f.group || "—")+'</td>'
          +'<td>'+formatTime(f.start_utc)+' — '+formatTime(f.end_utc)+'</td><td>'+U.n(f.ra,3)+'° / '+U.n(f.dec,3)+'°</td>'
          +'<td>'+distance+'</td><td>'+U.pct(f.gain,1)+'</td><td>'+U.pct(f.cumulative,1)+'</td><td>'+status+'</td><td>'+U.n(minutes,2)+'</td></tr>';
      }).join("")+'</tbody></table></div></details>' : "";
    const basis=[loc.method==="greedy"?"贪心铺场":"",AL.MAP[loc.basis] || loc.basis].filter(Boolean).join(" · ");
    const final=loc.covered_probability ?? curve.at(-1)?.[1];
    return '<section class="card" data-alert-localization data-alert-planned-coverage="'+U.esc(final)+'"><div class="card-h"><h2>定位概率与覆盖</h2><span class="small muted">'+U.esc(basis)+'</span></div>'
      +'<div class="loc-grid"><div class="loc-map">'+(sky || missing("定位概率或已选场"))+'</div><div class="loc-curve"><h3>覆盖概率随时间累计</h3>'
      +(U.fin(final) ? '<div class="loc-final"><b class="num">'+U.pct(final,1)+'</b><span class="small muted">计划覆盖'+(line.length ? ' · 合格 GTI 覆盖 '+U.pct(line.at(-1)[1],1) : '')+' · '+fields.length+' 场</span></div>' : "")
      +AL.chart(curve,{name:"覆盖概率随时间累计",unit:"分钟",step:true,comparison:line})+'<div class="loc-notes">'+notes+'</div></div></div>'
      +listed+'</section>';
  },
  narrow(w,event){
    const plan=w?.tonight, centre=AlertLocalization.point(event.contract);
    if (!plan || !centre || !event.task_id) return "";
    const rows=(plan.visits || []).filter(v=>v.task_id===event.task_id).flatMap(v=>
      (v.runs?.length?v.runs:[v]).map(r=>({pointing:r.pointing || v.pointing,start:r.start_utc,group:v.group})));
    const directions=rows.map(r=>({...r,p:AlertLocalization.point(r),pa:r.pointing?.wobble?.pa_deg}))
      .filter(r=>r.p && U.fin(r.pa)).sort((a,b)=>U.ms(a.start)-U.ms(b.start));
    if (!directions.length) return "";
    const {project}=AlertLocalization.projection(centre,directions.map(r=>r.p),.1);
    const unique = new Map();
    for (const [i,run] of directions.entries()) {
      const key=[run.p.ra,run.p.dec].join(",");
      const group = unique.get(key) || {p:run.p,pa:run.pa,rows:[]};
      group.rows.push(i+1); unique.set(key,group);
    }
    const marks = [...unique.values()].map(row=>{
      const [x,y]=project(row.p);
      return '<circle cx="'+x+'" cy="'+y+'" r="4" fill="var(--accent)"><title>方向 '+U.n(row.pa,1)+'° · run '+row.rows.join("、")+'</title></circle>'
        +'<text x="'+x+'" y="'+(y-8)+'" text-anchor="middle" class="axl">'+U.n(row.pa,0)+'°'+(row.rows.length>1 ? " · "+row.rows.length+" 次":"")+'</text>';
    }).join("");
    return '<section class="card" data-alert-wobble><div class="card-h"><h2>定位与 wobble 指向</h2></div><svg viewBox="0 0 460 290" role="img" aria-label="目标位置和各 run 的 wobble 指向" style="width:100%;max-width:600px">'
      +AlertLocalization.axes()+'<circle cx="235" cy="145" r="4" fill="var(--ink)"/><text x="245" y="159" class="axl">目标</text>'+marks+'</svg>'
      +'<details><summary>逐 run 指向 · '+directions.length+' 段</summary><div class="scroll-x"><table class="t"><thead><tr><th>开始（北京时间）</th><th>通道</th><th>方向</th><th>指向（ICRS）</th></tr></thead><tbody>'
      +directions.map(r=>'<tr data-alert-wobble-run><td>'+U.hm(r.start)+'</td><td>'+U.esc(r.group)+'</td><td>'+U.n(r.pa,1)+'°</td><td>'+U.n(r.p.ra,3)+'° / '+U.n(r.p.dec,3)+'°</td></tr>').join("")
      +'</tbody></table></div></details></section>';
  }
};

/* ==== 48-source.js ==== */
"use strict";
/* 源详情：每月计划（自然月，来自全年账 task_months）、延展源布局卡（场图、场表、警告、设计口径、拼接配平）。 */
const SRC = {
  KERNEL: {pessimistic: "悲观响应", placeholder: "占位响应", nominal: "占位响应", optimistic: "乐观响应"},
  FAMILY: {regular_hexagon: "规则六边形", hexagon: "六边形", square: "方格", strip: "条带", given: "给定布局"},
  /* 规划期内的自然月：全年账（各年）里的 task_months 优先 */
  months(w, t){
    const docs = Object.values(w.annuals || (w.annual ? {x: w.annual} : {})).sort(U.by(d => d.year || 0));
    const p = Data.period(w), lo = p ? p.start.slice(0, 7) : "0000", hi = p ? p.end.slice(0, 7) : "9999";
    const rows = [];
    for (const d of docs) (((d.task_months || {})[t.id]) || []).forEach((r, j) => {
      if (!r) return;
      const ym = typeof r.label === "string" && /^\d{4}-\d{2}$/.test(r.label) ? r.label : (d.year + "-" + String(r.month || j + 1).padStart(2, "0"));
      if (ym < lo || ym > hi) return;
      rows.push({ym, el: r.eligible_wall_min || {}, pw: r.planned_wall_min || {}, pc: r.planned_credit_f32 || {}, g8: r.planned_s8_group_min || {}, obs: r.observed_wall_min, acc: r.accepted_credit_f32, accWhy: r.accepted_credit_f32_reason, status: r.status});
    });
    if (rows.length) return {src: "全年账 task_months（自然月）", rows};
    // 退一步：全期结果按月的分配（新结果按 month；旧结果按朔望月）
    const L = w.long, pL = L && (L.progress || []).find(q => q.task_id === t.id);
    if (!L || !L.months || !pL) return null;
    const cal = L.months[0] && L.months[0].period_unit === "calendar_month";
    return {src: cal ? "全期结果（自然月）" : "全期结果（旧结果，按朔望月）", rows: L.months.map(m => {
      const al = (pL.allocations || []).filter(a => a.period_unit ? (a.month || a.period_id) === (m.month || m.period_id) : a.lunation === m.plan_lunation_index);
      const sum = sc => U.sum(al.filter(a => a.scenario === sc), a => a.credit_f32);
      return {ym: cal ? (m.month || m.period_id) : null, lab: cal ? null : U.md(m.first_night), el: {}, pw: {}, pc: {exp: sum("exp"), pess: sum("pess")}, g8: {}};
    })};
  },
  /* 各场的今晚分钟、累计已接受，以及“实得 ÷ 份额” */
  fieldStats(w, t, lay){
    const T = w.tonight, inp = Data.anyPlan(w)?.inputs || {}, acc = inp.accepted_by_field || inp.accepted || {};
    const tonight = {};
    for (const v of (T && T.visits) || []) {
      if (String(v.task_id).split(":")[0] !== t.id) continue;
      const fields = TN.runFields(v), cr = v.expected?.credit_f32;
      if (fields.length===1 && U.fin(cr)) tonight[fields[0]] = (tonight[fields[0]] || 0) + cr;
    }
    const balance = T?.mosaic_balance?.[t.id] || lay.mosaic_balance;
    const mb = balance?.fields ? new Map(balance.fields.map(f => [f.id, f])) : null;
    const rows = (lay.fields || []).map(f => {
      const row=mb?.get(f.id);
      return {f, tonight:row ? row.planned_f32_min : tonight[f.id] ?? null,
        accepted:row ? row.accepted_f32_min : acc[t.id+":"+f.id] ?? acc[f.id] ?? null,
        ratio:row?.ratio ?? null, projected:row?.projected_ratio ?? null, perShare:row?.per_share_f32_min ?? null};
    });
    // 还没有已接受量时 ratio 为空：改用“今晚计划完成后”的预计比例上色，并在图注里说明

      const tip = `${f.id} · 份额 ${U.pct(f.share, 1)} · 今晚 ${U.n(r.tonight, 0)}${U.fin(r.shown) ? (st.useProjected ? " · 计划完成后实得÷应得 " : " · 实得÷应得 ") + U.n(r.shown, 2) : ""}${wv ? " · " + warn.get(f.id).join("；") : ""}`;
      return `<g><circle cx="${X(x)}" cy="${Y(y)}" r="${rr}" style="fill:${SRC.ratioColor(r.shown)};stroke:${wv ? "var(--danger)" : "var(--card)"};stroke-width:${wv ? 1.6 : 1.2}"><title>${U.esc(tip)}</title></circle>

"use strict";
/* 打到 5σ 要多少小时：页面里的简单估计（2026-11-26 起；同日下午改为按完整谱分能段算）。
   LACT 还没有绝对灵敏度（IRF 待提供），只用一个占位锚点：整阵在各天顶角“1% Crab（HEGRA 谱）观测 50 h 到 5σ”。
   做法：0.1—1000 TeV 每十倍能量分 6 档。每档的信号 = 有效面积 × 效率 × 源在这一档的流强；
   每档的背景 = 一个常数 ×有效面积 × E^-3（残余宇宙线）× (PSF/PSF₁TeV)²，常数按锚点在每个天顶角反解。
   每档用 Li & Ma 第 17 式（α = 1/OFF 区个数）按期望计数算显著性，各档显著性平方相加，所以 σ 随 √t 增长；
   另要求总超出事例 ≥ 10。展宽源每档背景乘 1 + (σ_src / PSF(E))²。一个 8 台组的显著性平方率按折算比 w。
   源的谱拼成完整谱（各段在自己的测量能段用自己的幂律，段间按对数连线，最高一段往上外推）：
     · 1LHAASO：WCDA 1—25 TeV、KM2A 25 TeV 以上；只有 KM2A 时低能用文献或 TeVCat（IACT）补，没有就不往下外推；
     · 文献 LHAASO 对应体（50-lhaaso-lit.js）：高能用 LHAASO，低能用文中别的仪器（H.E.S.S. 等）补；
     · 只有 TeVCat：Crab 单位流强（阈能 ≤ 10 TeV 按 HEGRA Crab，往下外推；阈能 > 10 TeV 按 1LHAASO 的 Crab，只算阈能以上）。
   低能没有测量、只算了测到的高能段的，时间是上限，写“≤”。Fermi 不估。这些常数都是占位，LACT 性能版本给出后替换。 */
const WBDetect = (() => {
  const P = {
    crab: {n0: 2.83e-11, e0: 1, g: 2.62},          // HEGRA Crab（cm⁻² s⁻¹ TeV⁻¹）：锚点；TeVCat 阈能 ≤ 10 TeV 的 Crab 单位
    crabUHE: {n0: 6.23e-16, e0: 50, g: 3.19},      // 1LHAASO 的 Crab（KM2A）：TeVCat 阈能 > 10 TeV 的 Crab 单位（100 TeV 处约 1e-12 erg cm⁻² s⁻¹）
    anchorCrab: 0.01, anchorHours: 50, anchorSigma: 5,
    // 整阵有效面积（km²）：各天顶角几个能量点（TeV），对数能量插值；能阈处 0.3 km²，能阈以下为 0，最高点以上取平。按登记表 aeff 的文字给
    aeff: {20: [[1, 1], [5, 2], [30, 2.5]], 40: [[1, 1], [5, 2], [30, 3]], 60: [[3, 1.5], [10, 3], [30, 5]]},
    aeffAtEth: 0.3,
    efficiency: 0.5,                                 // 选择与 ON 区包含
    psf: {at1TeV: 0.1, slope: 0.35, floor: 0.045},   // PSF(E) = max(0.045°, 0.1° × E^-0.35)，10 TeV 以上约 0.045°（登记表 psf）
    bgIndex: 3.0,                                    // 残余背景谱指数（宇宙线 2.7，加上鉴别随能量变好）
    bins: {lo: 0.1, perDecade: 6, decades: 4},       // 0.1—1000 TeV
    minExcess: 10, sigma: 5, defaultIndex: 2.5,
    tevcatMaxTeV: 10,                                // TeVCat 阈能高于这个按超高能处理
    tevcatLowHiTeV: 20,                              // TeVCat（IACT）流强给 LHAASO 补低能段时用到的最高能量
  };
  const R = Math.PI / 180, cache = new Map();
  const interp = (table, z) => {
    if (!table?.length) return null;
    if (table.length === 1 || z <= table[0][0]) return table[0][1];
    let k = 1;
    while (k < table.length - 1 && z > table[k][0]) k++;
    const [a, x] = table[k - 1], [b, y] = table[k];
    return x + (z - a) * (y - x) / (b - a);
  };
  const tableOf = id => Object.entries(WBPolicy.get(id) || {}).map(([z, v]) => [+z, +v]).filter(([z, v]) => U.fin(z) && U.fin(v)).sort((a, b) => a[0] - b[0]);
  const eth = z => interp(tableOf("eth_f32"), z);
  const wOf = z => { const w = interp(tableOf("w_table"), z); return U.fin(w) ? U.clamp(w, 0, 1) : null; };
  const alpha = () => { const n = WBPolicy.get("wobble")?.min_off; return U.fin(n) && n > 0 ? 1 / n : 1 / 3; };
  const zmax = () => (typeof WBWindows !== "undefined" && WBWindows.previewZenith?.()) || WBPolicy.get("max_zenith") || 70;

  // 能量分档
  const EDGES = Array.from({length: P.bins.perDecade * P.bins.decades + 1}, (_, j) => P.bins.lo * 10 ** (j / P.bins.perDecade));
  const MIDS = EDGES.slice(0, -1).map((e, j) => Math.sqrt(e * EDGES[j + 1]));
  const psf = E => Math.max(P.psf.floor, P.psf.at1TeV * E ** -P.psf.slope);
  const pl = (c, E) => c.n0 * (E / c.e0) ** -c.g;
  const plAbove = (c, E) => c.g > 1 ? c.n0 * c.e0 / (c.g - 1) * (E / c.e0) ** (1 - c.g) : Infinity;
  // 一档里的积分：对数能量上 Simpson（5 点）
  function integrate(f, a, b) {
    const la = Math.log(a), lb = Math.log(b), h = (lb - la) / 4;
    let s = 0;
    for (let i = 0; i <= 4; i++) { const E = Math.exp(la + i * h); s += (i === 0 || i === 4 ? 1 : i % 2 ? 4 : 2) * E * f(E); }
    return s * h / 3;
  }
  const crabBins = EDGES.slice(0, -1).map((a, j) => integrate(E => pl(P.crab, E), a, EDGES[j + 1]));
  const bgShape = EDGES.slice(0, -1).map((a, j) => integrate(E => E ** -P.bgIndex, a, EDGES[j + 1]) * (psf(MIDS[j]) / psf(1)) ** 2);

  // 有效面积（km²）：天顶角表之间线性插值，能阈以下为 0
  function aeffTable(zt, E) {
    const pts = [[eth(zt), P.aeffAtEth], ...P.aeff[zt].filter(([e]) => e > eth(zt))];
    if (E < pts[0][0]) return 0;
    if (E >= pts.at(-1)[0]) return pts.at(-1)[1];
    let k = 1; while (E > pts[k][0]) k++;
    const [e1, a1] = pts[k - 1], [e2, a2] = pts[k];
    return a1 + (a2 - a1) * Math.log(E / e1) / Math.log(e2 / e1);
  }
  function aeff(z, E) {
    if (E < eth(z)) return 0;
    if (z <= 20) return aeffTable(20, E);
    if (z >= 60) return aeffTable(60, E);
    const lo = z < 40 ? 20 : 40, hi = lo + 20, f = (z - lo) / 20;
    return (1 - f) * aeffTable(lo, E) + f * aeffTable(hi, E);
  }

  function liMa(non, noff, a) {
    if (!(non > 0) || !(noff > 0) || non <= a * noff) return 0;
    const s = non + noff, v = 2 * (non * Math.log((1 + a) / a * non / s) + noff * Math.log((1 + a) * noff / s));
    return v > 0 ? Math.sqrt(v) : 0;
  }
  /* 某天顶角的探测器：每档的有效面积 × 效率（cm² × 小时）和背景率（每小时，点源 ON 区）。
     背景常数 B 按锚点反解：1% Crab 观测 50 h，各档显著性平方之和 = 25。按 0.25° 记住结果。 */
  const zMemo = new Map();
  function at(z) {
    const key = Math.round(z * 4) / 4;
    if (zMemo.has(key)) return zMemo.get(key);
    const a = alpha(), T = P.anchorHours;
    const exposure = MIDS.map(E => aeff(key, E) * 1e10 * P.efficiency * 3600);
    const shape = bgShape.map((g, j) => g * aeff(key, MIDS[j]));
    const ts = B => exposure.reduce((sum, x, j) => {
      if (!(x > 0)) return sum;
      const s = P.anchorCrab * crabBins[j] * x * T, b = B * shape[j] * T, S = liMa(s + b, b / a, a);
      return sum + S * S;
    }, 0);
    let lo = 1e-30, hi = 1e30;                       // 背景越大显著性越低：对数二分
    for (let i = 0; i < 120; i++) { const mid = Math.sqrt(lo * hi); if (ts(mid) > P.anchorSigma ** 2) lo = mid; else hi = mid; }
    const B = Math.sqrt(lo * hi), out = {exposure, bg: shape.map(g => B * g)};
    if (zMemo.size > 2000) zMemo.clear();
    zMemo.set(key, out);
    return out;
  }
  // 整阵在天顶角 z 每小时的显著性平方 r 和信号事例率 Rs；不合格（能阈高于能段上限或超过天顶角上限）为 0
  function rate(est, z) {
    const E = eth(z);
    if (!U.fin(E) || z > est.zmax + 1e-9 || (U.fin(est.edge) && E > est.edge)) return {r: 0, Rs: 0};
    const d = at(z), a = alpha();
    let r = 0, Rs = 0;
    for (let j = 0; j < MIDS.length; j++) {
      const x = d.exposure[j]; if (!(x > 0)) continue;
      const s = est.flux[j] * x; if (!(s > 0)) continue;
      const b = d.bg[j] * est.k[j], S = liMa(s + b, b / a, a);
      r += S * S; Rs += s;
    }
    return {r, Rs};
  }
  const hoursFor = (r, Rs) => r > 0 && Rs > 0 ? Math.max(P.sigma ** 2 / r, P.minExcess / Rs) : null;

  /* 完整谱：comps 是按能量排好的几段 {lo, hi, n0, e0, g, sigma, label}；
     lowCut：最低一段以下没有测量，不往下外推；hiCut：最高一段以上不外推 */
  function dnde(spec, E) {
    const cs = spec.comps;
    const inside = cs.find(c => E >= c.lo && E <= c.hi);
    if (inside) return pl(inside, E);
    if (E < cs[0].lo) return spec.lowCut ? 0 : pl(cs[0], E);
    if (E > cs.at(-1).hi) return spec.hiCut ? 0 : pl(cs.at(-1), E);
    for (let i = 0; i + 1 < cs.length; i++) {
      const a = cs[i], b = cs[i + 1];
      if (E > a.hi && E < b.lo) {
        const fa = pl(a, a.hi), fb = pl(b, b.lo), x = Math.log(E / a.hi) / Math.log(b.lo / a.hi);
        return Math.exp(Math.log(fa) + x * (Math.log(fb) - Math.log(fa)));
      }
    }
    return 0;
  }
  function sigmaAt(spec, E) {
    const cs = spec.comps;
    const c = cs.find(c => E >= c.lo && E <= c.hi) || (E < cs[0].lo ? cs[0] : E > cs.at(-1).hi ? cs.at(-1) : null);
    if (c) return c.sigma || 0;
    return Math.max(...cs.map(c => c.sigma || 0));
  }

  const sigmaOf = ext => ext && !ext.upperLimit && U.fin(ext.radiusDeg) ? ext.radiusDeg : 0;
  const tevSigma = m => { const e = m.extension, dims = e?.kind === "catalog-angular-size" ? [e.xDeg, e.yDeg].filter(v => U.fin(v) && v > 0) : [];
    return dims.length === 2 ? Math.sqrt(dims[0] * dims[1]) : dims[0] || 0; };
  const lhOk = c => c?.detected && c.flux && !c.flux.upperLimit && U.fin(c.flux.value) && c.flux.value > 0 && U.fin(c.spectralIndex);
  // TeVCat 的 Crab 单位流强换成一段幂律；阈能 > 10 TeV 的按 1LHAASO 的 Crab、只算阈能以上
  function tevcatComp(m, {hi = Infinity} = {}) {
    const f = m.flux;
    if (!f || f.unit !== "Crab" || f.upperLimit || !U.fin(f.value) || f.value <= 0) return null;
    const Et = U.fin(f.energyThresholdGeV) ? f.energyThresholdGeV / 1000 : 1, uhe = Et > P.tevcatMaxTeV;
    const ref = uhe ? P.crabUHE : P.crab, g = U.fin(m.spectralIndex) ? m.spectralIndex : uhe ? P.crabUHE.g : P.defaultIndex;
    const n0 = f.value * plAbove(ref, Et) * (g - 1) / Et;
    return {lo: Et, hi: Math.max(Et, hi), n0, e0: Et, g, sigma: tevSigma(m), uhe, member: m,
      label: `TeVCat：${U.n(Et >= 1 ? Et : Et * 1000, 0)} ${Et >= 1 ? "TeV" : "GeV"} 以上 ${U.n(f.value, f.value < 0.1 ? 3 : 2)} Crab（${uhe ? "1LHAASO 的 Crab" : "HEGRA Crab"}），Γ = ${U.n(g, 2)}${U.fin(m.spectralIndex) ? "" : "（目录缺，取" + (uhe ? " Crab 的" : "") + " " + U.n(g, 2) + "）"}`};
  }
  const lowFill = members => {
    for (const m of members.filter(x => x.catalog === "TeVCat")) {
      const c = tevcatComp(m, {hi: P.tevcatLowHiTeV});
      if (c && !c.uhe) return {...c, hi: Math.max(c.lo, P.tevcatLowHiTeV)};
    }
    return null;
  };

  // 同一处的目录行里拼谱：1LHAASO → 文献 LHAASO 对应体 → TeVCat
  function spectrum(members) {
    for (const m of members.filter(x => x.catalog === "1LHAASO")) {
      const comps = m.components || [], wc = comps.find(c => c.detector === "WCDA"), km = comps.find(c => c.detector === "KM2A");
      if (!lhOk(wc) && !lhOk(km)) continue;
      const parts = [];
      if (lhOk(wc)) parts.push({lo: 1, hi: 25, n0: wc.flux.value, e0: wc.flux.referenceEnergyTeV || 3, g: wc.spectralIndex, sigma: sigmaOf(wc.extension),
        label: `1LHAASO WCDA：${U.n(wc.flux.referenceEnergyTeV || 3, 0)} TeV 处 ${sci(wc.flux.value)} cm⁻² s⁻¹ TeV⁻¹，Γ = ${U.n(wc.spectralIndex, 2)}`});
      if (lhOk(km)) parts.push({lo: 25, hi: 1000, n0: km.flux.value, e0: km.flux.referenceEnergyTeV || 50, g: km.spectralIndex, sigma: sigmaOf(km.extension),
        label: `1LHAASO KM2A：${U.n(km.flux.referenceEnergyTeV || 50, 0)} TeV 处 ${sci(km.flux.value)} cm⁻² s⁻¹ TeV⁻¹，Γ = ${U.n(km.spectralIndex, 2)}`});
      let lowCut = false, fill = null;
      if (!lhOk(wc)) { fill = lowFill(members); if (fill) parts.unshift(fill); else lowCut = true; }
      // KM2A 没测到（只有上限）：WCDA 的谱不往 25 TeV 以上外推
      return {member: m, comps: parts, lowCut, hiCut: !lhOk(km),
        note: !lhOk(wc) && !fill ? `WCDA 没测到${U.fin(wc?.flux?.value) ? `（3 TeV 上限 ${sci(wc.flux.value)}）` : ""}，25 TeV 以下没有测量，只算 KM2A 测到的部分` : ""};
    }
    const hit = literature(members);
    if (hit) {
      const L = hit.entry, e0 = L.flux.energyTeV, n0 = L.flux.e2dnde_erg * 0.6241509 / e0 ** 2;   // 1 erg = 0.624 TeV
      const main = {lo: L.band[0], hi: L.band[1], n0, e0, g: L.index, sigma: L.r39Upper ? 0 : L.r39 || 0,
        label: `${L.name}（文献）：${L.band[0]}—${L.band[1]} TeV，Γ = ${U.n(L.index, 2)}，${L.flux.text}，r39 ${L.r39Upper ? "< " : ""}${U.n(L.r39, 2)}°`, ref: L.ref};
      const parts = [main];
      let fill = null;
      if (L.detector !== "WCDA" && L.band[0] > 3) {
        for (const x of L.low || []) parts.unshift({lo: x.band[0], hi: x.band[1], n0: x.n0, e0: x.e0, g: x.index, sigma: x.sigma || 0, ref: x.ref,
          label: `${x.instrument}（文献）：${x.band[0]}—${x.band[1]} TeV，${U.n(x.e0, 0)} TeV 处 ${sci(x.n0)} cm⁻² s⁻¹ TeV⁻¹，Γ = ${U.n(x.index, 2)}`});
        if (!(L.low || []).length && (fill = lowFill(members))) parts.unshift(fill);
      }
      const lowCut = L.detector !== "WCDA" && L.band[0] > 3 && parts.length === 1;
      return {member: hit.member, lit: L, comps: parts.sort((a, b) => a.lo - b.lo), lowCut,
        note: lowCut ? `${L.band[0]} TeV 以下没有测量（WCDA 和 IACT 都没测到），只算 LHAASO 测到的部分` : ""};
    }
    let uhe = null;
    for (const m of members.filter(x => x.catalog === "TeVCat")) {
      const c = tevcatComp(m);
      if (!c) continue;
      if (c.uhe) { uhe ??= c; continue; }
      return {member: m, comps: [c], extrap: c.lo > 2};
    }
    if (uhe) return {member: uhe.member, comps: [uhe], lowCut: true, note: `TeVCat 的流强是 ${U.n(uhe.lo, 0)} TeV 以上量的，以下没有测量，只算这一段`};
    const cats = new Set(members.map(m => m.catalog));
    const reason = cats.has("TeVCat") ? "TeVCat 没给流强" : cats.has("1LHAASO") ? "1LHAASO 流强不可用" :
      [...cats].some(c => /4FGL|Fermi/i.test(c)) ? "Fermi 源不估" : "没有目录流强";
    return {reason};
  }
  function literature(members) {
    const list = typeof LHAASO_LIT !== "undefined" ? LHAASO_LIT : [];
    for (const m of members) {
      const names = new Set([m.name, ...(m.aliases || [])].filter(k => typeof k === "string").map(norm));
      for (const entry of list)
        if ([entry.name, ...(entry.counterparts || [])].some(k => names.has(norm(k))) && sep(m, {ra: entry.ra, dec: entry.dec}) <= 1) return {entry, member: m};
    }
    return null;
  }
  function sci(v) {
    if (!U.fin(v) || v <= 0) return "—";
    const e = Math.floor(Math.log10(v)), m = v / 10 ** e;
    return `${m.toFixed(2)}×10${String(e).replace("-", "⁻").replace(/\d/g, d => "⁰¹²³⁴⁵⁶⁷⁸⁹"[d])}`;
  }
  const crab = f => f >= 0.1 ? U.n(f, 2) + " Crab" : U.n(f * 100, f < 0.01 ? 2 : 1) + "% Crab";

  /* 表里同一处的合并规则要求两两能对上，示例任务（如 task:Crab）会把 1LHAASO 那一行挤出去。
     选谱时再按名称和别名把 1 度内的 1LHAASO / TeVCat 行找回来（近的在前）。 */
  let index = null, indexN = -1;
  const norm = n => String(n).normalize("NFKC").toLowerCase().replace(/\s+/g, "").replace(/\*+$/, "");
  const pos = r => [r.ra_deg ?? r.ra, r.dec_deg ?? r.dec];
  const sep = (a, b) => {
    const [r1, d1] = pos(a), [r2, d2] = pos(b);
    if (![r1, d1, r2, d2].every(U.fin)) return Infinity;
    const c = Math.sin(d1 * R) * Math.sin(d2 * R) + Math.cos(d1 * R) * Math.cos(d2 * R) * Math.cos((r1 - r2) * R);
    return Math.acos(U.clamp(c, -1, 1)) / R;
  };
  function linked(members) {
    if (typeof WBCatalog === "undefined" || !WBCatalog.active) return members;
    // 私有版里 1LHAASO 被 2LHAASO 替换，不在 active() 里；它的谱另存在 WBCatalog.lhaaso1
    const shown = WBCatalog.active(), ids = new Set(shown.map(r => r.id));
    const hidden = (WBCatalog.lhaaso1 || []).filter(r => !ids.has(r.id)), all = [...shown, ...hidden];
    if (!index || indexN !== all.length) {
      index = new Map(); indexN = all.length;
      // 1LHAASO 论文的对应体表（associations，不含“不确定”的）也算：TeVCat 名字能对上就把那一行 1LHAASO 找回来
      for (const r of all) if (r.catalog === "1LHAASO" || r.catalog === "TeVCat")
        for (const k of [r.name, ...(r.aliases || []), ...(r.catalog === "1LHAASO" ? (r.associations || []).filter(a => !a.uncertain).map(a => a.name) : [])])
          if (typeof k === "string" && k.trim()) {
            const key = norm(k); if (!index.has(key)) index.set(key, []); if (!index.get(key).includes(r)) index.get(key).push(r);
          }
    }
    const out = new Map(members.map(m => [m.id, m])), extra = [];
    // 2LHAASO 行没有别名，按位置（0.2° 内，同表里的合并规则）找 1LHAASO
    for (const m of members.filter(x => x.catalog === "2LHAASO")) for (const r of WBCatalog.lhaaso1 || []) {
      const d = sep(m, r);
      if (!out.has(r.id) && d <= 0.2) { out.set(r.id, r); extra.push([d, r]); }
    }
    for (const m of members) for (const k of [m.name, ...(m.aliases || [])]) {
      if (typeof k !== "string") continue;
      for (const r of index.get(norm(k)) || []) {
        const d = sep(m, r);
        if (!out.has(r.id) && d <= 1) { out.set(r.id, r); extra.push([d, r]); }
      }
    }
    return [...members, ...extra.sort((a, b) => a[0] - b[0]).map(x => x[1])];
  }

  function estimate(members) {
    members = linked((members || []).filter(Boolean));
    if (!members.length) return null;
    const site = WBPolicy.get("site"), zm = zmax();
    const key = members.map(m => m.id).sort().join("|") + "|" + zm;
    if (cache.has(key)) return cache.get(key);
    const pick = spectrum(members), out = {key, ok: false, reason: pick.reason || null, lit: pick.lit || null};
    if (pick.comps?.length && site) {
      const m = pick.member, dec = m.dec_deg ?? m.dec, spec = {comps: pick.comps, lowCut: !!pick.lowCut, hiCut: !!pick.hiCut};
      let edge = null;
      try {
        const band = WBCatalog.draft(m).energy_band_tev, rule = WBPolicy.get("qual_rule")?.edge;
        if (Array.isArray(band) && band.every(U.fin)) edge = band[rule === "lower" ? 0 : 1];
      } catch (e) { edge = null; }
      const flux = EDGES.slice(0, -1).map((a, j) => integrate(E => dnde(spec, E), a, EDGES[j + 1]));
      const sig = MIDS.map(E => sigmaAt(spec, E));
      Object.assign(out, {member: m, spec, flux, sig, k: sig.map((s, j) => 1 + (s / psf(MIDS[j])) ** 2),
        upper: spec.lowCut, extrap: !!pick.extrap, note: pick.note || "", edge, zmax: zm, dec,
        refs: pick.comps.filter(c => c.ref).map(c => ({...c.ref, short: c.label.split("（")[0]})), sigmaLow: sigmaAt(spec, 2), sigmaHigh: sigmaAt(spec, 50)});
      // 20° 整阵能阈以上的流强折合几成 Crab（HEGRA）
      const E20 = eth(20);
      if (U.fin(E20)) {
        const src = MIDS.reduce((s, E, j) => s + (E >= E20 ? flux[j] : 0), 0), ref = MIDS.reduce((s, E, j) => s + (E >= E20 ? crabBins[j] : 0), 0);
        out.crabFrac = ref > 0 ? src / ref : null;
      }
      // 中天：一直停在中天天顶角时要多久（几何上最好的情形）
      const zc = Math.abs(site.lat_deg - dec);
      if (U.fin(dec) && zc <= zm) {
        const x = rate(out, zc), t = hoursFor(x.r, x.Rs);
        if (t != null) out.best = {z: zc, t};
        // 天顶角自然分布：时角在可见范围里均匀取样（全年暗夜对时角大致均匀）
        const phi = site.lat_deg * R, d = dec * R, cz = Math.cos(zm * R);
        const c = (cz - Math.sin(phi) * Math.sin(d)) / (Math.cos(phi) * Math.cos(d));
        const H = c <= -1 ? Math.PI : c >= 1 ? 0 : Math.acos(c), n = 48;
        let rs = 0, ss = 0;
        for (let i = 0; i < n; i++) {
          const h = (i + .5) / n * H, z = Math.acos(U.clamp(Math.sin(phi) * Math.sin(d) + Math.cos(phi) * Math.cos(d) * Math.cos(h), -1, 1)) / R;
          const x = rate(out, z); rs += x.r; ss += x.Rs;
        }
        const tm = hoursFor(rs / n, ss / n);
        if (tm != null) out.mix = {t: tm};
      }
      out.ok = !!(out.best || out.mix);
      if (!out.ok) out.reason = "天顶角上限内看不到";
    }
    if (cache.size > 4000) cache.clear();
    cache.set(key, out);
    return out;
  }
  const basisText = e => e?.spec ? e.spec.comps.map(c => c.label).join("；") +
    (e.spec.comps.length > 1 && e.spec.comps.some((c, i) => i && c.lo > e.spec.comps[i - 1].hi) ? "；段间按两端对数连线" : "") : "";

  function fmt(t) {
    if (!U.fin(t)) return "—";
    if (t < 0.1) return "<0.1";
    if (t >= 1e4) return "> 1 万";
    return U.n(t, t < 10 ? 1 : 0);
  }
  const mark = e => e.upper ? "≤" : e.extrap ? "≈" : "";
  const note = () => `灵敏度为占位：整阵在各天顶角 1% Crab（HEGRA 谱）50 h 到 5σ；按完整谱分能段，Li & Ma，α = 1/${Math.round(1 / alpha())}，超出事例 ≥ ${P.minExcess}`;
  // 全年窗口表的一格（整阵口径，天顶角自然分布）
  function cell(members) {
    const e = estimate(members);
    if (!e?.ok) return `<td class="num win-t5 is-none" title="${U.esc(e?.reason || "无法估计")}">—</td>`;
    const t = e.mix?.t ?? e.best?.t;
    const tip = [`打到 5σ 约需 ${mark(e)}${fmt(e.mix?.t)} h（天顶角自然分布，整阵）`, e.best ? `中天（天顶角 ${U.n(e.best.z, 0)}°）约 ${mark(e)}${fmt(e.best.t)} h` : "",
      basisText(e), e.note, Math.max(...e.sig) > P.psf.at1TeV / 2 ? `展宽 σ ≈ ${U.n(e.sigmaLow, 2)}°（低能）/ ${U.n(e.sigmaHigh, 2)}°（高能）` : "", note()].filter(Boolean).join("\n");
    return `<td class="num win-t5${t > 1000 ? " is-long" : ""}" title="${U.esc(tip)}">${mark(e)}${fmt(t)}</td>`;
  }
  const hours = members => { const e = estimate(members); return e?.ok ? (e.mix?.t ?? e.best?.t) : null; };

  /* 源卡里的一节。Z = WBGeo.zenithMonths 的结果（可能还没算完）；frac(m) = 每月期望比例（天气，雨季 0） */
  function card(members, {Z = null, year = null, frac = () => 1} = {}) {
    const e = estimate(members);
    const head = `<div class="card-h"><h3>打到 5σ</h3><span class="note">简单估计 · 灵敏度占位</span></div>`;
    const refs = (e?.refs || []).map(r => ` <a href="${U.esc(r.url)}" target="_blank" rel="noopener noreferrer" title="${U.esc(r.text)}">${U.esc(r.short)} 文献 ↗</a>`).join("");
    if (!e?.ok) return head + `<p class="note">${U.esc(e?.reason || "无法估计")}。</p>`;
    const pre = mark(e) ? mark(e) + " " : "";
    let year5 = "…", when = "";
    if (Z?.months && Array.from({length: 12}, (_, i) => Z.months[i + 1]).every(Boolean)) {
      let s2 = 0, ns = 0, reached = null;
      for (let m = 1; m <= 12; m++) {
        const f = frac(m) ?? 0;
        Z.months[m].forEach((h, b) => {
          if (!(h > 0) || !(f > 0)) return;
          const z = Math.min(Z.zenith_max_deg, (b + .5) * Z.bin_deg), x = rate(e, z);
          s2 += h * f * x.r; ns += h * f * x.Rs;
        });
        if (reached == null && s2 >= P.sigma ** 2 && ns >= P.minExcess) reached = m;
      }
      year5 = s2 > 0 ? (e.upper ? "≥ " : "") + U.n(Math.sqrt(s2), Math.sqrt(s2) < 10 ? 1 : 0) : "0";
      when = reached ? `从 1 月起按月累计，${reached} 月底前到 5σ。` : s2 > 0 ? "全年累计到不了 5σ。" : "";
    }
    const w = e.best ? wOf(e.best.z) : null;
    const spec = basisText(e) + (U.fin(e.crabFrac) ? `；20° 整阵能阈（${U.n(eth(20), 2)} TeV）以上约 ${crab(e.crabFrac)}` : "") + "。" + (e.note ? e.note + "，时间是上限。" : "");
    const big = Math.max(...e.sig);
    const more = [
      big > 0 ? (Math.abs(e.sigmaLow - e.sigmaHigh) > 0.01 ? `展宽 σ ≈ ${U.n(e.sigmaLow, 2)}°（低能）/ ${U.n(e.sigmaHigh, 2)}°（高能），` : `展宽 σ ≈ ${U.n(big, 2)}°，`) + "ON 区随之放大、背景变多。" : "按点源算。",
      U.fin(w) && w > 0 && e.best ? `四组模式下单用一个 8 台组：中天约 ${pre}${fmt(e.best.t / w)} h（w = ${U.n(w, 2)}）。` : "",
      when,
    ].filter(Boolean).join("");
    return head + `<dl class="win-kv3">
        <div><dt>中天${e.best ? " " + U.n(e.best.z, 0) + "°" : ""}</dt><dd>${pre}${fmt(e.best?.t)}<small> h</small></dd></div>
        <div><dt>天顶角自然分布</dt><dd>${pre}${fmt(e.mix?.t)}<small> h</small></dd></div>
        <div title="把 ${year ?? ""} 年各月能看的时间（乘每月可观测比例，雨季为 0）都给这个源，累计能到几 σ"><dt>${year ?? ""} 年都给它</dt><dd>${year5}<small> σ</small></dd></div></dl>
      <p class="note">${U.esc(spec)}${refs}</p><p class="note">${U.esc(more)}</p>
      <details class="dt-how"><summary>怎么估的</summary><p class="note">整阵口径。${U.esc(note())}。0.1—1000 TeV 每十倍能量分 6 档：每档信号 = 有效面积 × 效率 ${P.efficiency} × 源在这一档的流强，背景 ∝ 有效面积 × E^-${P.bgIndex} × PSF²，背景的总量按锚点在每个天顶角反解；各档显著性平方相加，随 √t 增长。有效面积按登记表 aeff 的文字给（能阈处 0.3 km²，20°：1 TeV 1 km²、5 TeV 2 km²、30 TeV 2.5 km²；60°：3 TeV 1.5 km²、10 TeV 3 km²、30 TeV 5 km²），PSF 1 TeV 0.1°、10 TeV 以上 0.045°；展宽源每档背景乘 1 + (σ_src/PSF)²，所以大展宽源在高能吃亏更多。“天顶角自然分布”假设全年暗夜对时角大致均匀；大天顶角能阈高、高能有效面积大，硬谱源在大天顶角反而快，所以它可能比“中天”还短。“都给它”用下面天顶角分布的逐月小时乘每月可观测比例（雨季为 0）。谱拼法：1LHAASO（WCDA 1—25 TeV，KM2A 25 TeV 以上）或文献 LHAASO 对应体为主；LHAASO 没测到低能段时用 H.E.S.S. 等 IACT 的测量（文献或 TeVCat）补；段间按对数连线；低能没有任何测量的不往下外推，只算测到的部分，时间写“≤”。各仪器的源区大小、系统误差不同，拼接处可能不连续，只作量级参考。以上常数都是占位，LACT 性能版本给出后替换。</p></details>`;
  }

  /* 一段观测（手排）的显著性平方和事例数：samples = [{z, hours}] */
  function accumulate(members, samples) {
    const e = estimate(members);
    if (!e?.ok) return null;
    let s2 = 0, ns = 0;
    for (const {z, hours: h} of samples) { const x = rate(e, z); s2 += x.r * h; ns += x.Rs * h; }
    return {s2, ns, upper: e.upper, extrap: e.extrap};
  }
  // σ：低能没算进去的是下限（≥）
  const sigmaText = acc => !acc ? "—" : (acc.upper ? "≥" : acc.extrap ? "≈" : "") + U.n(Math.sqrt(acc.s2), Math.sqrt(acc.s2) < 10 ? 1 : 0) + "σ" + (acc.ns < P.minExcess ? "*" : "");

  return {P, estimate, cell, hours, card, accumulate, sigmaText, fmt, note, eth, rate, dnde, aeff};
})();

        <div></div>${months.map(m=>`<button type="button" class="zm-m${m===state.month?" on":""}${rainy(m)?" rainy":""}" data-act="wiMonth" data-arg="${m}" title="${m} 月${rainy(m)?" · 雨季":""}">${m}</button>`).join("")}<div class="zm-h">${scope==="month"?state.month+" 月":state.includeRain?"全年":"非雨季"} h</div>
        ${rowsHtml}
        <div class="zm-l">合计</div><div style="grid-column:span 12"></div><div class="zm-v num"><b>${U.fin(total)?U.n(total,0):"…"}</b></div>
      </div>
      <p class="note">${state.zenBusy?"还在算其余月份… ":""}几何可见时间按源中心的天顶角分档，格子越深小时越多；点月份数字换月。页面近似（${Z.step_min} 分钟取样），和表里的数差几个小时属正常。${state.expected?"已乘每月可观测比例。":""}</p>`;
  }
  /* 打到 5σ（WBDetect，简单估计）：同一处各目录合起来选谱；全年累计用右边算好的天顶角分布 */
  function detectPanel(s, c = sheetCtx(s)){
    if (typeof WBDetect==="undefined") return "";
    const Z=state.zenFor===zenKey(s) ? state.zen : null;
    return WBDetect.card(c.group?.members || [s], {Z, year:state.year, frac:m=>expectedFraction(m) ?? 0});
  }
  async function loadZenith(){
    const s=selected(); if(!s||state.zenBusy&&state.zenFor===zenKey(s))return;
    state.zenAbort?.abort();
    const controller=state.zenAbort=new AbortController(), key=state.zenFor=zenKey(s);
    state.zen=null; state.zenBusy=true;
    // 先算所选月，再算其余月份；每算完一个月重画一次
    const order=[state.month,...Array.from({length:12},(_,i)=>i+1).filter(m=>m!==state.month)];
    try{
      const done=await WBGeo.zenithMonths(state.year,s,state.preview,{months:order,signal:controller.signal,
        onMonth:(_,partial)=>{ if(state.zenFor===key){ state.zen=partial; updatePart(["windowZenith","windowDetect"]); } }});
      if(done&&state.zenFor===key) state.zen=done;
    }catch(e){ if(state.zenFor===key) state.error="天顶角分布没算出来："+e.message; }
    finally{ if(state.zenFor===key&&!controller.signal.aborted){ state.zenBusy=false; updatePart(["windowZenith","windowDetect"]); } }
  }
  /* 延展度（同一处各目录各一条）与指向策略：在当前计划里的源照计划写（实际用的 wobble 方向、背景方法、拼接布局），
     不在计划里的写加入任务后按登记表的默认怎么指。 */
  const BG = {reflected:"反射 OFF", template:"模板背景", ring:"环形背景"};
  const KERNEL = {pessimistic:"悲观", placeholder:"占位", optimistic:"乐观"};
  function extentHtml(group, s){
    const members = group ? group.members : [s];
    const items = members.map(m => ({m, e: typeof WBAtlas !== "undefined" ? WBAtlas.extentOf(m) : null})).filter(x => x.e);
    if (!items.length) return `<div class="win-kv"><span>延展度</span><b>目录没给展宽</b><span class="muted">按点源处理</span></div>`;
    return items.map(({m, e}) => `<div class="win-kv"><span>延展度</span><b>${U.esc(e.text)}</b><span class="muted">${U.esc(catalogName(m.catalog))}${members.length > 1 ? " · " + U.esc(m.name) : ""}</span></div>`).join("");
  }
  function pointingHtml(s, group){
    const w = Data.ws(), plan = Data.anyPlan(w), date = Data.workspaceNight(w);
    const taskRow = (group ? group.members : [s]).find(m => m.catalog === "tasks");
    const tid = taskRow ? String(taskRow.task_id || taskRow.id).replace(/^task:/, "") : null;
    const wob = WBPolicy.get("wobble") || {}, lp = WBPolicy.get("layout_policy") || {};
    const dirs = (wob.directions_deg || []).map(d => d + "°").join(" / ");
    const lines = [];
    let head = globalThis.LACT_PUBLIC ? "按登记表默认" : "加入任务后按登记表默认";
    // 这一页打开时不读结果；第一次看源详情时读入当前这版，读完会整页重画
    if (!plan && w?.caseFile && !w.loaded && !w.error) { Data.loadCase(w); head = "正在读入当前结果，看它是不是计划里的任务…"; }
    if (tid && plan) {
      const layout = plan.inputs?.layouts?.[tid];
      const vs = (plan.visits || []).filter(v => String(v.task_id).split(":")[0] === tid);
      head = `这版计划（${date || "—"}）里${vs.length ? "" : "没排它；排进来时按下面的方式"}`;
      if (layout) {
        lines.push(["方式", `拼接 ${(layout.fields || []).length} 场${U.fin(layout.candidate_count) ? `（候选 ${layout.candidate_count} 场，按份额剪枝）` : ""}`]);
        lines.push(["布局", `${layout.family === "regular_hexagon" ? "规则六边形" : U.esc(layout.family || layout.method || "—")}${U.fin(layout.rings) ? ` ${layout.rings} 圈` : ""}${U.fin(layout.step_deg) ? `，场距 ${U.n(layout.step_deg, 1)}°` : ""}；ROI ${U.fin(layout.roi?.radius_deg ?? layout.radius_deg) ? "半径 " + U.n(layout.roi?.radius_deg ?? layout.radius_deg, 1) + "°" : "—"}`]);
        lines.push(["设计", `按${KERNEL[layout.design_kernel] || U.esc(layout.design_kernel || "—")}偏轴响应${U.fin(layout.r50_deg) ? `（r50 ${U.n(layout.r50_deg, 1)}°）` : ""}，各场按份额分时，落地逐 run 选场`]);
      } else if (vs.length) {
        const cfg = vs.find(v => v.pointing?.wobble_configuration)?.pointing.wobble_configuration;
        const pas = new Map(); for (const v of vs) { const pa = v.pointing?.wobble?.pa_deg; if (U.fin(pa)) pas.set(pa, (pas.get(pa) || 0) + 1); }
        lines.push(["方式", `wobble 偏置 ${U.n(cfg?.offset_deg ?? wob.offset_deg, 1)}°`]);
        if (pas.size) lines.push(["方向", [...pas].sort((a, b) => a[0] - b[0]).map(([pa, n]) => `${pa}° × ${n}`).join("、") + ` <span class="muted">（共 ${vs.length} 段）</span>`]);
      }
      if (vs.length) {
        const bgs = new Map(); for (const v of vs) { const k = v.pointing?.background_method || "—"; bgs.set(k, (bgs.get(k) || 0) + 1); }
        const why = U.uniq(vs.map(v => v.pointing?.template_reason).filter(Boolean));
        const offs = vs.map(v => v.pointing?.wobble?.n_off).filter(U.fin);
        lines.push(["背景", [...bgs].map(([k, n]) => `${BG[k] || U.esc(k)}${bgs.size > 1 ? " × " + n : ""}`).join("、") +
          (offs.length ? `，OFF ${Math.min(...offs)}${Math.max(...offs) !== Math.min(...offs) ? "—" + Math.max(...offs) : ""} 个` : "") +
          (why.length ? `<div class="tiny muted">用模板的原因：${U.esc(why.join("；"))}</div>` : "")]);
      }
    }
    if (!lines.length) {
      let draft = null; try { draft = WBCatalog.draft(s); } catch { draft = null; }
      if (draft?.kind === "extended") {
        lines.push(["方式", `延展源（加入后半径 ${U.n(draft.radius_deg, 2)}°，由目录展宽乘登记倍数）`]);
        lines.push(["布局", `是否拼接、几场由排班按“延展源布局”登记项定：规则布局，有效视场半径 ${U.n(lp.usable_radius_deg, 1)}°，按${KERNEL[lp.design_kernel] || "悲观"}偏轴响应设计`]);
      } else {
        lines.push(["方式", `点源 wobble：偏置 ${U.n(wob.offset_deg, 1)}°，方向 ${dirs || "—"} 轮换`]);
      }
      lines.push(["背景", `反射 OFF（ON 半径 ${U.n(wob.on_radius_deg, 2)}°，邻源排除 ${U.n(wob.exclusion_radius_deg, 1)}°，至少 ${wob.min_off ?? "—"} 个）；不够时改用模板背景`]);
    }
    const hasFields = tid && plan?.inputs?.layouts?.[tid];
    return `<div class="win-sec"><div class="card-h"><h3>延展度与指向</h3><span class="note">${U.esc(head)}</span></div>
      ${extentHtml(group, s)}
      ${lines.map(([k, v]) => `<div class="win-kv"><span>${k}</span><b>${v}</b></div>`).join("")}
      ${hasFields ? `<button type="button" class="linkbtn" data-act="wiShowFields">在天图上显示拼接场 →</button>` : ""}
    </div>`;
  }
  const KIND = {point:"点源", extended:"延展源", monitoring:"监测", localization:"定位"};
  function sheetCtx(s){
    // 和表里使用相同的目录名称对应规则。
    const group=U.fin(s.ra_deg)&&U.fin(s.dec_deg)
      ? merge(rows().filter(r=>r.id===s.id||(U.fin(r.ra_deg)&&U.fin(r.dec_deg)&&Math.abs(r.dec_deg-s.dec_deg)<=2&&Astro.sep(r.ra_deg,r.dec_deg,s.ra_deg,s.dec_deg)<=2))).find(g=>g.ids.includes(s.id))
      : null;
    // 已加入的同名或别名任务可以直接打开任务详情；任务也能找到同一处的目录行看源信息
    const taskMember=s.catalog==="tasks"?s:group?.members.find(m=>m.catalog==="tasks");
    const catalogMember=s.catalog!=="tasks"?s:group?.members.find(m=>m.catalog!=="tasks");
    const cats=group?group.catalogs:[s.catalog], others=aliasesFor(group?.members || [s],s.name);
    const names = new Set([s.name,...others].map(norm));

  /* 源卡的内容：每月可观测 → 天顶角分布 → 延展度与指向 → 逐夜窗口（三处同顺序） */

  function mount(){

    }
    if (state.ready) {
      WBCatalog.mount(); queueYear();
      const s=selected(), key=s ? [s.id,state.year,state.month,JSON.stringify(state.preview)].join("|") : null;
      if (key && state.monthFor!==key && !state.monthBusy) loadMonth();

  /* 坐标输入：“名字 赤经 赤纬”，赤经赤纬可以是度，也可以是时分秒 / 度分秒；名字可省。
     0.1° 内已有目录源就直接选它，否则加成本地私有源（只存在这个浏览器），选中并把天图转到那里。 */
  function parseCoord(text){
    const t = String(text || "").trim().replace(/[，,]/g, " ").replace(/\s+/g, " ");
    // 时分秒：05:34:32.0 +22:00:52 或 5h34m32s +22d00m52s
    const sexa = /(\d{1,2})[h:\s](\d{1,2})[m:\s](\d{1,2}(?:\.\d+)?)s?\s+([+\-−]?)(\d{1,2})[d°:\s](\d{1,2})['m:\s](\d{1,2}(?:\.\d+)?)["s]?\s*$/i.exec(t);
    if (sexa) {
      const [, h, m, sec, sign, d, dm, ds] = sexa;
      const ra = (+h + +m / 60 + +sec / 3600) * 15, dec = (sign === "-" || sign === "−" ? -1 : 1) * (+d + +dm / 60 + +ds / 3600);
      return {name: t.slice(0, sexa.index).trim(), ra, dec};
    }
    const deg = /([+-]?\d+(?:\.\d+)?)°?\s+([+\-−]?\d+(?:\.\d+)?)°?\s*$/.exec(t);
    if (deg) return {name: t.slice(0, deg.index).trim(), ra: +deg[1], dec: +deg[2].replace("−", "-")};
    return null;
  }
  function locate(text){
    state.coordText = text;
    const c = parseCoord(text);
    if (!c || !(c.ra >= 0 && c.ra < 360) || !(Math.abs(c.dec) <= 90)) {
      App.toast("没认出坐标。写成“名字 赤经 赤纬”，例如 83.63 22.01 或 05:34:32 +22:00:52。");
      return;
    }
    const near = rows().map(r => ({r, d: U.fin(r.ra_deg) && U.fin(r.dec_deg) ? Astro.sep(r.ra_deg, r.dec_deg, c.ra, c.dec) : Infinity}))
      .filter(x => x.d <= .1).sort((a, b) => a.d - b.d)[0];
    let id;
    if (near && !c.name) { id = near.r.id; App.toast(`这个位置已有目录源：${U.esc(near.r.name)}（相距 ${U.n(near.d, 2)}°）`); }
    else {
      const name = c.name || `自定义 ${U.n(c.ra, 2)}° ${c.dec >= 0 ? "+" : ""}${U.n(c.dec, 2)}°`;
      const same = WBCatalog.local.find(s => s.name === name && Math.abs(s.ra_deg - c.ra) < 1e-6 && Math.abs(s.dec_deg - c.dec) < 1e-6);
      if (same) id = same.id;
      else {
        const row = WBCatalog.canonical({id: "private:custom-" + Date.now(), name, ra: +c.ra.toFixed(5), dec: +c.dec.toFixed(5), status: "private", type: "自定义坐标"}, "private");
        WBCatalog.local.push(row); U.store.set("wb-catalog-private", WBCatalog.local);
        id = row.id;
        App.toast(`已加入本地私有源“${U.esc(name)}”（只存在这个浏览器）；右栏可看每月时间${globalThis.LACT_PUBLIC ? "" : "，点“加入任务”进源表"}。`);
      }
    }
    if (typeof WBAtlas !== "undefined") WBAtlas.centerOn?.(c.ra, c.dec);
    focusSource(id);
  }
  function focusSource(id){
    state.selected=id; clearMonth();
    if (App.state.route === "windows") {
      refresh();
      const side=document.getElementById("window-source");
      if (side && side.getBoundingClientRect().top > window.innerHeight*0.7) side.scrollIntoView({block:"start",behavior:"smooth"});
    }
    else App.go("windows");
  }
  function clearMonth(){ state.monthRows=[]; state.monthBasis=null; state.monthTicket=Symbol(); state.monthBusy=false; state.monthFor=null; }
  function clearNight(){ state.nightRows=[]; state.compare.clear(); state.nightPage=1; state.nightTicket=Symbol(); state.nightBusy=false; state.nightFor=null; }
  function clearYear(){
    state.yearAbort?.abort(); state.annualBusy=false; state.yearRows.clear(); state.yearBasis.clear(); state.error="";
    state.annualAttempt=null; state.annualContext=null; state.sourceSignatures=new Map();
  }
  function plotTracks(){
    const root=document.querySelector("[data-wi-tracks]");
    if (!root) return;
    const step=WBPolicy.display()?.window_step_min;
    if (!U.fin(step)) { root.textContent="未提供窗口步长"; return; }
    const sources=rows().filter(r=>state.compare.has(r.id));
    const tracks=WBGeo.night(state.night,sources,state.preview,true);
    const x=i=>50+i/(tracks[0]?.zenith?.length-1||1)*650, y=z=>32+U.clamp(z,0,180)*198/180;
    const labels=[0,30,60,90,120,150,180];
    const vertical = tracks[0] ? Array.from({length:8},(_,i)=>{
      const idx=Math.round(i*(tracks[0].zenith.length-1)/7);
      const stamp=tracks[0].start_ms+idx*step*6e4;
      return `<text x="${x(idx)}" y="250" text-anchor="middle">${U.hm(stamp)}</text>`;
    }).join("") : "";
    root.innerHTML=`<svg viewBox="0 0 720 266" role="img" aria-label="多个源的天顶角和北京时间轨迹">
      ${labels.map(z=>`<line x1="50" x2="700" y1="${y(z)}" y2="${y(z)}" stroke="var(--border2)"/><text x="41" y="${y(z)+4}" text-anchor="end">${z}°</text>`).join("")}
      ${tracks.map((r,j)=>`<polyline points="${r.zenith.map((z,i)=>`${x(i).toFixed(2)},${y(z).toFixed(2)}`).join(" ")}" fill="none" stroke="${PALETTE[j%PALETTE.length]}" stroke-width="2"/>`).join("")}${vertical}</svg>
      <div class="win-controls">${sources.map((r,j)=>`<span class="win-legend"><i style="background:${PALETTE[j%PALETTE.length]}"></i>${U.esc(r.name)}</span>`).join("")}</div>`;
  }
  function absorb(document,basis,allowed){
    for(const row of document?.sources || []){
      if (allowed && !allowed.has(row.id)) continue;
      state.yearRows.set(row.id,new Map(row.months.map(month=>[month.month,month])));
      state.yearBasis.set(row.id,basis);
    }
  }
  function activeTaskTable(only){
    const local=App.state.inp?.table,w=Data.ws();
    const saved=Data.anyPlan(w)?.inputs?.tasks || w?.tasks?.tasks;
    const tasks=(local?.tasks || saved || []).filter(t=>U.fin(t.approved_min)&&t.approved_min>0 &&
      (!only || only.has("task:"+t.id)));
    return tasks.length ? {schema:"lact-task-table",version:1,plan_period:local?.plan_period,tasks} : null;
  }
  async function loadYear(force=false){
    if(!state.ready)return;
    const request=annualRequest(), context=annualContext();
    if(state.annualBusy&&state.annualAttempt===request)return;
    if(force||state.annualContext!==context)clearYear();
    else state.yearAbort?.abort();
    state.annualContext=context; state.annualAttempt=request; state.error="";
    const controller = state.yearAbort = new AbortController();
    state.annualBusy=true; refresh();
    try{
      const {year,mode,preview}=state;
      const doc=mode==="LACT"&&!preview ? await WBCatalog.loadWindow(year).catch(()=>null) : null;
      if(controller.signal.aborted)return;
      if(doc){
        absorb(doc,"后端导出",new Set(rows().filter(r=>r.catalog!=="tasks").map(r=>r.id)));
        refresh();
      }
      if (WBCatalog.selected.size && !WBCatalog.cache.fermi) try { await WBCatalog.load("fermi"); }
      catch(e){ state.error="已选 Fermi 目录暂不可用："+e.message; }
      if(controller.signal.aborted)return;
      const all=rows(), signatures=new Map(all.map(r=>[r.id,sourceSignature(r)]));
      for(const id of state.yearRows.keys())if(!signatures.has(id) ||
          state.yearBasis.get(id)!=="后端导出"&&state.sourceSignatures.has(id)&&state.sourceSignatures.get(id)!==signatures.get(id)){
        state.yearRows.delete(id); state.yearBasis.delete(id);
      }
      state.sourceSignatures=signatures;
      if(mode==="LACT"&&!preview){
        // Static files contain examples for tasks, so task rows use the current input.
        const missing=all.filter(r=>!state.yearRows.has(r.id));
        if(Data.server.on&&missing.length){
          const external=missing.filter(r=>r.catalog!=="tasks" && r.catalog!=="private");
          const queries=[];
          if(external.length) queries.push({year,source_ids:external.map(r=>r.id)});
          const taskIds=new Set(missing.filter(r=>r.catalog==="tasks").map(r=>r.id));
          if(taskIds.size){
            const tasks=activeTaskTable(taskIds);
            queries.push({year,source_ids:[],include_tasks:true,...(tasks?{tasks}:{})});
          }
          for (const body of queries) {
            try{
              const response=await Data.api("/api/windows",body);
              if(controller.signal.aborted)return;
              absorb(response.windows,"本机排班口径",new Set(missing.map(r=>r.id)));
            }catch(e){ if (controller.signal.aborted)return; state.error="本机窗口暂不可用，缺项将用页面几何近似。"; }
          }
        }
      }
      const missing=all.filter(r=>!state.yearRows.has(r.id));
      if(missing.length){
        const includeStates=mode==="LACT";
        const approximate=await WBGeo.year(year,missing,{mode,preview,includeStates,signal:controller.signal,progress:(done,total)=>{
          const node=document.querySelector("[data-wi-progress]");
          if(node&&!controller.signal.aborted)node.textContent=`计算页面近似 ${done}/${total} 日`;
        }});
        if (controller.signal.aborted || !approximate) return;
        const geometry=includeStates ? approximate.geometry : approximate;
        for(const [id,monthly] of Object.entries(geometry)){
          state.yearRows.set(id,new Map(monthly.map((geometry_hours,i)=>{
            const month=i+1, frac=expectedFraction(month);
            const row={month,geometry_hours,f32_hours:includeStates?(approximate.f32?.[id]?.[i]??null):null,
              s8_hours:includeStates?(approximate.s8?.[id]?.[i]??null):null};
            if(includeStates)for(const field of measures.keys())row["expected_"+field]=U.fin(frac)&&U.fin(row[field])?row[field]*frac:null;
            return [month,row];
          })));
          state.yearBasis.set(id,preview?"页面近似 · 预览值":"页面近似");
        }
      }
    }catch(e){ if(!controller.signal.aborted)state.error="全年窗口读取失败：" + e.message; }
    finally { if(!controller.signal.aborted){state.annualBusy=false; refresh();} }
  }
  async function loadMonth(){
    const s=selected(); if(!s||state.monthBusy)return;
    const ticket=state.monthTicket=Symbol(), {year,month,preview}=state;
    state.monthFor=[s.id,year,month,JSON.stringify(preview)].join("|");
    state.monthBusy=true; updatePart("windowNights");
    try{
      let exact=null;
      if(Data.server.on&&!preview&&s.catalog!=="private"){
        try{
          const task=s.catalog==="tasks";
          const table=task ? activeTaskTable(new Set([s.id])) : null;
          const reply=await Data.api("/api/windows",{year,month,source_ids:task?[]:[s.id],include_tasks:task,
            ...(table?{tasks:table}:{})});
          exact=reply.windows?.sources?.find(row=>row.id===s.id);
        }catch(e){ /* offline geometry is still available */ }
      }
      if(ticket!==state.monthTicket)return;
      if(exact?.nights){
        state.monthRows=exact.nights; state.monthBasis="本机排班口径";
      }else{
        const count=new Date(Date.UTC(year,month,0)).getUTCDate(), calculated=[];
        for(let d=1;d<=count;d++){
          const date=`${year}-${String(month).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
          calculated.push(...WBGeo.night(date,[s],preview,false));
          if(d%3===0){ await new Promise(resolve=>setTimeout(resolve,0)); if(ticket!==state.monthTicket)return; }
        }
        state.monthRows=calculated; state.monthBasis=preview?"页面近似 · 预览值":"页面近似";
      }
    }catch(e){ if(ticket===state.monthTicket)state.monthBasis="逐夜窗口读取失败：" + e.message; }
    finally{ if(ticket===state.monthTicket){state.monthBusy=false;updatePart("windowNights");} }
  }
  async function loadNight(){
    if(state.nightBusy||!state.ready)return;
    const ticket=state.nightTicket=Symbol(), date=state.night;
    state.nightFor=date+"|"+JSON.stringify(state.preview);
    state.nightBusy=true; updatePart("windowNight");
    await new Promise(resolve=>setTimeout(resolve,0));
    if(ticket!==state.nightTicket)return;
    try{ state.nightRows=WBGeo.night(date,rows(),state.preview,false); }
    catch(e){state.error="该夜窗口读取失败：" + e.message;}
    finally{state.nightBusy=false;updatePart("windowNight");plotTracks();}
  }

  App.acts.wiControl=async(value,el)=>{

"use strict";
/* 公开版“源与窗口 → 某一晚”里的手排演示：把源排进一条时间轴，拖动改时间、拖右边缘改时长，
   检查几何条件（暗夜、天顶角、离月）、重叠、最短观测和转向时间，导出任务 CSV、指向 CSV 和计划 JSON。
   只在公开版显示；不是排班程序的结果。草稿按观测夜存在这个浏览器里。 */
const WBManual = (() => {
  const KEY = "manual-plans", SNAP = 5 * 6e4, MIN = 6e4;
  let plans = U.store.get(KEY, {}), sel = null, drag = null;
  // 排入成功或失败的提示写在手排卡里（“源与窗口”这一屏不显示 App.toast），显示一次就清掉
  let notice = null;
  const cache = new Map();
  const enabled = () => !!globalThis.LACT_PUBLIC;
  const save = () => U.store.set(KEY, plans);
  const list = date => (plans[date] ||= []).slice().sort((a, b) => a.start - b.start);
  const minVisit = () => WBPolicy.get("min_visit") ?? 10;
  const snap = t => Math.round(t / SNAP) * SNAP;
  const hm = t => U.hm(t);
  // 块里写得下几个字就写几个，写不下的用省略号（中文按 11 px、其他按 6.5 px 估）
  const textWidth = text => [...String(text)].reduce((w, ch) => w + (ch.charCodeAt(0) > 255 ? 11 : 6.5), 0);
  const fit = (text, px) => { let w = 0, out = ""; for (const ch of String(text)) { w += ch.charCodeAt(0) > 255 ? 11 : 6.5; if (w > px) return out.replace(/\s+$/, "") + "…"; out += ch; } return out; };
  // 颜色按源加进来的先后定，拖动改顺序时不变
  const color = (date, id) => PALETTE[[...new Set((plans[date] || []).map(b => b.src.id))].indexOf(id) % PALETTE.length] || PALETTE[0];
  // 亮星（56-stars.js 排进来的，src.kind = "star"）按亮星的条件算可见：月光下也行、天顶角和离月另有占位值
  const isStar = src => src?.kind === "star";
  const conditions = src => isStar(src) && typeof WBStars !== "undefined" ? WBStars.preview() : WBWindows.preview;
  function geo(date, src) {
    const pv = conditions(src), key = date + "|" + src.id + "|" + (src.kind || "") + "|" + JSON.stringify(pv || null);
    if (!cache.has(key)) cache.set(key, WBGeo.night(date, [src], pv, true)[0] || null);
    return cache.get(key);
  }
  // 转向时间：两源角距 ÷ 转速 + 稳定时间（登记表），单位分钟
  const slew = (a, b) => (Astro.sep(a.ra_deg, a.dec_deg, b.ra_deg, b.dec_deg) / (WBPolicy.get("slew_speed") || 1) + (WBPolicy.get("slew_settle") || 0)) / 60;
  const visibleMin = (g, a, b) => (g?.windows || []).reduce((sum, w) => sum + Math.max(0, Math.min(b, U.ms(w.end_utc)) - Math.max(a, U.ms(w.start_utc))), 0) / MIN;

  /* 打到几 σ（WBDetect 的简单估计，灵敏度占位）：块里每个取样点看得到就按那一刻的天顶角累计 */
  function detect(date, b) {
    if (typeof WBDetect === "undefined") return null;
    const g = geo(date, b.src), members = WBWindows.members?.(b.src.id);
    if (!g?.zenith?.length || !members) return null;
    const step = (WBPolicy.display()?.window_step_min || 1) * MIN, wins = (g.windows || []).map(w => [U.ms(w.start_utc), U.ms(w.end_utc)]);
    const samples = [];
    g.zenith.forEach((z, i) => {
      const t = g.start_ms + i * step;
      if (t >= b.start && t < b.end && wins.some(([x, y]) => t >= x && t < y)) samples.push({z, hours: step / 36e5});
    });
    return WBDetect.accumulate(members, samples);
  }
  function detectTotals(date) {
    const by = new Map();
    for (const b of list(date)) {
      const d = detect(date, b); if (!d) continue;
      const x = by.get(b.src.id) || {name: b.src.name, s2: 0, ns: 0, upper: false, extrap: false, n: 0};
      x.s2 += d.s2; x.ns += d.ns; x.upper ||= d.upper; x.extrap ||= d.extrap; x.n++;
      by.set(b.src.id, x);
    }
    return [...by.values()];
  }

  function check(date) {
    const blocks = list(date), out = new Map();
    blocks.forEach((b, i) => {
      const msgs = [], dur = (b.end - b.start) / MIN, g = geo(date, b.src), prev = blocks[i - 1];
      const lost = Math.round(dur - visibleMin(g, b.start, b.end));
      const why = isStar(b.src) && typeof WBStars !== "undefined" ? `亮星条件：太阳、天顶角 ≤ ${WBStars.COND.zenith}°、离月 ≥ ${WBStars.COND.moon}°` : "暗夜、天顶角或离月";
      if (lost > 0) msgs.push(lost >= dur ? `这段时间看不到（${why}）` : `有 ${lost} 分钟看不到`);
      if (dur < minVisit()) msgs.push(`短于最短观测 ${minVisit()} 分钟`);
      if (prev) {
        if (b.start < prev.end) msgs.push(`和 ${prev.src.name} 重叠`);
        else if (prev.src.id !== b.src.id) {
          const need = slew(prev.src, b.src), gap = (b.start - prev.end) / MIN;
          if (gap + 1e-9 < need) msgs.push(`离上一段只隔 ${Math.round(gap)} 分钟，转向要 ${need.toFixed(1)} 分钟`);
        }
      }
      out.set(b.id, msgs);
    });
    return out;
  }

  function add(date, src) {
    const g = geo(date, src);
    if (!g?.windows?.length) { notice = {bad: true, text: `${src.name} 这一晚看不到（${isStar(src) ? "按亮星条件" : "暗夜、天顶角或离月"}）。`}; redraw(date); return false; }
    const blocks = list(date), len = 60 * MIN, need = minVisit() * MIN;
    const free = (a, b) => blocks.every(x => b + (x.src.id === src.id ? 0 : slew(x.src, src) * MIN) <= x.start || a >= x.end + (x.src.id === src.id ? 0 : slew(x.src, src) * MIN));
    for (const w of g.windows) {
      const ws = U.ms(w.start_utc), we = U.ms(w.end_utc);
      for (let s = Math.ceil(ws / SNAP) * SNAP; s + need <= we; s += SNAP) {
        let e = Math.min(s + len, Math.floor(we / SNAP) * SNAP);
        while (e - s >= need && !free(s, e)) e -= SNAP;
        if (e - s >= need && free(s, e)) {
          const block = {id: Math.random().toString(36).slice(2, 9), src: {id: src.id, name: src.name, ra_deg: src.ra_deg ?? src.ra, dec_deg: src.dec_deg ?? src.dec, ...(isStar(src) ? {kind: "star"} : {})}, start: s, end: e};
          (plans[date] ||= []).push(block); sel = block.id; save();
          notice = {text: `已排入 ${src.name}：${hm(s)}—${hm(e)}。`}; redraw(date);
          return block;
        }
      }
    }
    notice = {bad: true, text: `${src.name} 能看到的时段里已经没有空位了。`}; redraw(date);
    return false;
  }

  function chart(date) {
    const [a, b] = WBPolicy.bounds(date), x0 = 50, x1 = 700, X = t => x0 + (t - a) / (b - a) * (x1 - x0), Y = z => 14 + Math.min(z, 90) / 90 * 150;
    const zmax = WBWindows.preview?.zenith ?? WBPolicy.get("max_zenith"), blocks = list(date), status = check(date);
    const step = (WBPolicy.display()?.window_step_min || 1) * MIN, ev = WBGeo.solarEvents(date) || {};
    const ds = U.ms(ev.darkStart), de = U.ms(ev.darkEnd);
    let s = `<defs><pattern id="mp-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="var(--faint)" stroke-width="1.4"/></pattern></defs>`;
    s += `<rect x="${x0}" y="14" width="${x1 - x0}" height="150" fill="var(--sunk)"/>`;
    if (Number.isFinite(ds)) s += `<rect x="${x0}" y="14" width="${Math.max(0, X(ds) - x0)}" height="150" fill="var(--twilight)" opacity=".55"/>`;
    if (Number.isFinite(de)) s += `<rect x="${X(de)}" y="14" width="${Math.max(0, x1 - X(de))}" height="150" fill="var(--twilight)" opacity=".55"/>`;
    // 月亮在地平线上的时段铺一层很浅的底色（56-stars.js 算的月亮轨迹）
    const mt = typeof WBStars !== "undefined" ? WBStars.moonTrack(date) : null;
    for (const [u, v] of mt?.up || []) s += `<rect x="${X(u).toFixed(1)}" y="14" width="${Math.max(0, X(v) - X(u)).toFixed(1)}" height="150" fill="var(--moon)" opacity=".09"><title>月亮在地平线上 ${hm(u)}—${hm(v)}</title></rect>`;
    for (const z of [0, 30, 60, 90]) s += `<line x1="${x0}" x2="${x1}" y1="${Y(z)}" y2="${Y(z)}" stroke="var(--rule)"/><text x="${x0 - 6}" y="${Y(z) + 4}" text-anchor="end" class="mp-ax">${z}°</text>`;
    // 月亮的天顶角：只画在地平线上的部分，名字写在最高点
    if (mt?.up?.length) {
      let seg = [];
      const flush = () => { if (seg.length > 1) s += `<polyline points="${seg.join(" ")}" fill="none" stroke="var(--moon)" stroke-width="1.6" stroke-linejoin="round"/>`; seg = []; };
      for (const p of mt.pts) { if (p.alt >= 0) seg.push(`${X(p.t).toFixed(1)},${Y(90 - p.alt).toFixed(1)}`); else flush(); }
      flush();
      const top = mt.pts.reduce((m, p) => p.alt > m.alt ? p : m, mt.pts[0]), name = `月亮 ${Math.round(mt.illum * 100)}%`, half = textWidth(name) / 2;
      const tx = Math.min(x1 - half - 2, Math.max(x0 + half + 2, X(top.t)));
      s += `<text x="${tx.toFixed(1)}" y="${Math.max(24, Y(90 - top.alt) - 6).toFixed(1)}" text-anchor="middle" class="mp-name" fill="var(--moon)">${name}</text>`;
    }
    if (U.fin(zmax)) s += `<line x1="${x0}" x2="${x1}" y1="${Y(zmax)}" y2="${Y(zmax)}" stroke="var(--axis)" stroke-dasharray="4 4"/><text x="${x1 - 4}" y="${Y(zmax) - 4}" text-anchor="end" class="mp-ax">天顶角上限 ${zmax}°</text>`;
    const zStar = blocks.some(x => isStar(x.src)) && typeof WBStars !== "undefined" ? WBStars.COND.zenith : null;
    if (U.fin(zStar) && zStar !== zmax) s += `<line x1="${x0}" x2="${x1}" y1="${Y(zStar)}" y2="${Y(zStar)}" stroke="var(--axis)" stroke-dasharray="1 3"/><text x="${x1 - 4}" y="${Y(zStar) - 4}" text-anchor="end" class="mp-ax">亮星上限 ${zStar}°</text>`;
    // 计划里每个源的天顶角：细虚线是整夜，粗线是排进去的时段
    for (const id of [...new Set(blocks.map(x => x.src.id))]) {
      const src = blocks.find(x => x.src.id === id).src, g = geo(date, src), c = color(date, id);
      if (!g?.zenith?.length) continue;
      const pts = g.zenith.map((z, i) => [X(g.start_ms + i * step), Y(z), g.start_ms + i * step]);
      s += `<polyline points="${pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ")}" fill="none" stroke="${c}" stroke-width="1.2" stroke-dasharray="3 3" opacity=".8"/>`;
      for (const blk of blocks.filter(x => x.src.id === id)) {
        const seg = pts.filter(p => p[2] >= blk.start && p[2] <= blk.end);
        if (seg.length > 1) s += `<polyline points="${seg.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ")}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`;
      }
      // 源名写在最高点上方；按字宽估算，别让名字出了图的左右边
      const top = pts.reduce((m, p) => p[1] < m[1] ? p : m, pts[0]), half = textWidth(src.name) / 2;
      const tx = Math.min(x1 - half - 2, Math.max(x0 + half + 2, top[0]));

        s += `<rect x="${X(prev.end)}" y="178" width="${Math.max(1, X(prev.end + need) - X(prev.end))}" height="28" fill="url(#mp-hatch)"><title>转向 ${(need / MIN).toFixed(1)} 分钟</title></rect>`;

      const tip = `${blk.src.name} · ${hm(blk.start)}—${hm(blk.end)} · ${Math.round((blk.end - blk.start) / MIN)} 分钟${msgs.length ? " · " + msgs.join("；") : ""}`;
      s += `<g class="mp-block${msgs.length ? " is-bad" : ""}${on ? " is-sel" : ""}" data-mp-block="${blk.id}"><title>${U.esc(tip)}</title>

        ${w > 30 ? `<text x="${X(blk.start) + 6}" y="196" class="mp-label">${U.esc(fit(blk.src.name, w - 10))}</text>` : ""}
        <rect class="mp-edge" data-mp-edge="1" x="${X(blk.end) - 5}" y="178" width="8" height="28" fill="transparent"/></g>`;
    }
    for (let t = Math.ceil(a / 36e5) * 36e5; t <= b; t += 36e5) {

        return `<tr class="click${b.id === sel ? " sel" : ""}" data-act="mpSel" data-arg="${b.id}"><td class="num">${i + 1}</td><td><i class="mp-dot" style="background:${color(date, b.src.id)}"></i>${U.esc(b.src.name)}</td>

  }

    return `<p class="small mp-sigma">同一源几段合计：${rows.filter(x => x.n > 1).map(x => `${U.esc(x.name)} ${WBDetect.sigmaText(x)}`).join(" · ")}
      <span class="muted" title="${U.esc(WBDetect.note() + "。整阵口径，按每个时刻的天顶角累计，σ 随 √t 增长。≥ 表示低能没有测量、只算了测到的高能段，≈ 表示流强从更高能量往下外推，* 表示超出事例不足 10 个")}">（灵敏度占位，仅供量级参考）</span></p>`;

/* ==== 55-replay.js ==== */
"use strict";

const ReplayToo = {
  entries(w){ return (w?.meta?.too || []).filter(event => event.synthetic === true); },

  link(w){
    return ReplayToo.entries(w).length
      ? `<p class="note"><a class="btn" href="#alert/${U.esc(w.meta.date)}" data-act="go" data-arg="alert/${U.esc(w.meta.date)}" data-replay-too-link>查看模拟 ToO 决策与排班变化</a></p>` : "";
  },

  removed(w, plan){
    if (!Data.isReplay(w) || plan.kind !== "tonight" || plan.plan_id !== w.tonight?.plan_id) return [];
    if (w.tooComparisons?.night) return w.tooComparisons.night.removed || [];
    if (w.replayRemoved) return w.replayRemoved;
    const before = Data.nightVersions(w.meta.date).find(v => v.meta?.version_label === "原计划" && v.meta.plan_id !== plan.plan_id);
    if (!before) return [];
    const event = (w.replayEvents || w.meta.too || []).find(e => e.original_plan_id === before.meta.plan_id && e.selected_plan_id === plan.plan_id);
    return w.tooComparisons?.[event?.event_id]?.removed || [];
  },

  weatherLosses(w, plan){
    if (!Data.isReplay(w) || plan?.kind !== "tonight" || w.reports?.plan_id !== plan.plan_id) return [];
    return (w.reports?.operational_losses || []).filter(row => row.category === "weather");
  },

  timelineNote(w, plan){
    const removed = ReplayToo.removed(w, plan);
    const weather = ReplayToo.weatherLosses(w, plan).length || removed.some(row => row.weather_closed);
    if (!removed.length && !weather) return "";
    const cuts = (plan.events || []).flatMap(event => event.interrupted || []).map(cut => {
      const removedTail = removed.find(row => row.visit_id === cut.visit_id && row.group === cut.group
        && U.ms(row.start_utc) === U.ms(cut.at_utc));
      return removedTail ? `${Data.name(cut.task_id,w)} ${ReplayToo.time(removedTail.start_utc).slice(11)}–${ReplayToo.time(removedTail.end_utc).slice(11)}` : "";
    }).filter(Boolean);
    return `<p class="note" data-replay-original-note>实色是当前计划。${removed.length ? '<i class="key replay-ghost-key" aria-hidden="true"></i>源色斜纹是原计划被替代的时段。' : ""}${weather ? '<i class="key replay-ghost-key wx" aria-hidden="true"></i>灰斜纹是天气停观（计划了、没观测到）。' : ""}
      ${cuts.length ? `本次告警截短了 ${U.esc(U.uniq(cuts).join("、"))} 的原计划。` : ""}</p>`;
  },

  /* 原计划里被移出或截短的 ON，画进同一条组道、执行色块的下面（浅色 + 虚线框，天气停观再加灰斜纹）。
     同一源、同一原因、间隔不超过 5 分钟的相邻段并成一块，免得一串小框。 */
  ghosts(w, plan, model, group){
    const rows = ReplayToo.removed(w, plan).filter(row => row.group === group
      && Math.max(U.ms(row.start_utc), model.x0) < Math.min(U.ms(row.end_utc), model.x1))
      .sort((x, y) => U.ms(x.start_utc) - U.ms(y.start_utc));
    if (!rows.length) return "";
    const merged = [];
    for (const row of rows) {
      const a = U.ms(row.start_utc), b = U.ms(row.end_utc), wx = row.weather_closed === true;
      const last = merged.findLast(m => m.task === row.task_id && m.wx === wx);
      if (last && a - last.b <= 5 * 60e3) {
        if (b > last.b) { last.b = b; last.end = row.end_utc; }
        last.n++; last.parts.push(row); continue;
      }
      merged.push({task: row.task_id, wx, a, b, n: 1, start: row.start_utc, end: row.end_utc, parts: [row]});
    }
    const {intervention_kind} = w.meta.replay || {};
    const reason = intervention_kind === "weather" ? "天气恢复后重排移出" : intervention_kind === "manual" ? "人工停排移出" : "告警处理时移出或截短";
    return merged.map(g => {
      const start = TN.pct(model, Math.max(g.a, model.x0)), end = TN.pct(model, Math.min(g.b, model.x1));
      const name = Data.name(g.task, w);
      const tip = `原计划 ${name} · ${group} · ${ReplayToo.time(g.start).slice(11)}–${ReplayToo.time(g.end).slice(11)}（北京时间）· ${g.wx ? "天气停观" : reason}，没有执行${g.n > 1 ? `\n${g.n} 段：${g.parts.map(r => ReplayToo.time(r.start_utc).slice(11) + "–" + ReplayToo.time(r.end_utc).slice(11)).join("、")}` : ""}`;
      return `<span class="blk replay-ghost replay-original-piece${g.wx ? " wx" : ""}" data-replay-original-on data-task="${U.esc(g.task)}"
        data-start="${U.esc(g.start)}" data-end="${U.esc(g.end)}" title="${U.esc(tip)}"
        style="left:${start}%;width:${Math.max(end - start, .15)}%;--source-color:${Data.color(g.task, w)}"><span class="replay-ghost-name">${U.esc(name)}</span></span>`;
    }).join("");
  },

  time(value){
    const time = U.bj(U.ms(value));
    return time ? time.toISOString().slice(0, 19).replace("T", " ") : "—";
  },

  table(w, title, rows, key){
    if (!rows.length) return `<div><h3>${title}</h3><p class="note">无</p></div>`;
    return `<div><h3>${title} <span class="small muted">${rows.length} 段</span></h3>
      <div class="scroll-x" style="max-height:300px;overflow:auto"><table class="t" data-replay-too-${key}>
      <thead><tr><th>源</th><th>组</th><th>时段（北京时间）</th><th class="n">分钟</th></tr></thead><tbody>
      ${rows.map(row => `<tr${row.event ? ' data-replay-too-event-on' : ''}>
        <td><b>${U.esc(Data.name(row.target_id || row.task_id,w))}</b>${row.event ? ' <span class="pill sim">ToO</span>' : ""}
          <div class="small muted">${U.esc(row.visit_id)}</div></td><td>${U.esc(row.group)}</td>
        <td class="num" title="${U.esc(`${row.start_utc} — ${row.end_utc}`)}">${ReplayToo.time(row.start_utc)}<br>${ReplayToo.time(row.end_utc)}</td>
        <td class="n">${U.n(U.mins(row.start_utc,row.end_utc),2)}</td></tr>`).join("")}</tbody></table></div></div>`;
  },

  render(w){
    const rows = ReplayToo.entries(w);
    if (!rows.length) return "";
    return rows.map(event => {
      const comparison = w.tooComparisons?.[event.event_id];
      const changed = comparison && (comparison.removed.length || comparison.added.length);
      const decision = event.decision;
      const state = AL.DECISION[decision.state] || decision.state;
      const reason = AL.WHY[decision.reason] || AL.RULE[decision.reason] || decision.reason;
      const screen = AL.DECISION[decision.screen] || decision.screen;
      const source = AL.PROJECT[event.source.toLowerCase()] || event.source;
      return `<section class="card" data-replay-too="${U.esc(event.event_id)}" style="margin-bottom:16px">
        <div class="card-h"><h2 title="${U.esc(event.event_id)}">${U.esc(Data.alertLabel(event) || source)}</h2>
          <span class="pill sim">模拟告警</span><span class="pill plain" data-replay-too-state="${U.esc(decision.state)}">${U.esc(state)}</span></div>
        <p class="note" title="${U.esc(event.at_utc)}">${ReplayToo.time(event.at_utc)} 北京时间${reason ? ` · ${U.esc(reason)}` : ""}
          ${screen && screen !== state ? ` · ${U.esc(screen)}` : ""}</p>
        ${!comparison ? "" : changed ? (() => {
          // 顶上只给一句概括；两张逐段对照表收进“展开”（时间轴卡里已经画出前后对比）
          const mins = list => U.sum(list, row => U.mins(row.start_utc, row.end_utc));
          const ev = comparison.added.filter(row => row.event);
          const hit = U.uniq(comparison.removed.map(row => Data.name(String(row.task_id || row.target_id).split(":")[0], w)));
          return `<p style="margin:12px 0 6px">原计划被移出或截短 <b class="num">${comparison.removed.length}</b> 段、共 <b class="num">${U.n(mins(comparison.removed), 0)}</b> 分钟（${U.esc(hit.join("、"))}）；
            处理后新增 <b class="num">${comparison.added.length}</b> 段、共 <b class="num">${U.n(mins(comparison.added), 0)}</b> 分钟${ev.length ? `，其中告警目标 <b class="num">${U.n(mins(ev), 0)}</b> 分钟` : ""}。
            <span class="small muted">前后对比见下面“时间轴”卡。</span></p>
          <details class="foldnote"><summary>逐段对照表</summary><div class="row" style="margin-top:8px">
          <div class="grow" style="flex-basis:330px">${ReplayToo.table(w,"原计划中被移出或缩短的 ON",comparison.removed,"removed")}</div>
          <div class="grow" style="flex-basis:330px">${ReplayToo.table(w,"告警处理后新增的 ON",comparison.added,"added")}</div></div></details>`;
        })()
          : '<p class="note" data-replay-too-unchanged>排班未变。</p>'}</section>`;
    }).join("");
  },
};

/* 告警的显示名统一由 Data.alertLabel 给出（10-data.js），这里不再单独认 november-sim-… 这种编号。 */
/* 账本里前几夜的告警目标（alert_…）：这一版里没有这个任务，借回报里记的计划编号找到是哪次告警 */
ReplayToo.alertName = (id, w) => {
  const base = String(id || "").split(":")[0];
  if (!/^alert_/.test(base)) return null;
  for (const v of [w, ...Data.list]) {
    const rep = Object.values(v?.ledger?.reports || {}).find(r => r.task_id === base || r.target_id === base);
    if (!rep) continue;
    const event = Data.list.flatMap(x => x.meta?.too || []).find(e => e.selected_plan_id === rep.plan_id || e.original_plan_id === rep.plan_id);
    if (event) return Data.alertLabel(event, w) || Data.alertLabel(event.event_id, w);
  }
  return null;
};
(() => {
  // 账本里前几夜的告警目标（这一版里没有这个任务）：借回报里的计划编号找到是哪次告警
  const name = Data.name;

    const base = String(id || "").split(":")[0];
    if (!/^alert_/.test(base) || Data.task(id, w) || Data.alertFacts(base, w || Data.ws())) return n;

  };
})();

    "zet Ori": "参宿一", "eps UMa": "玉衡", "alf Per": "天船三", "alf UMa": "天枢", "del CMa": "弧矢一", "eps Sgr": "箕宿三",
    "eta UMa": "摇光", "alf UMi": "北极星", "alf And": "壁宿二", "alf Oph": "候", "bet Leo": "五帝座一", "gam Cyg": "天津一",
    "alf Peg": "室宿一", "bet Per": "大陵五", "alf Ari": "娄宿三", "alf Hya": "星宿一", "zet UMa": "开阳", "bet UMa": "天璇",
