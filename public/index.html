  nightControls(w, split = false){
    const date = Data.night(), versions = Data.nightVersions(date);
    const nights = Shell.knownNights(), today = Data.replayView?.default_date || U.ymd(Date.now());
    const view = App.state.route === "tonight" ? TN.view(w) : null;
    const plan = view?.doc || w?.tonight;
    const versionLabel = item => item.meta?.version_label || (Data.isReplay(item) ? "回放版" : item.meta?.slot_min
      ? `计划 · ${item.meta.slot_min} 分钟` : (item.label || "计划版本").replace(/^\d{4}-\d{2}-\d{2}\s*·\s*/, ""));
    const planId = item => item?.tonight?.plan_id || item?.ver?.plan_id || item?.job?.plan_id || item?.meta?.plan_id || "";
    const labels = versions.map(versionLabel);
    const reports = w?.reports?.reports || [];
    const simulated = Data.isReplay(w) || w?.reports?.synthetic === true || reports.some(row => row.simulation === true);
    const actual = !Data.isReplay(w) && w?.reports?.synthetic !== true && reports.some(row => row.simulation !== true);
    const kind = view?.kind === "preview" ? "预览" : view?.kind === "near_term" ? "近期分配" : w ? versionLabel(w) : "无计划";
    const version = !Data.replayView && versions.length > 1
      ? `<select class="night-version" data-change="nightVersion" aria-label="当夜版本" title="${U.esc(planId(w))}">${versions.map((item,i) =>
        `<option value="${U.esc(item.id)}" title="${U.esc(planId(item))}"${item === w ? " selected" : ""}>${U.esc(labels[i] +
          (labels.indexOf(labels[i]) !== labels.lastIndexOf(labels[i]) ? " · " + (planId(item) || item.id).slice(-8) : ""))}</option>`).join("")}</select>`
      : `<span class="pill plain${w ? " night-version" : ""}" title="${U.esc(plan?.plan_id || planId(w))}">${U.esc(kind)}</span>`;
    // 前后一夜：优先跳到相邻的“有结果的夜”，没有时按日历走一天
    const days = nights.map(n => n.date).sort();
    const prev = days.filter(d => d < date).pop() || U.addDays(date, -1), next = days.find(d => d > date) || U.addDays(date, 1);
    const tag = n => [n.plans ? "计划" : "", n.replay ? "回放 · 模拟" : ""].filter(Boolean).join(" · ");
    const main = `<div class="night-controls" role="group" aria-label="观测夜">
      <button type="button" class="chip night-step" data-act="chooseNight" data-arg="${prev}" title="前一夜：${prev}" aria-label="前一夜 ${prev}">‹</button>
      <details class="night-pick">
        <summary class="chip" title="观测夜（北京时间）。点开选别的夜"><b class="num">${U.esc(date)}</b><span class="muted">${Shell.weekday(date)}${date === today ? " · 今天" : ""}</span><span class="muted" aria-hidden="true">▾</span></summary>
        <div class="night-menu">
          ${Shell.calendar(date.slice(0, 7))}
          ${nights.length ? `<div class="night-menu-h">有结果的夜</div><div class="night-jump">${nights.map(n => `<button type="button" class="chip" data-act="chooseNight" data-arg="${n.date}" aria-pressed="${n.date === date}" title="${U.esc(Shell.weekday(n.date) + " · " + tag(n))}"><b class="num">${n.date}</b><span class="muted">${n.plans ? "计划" : ""}${n.plans && n.replay ? "·" : ""}${n.replay ? "回放" : ""}</span></button>`).join("")}</div>` : '<p class="note">还没有读入任何结果。</p>'}
          <div class="night-menu-f">
            ${date === today ? "" : `<button type="button" class="linkbtn" data-act="chooseNight" data-arg="${today}">回到今天</button>`}
            ${nights.some(n => n.replay) ? '<button type="button" class="linkbtn" data-act="wbRecentReplay">在结果列表里看 →</button>' : ""}
          </div>
        </div>
      </details>
      <button type="button" class="chip night-step" data-act="chooseNight" data-arg="${next}" title="后一夜：${next}" aria-label="后一夜 ${next}">›</button>
    </div>`;
    // 每一夜只显示一版（最新的那一版），页眉不放版本选择或版本牌子（用户 11-24 定）
    void version; void actual; void simulated;
    const ver = "";
    return split ? [main, ver] : main + ver;
  },

App.acts.wbLoadLegacy=()=>Data.loadLegacy().catch(e=>App.toast(U.esc(e.message)));

App.acts.forgetFiles = async () => { await Data.forget(); App.render(); };
/* 手机宽：版本、结果来源、结果、操作人收在“⋯”里 */
App.acts.topMore = () => { App.state.topMore = !App.state.topMore; document.getElementById("top").innerHTML = Shell.top(); };
document.addEventListener("click", ev => {
  if (App.state.topMore && !ev.target.closest(".top-right") && !ev.target.closest(".drawer")) { App.state.topMore = false; document.getElementById("top").innerHTML = Shell.top(); }
});
/* 换一批结果：记在本机，整页重读（两批的日历、版本、曝光缓存都不共用）。观测夜回到那一批的默认夜 */
App.acts.pickSource = id => {
  if (!Data.sources().some(s => s.id === id) || id === Data.sourceId) return;
  U.store.set("source", id);
  const r = App.state.route, keep = App.nightly() || ["year", "windows", "inputs"].includes(r);
  history.replaceState(null, "", "#" + (App.annualView() ? "year" : keep ? r : "tonight"));
  if (location.search) location.search = ""; else location.reload();
};
App.acts.pickWs = id => {
  const w = Data.list.find(item => item.id === id);
  if (!w) return;
  if (App.annualView() && !Data.replayView && w.origin !== "recent_replay") {
    Data.annualSelection = w.origin === "latest" ? null : id;
    App.set({drawer: null});
    const snapshot = Data.annualWorkspace();
    if (snapshot?.loaded) Data.enrich(snapshot);
    return;
  }
  Data.select(id);
  App.set({drawer: null});
  if (Data.isReplay(w) && !App.nightly()) App.go("tonight");
};
App.acts.chooseNight = (date, el) => {
  if (!U.isDay(date)) { if (el && "value" in el) el.value = Data.night(); return; }
  App.go(App.state.route + "/" + date);
};
// 日历翻月：只换日历这一块，菜单保持打开
App.acts.calMonth = (ym, el) => {
  const box = el?.closest(".ncal");
  if (box) box.outerHTML = Shell.calendar(ym);
};
// 点菜单以外的地方收起弹出的菜单（观测夜、图层）；点到的东西已被替换掉（翻月）时不算“外面”
document.addEventListener("click", event => {
  if (!event.target.isConnected) return;
  for (const menu of document.querySelectorAll("details.night-pick[open], details.wb-layer-menu[open]"))
    if (!menu.contains(event.target)) menu.open = false;
});
App.acts.nightVersion = id => {
  if (!Data.nightVersions().some(w => w.id === id)) return;
  Data.select(id);
  App.render();
};
App.acts.wbRecentReplay = () => {
  App.set({drawer:"data"});
  document.querySelector("[data-wb-recent-replay-group]")?.scrollIntoView({block:"start"});
};

/* 文件选择与拖放（抽屉每次重画后重新挂） */
document.addEventListener("change", async ev => {
  if (ev.target && (ev.target.id === "file-in" || ev.target.id === "dir-in") && ev.target.files.length) {
    const list = [...ev.target.files].filter(f => /\.json$/i.test(f.name) && !/(^|[\\/])(logs?|__pycache__)[\\/]/.test(f.webkitRelativePath || "") && f.size < 30e6);
    await Data.openFiles(list); App.render();
  }
});
["dragover", "dragenter"].forEach(t => document.addEventListener(t, ev => { const d = ev.target.closest && ev.target.closest("#drop"); if (d) { ev.preventDefault(); d.classList.add("over"); } }));
document.addEventListener("dragleave", ev => { const d = ev.target.closest && ev.target.closest("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", async ev => {
  const d = ev.target.closest && ev.target.closest("#drop");
  if (!d) return; ev.preventDefault();
  await Data.openFiles([...ev.dataTransfer.files]); App.render();
});

      <path d="${dots(P.md)}" style="stroke:var(--site-md);stroke-width:${(opts.dot || 1.4) * 1.5};stroke-linecap:round;fill:none"/>
      <polygon points="${poly(SITE_BG.outer)}" style="fill:none;stroke:var(--site-line);stroke-dasharray:3 3;stroke-width:.8"/>${ponds}</g>`;
    SiteBG.cache.set(key, out);
    return out;
  }
};

"use strict";
/* 当夜几何模型：优先用后端的可视化附件（viz），没有时页面近似计算并标注。 */
const TELS = [[1,-435,417,"A8"],[2,-279,419,"B8"],[3,-432,243,"C8"],[4,-325,294,"D8"],[5,11,367,"A8"],[6,205,290,"B8"],[7,-43,197,"C8"],[8,122,179,"D8"],[9,422,256,"A8"],[10,549,289,"B8"],[11,379,133,"C8"],[12,562,152,"D8"],[13,165,63,"A8"],[14,344,3,"B8"],[15,187,-171,"C8"],[16,343,-143,"D8"],[17,189,-414,"A8"],[18,344,-321,"B8"],[19,381,-440,"C8"],[20,283,-517,"D8"],[21,-175,-129,"A8"],[22,35,-146,"B8"],[23,-122,-265,"C8"],[24,5,-279,"D8"],[25,-276,-427,"A8"],[26,-160,-478,"B8"],[27,-332,-500,"C8"],[28,-219,-592,"D8"],[29,-587,-35,"A8"],[30,-510,21,"B8"],[31,-432,-87,"C8"],[32,-560,-160,"D8"]];
const TELS_EX = [[33,-227,78],[34,-203,259],[35,-95,432],[36,267,137]];

const Geom = {
  cache: new Map(),
  night(w){
    const T = w && w.tonight; if (!T) return null;
    const key = T.plan_id + "|" + (w.viz ? "v" : "a");
    if (Geom.cache.has(key)) return Geom.cache.get(key);
    const site = T.site || Data.site(w), viz = w.viz && w.viz.status !== "unavailable" ? w.viz : null;
    const dark = (T.dark_utc || []).map(U.ms);
    const evts = [].concat(T.visits || [], T.support || [], T.idle || []).flatMap(r => [U.ms(r.start_utc), U.ms(r.end_utc)]).filter(x => x != null);
    let a = Math.min(dark[0] != null ? dark[0] : Infinity, ...evts), b = Math.max(dark[1] != null ? dark[1] : -Infinity, ...evts);
    if (viz && viz.time_range_utc) { a = Math.min(a, U.ms(viz.time_range_utc[0])); b = Math.max(b, U.ms(viz.time_range_utc[1])); }
    if (!isFinite(a) || !isFinite(b)) return null;
    const HALF = 30 * 6e4; const x0 = Math.floor((a - 15 * 6e4) / HALF) * HALF, x1 = Math.ceil((b + 15 * 6e4) / HALF) * HALF;
    const tasks = Data.tasks(w);
    const tracks = {}; let approx = false;
    const step = 5 * 6e4;
    for (const t of tasks) {
      const vt = viz && (viz.source_tracks || []).find(s => s.task_id === t.id);
      if (vt && vt.samples && vt.samples.length) tracks[t.id] = vt.samples.map(s => ({t: U.ms(s.utc), z: s.zenith_deg, az: s.azimuth_deg})).filter(s => s.z != null);
      else if (U.fin(t.ra_deg) && U.fin(t.dec_deg)) {
        approx = true; const arr = [];
        for (let x = x0; x <= x1; x += step) { const h = Astro.altaz(t.ra_deg, t.dec_deg, x, site); arr.push({t: x, z: 90 - h.alt, az: h.az}); }
        tracks[t.id] = arr;
      }
    }
    // 月亮
    let moon = [], moonApprox = false;
    if (viz && (viz.sky_samples || []).length && viz.sky_samples[0].moon_alt_deg != null) {
      moon = viz.sky_samples.map(s => ({t: U.ms(s.utc), z: 90 - s.moon_alt_deg, az: s.moon_az_deg != null ? s.moon_az_deg : null, sunAlt: s.sun_alt_deg}));
      if (moon.some(m => m.az == null)) { moonApprox = true; moon.forEach(m => { if (m.az == null) m.az = Astro.moon(m.t, site).az; }); }
    } else {
      moonApprox = true;
      for (let x = x0; x <= x1; x += step) { const m = Astro.moon(x, site); moon.push({t: x, z: 90 - m.alt, az: m.az}); }
    }
    const sky0 = viz && viz.sky_samples && viz.sky_samples.find(s => s.moon_illumination != null);
    const illum = sky0 ? sky0.moon_illumination : Astro.illum((x0 + x1) / 2);
    const illumApprox = !sky0;
    // 访问段的轨迹
    const vtr = {};
    for (const v of T.visits || []) {
      const vv = viz && (viz.visit_tracks || []).find(x => x.visit_id === v.visit_id);
      let s = [];
      if (vv) s = (vv.samples && vv.samples.length ? vv.samples : (vv.segments || []).flatMap(g => g.samples || [])).map(p => ({t: U.ms(p.utc), z: p.zenith_deg, az: p.azimuth_deg}));
      if (!s.length && v.pointing && U.fin(v.pointing.ra_deg)) {
        const A = U.ms(v.start_utc), B = U.ms(v.end_utc);
        for (let x = A; x < B; x += 2 * 6e4) { const h = Astro.altaz(v.pointing.ra_deg, v.pointing.dec_deg, x, site); s.push({t: x, z: 90 - h.alt, az: h.az}); }
        const h = Astro.altaz(v.pointing.ra_deg, v.pointing.dec_deg, B, site); s.push({t: B, z: 90 - h.alt, az: h.az});
        if (!viz) approx = true;
      }
      vtr[v.visit_id] = s;
    }
    const m = {x0, x1, dark, site, tracks, moon, moonApprox, illum, illumApprox, vtr, approx, viz: !!viz,
      moonrise: null, moonset: null};
    for (let i = 1; i < moon.length; i++) {
      if (moon[i - 1].z >= 90 && moon[i].z < 90 && m.moonrise == null) m.moonrise = moon[i].t;
      if (moon[i - 1].z < 90 && moon[i].z >= 90 && m.moonset == null) m.moonset = moon[i].t;
    }
    m.moonUpAtStart = moon.length && moon[0].z < 90;
    Geom.cache.set(key, m);
    return m;
  },
  at(track, t){
    if (!track || !track.length) return null;
    if (t <= track[0].t) return track[0]; if (t >= track[track.length - 1].t) return track[track.length - 1];
    let lo = 0, hi = track.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (track[mid].t <= t) lo = mid; else hi = mid; }
    const p = track[lo], q = track[hi], f = (t - p.t) / (q.t - p.t || 1);
    let daz = q.az - p.az; if (daz > 180) daz -= 360; if (daz < -180) daz += 360;
    return {t, z: p.z + (q.z - p.z) * f, az: ((p.az + daz * f) % 360 + 360) % 360};
  }
};

/* ==== 41-tonight.js ==== */
"use strict";
/* 当夜：今晚看哪些源、怎样看。时间轴（天顶角 + 五条组道）+ 此刻天空 / 阵列 / 指向 + 进度。 */
const TN = {
  view(w = Data.ws()){
    const parent = w?.tonight;
    const date = Data.night();
    if (parent && date === parent.night_local_date) return {date, doc: parent, kind: "tonight"};
    const doc = Object.values(w?.previews || {}).find(p => p.night_local_date === date && p.preview_of === parent?.plan_id);
    if (doc) return {date, doc, kind: "preview"};
    if (date && w?.near?.inputs?.near_lower?.dates?.includes(date)) return {date, kind: "near_term"};
    return {date, kind: "missing"};
  },
  st(){
    const w = Data.ws(), view = TN.view(w), id = view.doc?.plan_id || w?.id + "/" + view.date;
    const key = view.kind === "tonight" ? "tn" : "tnForecast";
    if (!App.state[key] || App.state[key].id !== id) App.state[key] = {id, sel:null, focus:null, t:null, tab:"sky"};
    return App.state[key];
  },
  model(w, view = TN.view(w)){
    if (!view.doc) return null;
    const source = view.kind === "preview" ? {...w, tonight: view.doc, viz: null} : w;
    const model = Geom.night(source);
    if (model) return model;
    const bounds = WBPolicy.display() && WBPolicy.bounds(view.date);
    if (!bounds) return null;
    return {x0:bounds[0], x1:bounds[1], dark:[], site:view.doc.site || Data.site(w), tracks:{}, vtr:{}, moon:[]};
  },
  zenith(T){ return T.inputs?.parameters?.max_zenith_deg ?? WBPolicy.get("max_zenith"); },
  zy(z){ return 6 + U.clamp(z, 0, 90) / 90 * 218; },
  x(m, t){ return (t - m.x0) / (m.x1 - m.x0) * 1000; },
  pct(m, t){ return U.clamp((t - m.x0) / (m.x1 - m.x0) * 100, 0, 100); },
  // 告警任务：从告警到达（第一条通知到达）起才画；常规源返回 null
  arrivalOf(w, t){ return Data.isAlertTask(t) ? Data.alertArrival(t.id, w) : null; },
  since(w, t, track){ const a = TN.arrivalOf(w, t); return a == null ? (track || []) : (track || []).filter(p => p.t >= a); },
  path(m, pts){
    let d = "", pen = false;
    for (const p of pts) {
      if (p.z == null || p.z > 90) { pen = false; continue; }
      d += (pen ? "L" : "M") + TN.x(m, p.t).toFixed(1) + " " + TN.zy(p.z).toFixed(1); pen = true;
    }
    return d;
  },
  visitsAt(T, t){ return (T.visits || []).filter(v => U.ms(v.start_utc) <= t && t < U.ms(v.end_utc)); },
  defaultT(m, T){
    const now = Date.now();
    if (now > m.x0 && now < m.x1) return now;
    const v = (T.visits || [])[0];
    return v ? (U.ms(v.start_utc) + U.ms(v.end_utc)) / 2 : (m.x0 + m.x1) / 2;
  },
  /* 延展源逐 run 场 id，优先采用后端的物理场。 */
  runField(v, r){
    if (r?.field_id || (!r?.target_id && v.field_id)) return r?.field_id || v.field_id;
    const target = r?.target_id || r?.pointing?.normalization?.id || v.target_id || "";
    const field = String(target).includes(":") ? String(target).split(":").slice(1).join(":") : target;
    return v.schedule_target_id || Data.task(v.task_id)?.fields?.some(f => String(f.id) === field) ? field : "";
  },
  /* 超额填充：某源今晚计划量超出它批准余量的部分（progress 里 planned_tonight_credit − planned_tonight_capped_credit），
     即保底、需求都排满后，求解器最后一层（over-target）用剩下的暗时间继续给它的量。
     求解器不区分是哪一段超额（信用可互换），页面按时间先后，把这个源最后的那部分记为超额。
     返回 visit_id → {frac 这段里超额的比例, credit 超额 F32 分钟, total 这个源今晚超额合计} */
  overShare(T){
    const out = new Map();
    for (const p of T?.progress || []) {
      const over = p.planned_tonight_credit - p.planned_tonight_capped_credit;
      if (!U.fin(over) || over < .05) continue;
      let rest = over;
      const vs = (T.visits || []).filter(v => String(v.task_id).split(":")[0] === p.task_id && U.fin(v.expected?.credit_f32) && v.expected.credit_f32 > 0)
        .sort(U.by(v => -U.ms(v.start_utc)));
      for (const v of vs) {
        if (rest <= 1e-9) break;
        const c = v.expected.credit_f32, x = Math.min(c, rest);
        out.set(v.visit_id, {frac: x / c, credit: x, total: over});
        rest -= x;
      }
    }
    return out;
  },
  /* 超额那一截：源色变浅（不带斜纹），顶上一道源色点线（只盖右端 frac 那么宽）。
     斜纹只留给“计划了但没执行”的两种：天气停观（灰斜纹）、被告警替代的原计划（源色斜纹）（11-24） */
  overBg(color, frac, dots = true){
    const f = (U.clamp(frac, 0, 1) * 100).toFixed(1) + "%";
    return `${dots ? `repeating-linear-gradient(90deg,${color} 0 3px,transparent 3px 6px) right top/${f} 2px no-repeat,` : ""}linear-gradient(var(--over-veil),var(--over-veil)) right/${f} 100% no-repeat,${color}`;
  },
  runFields(v){ return U.uniq((v.runs && v.runs.length ? v.runs : [null]).map(r => TN.runField(v, r)).filter(Boolean)); },
  plan(w){
    const s = TN.st(), {doc, kind} = TN.view(w);
    return !Data.isReplay(w) && kind === "tonight" && s.mode === "edit" && s.draft
      ? Object.assign({}, doc, {visits: s.draft.visits, support: s.draft.support}) : doc;
  },
  vtrack(m, v, w){
    const A = U.ms(v.start_utc), B = U.ms(v.end_utc), base = m.vtr[v.visit_id] || [];
    if (base.length && base[0].t <= A + 6e4 && base[base.length - 1].t >= B - 6e4) return base.filter(p => p.t >= A - 1 && p.t <= B + 1);
    const p = v.pointing; if (!p || !U.fin(p.ra_deg)) return [];
    const key = [v.visit_id, A, B, p.ra_deg, p.dec_deg, m.site.lat_deg, m.site.lon_deg].join("|");
    TN._vt = TN._vt || new Map();
    if (TN._vt.has(key)) return TN._vt.get(key);
    const out = []; for (let x = A; x < B; x += 2 * 6e4) { const h = Astro.altaz(p.ra_deg, p.dec_deg, x, m.site); out.push({t: x, z: 90 - h.alt, az: h.az}); }
    const h = Astro.altaz(p.ra_deg, p.dec_deg, B, m.site); out.push({t: B, z: 90 - h.alt, az: h.az});
    TN._vt.set(key, out); return out;
  },
  wall(list){ // 时间并集（分钟）
    const iv = list.map(r => [U.ms(r.start_utc), U.ms(r.end_utc)]).filter(r => r[0] != null).sort((a, b) => a[0] - b[0]);
    let tot = 0, cs = null, ce = null;
    for (const [s, e] of iv) { if (cs == null || s > ce) { if (cs != null) tot += ce - cs; cs = s; ce = e; } else ce = Math.max(ce, e); }
    if (cs != null) tot += ce - cs;
    return tot / 6e4;
  }
};

          <p class="note">细线是源的天顶角，粗线是计划访问，斜线块是转向、等待和拆合阵。${TN.overShare(T).size ? `色块变浅、顶上带点线<i class="key over-key" aria-hidden="true"></i>的部分是<b>超额填充</b>：这个源批准量已排满后，用剩下的暗时间多给的部分（${[...(T.progress || [])].filter(p => p.planned_tonight_credit - p.planned_tonight_capped_credit >= .05).map(p => U.esc(Data.name(p.task_id, w)) + " " + U.n(p.planned_tonight_credit - p.planned_tonight_capped_credit, 1)).join("、")} F32 分钟；按时间先后算在最后）。` : "今晚没有超额填充，各段都在批准量以内。"}${m.approx ? "轨迹由页面近似画出。" : ""}</p>
          ${order.length ? `<section class="tn-sources" aria-label="该夜各源">
            ${cards.length ? `<div class="cards">${cards.join("")}</div>` : ""}
            ${unplanned.length ? `<div class="tn-unplanned"><span class="small muted">未排</span>${unplanned.join("")}</div>` : ""}
          </section>` : ""}
          ${TForecast.render(w, view.date, m, T.night_local_date)}
        </section>
        <div class="stack side">
        <aside class="card" aria-label="此刻">
          <div class="seg full" role="tablist">${[["sky", "天空"], ["array", "阵列"], ["point", "指向"]].map(([k, l]) => `<button role="tab" data-act="tnTab" data-arg="${k}" aria-selected="${s.tab === k}">${l}</button>`).join("")}</div>
          <div data-part="side">${App.screens.tonight.parts.side()}</div>
        </aside>
        <section class="card" aria-labelledby="sv-h">
          <div class="card-h"><h2 id="sv-h">${preview ? "这夜预览" : "本夜计划"}</h2>${preview ? `<span class="small muted">${T.audit?.passed === true ? "当夜合法性独审通过" : "独审未提供"}</span>` : '<a href="#audit" class="small">审核详情 →</a>'}</div>
          ${App.screens.tonight.summary(w, T, sup)}
        </section>
        </div>
      </div>
      ${editing ? TE.card(w, T0, T, m, s) : ""}
      ${replay?"":TForecast.fillers(w, "night", view.date, T.plan_id)}
      <section class="card" style="margin-top:20px" aria-labelledby="pg-h">
        <div class="card-h"><h2 id="pg-h">各源进度</h2><span class="small muted">分钟为 F32 当量科学量 · 点行看源详情</span></div>
        ${App.screens.tonight.progress(w, T)}
      </section>`;
  },

  timeline(w, T, m, s){
    const tasks = Data.tasks(w), preview = T.kind === "preview";
    const editing = !Data.isReplay(w) && !preview && s.mode === "edit", chk = editing ? TE.check(w, T, m) : null;
    const zmax = TN.zenith(T);
    const focus = s.focus;
    const lines = tasks.map(t => {
      const d = TN.path(m, TN.since(w, t, m.tracks[t.id])); if (!d) return "";
      const op = focus && focus !== t.id ? .18 : .75;
      return `<path d="${d}" style="stroke:${t.color};stroke-width:1.2;stroke-dasharray:5 4;opacity:${op};vector-effect:non-scaling-stroke;fill:none"/>`;
    }).join("");
    const segs = (T.visits || []).map(v => {
      const d = TN.path(m, TN.vtrack(m, v, w)); if (!d) return "";
      const c = Data.color(v.task_id, w), on = s.sel === v.visit_id;
      const op = focus && focus !== String(v.task_id).split(":")[0] ? .2 : 1;
      return `<path d="${d}" style="stroke:${c};stroke-width:${on ? 7 : 4};stroke-linecap:round;opacity:${op};vector-effect:non-scaling-stroke;fill:none"/>`;
    }).join("");
    const moonD = TN.path(m, m.moon);
    // 标签：每个源在最高点附近
    const labels = tasks.map(t => {
      const tr = TN.since(w, t, m.tracks[t.id]).filter(p => p.t >= m.x0 && p.t <= m.x1);
      if (!tr.length) return "";
      const best = tr.reduce((a, p) => p.z < a.z ? p : a, tr[0]);
      if (best.z > 85) return "";
      const op = focus && focus !== t.id ? .3 : 1;
      return `<span style="position:absolute;left:${U.clamp(TN.pct(m, best.t), 3, 95)}%;top:${Math.max(0, TN.zy(best.z) - 17)}px;transform:translateX(-50%);font-size:11px;font-weight:600;color:${t.color};opacity:${op};white-space:nowrap;pointer-events:none">${U.esc(t.name || t.id)}</span>`;
    }).join("");
    const mz = m.moon.filter(p => p.z < 88);
    const moonLbl = mz.length ? `<span style="position:absolute;left:${U.clamp(TN.pct(m, mz[Math.floor(mz.length / 2)].t), 3, 95)}%;top:${TN.zy(mz[Math.floor(mz.length / 2)].z) + 4}px;font-size:11px;color:var(--moonline);white-space:nowrap">月亮</span>` : "";
    const nd0 = m.dark[0] != null ? TN.x(m, m.dark[0]) : 0, nd1 = m.dark[1] != null ? TN.x(m, m.dark[1]) : 1000;
    const overs = TN.overShare(T);
    const weather = ReplayToo.weatherLosses(w, T);
    const lanes = GROUPS.map(g => {
      const vs = (T.visits || []).filter(v => v.group === g);
      const ss = (T.support || []).filter(r => r.group === g || (g === "F32" && r.group === "all"));
      const sub = g === "F32" ? "全阵 32 台" : "8 台组";
      const blocks = ss.map(r => {
        const l = TN.pct(m, U.ms(r.start_utc)), wd = Math.max(.25, TN.pct(m, U.ms(r.end_utc)) - l);
        return `<div class="blk sup" style="left:${l}%;width:${wd}%" title="${U.esc((r.kind || "") + " " + U.span(r.start_utc, r.end_utc) + " " + (r.reason || ""))}"></div>`;
      }).join("") + vs.map(v => {
        const l = TN.pct(m, U.ms(v.start_utc)), wd = Math.max(.3, TN.pct(m, U.ms(v.end_utc)) - l);
        const c = Data.color(v.task_id, w), base = String(v.task_id).split(":")[0];
        const dim = focus && focus !== base ? " dim" : "", on = s.sel === v.visit_id ? " on" : "";
        // 色块只写源名；延展源的场 id 放在悬停和详情里（拼接逐 run 换场时也是一个块）
        const t0 = Data.task(base, w), nm = t0 ? t0.name || t0.id : base;
        // 放得下整名才写（约 0.85% 时间轴宽一个西文字符，中文算两个），否则留空，不出现“Gemin”这种截断
        const label = wd > 1.5 + 0.85 * [...String(nm)].reduce((a, ch) => a + (ch.charCodeAt(0) > 255 ? 2 : 1), 0) ? nm : "";
        const fields = TN.runFields(v);
        const ov = overs.get(v.visit_id);
        const tip = `${Data.name(base, w)}${fields.length ? " · 场 " + fields.join("、") : ""} · ${v.group} · ${U.span(v.start_utc, v.end_utc)} · ${U.n(U.mins(v.start_utc, v.end_utc))} min${(v.runs || []).length > 1 ? " · " + v.runs.length + " 个 run" : ""}` +
          (ov ? ` · ${ov.frac > .995 ? "整段" : "后 " + U.n(ov.credit, 1) + " F32 分钟"}是超额填充（已超出批准量）` : "");
        const A0 = U.ms(v.start_utc), B0 = U.ms(v.end_utc);
        const ticks = (v.runs || []).slice(1).map(r => `<i style="position:absolute;top:0;bottom:0;left:${(U.ms(r.start_utc) - A0) / (B0 - A0) * 100}%;width:1px;background:rgba(255,255,255,.75)"></i>`).join("");
        const lost = weather.filter(r => r.visit_id === v.visit_id && r.group === g
          && U.ms(r.start_utc) >= A0 && U.ms(r.end_utc) <= B0 && U.ms(r.start_utc) < U.ms(r.end_utc));
        const closures = lost.map(r => {
          const a = U.ms(r.start_utc), b = U.ms(r.end_utc);
          return `<span class="blk replay-ghost wx replay-weather-piece" data-replay-original-on data-replay-weather-loss
            data-task="${U.esc(v.task_id)}" data-start="${U.esc(r.start_utc)}" data-end="${U.esc(r.end_utc)}"
            title="${U.esc(Data.name(base, w) + " · " + U.span(r.start_utc, r.end_utc) + " · 计划了、因天气未观测")}"
            style="left:${(a - A0) / (B0 - A0) * 100}%;width:${(b - a) / (B0 - A0) * 100}%;--source-color:${c}"></span>`;
        }).join("");
        const fz = editing && TE.frozen(v), bad = chk && chk.conflictIds.has(v.visit_id), wrn = chk && chk.warnIds.has(v.visit_id);
        const cls = (editing ? (fz ? " frozen" : " edit") : "") + (bad ? " conflict" : wrn ? " warned" : "");
        return `<button class="blk${dim}${on}${cls}${ov ? " over" : ""}" style="left:${l}%;width:${wd}%;background:${ov ? TN.overBg(c, ov.frac) : c}" data-act="tnSel" data-arg="${U.esc(v.visit_id)}" data-vid="${U.esc(v.visit_id)}" title="${U.esc(tip + (fz ? " · 已开始，不能改" : ""))}" aria-label="${U.esc(tip + (lost.length ? " · 有天气停观" : ""))}">${ticks}${closures}<span class="${lost.length ? "replay-weather-label" : ""}" style="position:relative">${U.esc(label)}</span></button>`;
      }).join("") + (editing ? TE.ghosts(w, T, m, g) : "");
      return `<div class="lbl"><b>${g}</b><div>${sub}</div></div><div class="lane${editing ? " editing" : ""}"${editing ? ` data-act="tnLane" data-arg="${g}"` : ""}>${ReplayToo.ghosts(w, T, m, g)}${blocks}</div>`;
    }).join("");
    const ticks = []; for (let t = m.x0; t <= m.x1; t += 3600e3) ticks.push(t);
    const total = Math.round((m.x1 - m.x0) / 6e4);
    return `<div class="scroll-x" data-timeline="${preview ? "preview" : "tonight"}"${preview ? ' style="border:1px dashed var(--axis);border-radius:8px;padding:6px"' : ""}><div style="min-width:720px;position:relative">
      <div class="lanes">
        <div style="position:relative;height:230px;font-size:11px;color:var(--muted);text-align:right">
          ${[0, 30, 60, 90].map(z => `<span style="position:absolute;right:0;top:${TN.zy(z) - 8}px">${z}°</span>`).join("")}
        </div>
        <div style="position:relative;height:230px">
          <svg viewBox="0 0 1000 230" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%">
            ${U.fin(zmax) ? `<rect x="0" y="${TN.zy(zmax)}" width="1000" height="${230 - TN.zy(zmax)}" style="fill:var(--zonex)"/>` : ""}
            <rect x="0" y="0" width="${Math.max(0, nd0)}" height="230" style="fill:var(--twilight);opacity:.55"/>
            <rect x="${nd1}" y="0" width="${Math.max(0, 1000 - nd1)}" height="230" style="fill:var(--twilight);opacity:.55"/>
            <path d="M0 ${TN.zy(30)}H1000" style="stroke:var(--rule);vector-effect:non-scaling-stroke"/>
            <path d="M0 ${TN.zy(60)}H1000" style="stroke:var(--rule);vector-effect:non-scaling-stroke"/>
            ${U.fin(zmax) ? `<path d="M0 ${TN.zy(zmax)}H1000" style="stroke:var(--axis);stroke-dasharray:4 4;vector-effect:non-scaling-stroke"/>` : ""}
            <path d="${moonD}" style="stroke:var(--moonline);stroke-width:1.2;stroke-dasharray:2 4;vector-effect:non-scaling-stroke;fill:none"/>
            ${lines}${segs}
          </svg>
          ${U.fin(zmax) ? `<span style="position:absolute;right:6px;top:${TN.zy(zmax) - 16}px" class="tiny muted">天顶角总上限 ${U.n(zmax, 1)}°</span>` : ""}
          ${labels}${moonLbl}
        </div>
        ${lanes}
        <div></div>
        <div style="position:relative;height:16px" class="tiny muted num">${ticks.map((t, k) => `<span${k % 2 ? ' class="tick-odd"' : ""} style="position:absolute;left:${TN.pct(m, t)}%;transform:translateX(${TN.pct(m, t) > 97 ? "-100%" : TN.pct(m, t) < 2 ? "0" : "-50%"})">${U.hm(t)}</span>`).join("")}</div>
        <label for="tn-t" class="small ink2" style="text-align:right">时刻</label>
        <div style="display:flex;align-items:center;gap:12px"><input id="tn-t" type="range" min="0" max="${total}" step="1" value="${Math.round((s.t - m.x0) / 6e4)}" data-input="tnT"><b class="num" data-part="tlabel" style="min-width:44px">${U.hm(s.t)}</b></div>
      </div>
      <div data-part="cursor" aria-hidden="true" style="position:absolute;top:0;bottom:44px;left:70px;right:0;pointer-events:none">${App.screens.tonight.parts.cursor()}</div>
    </div></div>`;
  },

  parts: {
    tlabel(){ return U.hm(TN.st().t); },
    cursor(){
      const w = Data.ws(), m = TN.model(w), s = TN.st(); if (!m) return "";
      const p = TN.pct(m, s.t), now = Date.now();
      const nowLine = now > m.x0 && now < m.x1 ? `<div style="position:absolute;top:0;bottom:0;left:0;width:${TN.pct(m, now)}%;background:var(--ground);opacity:.45"></div><div style="position:absolute;top:0;bottom:0;left:${TN.pct(m, now)}%;width:1.5px;background:var(--accent)"></div><span style="position:absolute;top:-2px;left:${TN.pct(m, now)}%;margin-left:5px;font-size:11px;font-weight:600;color:var(--accent)">现在 ${U.hm(now)}</span>` : "";
      return nowLine + `<div style="position:absolute;top:0;bottom:0;left:${p}%;border-left:1.5px dashed var(--ink)"></div>`;
    },
    side(){
      const w = Data.ws(), T = TN.plan(w), m = TN.model(w), s = TN.st();
      const body = s.tab === "array" ? App.screens.tonight.arrayView(w, T, m, s) : s.tab === "point" ? App.screens.tonight.pointView(w, T, m, s) : App.screens.tonight.skyView(w, T, m, s);
      return body + (!Data.isReplay(w) && s.mode === "edit" ? TE.editor(w, T, m, s) : App.screens.tonight.detail(w, T, m, s));
    }
  },

  skyView(w, T, m, s){
    const R = 128, C = 150, pos = (z, az) => { const r = z / 90 * R, a = az * Math.PI / 180; return [C - r * Math.sin(a), C - r * Math.cos(a)]; }; // 北上东左
    const zmax = TN.zenith(T);
    const active = TN.visitsAt(T, s.t);
    // 标签避让：依次试右、左、上、下，避开已放的标签（地平线附近的源常常挤在一起）
    const placed = [], tw = str => [...String(str)].reduce((a, c) => a + (c.charCodeAt(0) > 255 ? 11 : 6.2), 0);
    const hit = (x, y, wd) => placed.some(q => x < q.x + q.w && x + wd > q.x && y - 11 < q.y && y > q.y - 11) || x < 0 || x + wd > 300;
    // 告警到达之前，天空图上不画这个告警源
    const pts = Data.tasks(w).filter(t => !(TN.arrivalOf(w, t) > s.t)).map(t => { const p = Geom.at(m.tracks[t.id], s.t); return p && p.z < 90 ? {t, p, xy: pos(p.z, p.az), on: active.some(v => String(v.task_id).split(":")[0] === t.id)} : null; }).filter(Boolean)
      .sort(U.by(o => o.on ? 0 : 1));
    for (const o of pts) placed.push({x: o.xy[0] - 6, y: o.xy[1] + 6, w: 12});
    const dots = pts.map(({t, p, xy: [x, y], on}) => {
      const r = on ? 7 : 4.5, label = t.name || t.id, wd = tw(label);
      const cand = [[x + r + 3, y + 4], [x - r - 3 - wd, y + 4], [x - wd / 2, y - r - 3], [x - wd / 2, y + r + 12], [x + r + 3, y - 8], [x + r + 3, y + 16], [x - r - 3 - wd, y - 8], [x - r - 3 - wd, y + 16]];
      const [lx, ly] = cand.find(([cx, cy]) => !hit(cx, cy, wd)) || cand[0];
      placed.push({x: lx, y: ly, w: wd});
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" style="fill:${on ? t.color : "var(--card)"};stroke:${t.color};stroke-width:${on ? 2 : 1.6}"><title>${U.esc(label + " · 天顶角 " + U.n(p.z, 1) + "° · 方位 " + U.n(p.az, 0) + "°" + (on ? " · 正在观测" : ""))}</title></circle>
        <text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" style="font-size:11px;fill:${t.color};font-weight:${on ? 700 : 500}">${U.esc(label)}</text>`;
    }).join("");
    const mp = Geom.at(m.moon, s.t);
    const moon = mp && mp.z < 90 ? (() => { const [x, y] = pos(mp.z, mp.az); return `<circle cx="${x}" cy="${y}" r="8" style="fill:var(--moonfill);stroke:var(--moonline)"><title>月亮 · 天顶角 ${U.n(mp.z, 0)}°</title></circle><circle cx="${x}" cy="${y}" r="${40 / 90 * R}" style="fill:none;stroke:var(--moonline);stroke-dasharray:2 3;opacity:.7"/>`; })() : "";
    const below = Data.tasks(w).filter(t => !(TN.arrivalOf(w, t) > s.t)).filter(t => { const p = Geom.at(m.tracks[t.id], s.t); return !p || p.z >= 90; }).map(t => t.name || t.id);
    const starLayer = TNStars.on.sky ? TNStars.skyLayer(s.t, pos) : null;
    return `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:14px 0 4px"><b>${U.hm(s.t)} 的天空</b><span class="tn-head-r"><span class="tiny muted">天顶居中 · 北上东左</span>${TNStars.chip("sky")}</span></div>
      <svg viewBox="0 0 300 300" role="img" aria-label="${U.hm(s.t)} 各源在天空中的位置" style="display:block;width:100%;max-width:320px;margin:0 auto">
        <circle cx="${C}" cy="${C}" r="${R}" style="fill:var(--zonex)"/>
        ${U.fin(zmax) ? `<circle cx="${C}" cy="${C}" r="${zmax / 90 * R}" style="fill:var(--card);stroke:var(--axis);stroke-dasharray:4 4"/>` : ""}
        <circle cx="${C}" cy="${C}" r="${R}" style="fill:none;stroke:var(--border2)"/>
        <path d="M${C - R} ${C}H${C + R}M${C} ${C - R}V${C + R}" style="stroke:var(--rule)"/>
        <text x="${C - 5}" y="14" class="axl">北</text><text x="${C - 5}" y="296" class="axl">南</text><text x="2" y="${C + 4}" class="axl">东</text><text x="286" y="${C + 4}" class="axl">西</text>
        ${U.fin(zmax) ? `<text x="${C + 3}" y="${C - zmax / 90 * R + 11}" class="axl" style="font-size:9px">${U.n(zmax, 1)}°</text>` : ""}
        ${starLayer?.svg || ""}${moon}${dots}
      </svg>
      <p class="note" style="text-align:center;margin-top:4px">实心：正在观测；空心：在天上未观测。虚线圈：离月 40°。${starLayer ? starLayer.note : ""}${below.length ? "<br>地平线下：" + U.esc(below.join("、")) : ""}</p>`;
  },

  arrayView(w, T, m, s){
    const active = TN.visitsAt(T, s.t);
    const grpOf = {}; // 台号 -> 访问
    for (const v of active) for (const id of v.members || []) grpOf[id] = v;
    const xs = TELS.map(t => t[1]), ys = TELS.map(t => t[2]);
    const E = SiteBG.extent, minX = Math.min(-E, ...xs) , maxX = Math.max(E, ...xs), minY = Math.min(-E, ...ys), maxY = Math.max(E, ...ys);
    const W = 340, H = 330, sc = Math.min((W - 20) / (maxX - minX), (H - 30) / (maxY - minY));
    const px = e => 10 + (e - minX) * sc, py = n => 10 + (maxY - n) * sc;
    const dots = TELS.map(([id, e, n, g]) => {
      const v = grpOf[id], c = v ? Data.color(v.task_id, w) : null;
      const tip = `${id} 号 · ${g}` + (v ? " · " + Data.name(v.target_id || v.task_id, w) + (v.group === "F32" ? "（F32）" : "") : " · 空闲");
      return `<circle cx="${px(e).toFixed(1)}" cy="${py(n).toFixed(1)}" r="7" style="fill:${c || "var(--card)"};stroke:${c || "var(--axis)"};stroke-width:1.5"><title>${U.esc(tip)}</title></circle><text x="${px(e).toFixed(1)}" y="${(py(n) - 10).toFixed(1)}" text-anchor="middle" style="font-size:8.5px;fill:var(--muted)">${id}</text><text x="${px(e).toFixed(1)}" y="${(py(n) + 3).toFixed(1)}" text-anchor="middle" style="font-size:8px;font-weight:700;fill:${c ? "#fff" : "var(--muted)"};pointer-events:none">${g[0]}</text>`;
    }).join("") + TELS_EX.map(([id, e, n]) => `<circle cx="${px(e)}" cy="${py(n)}" r="7" style="fill:none;stroke:var(--axis);stroke-dasharray:2 2"><title>${id} 号 · 不在当前阵列</title></circle>`).join("");
    const bar = 250 * sc;
    const rows = GROUPS.map(g => {
      const v = active.find(x => x.group === g);
      if (g === "F32" && !v) return "";
      if (g !== "F32" && active.some(x => x.group === "F32")) return "";
      const c = v ? Data.color(v.task_id, w) : "var(--axis)";
      return `<b>${g}</b><span class="ink2"><i class="dot" style="background:${c}"></i>${v ? U.esc(Data.name(v.target_id || v.task_id, w)) + " · " + U.span(v.start_utc, v.end_utc) : "空闲"}</span>`;
    }).join("");
    return `<div style="display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 4px"><b>${U.hm(s.t)} 的地面阵列</b><span class="tiny muted">${active.some(v => v.group === "F32") ? "全阵 F32" : active.length ? "拆成 8 台组" : "无观测"}</span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="阵列各望远镜此刻在看什么" style="display:block;width:100%;max-width:360px;margin:0 auto">
        ${SiteBG.svg(px, py, {dot: 1.1})}${dots}
        <path d="M${W - 20 - bar} ${H - 12}h${bar}M${W - 20 - bar} ${H - 16}v8M${W - 20} ${H - 16}v8" style="stroke:var(--faint);fill:none"/>
        <text x="${W - 20 - bar / 2}" y="${H - 18}" text-anchor="middle" style="font-size:10px;fill:var(--muted)">250 m</text>
        <path d="M${W - 12} 34V14M${W - 16} 20L${W - 12} 13L${W - 8} 20" style="stroke:var(--faint);fill:none"/><text x="${W - 16}" y="46" style="font-size:10px;fill:var(--muted)">北</text>
      </svg>
      <div style="display:grid;grid-template-columns:40px minmax(0,1fr);gap:5px 10px;font-size:12.5px;margin-top:6px">${rows}</div>
      <p class="note">圆点里的字母是所属 8 台组；颜色是正在看的源，空心为空闲；虚线圈是建设中的 33—36 号。浅色底图是 LHAASO 的 KM2A 探测器和 WCDA 水池。</p>`;
  },

  pointView(w, T, m, s){
    const rows = [];
    for (const v of T.visits || []) for (const r of (v.runs && v.runs.length ? v.runs : [v])) rows.push({v, r});
    rows.sort(U.by(x => U.ms(x.r.start_utc)));
    const body = rows.map(({v, r}) => {
      const p = r.pointing || v.pointing || {}, wb = p.wobble || {};
      const now = U.ms(r.start_utc) <= s.t && s.t < U.ms(r.end_utc);
      return `<tr class="click${now || s.sel === v.visit_id ? " sel" : ""}" data-act="tnSel" data-arg="${U.esc(v.visit_id)}">
        <td class="num">${U.span(r.start_utc, r.end_utc)}</td><td>${v.group}</td>
        <td><i class="dot" style="background:${Data.color(v.task_id, w)}"></i>${U.esc(Data.name(v.target_id || v.task_id, w))}</td>
        <td class="n">${U.n(p.ra_deg, 3)}</td><td class="n">${U.n(p.dec_deg, 3)}</td>
        <td class="n">${wb.offset_deg != null ? U.n(wb.offset_deg, 1) + "° / " + U.n(wb.pa_deg, 0) + "°" : "—"}</td>
        <td class="mono tiny">${U.esc(r.run_id || v.run_id || "—")}</td></tr>`;
    }).join("");
    return App.screens.tonight.pointMap(w, T, m, s) + `<div style="display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 6px"><b>指向表</b><span class="tiny muted">ICRS · 北京时间</span></div>
      <div class="scroll-x" style="max-height:360px;overflow-y:auto"><table class="t" style="font-size:12px"><thead><tr><th>时间</th><th>组</th><th>源</th><th class="n">赤经</th><th class="n">赤纬</th><th class="n">wobble</th><th>run</th></tr></thead><tbody>${body}</tbody></table></div>`;
  },

  /* 指向图：以源为中心的天球切面（东左北上），画今晚每个指向的相机视场、wobble 位置、分场和邻源排除区 */
  pointMap(w, T, m, s){
    const visits = T.visits || [], base = v => String(v.task_id).split(":")[0];
    const tids = U.uniq(visits.slice().sort(U.by(v => U.ms(v.start_utc))).map(base));
    if (!tids.length) return "";
    const active = TN.visitsAt(T, s.t);
    const tid = s.pt && tids.includes(s.pt) ? s.pt : (active[0] ? base(active[0]) : tids[0]);
    const t = Data.task(tid, w) || {}, vs = visits.filter(v => base(v) === tid).sort(U.by(v => U.ms(v.start_utc)));
    const src0 = (vs[0].pointing && vs[0].pointing.source_icrs) || {};
    const ra0 = U.fin(t.ra_deg) ? t.ra_deg : src0.ra_deg, dec0 = U.fin(t.dec_deg) ? t.dec_deg : src0.dec_deg;
    const cam = T.kind !== "preview" && w.viz?.camera;
    const fov = cam?.fov_radius_deg ?? WBPolicy.get("camera")?.fov_radius_deg;
    const eff = cam?.effective_radius_deg ?? WBPolicy.get("offaxis_kernels")?.tophat_2?.radius_deg;
    // 告警铺场的场：虚线圆画铺场实际用的覆盖半径（结果里的 localization_selection.radius_deg），和告警页同一个；相机视场浅画
    const alertT = Data.isAlertTask(t);
    const locInfo = alertT ? [T.alert, ...Object.values(T.alert_history || {})]
      .filter(info => info?.task_id === tid && info.localization_selection?.visits?.length)
      .sort(U.by(info => -(U.ms(info.decision?.assessed_utc || info.contract?.arrival_utc) || 0)))[0] : null;
    const loc = locInfo?.localization_selection || (alertT ? Data.alertFacts(tid, w)?.loc : null);
    const tileR = alertT ? (U.fin(loc?.radius_deg) ? loc.radius_deg : null) : undefined;
    const ring = alertT ? tileR : eff;
    const R = Math.PI / 180, proj = (ra, dec) => [-(((ra - ra0 + 540) % 360) - 180) * Math.cos(dec0 * R), dec - dec0];
    const pts = new Map(); let excl = [];
    for (const v of vs) for (const r of (v.runs && v.runs.length ? v.runs : [v])) {
      const p = r.pointing || v.pointing; if (!p || !U.fin(p.ra_deg)) continue;
      const key = p.ra_deg.toFixed(3) + "," + p.dec_deg.toFixed(3);
      const o = pts.get(key) || {p, runs: [], groups: new Set(), now: false};
      o.runs.push(r); o.groups.add(v.group); if (U.ms(r.start_utc) <= s.t && s.t < U.ms(r.end_utc)) o.now = true;
      pts.set(key, o);
      if (!excl.length && Array.isArray(p.exclusions_icrs)) excl = p.exclusions_icrs;
    }
    const P = [...pts.values()].map(o => Object.assign(o, {xy: proj(o.p.ra_deg, o.p.dec_deg)}));
    let E = 1;
    // 告警铺场按铺场覆盖圆定比例（和告警页一样看得清各场），相机视场浅画、可以出图边
    const padding = alertT && U.fin(tileR) ? tileR : U.fin(fov) ? fov : 0;
    for (const o of P) E = Math.max(E, Math.abs(o.xy[0]) + padding + .3, Math.abs(o.xy[1]) + padding + .3);
    if (t.radius_deg > 0) E = Math.max(E, t.radius_deg + .5);
    // proj 的 x 已是 −Δα·cosδ（东为负），屏幕上 x 小在左，所以直接加：东在左、北在上
    const S = 300, C = 150, k = 138 / E, X = x => C + x * k, Y = y => C - y * k;
    const c = t.color || Data.color(tid, w);
    const step = E > 8 ? 2 : 1, grid = [];
    for (let g = -Math.floor(E / step) * step; g <= E; g += step) grid.push(`M${X(g)} 0V${S}M0 ${Y(g)}H${S}`);
    const ex = excl.map(([ra, dec, r]) => { const [x, y] = proj(ra, dec); if (Math.abs(x) > E + r || Math.abs(y) > E + r) return "";
      return `<circle cx="${X(x)}" cy="${Y(y)}" r="${r * k}" style="fill:var(--hatch);fill-opacity:.18;stroke:var(--faint);stroke-dasharray:2 2"><title>邻源排除区 半径 ${U.n(r, 2)}°</title></circle>`; }).join("");
    const tileFields = alertT ? AlertLocalization.model(loc, locInfo || {})?.fields || [] : [];
    const fields = alertT ? P.map((o, i) => {
      const match = tileFields.find(f => AlertLocalization.matches(f, AlertLocalization.point(o.p)));
      const order = match?.order ?? i + 1;
      const [x, y] = o.xy, distance = Astro.sep(ra0, dec0, o.p.ra_deg, o.p.dec_deg);
      return tileFields.length ? `<text data-point-field="${order}" x="${X(x) + 5}" y="${Y(y) - 5}" style="font-size:10px;fill:${c};font-weight:700">${order}<title>场 ${order} · 离通报参考坐标 ${U.n(distance, 1)}°</title></text>` : "";
    }).join("") : (t.fields || []).map(f => { const [x, y] = proj(f.ra_deg, f.dec_deg);
      return `<g><title>${U.esc(f.id)}</title><path d="M${X(x) - 4} ${Y(y)}h8M${X(x)} ${Y(y) - 4}v8" style="stroke:${c};stroke-width:1.5"/><text x="${X(x) + 5}" y="${Y(y) - 4}" style="font-size:10px;fill:${c}">${U.esc(f.id)}</text></g>`; }).join("");
    const fovs = P.map(o => `${U.fin(fov) ? `<circle cx="${X(o.xy[0])}" cy="${Y(o.xy[1])}" r="${fov * k}" style="fill:${c};fill-opacity:${alertT ? (o.now ? .06 : .015) : (o.now ? .14 : .04)};stroke:${c};stroke-width:${o.now && !alertT ? 2.2 : .8};stroke-opacity:${alertT ? .22 : (o.now ? 1 : .55)}"/>` : ""}
      ${U.fin(ring) ? `<circle cx="${X(o.xy[0])}" cy="${Y(o.xy[1])}" r="${ring * k}" style="fill:${alertT && o.now ? c : "none"};fill-opacity:.12;stroke:${c};stroke-dasharray:3 2;stroke-width:${alertT && o.now ? 2 : 1};stroke-opacity:${alertT ? .9 : .65}"/>` : ""}`).join("");
    const dots = P.map(o => { const wb = o.p.wobble || {}, mins = o.runs.reduce((a, r) => a + U.mins(r.start_utc, r.end_utc), 0);
      return `<circle cx="${X(o.xy[0])}" cy="${Y(o.xy[1])}" r="${o.now ? 5 : 3.5}" style="fill:${o.now ? c : "var(--card)"};stroke:${c};stroke-width:1.5"><title>${U.esc("指向 " + U.n(o.p.ra_deg, 3) + "°, " + U.n(o.p.dec_deg, 3) + "°" + (wb.offset_deg != null ? " · wobble " + wb.offset_deg + "° / " + wb.pa_deg + "°" : "") + " · " + [...o.groups].join("·") + " · " + o.runs.length + " 个 run · " + U.n(mins) + " min" + (o.now ? " · 此刻" : ""))}</title></circle>`; }).join("");
    const pick = tids.map(id => `<button data-act="tnPt" data-arg="${U.esc(id)}" aria-pressed="${id === tid}" style="color:${Data.color(id, w)}">${U.esc(Data.name(id, w))}</button>`).join("");
    const starLayer = TNStars.on.point ? TNStars.pointLayer(s.t, proj, X, Y, E) : null;
    return `<div class="tn-pt-head"><div class="seg">${pick}</div>${TNStars.chip("point")}</div>
      <svg viewBox="0 0 ${S} ${S}" role="img" aria-label="${U.esc(Data.name(tid, w))} 今晚的指向与视场" style="width:100%;max-width:330px;display:block;margin:0 auto;border-radius:10px;background:var(--sunk)">
        <path d="${grid.join("")}" style="stroke:var(--rule)"/>
        ${t.radius_deg > 0 ? `<circle cx="${C}" cy="${C}" r="${t.radius_deg * k}" style="fill:none;stroke:${c};stroke-dasharray:5 4"><title>延展半径 ${t.radius_deg}°</title></circle>` : ""}
        ${ex}${fovs}${starLayer?.svg || ""}${fields}
        <path d="M${C - 7} ${C}h14M${C} ${C - 7}v14" style="stroke:var(--ink);stroke-width:1.5"/>${alertT ? `<text data-point-reference x="${C + 10}" y="${C + 13}" class="axl">通报参考坐标</text>` : ""}${dots}
        <text x="6" y="${S - 8}" style="font-size:10px;fill:var(--muted)">网格 ${step}°</text><text x="${S - 6}" y="14" text-anchor="end" style="font-size:10px;fill:var(--muted)">北上 · 东左</text>
      </svg>
      <p class="note" style="text-align:center;margin-top:6px">十字是${alertT ? "通报参考坐标" : "源中心"}，小圆点是该夜排入计划的 ${P.length} 个指向。${alertT ? `虚线圆为铺场覆盖半径${U.fin(tileR) ? " " + TForecast.number(tileR) + "°" : "：未提供"}。浅色实线圆为相机视场，半径 ${TForecast.number(fov)}°。${tileFields.length ? `数字是与告警页一致的场号。 <a href="#alert/${U.esc(T.night_local_date)}">看定位概率图</a>` : ""}` : `实线圆为相机视场，半径 ${TForecast.number(fov)}°。虚线圆为有效视场，半径 ${TForecast.number(eff)}°。`}${excl.length ? " 灰圈为邻源排除区。" : ""}${!alertT && (t.fields || []).length ? " 小十字为分场中心。" : ""}${starLayer ? starLayer.note : ""}</p>`;
  },

  detail(w, T, m, s){
    const v = (T.visits || []).find(x => x.visit_id === s.sel);
    if (!v) return `<p class="note" style="border-top:1px solid var(--rule);padding-top:10px;margin-top:14px">点时间轴上的色块，这里显示这段观测的详情。</p>`;
    const p = v.pointing || {}, wb = p.wobble || {}, e = v.expected || {};
    const z = v.zenith_deg || [], az = v.azimuth_deg || [];
    return `<div style="border-top:1px solid var(--rule);margin-top:14px;padding-top:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b style="color:${Data.color(v.task_id, w)};font-size:15px">${U.esc(Data.name(v.target_id || v.task_id, w))}</b><button class="btn" style="padding:2px 10px;font-size:12px" data-act="tnSel" data-arg="">取消选中</button></div>
      <dl class="kv" style="margin-top:8px">
        <dt>时段</dt><dd>${U.span(v.start_utc, v.end_utc)} · ${U.n(U.mins(v.start_utc, v.end_utc))} min</dd>
        <dt>组</dt><dd>${v.group} · ${(v.members || []).length} 台</dd>
        <dt>天顶角</dt><dd>${U.n(z[0], 1)}° → ${U.n(z[1], 1)}°</dd>
        <dt>方位</dt><dd>${U.n(az[0], 0)}° → ${U.n(az[1], 0)}°</dd>
        <dt>天空</dt><dd>${U.esc({dark: "暗夜", weak_moon: "弱月光", strong_moon: "强月光", twilight: "晨昏"}[v.sky] || v.sky || "—")}</dd>
        <dt>指向</dt><dd class="num">${U.n(p.ra_deg, 3)}°, ${U.n(p.dec_deg, 3)}°${wb.offset_deg != null ? ` · wobble ${U.n(wb.offset_deg, 1)}° / ${U.n(wb.pa_deg, 0)}°` : ""}</dd>
        <dt>背景</dt><dd>${U.esc(p.background_method || "—")}${p.template_reason ? `<div class="tiny muted">${U.esc(p.template_reason)}</div>` : ""}</dd>
        <dt>预计科学量</dt><dd>${U.n(e.credit_f32, 1)}（F32 当量 min）${e.credit_status === "unassessed" ? ' <span class="tag approx">未评估</span>' : ""}
          ${(() => { const ov = TN.overShare(T).get(v.visit_id); return ov ? `<div class="small warn" style="color:var(--ink2)"><i class="key over-key" aria-hidden="true"></i> 其中 ${U.n(ov.credit, 1)} 是超额填充：这个源今晚共超出批准量 ${U.n(ov.total, 1)}，按时间先后算在最后几段</div>` : ""; })()}</dd>
        <dt>run</dt><dd>${(v.runs || []).length ? (v.runs.length + " 个") : "未提供"} · <span class="mono tiny">${U.esc(v.visit_id)}</span>
          ${(v.runs || []).length ? `<div style="margin-top:4px">${v.runs.map(r => {
            const field = TN.runField(v,r), point = r.pointing || {};
            return `<div class="small num">${U.span(r.start_utc,r.end_utc)}${field ? " · 场 " + U.esc(field) : ""}
              · ${TForecast.number(point.ra_deg,3)}°, ${TForecast.number(point.dec_deg,3)}°${r.run_id ? ` <span class="mono tiny muted">${U.esc(String(r.run_id).split(":").slice(-2).join(":"))}</span>` : ""}</div>`;
          }).join("")}</div>` : ""}</dd>
        ${v.prereq ? `<dt>前置</dt><dd>${U.esc(v.prereq)}</dd>` : ""}
      </dl></div>`;
  },

  progress(w, T){
    const prog = T.progress || [];
    if (!prog.length) return missing("当夜结果里没有 progress");
    const days = w.near ? TForecast.days(w) : [], nlDays = T.inputs?.parameters?.near_term_nights;
    // 本周下限：缺口是要看的数，下限和已排放在小字里
    // 只在有缺口时写数字；下限和已排放到悬停里（11-24）
    const nlCell = n => !n ? '<span class="muted">—</span>' : `<span data-tap title="${U.esc(`本周下限 ${U.n(n.requested_min)} · 已排 ${U.n(n.planned_min)} · 缺口 ${TForecast.number(n.gap_min)}`)}">${n.gap_min > 0.05 ? `<b class="warn">${TForecast.number(n.gap_min)}</b>` : '<span class="muted">—</span>'}</span>`;
    // 逐夜分配：每夜一根小柱，实色是需求、淡色是超额；数字在悬停里
    const alloc = prog.map(p => days.map(date => TForecast.allocation(w, p.task_id, date)));
    const top = Math.max(1, ...alloc.flat().map(a => a ? a.need + a.over : 0));
    const spark = (p, i, color) => days.length ? `<div class="spark" role="img" aria-label="${U.esc(Data.name(p.task_id, w))} 未来 ${days.length} 夜的逐夜分配">${days.map((date, k) => {
      const a = alloc[i][k];
      const tip = `${U.md(date)} · ${a ? "需求 " + TForecast.number(a.need) + " / 超额 " + TForecast.number(a.over) + " 分钟" : "未提供"}`;
      return `<span data-tap data-credit-date="${U.esc(date)}" data-need="${a ? a.need : ""}" data-over="${a ? a.over : ""}" title="${U.esc(tip)}">${a ? `<i style="height:${(a.over / top * 100).toFixed(1)}%;background:${color};opacity:.35"></i><i style="height:${(a.need / top * 100).toFixed(1)}%;background:${color}"></i>` : '<i class="na"></i>'}</span>`;
    }).join("")}</div>` : '<span class="muted">—</span>';
    const rows = prog.map((p, i) => {
      const t = Data.task(p.task_id, w) || {color: "#8C948F"};
      const done = p.accepted_min, tonight = p.planned_tonight_capped_credit ?? p.planned_tonight_credit, ap = p.approved_min;
      const fa = ap && U.fin(done) ? U.clamp(done / ap, 0, 1) : 0, fb = ap && U.fin(tonight) ? U.clamp(tonight / ap, 0, 1 - fa) : 0, fp = ap && U.fin(p.planned_period_credit) ? U.clamp(p.planned_period_credit / ap - fa - fb, 0, 1 - fa - fb) : 0;
      const grade = p.urgency_grade === "warn" ? '<span class="pill warn">紧</span>' : p.urgency_grade === "bad" || p.urgency_grade === "danger" ? '<span class="pill danger">危</span>' : "";
      return `<tr class="click" data-act="go" data-arg="source/${U.esc(p.task_id)}">
        <td style="white-space:nowrap"><i class="dot" style="background:${t.color}"></i><b>${U.esc(Data.name(p.task_id, w))}</b></td>
        <td class="n">${p.tier ?? "—"}</td><td class="n">${TForecast.number(ap)}</td><td class="n">${TForecast.number(done)}</td><td class="n">${TForecast.number(tonight)}</td><td class="n">${TForecast.number(p.remaining_after_tonight)}</td>
        <td style="min-width:96px"><div style="display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk2)" title="已接受 ${U.n(done)} · 今晚 ${U.n(tonight)} · 规划期预计 ${U.n(p.planned_period_credit)} / ${U.n(ap)}">
          <i style="width:${fa * 100}%;background:var(--used)"></i><i style="width:${fb * 100}%;background:${t.color}"></i><i style="width:${fp * 100}%;background:${t.color};opacity:.3"></i></div></td>
        <td class="n">${nlCell(p.near_lower)}</td>
        <td>${spark(p, i, t.color)}</td>
        <td class="small" style="min-width:64px">${U.esc(p.tonight_label || "")}</td><td class="small" style="min-width:92px;max-width:170px">${U.esc(grade ? String(p.exit_label || "").replace(/[，,、\s]*(紧|危)$/u, "") : p.exit_label || "")} ${grade}</td></tr>`;
    }).join("");
    const acceptedLabel = T.kind === "preview" ? "预测期初余额" : "已接受";
    return `<div class="scroll-x"><table class="t"><thead><tr><th>源</th><th class="n">等级</th><th class="n">批准</th><th class="n">${acceptedLabel}</th><th class="n">本夜计划</th><th class="n">本夜后剩</th><th>进度</th>
      <th class="n" title="${U.fin(nlDays) ? U.n(nlDays) + " 夜" : "近期"}的软目标，单位为 ρ 加权的 F32 当量分钟；只报告，不强制">本周下限缺口</th>
      <th title="近期层给每一夜的条件分配（未乘 ρ）">${days.length ? U.esc(U.md(days[0]) + "—" + U.md(days[days.length - 1])) + " 逐夜" : "逐夜分配"}</th><th>本夜</th><th>规划期</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="legend" style="margin-top:10px"><span><i class="key" style="background:var(--used)"></i>${acceptedLabel}</span><span><i class="key" style="background:var(--ink2)"></i>本夜计划（源色）</span><span><i class="key" style="background:var(--ink2);opacity:.3"></i>规划期内预计</span>
      ${days.length ? '<span>逐夜小柱：<i class="key" style="background:var(--ink2)"></i>需求<i class="key" style="background:var(--ink2);opacity:.35;margin-left:8px"></i>超额 · 点或悬停看分钟数</span>' : ""}</div>`;
  },

  /* 空闲提示：暗时间空闲且有合格未完成目标（inputs.idle_quality），只是机会诊断 */
  idleHint(w, T){
    const q = T.inputs && T.inputs.idle_quality; if (!q) return "";
    // 后端的空闲区间里有 1e-8 分钟的数值噪声；短于 1 分钟的不算空闲
    //（放不下一个最短 run 的也不提）
    const least = U.fin(WBPolicy.get("min_run")) ? WBPolicy.get("min_run") : 5;
    const iv = (q.intervals || []).filter(x => U.mins(x.start_utc, x.end_utc) >= least);
    if (!iv.length) return "";
    const tot = iv.reduce((a, x) => a + U.mins(x.start_utc, x.end_utc), 0);
    const names = U.uniq(iv.flatMap(x => (x.candidates || []).map(c => Data.name(c.task_id || c.target_id, w))));
    return `<div class="missing" style="margin-top:10px;color:var(--ink2);background:var(--sunk2)"><span aria-hidden="true">◇</span><div><b>暗时间有空闲 ${U.n(tot)} 分钟</b>（${iv.map(x => U.span(x.start_utc, x.end_utc)).join("、")}），这时有合格但未完成的目标：${U.esc(names.slice(0, 6).join("、"))}${names.length > 6 ? " 等" : ""}。<br>只是机会诊断，不证明能插入（转向、最短访问、前级目标都没核对）。</div></div>`;
  },

  summary(w, T, sup){
    const so = T.solver || {};
    const kinds = {}; for (const r of sup) kinds[r.kind] = (kinds[r.kind] || 0) + U.mins(r.start_utc, r.end_utc);
    const kindL = {slew: "转向", wait: "等待", merge: "合阵", split: "拆阵", calibration: "标定"};
    const gi = Data.gapInfo(so), du = Data.darkUse(T);
    const dropped = T.dropped || [];
    return `<dl class="kv">
        <dt>访问</dt><dd>${(T.visits || []).length} 段</dd>
        ${Object.keys(kinds).map(k => `<dt>${kindL[k] || k}</dt><dd>${U.n(kinds[k], 1)} min</dd>`).join("")}
        <dt>暗时间利用</dt><dd>${du ? U.pct(du.f, 1) + ` <span class="muted small">（有观测 ${U.n(du.on)} / 暗时间 ${U.n(du.dark)} min）</span>` : "—"}</dd>
        <dt>求解</dt><dd>${U.esc(gi.summary)}${so.timing ? ` <span class="muted small">· 当夜 ${U.n(so.timing.tonight_s, 0)} s</span>` : ""}</dd>
        <dt>几何</dt><dd>${U.esc((T.inputs && T.inputs.geometry) || "—")}</dd>
        <dt>登记表</dt><dd class="mono tiny">${U.esc((T.inputs && T.inputs.params_version) || "—")}</dd>
      </dl>
      ${dropped.length ? `<p class="note warn">被丢弃 ${dropped.length} 段：${dropped.map(d => U.esc(d.visit_id || d.task_id || "")).join("、")}</p>` : ""}
      ${App.screens.tonight.idleHint(w, T)}
      ${gi.n && gi.proven < gi.n ? `<p class="note">“证明最优”指求解器在限时内证明了这一级没有更好的解；没证明不等于计划不能用，看暗时间利用和审核页的落地差。</p>` : ""}
      ${(T.idle || []).length ? `<p class="note">空闲：${T.idle.map(r => U.span(r.start_utc, r.end_utc) + (r.group ? " " + r.group : "") + (r.reason ? "（" + U.esc(r.reason) + "）" : "")).join("；")}</p>` : ""}
      ${Array.isArray(T.events) && T.events.length ? `<p class="note">告警事件 ${T.events.length} 个 · <a href="#alert">查看</a></p>` : ""}`;
  }
};

/* 当夜天空图和指向图上的亮星：默认关，开关和指向图的星等上限记在本机。天空图的上限和“源与窗口”的台站天空共用。 */
const TNStars = {
  on: {sky: U.store.get("tn-sky-stars", false), point: U.store.get("tn-point-stars", false)},
  pointLimit: U.store.get("point-star-limit", 6),
  skyLimit(){ const v = U.store.get("sky-star-limit", null); return U.fin(v) ? v : WBAtlas.starDefault(); },
  rows(){
    const rows = WBAtlas.starRows();
    if (!rows && !WBAtlas.starsLoading()) WBAtlas.loadStars().then(() => App.render("side"));
    return rows;
  },
  chip(which){
    const on = TNStars.on[which];
    // 默认关，所以只是一个不显眼的小字开关；打开后指向图旁边才出现星等上限
    const sub = which === "point" && on ? `<select class="mini-select" data-change="tnStarLimit" aria-label="指向图亮星星等上限">${[4,5,6,7,8].map(v => `<option value="${v}" ${v === TNStars.pointLimit ? "selected" : ""}>V ≤ ${v}</option>`).join("")}</select>` : "";
    return `<span class="tn-star-tools"><button type="button" class="mini-toggle" data-act="tnStars" data-arg="${which}" aria-pressed="${on}" title="${on ? "隐藏" : "显示"}亮星"><span class="sym" aria-hidden="true">✦</span>亮星</button>${sub}</span>`;
  },
  shape(x, y, r){ return "M" + WBAtlas.starShape(x, y, r).map(([a, b]) => a.toFixed(1) + " " + b.toFixed(1)).join("L") + "Z"; },
  skyLayer(t, pos){
    const rows = TNStars.rows(), lim = TNStars.skyLimit();
    if (!rows) return {svg: "", note: " 正在读取亮星目录…"};
    const shown = rows.filter(r => U.fin(r.mag) && r.mag <= lim).map(r => WBAtlas.starPosition(r, t));
    const up = WBGeo.sky(t, shown).sources.filter(p => p.alt > 0);
    const svg = up.map(p => { const [x, y] = pos(90 - p.alt, p.az);
      return `<path class="tn-star" d="${TNStars.shape(x, y, U.clamp(3.4 - .38 * p.mag, 1, 3.6))}" style="opacity:${U.clamp(.95 - .1 * p.mag, .45, .95).toFixed(2)}"><title>${U.esc(WBAtlas.starName(p))} · V ${U.n(p.mag, 1)}</title></path>`; }).join("");
    return {svg, note: ` 金色星芒：亮星 V ≤ ${lim}（地平线上 ${up.length} 颗）。`};
  },
  pointLayer(t, proj, X, Y, E){
    const rows = TNStars.rows(), lim = TNStars.pointLimit;
    if (!rows) return {svg: "", note: " 正在读取亮星目录…"};
    let n = 0, svg = "";
    for (const r of rows) {
      if (!U.fin(r.mag) || r.mag > lim) continue;
      const st = WBAtlas.starPosition(r, t), [x, y] = proj(st.ra, st.dec);
      if (Math.abs(x) > E + .2 || Math.abs(y) > E + .2) continue;
      n++;
      const name = WBAtlas.starName(r), cx = X(x), cy = Y(y);
      svg += `<g class="tn-star"><title>${U.esc(name)} · V ${U.n(r.mag, 1)}</title><path d="${TNStars.shape(cx, cy, U.clamp(6 - .7 * r.mag, 1.4, 6))}"/>${r.mag <= 4.5 ? `<text x="${(cx + 6).toFixed(1)}" y="${(cy - 5).toFixed(1)}">${U.esc(name)} ${U.n(r.mag, 1)}</text>` : ""}</g>`;
    }
    return {svg, note: ` 金色星芒：图内 V ≤ ${lim} 的亮星 ${n} 颗，V ≤ 4.5 的写了名字和星等。`};
  }
};

/* ==== 41x-forecasts.js ==== */
"use strict";

const TForecast = {
  number(value, digits = 1){
    if (!U.fin(value)) return "未提供";
    return value > 0 && value < .001 ? "＜0.001" : U.n(value, value > 0 && value < .1 ? 3 : digits);
  },
  days(w){
    const dates = w?.near?.inputs?.near_lower?.dates;
    if (Array.isArray(dates) && dates.length) return dates;
    return U.uniq([w?.tonight?.night_local_date, ...Object.values(w?.previews || {}).map(p => p.night_local_date)].filter(Boolean)).sort();
  },
  allocation(w, task, date){
    const rows = w?.near?.progress?.find(p => p.task_id === task)?.allocations?.filter(r => r.night_local_date === date);
    if (!rows?.length || rows.some(r => !U.fin(r.need_credit) || !U.fin(r.over_credit))) return null;
    return {need: U.sum(rows, r => r.need_credit), over: U.sum(rows, r => r.over_credit)};
  },
  splitCell(w, task, date){
    const row = TForecast.allocation(w, task, date);
    return row ? TForecast.number(row.need) + " / " + TForecast.number(row.over) : "未提供";
  },
  assumptions(doc){
    const a = doc.assumptions || {};
    const facts = [a.previous_plans_complete === true ? "前序计划按计划完成" : null,
      a.weather === "clear" ? "晴" : null, a.alerts === "none" ? "没有告警" : null,
      a.known_faults_and_calendar_preserved === true ? "保留已知故障和维护" : null].filter(Boolean);
    return `<p class="note" role="note" data-preview-assumptions><b>预览 · 不锁定 · 每天重算</b>。假设：${facts.length ? U.esc(facts.join("，")) : "未提供"}。进度表里的前序余额包含预测信用。</p>`;
  },
  strip(w, date, doc, bounds){
    if (!bounds && !WBPolicy.display()) return '<span class="tiny muted">夜界未提供</span>';
    const [a,b] = bounds || WBPolicy.bounds(date), pct = x => U.clamp((U.ms(x) - a) / (b - a) * 100, 0, 100);
    const span = (r, color, vertical, opacity, tip, over = 0) => {
      const x = pct(r.start_utc), width = pct(r.end_utc) - x;
      if (width <= 0) return "";
      return `<i data-tap style="position:absolute;left:${x}%;width:${width}%;top:${vertical.top}%;height:${vertical.height}%;background:${over > .01 ? TN.overBg(color, over, vertical.height > 20) : color};opacity:${opacity};border-radius:2px" title="${U.esc(tip)}"></i>`;
    };
    const overs = doc ? TN.overShare(doc) : null;
    if (doc) return doc.visits.map(v => {
      const lane = GROUPS.indexOf(v.group);
      if (lane < 0) return "";
      const field = TN.runFields(v).join("、");
      const ov = overs.get(v.visit_id);
      // 和近期行同样分两层：上半 F32，下半四个 8 台组各占一条细线（原来五条道各 18%，A8—D8 叠成一团，11-24）
      return span(v, Data.color(v.task_id,w), lane === 0 ? {top:0,height:44} : {top:54 + (lane - 1) * 11.5,height:10}, doc.kind === "preview" ? .6 : 1,
        `${Data.name(v.task_id,w)} ${v.group} ${U.span(v.start_utc,v.end_utc)}${field ? " · 场 " + field : ""}${ov ? " · 超额填充 " + U.n(ov.credit, 1) + " F32 分钟" : ""}`, ov?.frac || 0);
    }).join("");
    if (!Array.isArray(w?.near?.rows)) return '<span class="tiny muted">时隙未提供</span>';
    const slots = new Map();
    for (const row of w.near.rows.filter(r => r.date === date && r.groups > 0)) {
      const key = row.start_utc + "|" + row.mode;
      if (!slots.has(key)) slots.set(key, []);
      slots.get(key).push(row);
    }
    return [...slots.values()].map(rows => rows.map((row,index) => {
      const height = 44 / rows.length, top = (row.mode === "F32" ? 0 : 54) + index * height;
      const parent = w.near.inputs?.prepared_targets?.[row.target_id]?.task_id || row.target_id;
      const tip = `${Data.name(parent,w)} · ${row.target_id} · ${row.mode} · ${U.span(row.start_utc,row.end_utc)} · 状态 ${U.pct(row.state_fraction,1)} · 组占用 ${TForecast.number(row.groups,2)} · 需求 / 超额 ${TForecast.number(row.need_credit)} / ${TForecast.number(row.over_credit)} min`;
      const tot = (row.need_credit || 0) + (row.over_credit || 0);
      return span(row, Data.color(parent,w), {top,height:Math.max(0,height-2)},
        U.fin(row.state_fraction) ? .2 + .8 * U.clamp(row.state_fraction,0,1) : .2, tip, tot > 0 ? (row.over_credit || 0) / tot : 0);
    }).join("")).join("");
  },
  /* 未来几夜。给了当夜时间轴的几何 m（和它所属的日期 anchor）时，各夜按同一条钟点轴对齐，嵌在时间轴卡片里 */
  render(w, selected, m, anchor){
    const dates = TForecast.days(w), parent = w?.tonight;
    const near = w?.near, step = near?.inputs?.parameters?.slot_min;
    if (!parent || !dates.length) return "";
    const replay=Data.isReplay(w), baseLabel=replay?"回放夜":parent.night_local_date===U.ymd(Date.now())?"今晚":"原计划";
    const forecasts = Object.values(w.previews || {}).filter(p => p.preview_of === parent.plan_id);
    const expected = parent.previews || [];
    const embedded = Boolean(m && anchor);
    const bounds = date => embedded ? [m.x0, m.x1].map(t => t + U.dayMs(date) - U.dayMs(anchor)) : WBPolicy.display() ? WBPolicy.bounds(date) : null;
    const first = bounds(dates[0]);
    const axis = !embedded && first ? [0,.25,.5,.75,1].map(f => `<span>${U.hm(first[0]+(first[1]-first[0])*f)}</span>`).join("") : "";
    let anyNear = false;
    const anyOver = dates.some(date => {
      const doc = date === parent.night_local_date ? parent : forecasts.find(p => p.night_local_date === date);
      return doc ? TN.overShare(doc).size > 0 : (near?.rows || []).some(r => r.date === date && r.groups > 0 && r.over_credit > .01);
    });
    const rows = dates.map((date,i) => {
      const doc = date === parent.night_local_date ? parent : forecasts.find(p => p.night_local_date === date);
      const absent = expected.some(p => p.night_local_date === date) && !doc;
      const label = doc ? (doc.kind === "preview" ? "预览" : baseLabel) : absent ? "预览未提供" : "近期";
      if (!doc) anyNear = true;
      const hint = doc ? (doc.visits.length ? "" : '<span class="tiny muted">无计划访问</span>') : "";
      return `<div class="lbl"><button class="linkbtn" data-act="tnNight" data-arg="${U.esc(date)}" aria-pressed="${selected === date}"
          title="${i ? baseLabel + "之后第 " + i + " 夜" : baseLabel}"><b>${U.esc(U.md(date))}</b></button><div>${label}</div></div>
        <div class="fut-lane${doc?.kind === "preview" ? " preview" : doc ? "" : " near"}${selected === date ? " on" : ""}" data-forecast-date="${U.esc(date)}" data-kind="${doc?.kind || "near_term"}" data-act="tnNight" data-arg="${U.esc(date)}">${TForecast.strip(w,date,doc,bounds(date))}${hint}</div>`;
    }).join("");
    const body = `<div class="scroll-x"><div style="min-width:${embedded ? 720 : 500}px"><div class="lanes fut-lanes">
        ${axis ? `<div></div><div style="display:flex;justify-content:space-between" class="tiny muted num">${axis}</div>` : ""}${rows}</div></div></div>
      <div class="legend" style="margin-top:8px"><span><i class="key" style="background:var(--ink2)"></i>${baseLabel}（已排）</span>
        ${anyOver ? '<span><i class="key over-key"></i>变浅、顶上带点线：超额填充（批准量已排满后多给的；近期分配按每格的需求 / 超额比例）</span>' : ""}
        ${forecasts.length ? '<span><i class="key" style="background:var(--ink2);opacity:.55;outline:1px dashed var(--axis)"></i>预览：按计划完成、晴、无告警来排，不锁定，每天重算</span>' : ""}
        ${anyNear ? `<span><i class="key" style="background:linear-gradient(var(--ink2) 0 45%,transparent 45% 55%,var(--ink2) 55%);opacity:.5"></i>近期分配（${TForecast.number(step,0)} 分钟格）：上半整阵、下半 8 台组，越淡占得越少</span>` : ""}</div>
      ${!forecasts.length && !parent.preview_status ? (Data.replayView ? '<p class="note">逐夜回放不另排后两夜预览；上面是近期层给后面几夜的分配。</p>' : missing("后两夜预览", "此结果组没有预览文件")) : ""}
      ${expected.length > forecasts.length ? missing("部分后两夜预览", "索引里有预览，但结果文件尚未加载") : ""}
      ${parent.preview_status === "outside_planning_period" ? '<p class="note">规划期内没有后续夜。</p>' : ""}`;
    const head = `<h${embedded ? 3 : 2} id="tn-future-heading">${replay?"基线计划的后续预测":"未来几夜"}</h${embedded ? 3 : 2}><span class="small muted">${embedded ? "和上面同一条钟点轴 · " : "北京时间对齐 · "}点一行看那一夜</span>`;
    const obligations = TForecast.tooObligations(near);
    return embedded ? `<div class="tn-future" aria-labelledby="tn-future-heading"><div class="card-h">${head}</div>${body}${obligations}</div>`
      : `<section class="card" style="margin-top:20px" aria-labelledby="tn-future-heading"><div class="card-h">${head}</div>${body}${obligations}</section>`;
  },
  tooObligations(near){
    const plan = near?.too_obligations;
    if (plan?.executable !== false) return "";
    const selected = plan.selections || [], pending = plan.pending || [];
    if (!selected.length && !pending.length) return "";
    const reasons = {
      missing_ledger_or_period_start: "缺少账本或规划期起点",
      wide_or_unsupported_project: "此类义务待值班选夜",
      clock_pool_or_policy_unavailable: "事件时长、池余额或资格需复核",
      no_single_F32_pointing: "没有单场整阵指向",
      no_qualified_future_F32_offer: "期限内无合格整阵时段",
      shared_capacity_not_selected: "未获分配"
    };
    return `<section class="card" data-near-too-obligations><div class="card-h"><h3>近期 ToO 预留</h3></div>
      <p class="note">近期层容量预留。普通预览仍按无告警情形生成。值班选夜后按当时条件重排。</p>
      ${selected.length ? `<div class="scroll-x"><table class="t"><thead><tr><th>目标</th><th>观测夜</th><th>预留（北京时间）</th><th class="n">计划 ON（分钟）</th></tr></thead>
        <tbody>${selected.map(row=>`<tr><td>${U.esc(Data.alertLabel(row.event_id) || (Data.internalName(row.name) ? "告警" : row.name) || row.event_id)}</td><td>${U.esc(row.date)}</td>
          <td>${U.span(row.reserve_start_utc,row.reserve_end_utc)}</td><td class="n">${TForecast.number(row.on_min)}</td></tr>`).join("")}</tbody></table></div>` : ""}
      ${pending.length ? `<ul class="note">${pending.map(row=>`<li>${U.esc(Data.alertLabel(row.event_id) || (Data.internalName(row.name) ? "告警" : row.name) || row.event_id)} · ${U.esc(reasons[row.reason] || row.reason || "待复核")}</li>`).join("")}</ul>` : ""}</section>`;
  },
  savedDates(){

  unrealized(w, view){
    const date = view.date;
    const choices = TForecast.savedDates().sort(U.by(x => date ? Math.abs(U.dayMs(x.date)-U.dayMs(date)) : -U.dayMs(x.date)));
    const exact = choices.filter(x => x.date === date && x.w !== w);

        <div class="scroll-x"><table class="t"><thead><tr><th>源</th><th class="n">需求 / 超额 · F32 当量 min</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    } else detail = `<div class="card empty">${U.esc(date || "")} 这一夜没有保存的当夜计划。${Shell.nightChips("有计划的夜：")}</div>`;
    return `<div class="head"><div class="t"><h1>${view.kind === "near_term" ? "近期分配" : "当夜计划"}</h1></div>${actions}</div>

  },
  fillerGroup(w, unit, date, planId){
    const data = w?.fillerSuggestions;

    return data?.by_night?.find(n => n.night_local_date === date && n.plan_id === planId);
  },
  fillers(w, unit, date, planId){
    if (Data.isReplay(w)) return "";
    const group = TForecast.fillerGroup(w,unit,date,planId);
    const service = Data.server.on && w?.tonight;
    const title = unit === "month" ? date + " 补空推荐" : "补空推荐";

      <div style="display:flex;justify-content:space-between;gap:8px"><b>${U.esc(row.name || row.source_id)}</b><span class="tiny muted">${U.esc(row.catalog || "未提供")}</span></div>

      <p class="note">合格 ${TForecast.number(row.eligible_min)} min × 亮度 ${TForecast.number(row.brightness_proxy,2)} × 新颖度 ${TForecast.number(row.novelty,2)} = ${TForecast.number(row.score,2)}。<br>${U.esc(basis(row.brightness_basis?.method))}。${row.novelty_basis === "exposure_unavailable_neutral" ? "曝光未提供，新颖度采用结果中的中性值。" : U.fin(row.observed_roi_fraction) ? "已有曝光占 ROI " + U.pct(row.observed_roi_fraction,1) + "。" : ""}</p>
      ${row.draft_task ? `<button class="btn" data-act="tnFillerAdd" data-arg="${index}" data-unit="${unit}" data-date="${U.esc(date)}" data-plan="${U.esc(planId || "")}">加入源表</button>` : ""}
    </article>`).join("");

      ? "未分配容量 " + TForecast.number(group.remaining_min) + " min"

    // 没有空档也没有推荐时只留一行字，不占一张卡
    if (!service && group && !cards && unit !== "month" && !(group.windows || []).length)
      return `<p class="note" style="margin:14px 4px 0" data-filler-unit="${unit}" data-filler-date="${U.esc(date)}">补空推荐：这一夜没有达到最短时长的空档。</p>`;
    return `<section class="card" style="margin-top:16px" data-filler-unit="${unit}" data-filler-date="${U.esc(date)}">
      <div class="card-h"><h2>${U.esc(title)}</h2>${service ? `<button class="btn" data-act="tnFillerFetch" ${w.fillerPending ? "disabled" : ""}>${w.fillerPending ? "计算中…" : "按当前源表重算推荐"}</button>` : ""}</div>
      <p class="note">${U.esc(status)}${group ? "。加入后需确认批准量并重新排班。" : ""}</p>
      ${w.fillerError ? `<p role="alert" class="danger">${U.esc(w.fillerError)}</p>` : ""}
      ${cards ? `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px">${cards}</div>` : group?.suggestions && (group.windows?.length || unit === "month") ? '<p class="note">没有符合条件的推荐。</p>' : ""}
    </section>`;
  },
};

App.acts.tnNight = date => App.go("tonight/" + encodeURIComponent(date));
App.acts.tnOpenSaved = (id, el) => {
  Data.select(id);
  App.acts.tnNight(el.dataset.date);
};
App.acts.tnFillerAdd = (index, el) => {
  if (Data.isReplay()) return;
  const {unit,date,plan} = el.dataset;
  const row = TForecast.fillerGroup(Data.ws(),unit,date,plan)?.suggestions?.[Number(index)];
  if (!row?.draft_task) return;
  const added = WBCatalog.addDraft(row.draft_task);
  if (added) {
    App.state.fillerReplan = {taskId: added.id, date: unit === "night" ? date : Data.ws()?.tonight?.night_local_date};
    if (unit === "night") { IN.st().set.date = date; IN.save(); }
    if (App.state.route === "inputs") App.render();
  }
};
App.acts.tnFillerFetch = async () => {
  const w = Data.ws();
  if (!w?.tonight || Data.isReplay(w) || w.fillerPending || !Data.server.on) return;
  w.fillerPending = true;
  w.fillerError = null;
  keepY(App.render);
  try {
    const payload = w.ver ? {plan_id:w.tonight.plan_id} : {result:w.tonight,
      previews:Object.values(w.previews || {}).filter(p => p.preview_of === w.tonight.plan_id)};
    const annual = Object.values(w.annuals || {}).filter(d => d.params_fingerprint === w.tonight.inputs?.params_fingerprint);
    if (annual.length) payload.annual = annual;
    const table = App.state.inp?.table;
    if (table) payload.tasks = table;
    if (w.exposure) payload.exposure = w.exposure;
    w.fillerSuggestions = (await Data.api("/api/fillers",payload)).filler_suggestions;
  } catch (error) {
    w.fillerError = error.message || String(error);
  } finally {
    w.fillerPending = false;
    if (Data.ws() === w) keepY(App.render);
  }
};
