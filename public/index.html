/* ==== 08-catalog.js ==== */
"use strict";
/* Local catalog data, source form drafts and catalog-management screens. */
const WBCatalog = {
  cache: {}, errors:{}, mode: null, page:0, query:"",
  selected: new Set(U.store.get("wb-catalog-fermi", [])),
  local: U.store.get("wb-catalog-private", []),
  fermi:{query:"",type:"",minSignificance:"",onlyReachable:true,highEnergyOnly:false,selectedOnly:false,sort:"significance"},
  canonical(s, catalog){
    return {...s, catalog:catalog || s.catalog, ra_deg:s.ra_deg ?? s.ra, dec_deg:s.dec_deg ?? s.dec,
      ra:s.ra_deg ?? s.ra, dec:s.dec_deg ?? s.dec, aliases:s.aliases || []};
  },
  async load(key){
    if (WBCatalog.cache[key]) return WBCatalog.cache[key];
    const file=key==="fermi"?"fermi-sources":key;
    try{
      await Data.localScript("catalogs/"+file+".js");
      if (WBCatalog.cache[key]) return WBCatalog.cache[key];
      const doc=window.LACT_CATALOGS?.[file];
      if (key==="fermi") WBOldCatalog.validateFermiCatalog(doc);
      const rows=doc?.[key==="stars"?"stars":"sources"];
      if (!Array.isArray(rows)) throw Error("目录格式未提供");
      WBCatalog.cache[key]=rows.map(s=>WBCatalog.canonical(s));
      (WBCatalog.meta ||= {})[key]=doc?.meta || null;
      // 1LHAASO 的谱另存一份：被 2LHAASO 替换后，“打到 5σ”的估计仍从这里取流强（WBDetect）
      if (key==="sources") WBCatalog.lhaaso1=WBCatalog.cache[key].filter(s=>s.catalog==="1LHAASO");
      // 有 2LHAASO 时用它替换公开表里的 1LHAASO
      if (key==="sources" && WBCatalog.lhaaso2().length)
        WBCatalog.cache[key]=[...WBCatalog.cache[key].filter(s=>s.catalog!=="1LHAASO"), ...WBCatalog.lhaaso2()];
      delete window.LACT_CATALOGS[file];
      delete WBCatalog.errors[key];
      return WBCatalog.cache[key];
    } catch(e){WBCatalog.errors[key]=e.message;throw e;}
  },
  /* 2LHAASO：params/exclusions_2lhaaso.json（由用户的 2LHAASO.yaml 转出，只有位置、成分类型和拟合展宽）。
     同名的几个成分并成一个源：位置取各成分平均，展宽取最大的那个；成分原样留在 components 里。 */
  lhaaso2(){
    if (WBCatalog._lhaaso2) return WBCatalog._lhaaso2;
    const doc = globalThis.LACT_2LHAASO, parts = Array.isArray(doc?.components) ? doc.components : [];
    const groups = new Map();
    for (const c of parts) if (U.fin(c.ra_deg) && U.fin(c.dec_deg) && c.name) {
      if (!groups.has(c.name)) groups.set(c.name, []);
      groups.get(c.name).push(c);
    }
    const ext = c => c.kind === "gaussian" && U.fin(c.ext_deg) ? {kind:"gaussian-sigma", sigmaDeg:c.ext_deg, upperLimit:false}
      : c.kind === "template" && U.fin(c.ext_deg) ? {kind:"template", radiusDeg:c.ext_deg, upperLimit:false} : null;
    const kinds = {gaussian:"高斯展宽", point:"点源", template:"空间模板"};
    WBCatalog._lhaaso2 = [...groups].map(([name, cs]) => {
      // 赤经取平均时注意 0/360 交界
      const x = U.sum(cs, c => Math.cos(c.ra_deg * Math.PI / 180)), y = U.sum(cs, c => Math.sin(c.ra_deg * Math.PI / 180));
      const ra = ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360, dec = U.sum(cs, c => c.dec_deg) / cs.length;
      const widest = cs.reduce((a, c) => (c.ext_deg || 0) > (a.ext_deg || 0) ? c : a, cs[0]);
      const label = /^\d?LHAASO/i.test(name) || !/^J\d{4}/.test(name) ? name : "2LHAASO " + name;
      return WBCatalog.canonical({id:"2lhaaso-" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""),
        name:label, catalog:"2LHAASO", ra:+ra.toFixed(4), dec:+dec.toFixed(4), status:"established", defaultIncluded:true,
        type:cs.length > 1 ? `${cs.length} 个成分` : kinds[cs[0].kind] || "",
        extension:ext(widest), reference:doc.source_file || "2LHAASO",
        components:cs.map(c => ({detector:"2LHAASO", detected:true, kind:c.kind, ra:c.ra_deg, dec:c.dec_deg, extension:ext(c)}))});
    });
    return WBCatalog._lhaaso2;
  },
  async loadWindow(year){
    try {
      await Data.localScript(`windows_${year}.js`);
      const value=window.LACT_WINDOWS?.[String(year)];
      if(!value)return null;
      const doc=await Data.unpackCase(value);
      window.LACT_WINDOWS[String(year)]=doc;
      return doc;
    }
    catch(e){return null;}
  },
  taskRows(){
    const rows=App.state.inp?.table?.tasks || Data.tasks(Data.ws()) || [];
    return rows.filter(t=>U.fin(t.ra_deg)&&U.fin(t.dec_deg)).map(t=>WBCatalog.canonical(
      {...t,id:"task:"+t.id,task_id:t.id,type:t.kind,status:"published"}, "tasks"));
  },
  active(){
    return [...(WBCatalog.cache.sources||[]),...(WBCatalog.cache.fermi||[]).filter(s=>WBCatalog.selected.has(s.id)),
      ...WBCatalog.local,...WBCatalog.taskRows()];
  },
  get(id){return WBCatalog.active().find(s=>s.id===id) || WBCatalog.cache.fermi?.find(s=>s.id===id) || null;},
  paperAssociation(s){
    return s.id === "tevcat-422" ? {name:"LHAASO J1915+1053", href:"https://academic.oup.com/view-large/546107461"} : null;
  },
  associationNames(s){
    const declared = Array.isArray(s.associations) ? s.associations : [];
    return [...declared,s.association,s.fermi?.association,s.fermi?.associationAlt,s.fermi?.tevAssociation,WBCatalog.paperAssociation(s)]
      .map(item => typeof item === "string" ? item : item?.name)
      .filter(name => typeof name === "string" && name.trim());
  },
  matches(s,q){
    const query = String(q ?? "");
    const hess = query.replace(/\bH\.E\.S\.S\.?(?=\s|J\d|$)/gi,"HESS");
    const match = row => WBOldCatalog.matchesSource(row,query) || (hess !== query && WBOldCatalog.matchesSource(row,hess));
    return match(s) || match({aliases:WBCatalog.associationNames(s)});
  },
  lookup(q, allFermi){
    const list=WBCatalog.active();
    if(allFermi) list.push(...(WBCatalog.cache.fermi||[]).filter(s=>!WBCatalog.selected.has(s.id)));
    return list.filter(s=>WBCatalog.matches(s,q));
  },
  related(s){
    const keys = row => [row.name,...(row.aliases || [])].filter(name => typeof name === "string" && name.trim())
      .map(name => name.normalize("NFKC").toLowerCase().replace(/\s+/g,""));
    const names = new Set(keys(s));
    return WBCatalog.active().filter(row => row.id !== s.id && keys(row).some(name => names.has(name)))
      .map(source => ({source, relationship:"目录名称或别名匹配"}));
  },
  draft(s){
    const policy=WBPolicy.get("catalog_import");
    if(!policy) throw Error("未提供目录预填登记项");
    const components=(s.components||[]).filter(c=>c.detected);
    const component=components.find(c=>c.detector==="WCDA") || components.find(c=>c.detector==="KM2A");
    const high=(s.fermi?.highEnergyAssociations||[]).some(n=>/^\d*FHL\b/i.test(n));
    // 2LHAASO 文件里没有探测器（WCDA / KM2A）信息，能段不预填，让用户自己填
    const key=s.catalog==="1LHAASO"&&component?"lhaaso_"+component.detector.toLowerCase():
      s.catalog==="TeVCat"?"tevcat":s.catalog==="4FGL-DR4"&&high?"fermi_fhl":null;
    const ext=component?.extension || s.extension;
    const sig=!ext?.upperLimit && ["gaussian-r39","gaussian-sigma"].includes(ext?.kind) ? (ext.sigmaDeg ?? ext.radiusDeg) : null;
    const radius=U.fin(sig)&&sig>0 ? policy.gaussian_sigma_multiplier*sig : (s.catalog==="tasks" ? s.radius_deg : 0);
    const raw=s.task_id || s.id;
    return {id:raw.replace(/[^A-Za-z0-9_.-]+/g,"-").replace(/^-+|-+$/g,"") || "source",
      name:s.name,ra_deg:s.ra_deg,dec_deg:s.dec_deg,kind:radius?"extended":"point",radius_deg:radius||0,
      energy_band_tev:s.energy_band_tev || policy.energy_tev[key] || null,
      allowed_states:s.allowed_states||["F32","S8"],tier:policy.default_tier,approved_min:null};
  },
  nearby(row,tasks){
    const cfg=WBPolicy.get("catalog_import");
    return tasks.filter(t=>U.fin(t.ra_deg)&&U.fin(t.dec_deg)&&U.fin(row.ra_deg)&&U.fin(row.dec_deg)&&
      Astro.sep(row.ra_deg,row.dec_deg,t.ra_deg,t.dec_deg) <= cfg.nearby_margin_deg + (t.radius_deg||0) + (row.radius_deg||0));
  },
  addDraft(row, {render=true}={}){
    const state=IN.st(), tasks=state.table.tasks;
    if(tasks.some(t=>t.id===row.id)) {
      App.toast("源表中已存在该编号；请检查已有任务。"); return null;
    }
    const near=WBCatalog.nearby(row,tasks);
    const copy=structuredClone(row);
    tasks.push(copy); state.edit=tasks.length-1; state.problems=null; IN.save();
    const note="已添加草稿。请确认目录建议的能段、范围和等级"+(copy.approved_min==null?"，并填写批准时长":"")+"；修改源表后需重新排班。";
    if(render) {App.go("inputs");setTimeout(()=>App.toast((near.length?"邻近任务："+near.map(t=>U.esc(t.name||t.id)).join("、")+"。":"")+note),0);}
    return copy;
  },
  toolbar(){
    const b=(mode,label)=>`<button class="btn" type="button" data-act="wbCatMode" data-arg="${mode}" aria-pressed="${WBCatalog.mode===mode}">${label}</button>`;
    return `<div class="wb-cat-toolbar wb-cat-entry"><span class="small muted">更多目录</span>${b("fermi","Fermi 4FGL")}${b("private","本地私有目录")}${b("bulk","批量导入源表")}</div>`;
  },
  panel(){ return WBCatalog.toolbar() + (WBCatalog.mode?WBCatalog.management():''); },
  management(){
    const close='<button class="btn" data-act="wbCatMode">关闭</button>';
    if(WBCatalog.mode==="fermi"){
      const f=WBCatalog.fermi, rows=WBCatalog.cache.fermi;
      const sel=(k,values)=>`<select data-change="wbFermiSet" data-arg="${k}">${values.map(([v,l])=>`<option value="${U.esc(v)}"${f[k]===v?" selected":""}>${U.esc(l)}</option>`).join("")}</select>`;
      const checkbox=(k,l)=>`<label><input type="checkbox" data-change="wbFermiSet" data-arg="${k}" ${f[k]?"checked":""}>${l}</label>`;
      if(!rows) return `<section class="card" data-wb-fermi><div class="card-h"><h2>4FGL-DR4</h2>${close}</div><p>${U.esc(WBCatalog.errors.fermi||"正在读取本机目录…")}</p></section>`;
      const hits=WBOldCatalog.filterFermiSources(rows,f,{selectedIds:[...WBCatalog.selected],config:{latitude:WBPolicy.get("site")?.lat_deg,zmax:WBPolicy.get("max_zenith")}});
      const pageSize=25, pages=Math.max(1,Math.ceil(hits.length/pageSize));WBCatalog.page=U.clamp(WBCatalog.page,0,pages-1);
      const show=hits.slice(WBCatalog.page*pageSize,(WBCatalog.page+1)*pageSize);
      return `<section class="card" data-wb-fermi><div class="card-h"><h2>Fermi 扩展源库 · 4FGL-DR4</h2>${close}</div>
        <div class="wb-cat-toolbar"><label>搜索 <input type="search" data-change="wbFermiSet" data-arg="query" value="${U.esc(f.query)}"></label>
        <label>类型 ${sel("type",[["","全部类型"],["__unknown","未分类"],...U.uniq(rows.map(s=>s.fermi.classCode)).filter(Boolean).sort().map(k=>[k,k])])}</label>
        <label>显著性下限 σ <input type="number" min="0" step="any" data-change="wbFermiSet" data-arg="minSignificance" value="${U.esc(f.minSignificance)}"></label>
        <label>排序 ${sel("sort",[["significance","显著性"],["energyFlux","能流"],["name","名称"]])}</label>
        ${checkbox("onlyReachable","仅几何可达")}${checkbox("highEnergyOnly","有 FHL 关联")}${checkbox("selectedOnly","仅已加入")}</div>
        <p class="note">能流：0.1–100 GeV（erg cm⁻² s⁻¹），只在本库内比较。FHL 关联不表示 LACT 探测。已加入 ${WBCatalog.selected.size} 个。</p>
        <div class="scroll-x"><table class="t"><thead><tr><th>名称</th><th>类型</th><th>显著性 σ</th><th>能流</th><th>FHL</th><th>操作</th></tr></thead>
        <tbody>${show.map(s=>`<tr><td><button class="chip" data-act="wbSource" data-arg="${U.esc(s.id)}">${U.esc(s.name)}</button></td><td>${U.esc(s.fermi.classCode||"未提供")}</td><td>${WBCatalog.num(s.fermi.significance)}</td><td>${WBCatalog.num(s.fermi.energyFlux?.value,true)}</td><td>${U.esc(s.fermi.highEnergyAssociations.join("、")||"无")}</td><td><button class="btn" data-act="wbFermiPick" data-arg="${U.esc(s.id)}">${WBCatalog.selected.has(s.id)?"移除":"加入窗口表"}</button> <button class="btn" data-act="wbAddSource" data-arg="${U.esc(s.id)}">加入任务</button></td></tr>`).join("")}</tbody></table></div>

    }
    return WBBulk.render(close);
  },
  num(v, sci){return U.fin(v)?(sci?v.toExponential(3):U.n(v,2)):"未提供";},
  savePrivate(){
    U.store.set("wb-catalog-private",WBCatalog.local); App.render();
  },

    if(form) form.onsubmit=e=>{

};

"use strict";
/* Spreadsheet-pasted CSV/TSV stays local. The old quoted-cell parser is reused;
   the mapping below translates into the scheduler's current task contract. */
const WBBulk = {
  parsed:null, map:{}, note:"", text:"", excluded:new Set(),
  fields:[
    ["name","名称或目录别名",["name","source","源名","源名称","名称"]],
    ["id","目录 ID",["id","catalogid","sourceid","目录id"]],
    ["ra","赤经",["ra","radeg","赤经","赤经度"]],
    ["dec","赤纬",["dec","decdeg","赤纬","赤纬度"]],
    ["frame","坐标系",["frame","坐标系"]],
    ["coord","坐标单位",["coordinateunit","坐标单位"]],
    ["elo","能段下限",["emin","energymin","能段下限"]],
    ["ehi","能段上限",["emax","energymax","能段上限"]],
    ["eunit","能段单位",["energyunit","能段单位"]],
    ["hours","批准时长 h",["approvedhours","approvedh","hours","批准时长h","申请曝光h"]],
    ["minutes","批准时长 min",["approvedmin","minutes","批准时长min"]],
    ["radius","ROI 半径 °",["radiusdeg","roiradiusdeg","roi","roi半径","roi半径度"]],
    ["sigma","高斯 σ °",["sigmadeg","sigma","高斯σ"]],
    ["tier","等级",["tier","等级"]],
  ],
  norm(s){return String(s??"").normalize("NFKC").trim().toLowerCase().replace(/[\s_/.°()\[\]-]+/g,"");},
  set(text){
    WBBulk.text=text;
    WBBulk.parsed=WBOldCatalog.parseSourceTable(text);
    WBBulk.excluded=new Set();
    const headers=WBBulk.parsed.headers;
    WBBulk.map=Object.fromEntries(WBBulk.fields.map(([id,_,aliases])=>[
      id,headers.findIndex(h=>aliases.includes(WBBulk.norm(h)))]));
  },
  rows(){
    if(!WBBulk.parsed)return [];
    const n=WBBulk.norm, mapping=WBBulk.map, chosen=Object.values(mapping).filter(i=>i>=0);
    const sources=WBCatalog.active().concat(WBCatalog.cache.fermi||[]);
    return WBBulk.parsed.rows.map(row=>{
      try{
        if(row.parseErrors?.length)throw Error(row.parseErrors.join("；"));
        if(new Set(chosen).size!==chosen.length)throw Error("同一列被映射了两次");
        const get=k=>String(row.values?.[WBBulk.parsed.headers[mapping[k]]]??"").trim();
        const val=k=>{const v=get(k);if(!v)return null;const x=Number(v);if(!U.fin(x))throw Error(k+" 必须是有限数值");return x;};
        const name=get("name"), id=get("id"), hits=new Map();
        for(const s of sources){
          if(id ? n(s.id)===n(id) : name && [s.name,...(s.aliases||[])].some(a=>n(a)===n(name))) hits.set(s.id,s);
        }
        if(hits.size>1&&(val("ra")==null||val("dec")==null))throw Error("名称对应多个目录，请给目录 ID 或精确坐标");
        const s=hits.size===1?[...hits.values()][0]:null;
        const ra=val("ra")??s?.ra_deg,dec=val("dec")??s?.dec_deg;
        if(!U.fin(ra)||ra<0||ra>=360||!U.fin(dec)||Math.abs(dec)>90)throw Error("须给有效赤经赤纬（度）或唯一目录源");
        if(get("frame")&&!["icrs","fk5","j2000","fk5j2000"].includes(n(get("frame"))))throw Error("坐标系须为 ICRS 或 FK5/J2000");
        if(get("coord")&&!["deg","degree","degrees","度",""].includes(n(get("coord"))))throw Error("坐标单位须为度");
        const draft=s?WBCatalog.draft(s):WBCatalog.draft({id:id||name||("import-"+row.rowNumber),name:name||id,ra_deg:ra,dec_deg:dec});
        if(!draft.name)throw Error("缺名称");
        draft.ra_deg=ra;draft.dec_deg=dec;
        let lo=val("elo"),hi=val("ehi");
        if(lo!==null||hi!==null){
          const unit=n(get("eunit"));
          if(!["","tev","gev"].includes(unit))throw Error("能段单位须为 TeV 或 GeV");
          if(!(lo>0&&hi>lo))throw Error("能段须为两个递增正数");
          if(unit==="gev"){lo/=1000;hi/=1000;}
          draft.energy_band_tev=[lo,hi];
        }
        const mins=val("minutes"), hrs=val("hours");
        if(mins!=null&&hrs!=null)throw Error("批准时长只映射一种单位");
        if((mins!=null&&mins<=0)||(hrs!=null&&hrs<=0))throw Error("批准时长须为正数");
        draft.approved_min=mins??(hrs==null?null:hrs*60);
        const radius=val("radius"),sigma=val("sigma");
        if(radius!=null&&sigma!=null)throw Error("ROI 和 σ 只填一种");
        if((radius!=null&&radius<0)||(sigma!=null&&sigma<=0))throw Error("延展半径/σ 无效");
        draft.radius_deg=radius??(sigma==null?draft.radius_deg:sigma*WBPolicy.get("catalog_import").gaussian_sigma_multiplier);
        draft.kind=draft.radius_deg>0?"extended":"point";
        const tier=val("tier");
        if(tier!=null&&![1,2,3].includes(tier))throw Error("等级须为 1、2 或 3");
        draft.tier=tier??draft.tier;
        const existing=App.state.inp?.table?.tasks || Data.tasks(Data.ws()) || [];
        const neighbours=WBCatalog.nearby(draft,existing).map(t=>t.name||t.id);
        return {number:row.rowNumber,draft,source:s?.catalog||null,error:null,neighbours};
      }catch(e){return {number:row.rowNumber,error:e.message};}
    });
  },
  render(close){
    const rows=WBBulk.rows(), heads=WBBulk.parsed?.headers||[];
    return `<section class="card" data-wb-import><div class="card-h"><h2>批量导入 · CSV / TSV / Excel 粘贴</h2>${close}</div>
      <p class="note">读列后可手动映射。无目录匹配时可给 ICRS/FK5 J2000 度坐标；显式能量允许 TeV 或 GeV。没有批准量的行只加入草稿。</p>
      <div class="wb-cat-toolbar"><label class="btn">打开源表<input type="file" class="hidden" accept=".csv,.tsv,.txt,.json,.yaml,.yml" data-change="wbBulkFile"></label><button class="btn" data-act="wbBulkParse">读取列</button>
      <button class="btn" data-act="wbBulkTemplate">下载 CSV 模板</button>
      <span class="small muted">也接受旧版源表 JSON / YAML；原生任务合同用上方“导入源表”。</span></div>
      <textarea id="wb-bulk-text" rows="5" aria-label="粘贴源表" placeholder="可直接粘贴 Excel 单元格">${U.esc(WBBulk.text)}</textarea>
      ${WBBulk.note?`<p role="status">${U.esc(WBBulk.note)}</p>`:""}
      ${heads.length?`<div class="wb-cat-toolbar">${WBBulk.fields.map(([id,l])=>`<label>${l} <select data-change="wbBulkMap" data-arg="${id}"><option value="-1">不使用</option>${heads.map((h,i)=>`<option value="${i}" ${i===WBBulk.map[id]?"selected":""}>${U.esc(h)}</option>`).join("")}</select></label>`).join("")}</div>
      <div class="scroll-x"><table class="t"><thead><tr><th>选择</th><th>行</th><th>名称</th><th>目录匹配</th><th>能段 TeV</th><th>批准 min</th><th>检查</th></tr></thead><tbody>${rows.map(r=>`<tr><td><input type="checkbox" aria-label="导入第 ${r.number} 行" data-change="wbBulkSelect" data-arg="${r.number}" ${r.draft&&!WBBulk.excluded.has(r.number)?"checked":""} ${r.draft?"":"disabled"}></td><td>${r.number}</td><td>${U.esc(r.draft?.name||"")}</td><td>${U.esc(r.source||"未提供")}</td><td>${U.esc(r.draft?.energy_band_tev?.join("–")||"未提供")}</td><td>${WBCatalog.num(r.draft?.approved_min)}</td><td>${U.esc(r.error||(r.draft.approved_min==null?"待填批准量":"可加入"))}${r.neighbours?.length?`<br><span class="warn">邻近任务：${U.esc(r.neighbours.join("、"))}</span>`:""}
      <details><summary>原行</summary><pre>${U.esc(JSON.stringify(WBBulk.parsed.rows.find(x=>x.rowNumber===r.number)?.values||{},null,2))}</pre></details></td></tr>`).join("")}</tbody></table></div>
      <button class="btn primary" data-act="wbBulkAdd" ${rows.some(r=>r.draft&&!WBBulk.excluded.has(r.number))?"":"disabled"}>把选中有效行加入源表</button>`:""}</section>`;
  },
};

"use strict";
/* 数据层：三种来源（结果包 results_bundle.js / 本机打开的 JSON 文件 / 本机工作台服务），
   统一整理成“结果组”（一夜的当夜 + 近期 + 全期结果，以及可选的可视化附件、全年账等）。
   页面只读结果里的数；结果里没有的显示“未提供”。 */

const Data = {
  list: [], cur: null, ready: false, seasons: [], acceptance: null, bundleInfo: null,
  server: {on: false, token: null, config: null, error: null, jobs: []},
  loading: null,

  /* 主索引列出可选的回放批次。只有选择时才加载对应的分卷。 */
  sourceId: "latest", replayView: null, mainIndex: null, base: "", sourceError: null,
  sources(){
    if (globalThis.LACT_PUBLIC) return globalThis.LACT_PUBLIC_EXAMPLE ? [globalThis.LACT_PUBLIC_EXAMPLE] : [];
    const main = Data.mainIndex || window.LACT_LATEST, list = [{id: "latest", label: "最新批次", short: "最新批次", note: "后端最近一次排班写出的结果"}];
    for (const s of (Array.isArray(main?.sources) ? main.sources : [])) {
      if (!s || !/^[A-Za-z0-9_.-]+$/.test(s.id || "")) continue;
      const old = list.find(x => x.id === s.id);
      if (old) { for (const [k, v] of Object.entries(s)) if (old[k] == null) old[k] = v; } else list.push({...s});
    }
    return list;
  },
  sourceChoices(current = Data.sourceId){
    const visible = ["latest", "shadow_2026_11_none_approve", current];
    return Data.sources().filter(source => visible.includes(source.id));
  },
  source(){ return Data.sources().find(s => s.id === Data.sourceId) || Data.sources()[0]; },
  pickSource(){
    let id = null;
    try { id = new URLSearchParams(location.search).get("source"); } catch (e) {}
    const choices = id ? Data.sources() : Data.sourceChoices(null);
    const selected = id || U.store.get("source", "latest");
    return choices.find(source => source.id === selected && selected !== "latest") || null;
  },
  /* 只认相对路径的 .js 文件，用 <script> 读（双击打开时不能 fetch） */
  script(path){
    if (!/^(?:\.\.\/)*(?:[A-Za-z0-9_-][A-Za-z0-9_.-]*\/)*[A-Za-z0-9_-][A-Za-z0-9_.-]*\.js$/.test(path))
      return Promise.reject(Error("不认识的数据路径 " + path));
    return new Promise((resolve, reject) => {
      const el = document.createElement("script");
      el.src = path;
      el.onload = () => { el.remove(); resolve(); };
      el.onerror = () => { el.remove(); reject(Error("找不到 " + path)); };
      document.head.append(el);
    });
  },
  async loadSource(src){
    const main = window.LACT_LATEST;
    const path = src.index;
    if (!path) throw Error("这一批没有索引路径");
    try {
      await Data.script(path);
      const index = window.LACT_LATEST;
      if (index === main || index?.schema !== "lact-local-results" || index.view?.mode !== "night_replay")
        throw Error(path + " 不是逐夜回放索引");
      return {index, base: path.replace(/[^/]*$/, "")};
    } finally {
      window.LACT_LATEST = main;
    }
  },

  localScripts: new Map(),
  localScript(path, base = ""){
    if (!/^(?:results_bundle\.js|sky_months\.js|catalogs\/(?:sources|fermi-sources|stars)\.js|windows_\d{4}(?:_\d{2})?\.js|exposure_[A-Za-z0-9_.-]+\.js)$/.test(path))
      return Promise.reject(Error("未知本地数据文件"));
    path = base + path;
    if (!Data.localScripts.has(path)) Data.localScripts.set(path, new Promise((resolve,reject) => {
      const script = document.createElement("script");
      script.src = path;
      script.onload = () => { script.remove(); resolve(); };
      script.onerror = () => { script.remove(); reject(Error("找不到 " + path)); };
      document.head.append(script);
    }).catch(e => { Data.localScripts.delete(path); throw e; }));
    return Data.localScripts.get(path);
  },
  async loadLegacy(){
    await Data.localScript("results_bundle.js");
    if (window.LACT_RESULTS?.schema !== "lact-local-results") throw Error("历史包格式未识别");
    Data.addBundle(window.LACT_RESULTS,"results_bundle.js");
    App.render();
  },
  exposureCache: new Map(),
  async loadExposure(w=Data.ws()){
    if (!w) return null;
    if (w.exposure) return w.exposure;
    const file=w.meta?.exposure_file;
    if (!file) return null;
    // Scripts assign the same documented global; capture each one before loading another.
    if (!Data.exposureCache.has(file)) {
      const run=()=>Data.localScript(file, Data.base).then(()=>{
        const value=window.LACT_EXPOSURE;
        delete window.LACT_EXPOSURE;
        if (value?.schema!=="lact-exposure") throw Error("曝光分卷格式未识别");
        return value;
      });
      const promise=(Data.exposureQueue||Promise.resolve()).then(run,run);
      Data.exposureQueue=promise;
      Data.exposureCache.set(file,promise);
    }
    w.exposure=await Data.exposureCache.get(file);
    return w.exposure;
  },

  current(){ return Data.list.find(w => w.id === Data.cur) || Data.list[0] || null; },
  night(){ return App.state.observingNight || Data.replayView?.default_date || U.ymd(Date.now()); },
  workspaceNight(w){
    return w?.tonight?.night_local_date || w?.ver?.night_local_date || w?.job?.date || w?.meta?.date ||
      w?.near?.night_local_date || w?.long?.night_local_date || w?.reports?.night_local_date || null;
  },
  nightVersions(date=Data.night()){
    return Data.list.filter(w => Data.workspaceNight(w) === date);
  },
  annualWorkspace(){
    const published = Data.list.filter(w => w.origin === "latest").sort((a, b) =>
      (Data.workspaceNight(b) || "").localeCompare(Data.workspaceNight(a) || "") ||
      Number(!!b.meta?.preferred) - Number(!!a.meta?.preferred));
    // A replay index identifies one published planning snapshot for all years.
    if (Data.replayView) return published.find(w => w.meta?.preferred && w.meta.date === Data.replayView.default_date) || published[0] || null;
    const explicit = Data.list.find(w => w.id === Data.annualSelection);
    if (explicit) return explicit;
    const year = String(App.state.yr?.year || "");
    const yearPlan = year && published.find(w => Data.workspaceNight(w)?.slice(0, 4) === year);
    if (yearPlan || published[0]) return yearPlan || published[0];
    const server = Data.list.filter(w => w.origin === "server");
    const latestServer = rows => rows.sort((a, b) => (b.ver?.created_utc || b.job?.created_utc || "").localeCompare(a.ver?.created_utc || a.job?.created_utc || ""))[0];
    const currentServer = latestServer(server.filter(w => ["reported", "executing", "confirmed"].includes(w.status))) || latestServer(server);
    return currentServer || Data.list.find(w => w.origin !== "recent_replay") || Data.list[0] || null;
  },
  ws(){
    if (App.annualView()) return Data.annualWorkspace();
    const current = Data.current();
    if (!App.nightly()) return current;
    const date = Data.night(), versions = Data.nightVersions(date);
    if (Data.replayView && versions.length) {
      const published = versions.find(w => w.meta?.preferred) || versions[0];
      return (App.state.route !== "report" && published.planCorrection) || published;
    }
    if (versions.includes(current)) return current;
    if (versions.length) return versions.find(w => w.origin === "server" && ["confirmed", "executing", "reported"].includes(w.status)) ||
      versions.find(w => w.origin === "server") || versions.find(w => w.meta?.preferred) || versions.find(w => w.origin === "latest") || versions[0];
    if (App.state.route !== "tonight") return null;
    // On the planning page an attached preview can cover a day with no standalone plan.
    const forecasts = [current, ...Data.list].filter(w => w && !w.error);
    return forecasts.find(w => Object.values(w.previews || {}).some(p => p.night_local_date === date && p.preview_of === w.tonight?.plan_id)) ||
      forecasts.find(w => w.near?.inputs?.near_lower?.dates?.includes(date)) ||
      forecasts.find(w => !w.loaded && !Data.isReplay(w) && U.isDay(Data.workspaceNight(w)) &&
        Data.workspaceNight(w) < date && Data.workspaceNight(w) >= U.addDays(date, -2)) || null;
  },
  isReplay(w=Data.ws()){ return w?.origin === "recent_replay" || w?.meta?.replay?.synthetic === true; },
  recentReplay(){ return Data.list.filter(w => Data.isReplay(w) && w.meta?.exposure_file).at(-1); },
  select(id){
    const w = Data.list.find(item => item.id === id);
    if (!w) return;
    Data.cur = id;
    if (!Data.replayView) U.store.set("ws", id);
    const date = Data.workspaceNight(w);
    if (U.isDay(date)) App.setNight(date);
    if (w && w.caseFile && !w.loaded) Data.loadCase(w);
    else if (w && w.lazy && !w.loaded) Data.loadServerJob(w); else Data.enrich(w);
  },

  add(w){
    const i = Data.list.findIndex(x => x.id === w.id);
    if (i >= 0) Data.list[i] = Object.assign(Data.list[i], w); else Data.list.push(w);
    return w;
  },

  async boot(){
    // 最新结果（后端每次排班后写 docs/results_latest.js）优先；验收结果包 results_bundle.js 保留
    const N = window.LACT_LATEST, B = window.LACT_RESULTS;
    Data.mainIndex = N;
    // 公开版只读一份模拟示例（build.py --public 导出的回放），不读排班结果、近期回放和本机工作台
    const src = globalThis.LACT_PUBLIC ? globalThis.LACT_PUBLIC_EXAMPLE || null : Data.pickSource();
    if (src) {
      // 逐夜回放批次：只读这一批的索引，不读最新批次、历史包、近期回放和本机工作台作业，免得两批混在一起
      try {
        const {index: R, base} = await Data.loadSource(src);
        Data.sourceId = src.id; Data.base = base;
        Data.replayView = {...R.view, source: src, generated_utc: R.generated_utc};
        Data.addBundle(R, src.label, "latest");
        Data.attachReplayCorrections(src.id);
        const day = R.view.default_date;
        Data.cur = (Data.list.find(w => w.meta?.preferred && w.meta.date === day) || Data.list.filter(w => w.meta?.date <= day).pop() || Data.list[0])?.id;
        Data.ready = true;
        const w = Data.ws();
        if (!App.independent() && w?.caseFile && !w.loaded) await Data.loadCase(w);
        else if (w?.loaded) Data.enrich(w);
        return;
      } catch (e) {
        Data.sourceError = (src.label || src.id) + "：" + (e.message || e) + (globalThis.LACT_PUBLIC ? "。" : "。已改回最新批次。");
        Data.list = []; Data.replayView = null; Data.sourceId = "latest"; Data.base = "";
      }
    }
    if (globalThis.LACT_PUBLIC) { Data.ready = true; return; }
    if (N && N.schema === "lact-local-results") Data.addBundle(N, "results_latest.js", "latest");
    if (B && B.schema === "lact-local-results") Data.addBundle(B, "results_bundle.js");
    if (typeof LACT_RECENT_REPLAYS !== "undefined" && LACT_RECENT_REPLAYS?.schema === "lact-local-results")
      Data.addBundle(LACT_RECENT_REPLAYS, "近期排班回放", "recent_replay");
    await Data.restore();
    if (/^https?:$/.test(location.protocol)) await Data.probeServer();
    const saved = U.store.get("ws", null), savedW = Data.list.find(w => w.id === saved);
    const first = Data.list.find(w => w.origin === "server") || Data.list.find(w => w.id === Data.latestDefault) || Data.list.find(w => w.origin === "latest") || Data.list[0];
    // 记住的是旧结果包、而现在有了更新的结果时，默认换到最新的
    const stale = savedW && savedW.origin === "bundle" && first && first.origin !== "bundle";
    Data.cur = savedW && !stale ? saved : (first && first.id);
    Data.ready = true;
    const w = Data.ws();
    const independent = App.independent();
    if (!independent && w && w.caseFile && !w.loaded) await Data.loadCase(w);
    else if (!independent && w && w.lazy && !w.loaded) await Data.loadServerJob(w);
    else if (w?.loaded) Data.enrich(w);
  },

  attachReplayCorrections(source){
    const corrections = window.LACT_PLAN_CORRECTIONS;
    if (!Array.isArray(corrections)) return;
    for (const meta of corrections) {
      if (meta.source !== source || !/^results_latest_[A-Za-z0-9_.-]+\.js$/.test(meta.file)) continue;
      const archived = Data.list.find(w => w.meta?.id === meta.archive_case && w.meta.preferred &&
        w.meta.date === meta.date && w.meta.plan_id === meta.archive_plan_id);
      if (!archived) continue;
      const replay = {synthetic:true, scenario_label:"单夜修正复验", gcn:archived.meta.replay?.gcn || [],
        simulated_approval:archived.meta.replay?.simulated_approval};
      archived.planCorrection = {id:"correction:" + meta.id, label:meta.label, origin:archived.origin,
        meta:{...meta, replay}, caseFile:meta.file, loaded:false, audits:[], files:[]};
    }
  },

  addBundle(B, name, origin = "bundle"){
    const replay=origin==="recent_replay";
    const info = {name, batch: B.batch && B.batch.id, generated: B.generated_utc, notes: B.notes || []};
    if (!replay) {
      if (origin === "latest") Data.latestInfo = info; else Data.bundleInfo = info;
      if (B.acceptance && (origin === "bundle" || !Data.acceptance)) Data.acceptance = B.acceptance;
      if (B.landing_assessment) Data.landingAssessment = B.landing_assessment; // 批次落地读数（lact-v1-landing-readout）
      if (B.season) Data.season = B.season;                                      // 整季模拟摘要（逐夜、月账）
      if (B.params_version && origin === "latest") info.params = B.params_version;
      const seasons = (B.seasons || []).map(s => ({
        id: s.id, label: s.id.replace("season-", "整季模拟 · "),
        daily: s.daily_columns ? (s.daily || []).map(row => Object.fromEntries(s.daily_columns.map((k, i) => [k, row[i]]))) : (s.daily || []),
        summary: s.summary || {}, synthetic: s.summary && s.summary.synthetic,
      }));
      if (origin === "latest") {
        Data._latestSeasons = seasons;
        if (!B.season && seasons[0]) {
          const primary = seasons[0];
          Data.season = {...primary.summary, id: primary.id, label: primary.label, nights: primary.daily};
        }
      } else Data._bundleSeasons = seasons;
      // 最新批次的整季摘要排在最前（全年夜历默认叠它），验收结果包里的旧整季排在后面
      const S0 = Data.season, sl = S0 && Array.isArray(S0.nights) ? [{id: S0.id || "season-latest", label: "最新批次 · " + (S0.label || S0.id || "整季模拟"), daily: S0.nights, summary: {start: S0.start, end: S0.end, nights: S0.nights.length, clear_nights: S0.nights.filter(n => n.clear).length, tasks: Array.isArray(S0.tasks) ? S0.tasks : []}, synthetic: S0.synthetic !== false}] : [];
      Data.seasons = ((Data._latestSeasons || []).length ? Data._latestSeasons : sl).concat(Data._bundleSeasons || []);
    }
    // 默认先看离今天最近的、还没过去的那一夜（没有就看最近过去的那一夜）；列表按观测夜从早到晚
    const today = U.ymd(Date.now()), score = c => { const d = c.date || "1970-01-01"; return d >= today ? U.dayMs(d) - U.dayMs(today) : 1e13 + (U.dayMs(today) - U.dayMs(d)); };
    const ordered = (B.cases || []).slice().sort(U.by(score));
    if (origin === "latest" && ordered[0]) Data.latestDefault = origin + ":" + ordered[0].id;
    for (const c of (B.cases || []).slice().sort(U.by(c => (c.date || "") + (c.label || "")))) {
      if (replay && (!/^recent-\d{4}-\d{2}-\d{2}$/.test(c.id || "") || c.replay?.synthetic !== true)) continue;
      const w = {id: origin + ":" + c.id, label: c.label || c.id, origin, sub: (B.batch && B.batch.id) || "", loaded: true, audits: [], files: [], meta: c};
      if (c.plans) Data.attachCase(w, c);
      else if ((replay ? /^results_replay_recent_\d{4}-\d{2}-\d{2}-[a-f0-9]{16}\.js$/ : /^results_latest_[A-Za-z0-9_.-]+\.js$/).test(c.file || "")) {
        w.loaded = false; w.caseFile = Data.base + c.file;
        if (c.bytes) w.sub += " · " + U.n(c.bytes / 1048576, 1) + " MB";
      } else if (replay) continue;
      Data.add(w);
    }
  },

  /* 一例的各份结果；按指纹共用的 inputs 在这里还原（拆分后的结果包） */
  attachCase(w, c){
    const shared = c.shared_inputs || {};
    if (c.filler_suggestions) w.fillerSuggestions = c.filler_suggestions;
    if (c.too_comparisons) w.tooComparisons = c.too_comparisons;   // 逐夜回放：告警前后逐段对照
    if (c.too) w.replayEvents = c.too;
    if (c.replay_removed) w.replayRemoved = c.replay_removed;     // 逐夜回放：被天气 / 告警移出或截短的原计划段
    for (const p of c.plans || []) {
      const r = p.result;
      if (r && p.inputs_ref) {
        if (!Object.hasOwn(shared, p.inputs_ref)) throw Error("结果分卷缺少输入 " + p.inputs_ref);
        r.inputs = shared[p.inputs_ref];
      }
      if (Data.isReplay(w) && r?.schema === "lact-pipeline-feedback" && r.synthetic === true &&
          r.plan_id === w.meta.plan_id && Array.isArray(r.reports)) {
        Data.attach(w, {...r, schema:"lact-run-report"}, p.source_path || p.name);
      } else Data.attach(w, r, p.source_path || p.name);
    }
  },
  async unpackCase(c){
    if (!c || !c.encoding) return c;
    if (c.encoding !== "gzip-base64" || typeof DecompressionStream !== "function")
      throw Error("浏览器不支持结果分卷解压");
    const bytes = Uint8Array.from(atob(c.data), ch => ch.charCodeAt(0));
    const raw = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    return JSON.parse(raw);
  },
  /* file:// 下不能 fetch，用插入 <script> 的方式加载这一例 */
  loadCase(w){
    if (w.loaded) return Promise.resolve(w);
    if (w.loading) return w.loading;
    const id = w.meta.id;
    w.loading = new Promise(res => {
      const done = async () => {
        try {
          const c = await Data.unpackCase((window.LACT_LATEST_CASES || {})[id]);
          if (!c || c.id !== id || c.plan_id !== w.meta.plan_id) throw Error("没有读到匹配的结果组 " + w.caseFile);
          Data.attachCase(w, c); w.loaded = true; w.error = null;
        } catch (e) { w.error = e.message || String(e); }
        finally {
          if (window.LACT_LATEST_CASES) delete window.LACT_LATEST_CASES[id];
          el.remove(); w.loading = null; Geom.cache.clear(); res(); App.render();
        }
      };
      const el = document.createElement("script"); el.src = w.caseFile;
      el.onload = done; el.onerror = done;
      document.head.appendChild(el);
    });
    App.render();
    return w.loading;
  },

  /* 按 schema / kind 把一份 JSON 放进结果组 */
  classify(doc){
    if (!doc || typeof doc !== "object") return null;
    if (Array.isArray(doc)) return doc.length && doc[0] && doc[0].schema === "lact-run-report" ? "reports" : null;
    const s = doc.schema || "";
    if (s === "lact-local-results") return "bundle";
    if (s === "lact-exposure") return "exposure";
    if (s === "lact-result-visualization") return "viz";
    if (s === "lact-annual-account") return "annual";
    if (s === "lact-run-report" || (Array.isArray(doc.reports) && /run-report/.test(s))) return "reports";
    if (s === "lact-pointing") return "pointing";
    if (s === "lact-conditions") return "conditions";
    if (s === "lact-task-table" || (Array.isArray(doc.tasks) && !doc.visits)) return "tasks";
    if (s === "lact-alert") return "alert";
    if (/ledger/.test(s) || (doc.accepted && doc.reports && !doc.visits)) return "ledger";
    if (Array.isArray(doc.visits) && ["tonight", "near_term", "long_term", "preview"].includes(doc.kind)) return "plan";
    if (doc.passed !== undefined && Array.isArray(doc.checks)) return "audit";
    return null;
  },
  attach(w, doc, name){
    const k = Data.classify(doc);
    if (k === "plan" && doc.kind === "preview") (w.previews ||= {})[doc.night_offset] = doc;
    else if (k === "plan") { const slot = {tonight: "tonight", near_term: "near", long_term: "long"}[doc.kind]; w[slot] = doc; }
    else if (k === "viz") { if (!w.viz || !(w.tonight && w.viz.source_plan_id === w.tonight.plan_id)) w.viz = doc; }
    else if (k === "annual") {
      // 同一年有多份全年账时，优先用全期结果生成的那份（含全期分配）
      const A = (w.annuals = w.annuals || {}), y = doc.year || "?", old = A[y];
      const rank = d => d.source_kind === "long_term" || /long[_-]term$/.test(d.source_plan_id || "") ? 2 : d.source_kind === "tonight" ? 1 : 0;
      if (!old || rank(doc) >= rank(old)) A[y] = doc;
      w.annual = A[Object.keys(A).sort()[0]];
    }
    else if (k === "audit") (w.audits = w.audits || []).push(doc);
    else if (k === "reports" && Array.isArray(doc)) w.reports = {schema: "lact-run-report", interface_version: "v1", reports: doc};
    else if (k) w[k] = doc;
    (w.files = w.files || []).push({name, kind: k || "未识别"});
    return k;
  },

  /* 本机打开的文件：按 plan_id 分组（当夜 P、近期 P-near_term、全期 P-long_term 归为一组），
     全年账和可视化附件按 source_plan_id 归到对应的组；打开过的文件存进浏览器（IndexedDB），刷新后还在。 */
  planKey(id){ return String(id || "").replace(/-(near|long)[_-]term$/, ""); },
  async openFiles(fileList, opts = {}){
    const docs = [];
    for (const f of fileList) {
      try {
        let text = await f.text();
        if (/\.js$/i.test(f.name)) { const i = text.indexOf("{"), j = text.lastIndexOf("}"); text = text.slice(i, j + 1); }
        docs.push({name: f.name, text, doc: JSON.parse(text)});
      } catch (e) { docs.push({name: f.name, error: String(e.message || e)}); }
    }
    const report = [], groups = new Map(), loose = [];
    const group = key => {
      if (!groups.has(key)) {
        const old = Data.list.find(x => x.origin === "files" && x.key === key);
        groups.set(key, old || {id: "files:" + key, key, label: "本机文件", origin: "files", sub: "", loaded: true, audits: [], files: []});
      }
      return groups.get(key);
    };
    for (const d of docs) {
      if (d.error) { report.push(d.name + "：读不了（" + d.error + "）"); continue; }
      const k = Data.classify(d.doc);
      if (k === "bundle") { Data.addBundle(d.doc, d.name); report.push(d.name + "：结果包"); continue; }
      if (k === "plan") { const w = group(Data.planKey(d.doc.preview_of || d.doc.plan_id)); Data.attach(w, d.doc, d.name); report.push(d.name + "：排班结果（" + ({tonight: "当夜", near_term: "近期", long_term: "全期", preview: "预览"}[d.doc.kind]) + "）"); continue; }
      loose.push(d);
    }
    for (const d of loose) {
      const k = Data.classify(d.doc);
      if (!k) { if (!opts.quietUnknown) report.push(d.name + "：不是页面用得上的格式，跳过"); continue; }
      if ((k === "viz" || k === "annual") && d.doc.source_plan_id) {
        const key = Data.planKey(d.doc.source_plan_id);
        const w = groups.get(key) || Data.list.find(x => [x.tonight, x.near, x.long].some(p => p && Data.planKey(p.plan_id) === key));
        if (w) { Data.attach(w, d.doc, d.name); report.push(d.name + "：" + Data.kindLabel(k) + (k === "annual" ? " " + d.doc.year : "")); continue; }
      }
      const w = groups.size ? [...groups.values()][groups.size - 1] : (Data.ws() || group("loose"));
      const got = Data.attach(w, d.doc, d.name);
      report.push(d.name + "：" + (got ? Data.kindLabel(got) : "未识别的格式"));
    }
    let pick = null;
    for (const w of groups.values()) {
      const p = w.tonight || w.long || w.near;
      if (p) w.label = (p.night_local_date || "") + " · " + (w.annuals && Object.keys(w.annuals).length ? "自然月 · " : "") + "本机文件";
      w.sub = (p && p.plan_id) || "";
      Data.add(w);
      if (!pick || (p && (Data.anyPlan(pick) || {}).night_local_date < p.night_local_date)) pick = w;
    }
    if (pick && !opts.restore) {
      if (App.annualView()) Data.annualSelection = pick.id;
      else Data.select(pick.id);
    }
    if (!opts.restore) { Data.lastOpen = report; await Data.remember(docs.filter(d => !d.error)); }
  },
  /* 打开过的文件存在这个浏览器的 IndexedDB 里，只在本机，不上传 */
  idb(){ return new Promise((res, rej) => { try { const r = indexedDB.open("lact-workbench", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
  async kv(key, val){
    const db = await Data.idb();

      const r = val === undefined ? st.get(key) : val === null ? st.delete(key) : st.put(val, key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  },
  async remember(docs){
    try {
      const old = (await Data.kv("opened")) || [];
      const names = new Set(docs.map(d => d.name + "|" + (d.doc.plan_id || d.doc.source_plan_id || "") + "|" + (d.doc.year || "")));
      const keep = old.filter(o => !names.has(o.k)).concat(docs.map(d => ({k: d.name + "|" + (d.doc.plan_id || d.doc.source_plan_id || "") + "|" + (d.doc.year || ""), name: d.name, text: d.text})));
      let total = 0; const out = [];
      for (const o of keep.reverse()) { total += o.text.length; if (total > 60e6 || out.length >= 80) break; out.push(o); }
      await Data.kv("opened", out.reverse());
    } catch (e) {}
  },
  async restore(){
    try { const old = await Data.kv("opened"); if (old && old.length) { await Data.openFiles(old.map(o => ({name: o.name, text: async () => o.text})), {restore: true}); Data.restored = old.length; } } catch (e) {}
  },
  async forget(){ try { await Data.kv("opened", null); } catch (e) {} Data.list = Data.list.filter(w => w.origin !== "files"); if (!Data.list.some(w => w.id === Data.cur)) Data.cur = Data.list[0]?.id; Data.restored = 0; Data.lastOpen = null; },
  kindLabel(k){ return ({plan: "排班结果", viz: "可视化附件", annual: "全年账", reports: "夜后回报", pointing: "指向表", conditions: "设置", tasks: "源表", alert: "告警", ledger: "账本", audit: "审核记录"})[k] || k; },

  KIND: {auto: "自动排班", replan: "重排", manual: "人工修订", alert: "告警插入"},
  /* 工作台里的版本（每夜的当夜计划及其修订）和作业 */
  async refreshServer(){
    const [vers, jobs] = await Promise.all([Data.api("/api/versions").catch(() => []), Data.api("/api/jobs").then(r => r.jobs || []).catch(() => [])]);
    Data.server.versions = Array.isArray(vers) ? vers : (vers.versions || []);
    try { Data.server.events = (await Data.api("/api/events")).events || []; } catch (e) {}
    Data.server.jobs = jobs;
    const inVersions = new Set(Data.server.versions.map(v => v.job_id).filter(Boolean));
    for (const v of Data.server.versions) {
      const old = Data.list.find(x => x.id === "ver:" + v.plan_id);
      const label = v.night_local_date + " · " + (Data.KIND[v.revision_kind] || v.revision_kind || "版本");
      Data.add({id: "ver:" + v.plan_id, label, sub: (Data.STATUS[v.status] || v.status || "") + " · " + (v.created_utc ? U.ymd(v.created_utc) + " " + U.hm(v.created_utc) : "") + (v.operator ? " · " + App.opName(v.operator) : ""),
        origin: "server", ver: v, status: v.status, lazy: !(old && old.loaded), loaded: !!(old && old.loaded), audits: v.audit ? [v.audit] : [], files: (old && old.files) || []});
    }
    for (const j of jobs) {
      if (j.status !== "succeeded" || j.action === "feedback" || inVersions.has(j.id)) continue;
      Data.add({id: "job:" + j.id, label: (j.date || (j.plan_id || "").slice(5, 15) || j.id) + " · 作业 " + j.id.slice(-6), sub: j.action + (j.operator ? " · " + App.opName(j.operator) : ""), origin: "server", job: j, lazy: true, loaded: false, audits: [], files: []});

  async loadServerJob(w){
    if (!w || w.loading) return;
    w.loading = true; App.render();
    try {
      if (w.ver) {
        const f = w.ver.files || {};
        for (const k of ["result", "viz", "annual"]) if (f[k]) { const d = await fetch(f[k]).then(r => r.json()); Data.attach(w, d, k + ".json"); }
        if (w.ver.job_id) {
          try { const job = await Data.api("/api/jobs/" + encodeURIComponent(w.ver.job_id)); w.job = job;
            for (const r of job.results || []) if (r.result && r.result.kind !== "tonight") Data.attach(w, r.result, r.name); } catch (e) {}
        }
        if (w.ver.audit) w.audits = [w.ver.audit];
        if (w.ver.files_reason) w.filesReason = w.ver.files_reason;
      } else {
        const job = await Data.api("/api/jobs/" + encodeURIComponent(w.job.id));
        w.job = job;
        for (const r of job.results || []) Data.attach(w, r.result, r.name);
      }
      w.loaded = true;
    } catch (e) { w.error = String(e.message || e); }
    w.loading = false;
    Data.enrich(w);
    App.render();
  },
  /* 后端还没在出结果时写附件的话，向现有接口要一份（只读几何计算） */
  async enrich(w){
    if (!w || !Data.server.on || Data.isReplay(w)) return;
    if (w.tonight && !w.viz && !w.vizReq) {
      w.vizReq = "pending";
      try { const r = await Data.api("/api/visualize", {result: w.tonight}); w.viz = r.visualization; w.vizReq = "ok"; }
      catch (e) { w.vizReq = "失败：" + e.message; }
      App.render();
    }
    // 全年账按自然年给出；规划期跨两年（如 10 月—次年 9 月）时两年都要
    const base = w.long || w.tonight;
    if (base && !w.annualReq) {
      w.annualReq = "pending";
      const p = Data.period(w), y0 = +((p && p.start) || base.night_local_date).slice(0, 4), y1 = +((p && p.end) || base.night_local_date).slice(0, 4);
      const errs = [];
      for (let y = y0; y <= y1; y++) {
        if (w.annuals && w.annuals[y]) continue;
        try { const body = {result: base, year: y}; if (w.job && w.job.id && w.origin === "server") body.job_id = w.job.id;
          const r = await Data.api("/api/annual", body); Data.attach(w, r.annual, "annual-" + y + ".json"); }
        catch (e) { errs.push(y + "：" + e.message); }
      }
      w.annualReq = errs.length ? "失败：" + errs.join("；") : "ok";
      App.render();
    }
  },

  /* —— 取数的小工具 —— */
  anyPlan(w){ w = w || Data.ws(); return w && (w.tonight || w.long || w.near); },
  tasks(w){
    w = w || Data.ws(); if (!w) return [];
    const p = Data.anyPlan(w);
    const fromPlan = (p && p.inputs && p.inputs.tasks) || [];
    const fromTable = (w.tasks && w.tasks.tasks) || [];
    const list = fromPlan.length ? fromPlan : fromTable;
    return list.map((t, i) => {
      const o = Object.assign({}, t, {color: t.display_color || PALETTE[i % PALETTE.length]});
      // 告警任务：页面上一律用告警显示名，原来的名字（往往是内部编号）留在 raw_name，只进悬停
      if (Data.isAlertTask(t)) { const lab = Data.alertLabel(t.id, w); if (lab) { o.raw_name = t.name; o.name = lab; } }
      return o;
    });
  },
  /* ===== 告警的显示名：全站同一规则 =====
     1. 结果里有 display_name 就用它；
     2. 有正式名称（GRB 261121A、IceCube-261121A，或值班录入的目标名）用正式名称；
     3. 都没有：“仪器 + 类别 · 月/日 时:分”（触发时刻，北京时间），例如“GBM GRB · 11/10 22:00”；
     4. 模拟告警前面加“模拟”。
     alert_<哈希>、sample12-demo-…、november-sim-… 这类内部编号只放悬停和“编号”一行。 */
  isAlertTask(t){ return !!t && (/^alert_/.test(String(t.id || "")) || t.alert_event_id != null || t.too_project != null); },
  // 像内部编号的名字：全小写、用 - 或 _ 连起来的一串，或者 alert_/alert-event- 开头，或者长串十六进制
  internalName(n){ n = String(n || ""); return !n || /^alert[-_]/i.test(n) || /^[a-z0-9]+(?:[-_][a-z0-9.]+)+$/.test(n) || /^[0-9a-f]{16,}$/i.test(n); },
  alertIndex(w){
    if (!w || !w.loaded) return null;
    if (w.__alertIdx) return w.__alertIdx;
    const byId = new Map(), fill = (dst, src) => { for (const [k, v] of Object.entries(src || {})) if (v != null && v !== "" && dst[k] == null) dst[k] = v; };
    const pick = Data.alertPick;
    const add = (ids, facts, names = [], extra = {}) => {
      ids = [...new Set(ids.filter(x => x != null && x !== "").map(String))];
      if (!ids.length) return;
      let g = ids.map(id => byId.get(id)).find(Boolean);
      if (!g) g = {ids: new Set(), facts: {}, names: [], arrivals: []};
      for (const id of ids) {
        const o = byId.get(id);
        if (o && o !== g) { for (const x of o.ids) { g.ids.add(x); byId.set(x, g); } fill(g.facts, o.facts); g.names.push(...o.names); g.arrivals.push(...o.arrivals); }
        g.ids.add(id); byId.set(id, g);
      }
      fill(g.facts, facts); g.names.push(...names.filter(Boolean)); fill(g, extra);
    };
    const T = w.tonight || {};
    for (const a of [T.alert, ...Object.values(T.alert_history || {})].filter(Boolean)) {
      const notes = [a.contract, ...(a.notices || [])].filter(Boolean);
      add([a.event_id, a.task_id, ...notes.map(n => n.event_id)], Object.assign({}, ...notes.map(pick).reverse(), pick(a)),
        notes.flatMap(n => [n.display_name, n.official_name, n.grb_name, n.name]), {loc: a.localization_selection});
      const g = byId.get(String(a.task_id || a.event_id));
      if (g) g.arrivals.push(...notes.map(n => U.ms(n.arrival_utc)).filter(x => x != null));
    }
    for (const e of [...(T.events || []), ...(w.meta?.too || [])])
      add([e.event_id, e.alert_id, e.task_id, e.alert_name], Object.assign(pick(e), pick(e.too), pick(e.grb)), [e.display_name, e.official_name, e.grb_name, e.alert_name, e.candidate?.target, e.candidate?.target_name]);
    const p = Data.anyPlan(w), raw = (p?.inputs?.tasks?.length ? p.inputs.tasks : w.tasks?.tasks) || [];
    for (const t of raw) if (Data.isAlertTask(t))
      add([t.id, t.alert_event_id], {display_name: t.display_name, project: t.too_project}, [t.name], {fields: t.fields});
    for (const g of new Set(byId.values())) g.arrival = g.arrivals.length ? Math.min(...g.arrivals) : U.ms(g.facts.received_utc);
    return (w.__alertIdx = byId);
  },
  alertPick(o){
    const KEYS = ["display_name", "source", "notice_type", "project", "too_kind", "alert_class", "instrument", "trigger_utc", "received_utc", "simulated", "synthetic", "selected_configuration"];
    return o ? Object.fromEntries(KEYS.filter(k => o[k] != null && o[k] !== "").map(k => [k, o[k]])) : {};
  },
  // 找一个告警（任务编号、事件编号、告警编号，或事件对象）在已读入结果里的全部信息
  alertFacts(key, w = Data.ws()){
    const ids = typeof key === "object" && key ? [key.task_id, key.event_id, key.alert_id, key.alert_name] : [key];
    for (const v of [w, ...Data.list.filter(x => x !== w)]) {
      const idx = Data.alertIndex(v); if (!idx) continue;
      for (const id of ids) { const g = id != null && idx.get(String(id)); if (g) return Object.assign({w: v}, g); }
    }
    // 没读入的那一夜的事件（例如账本里前几夜的告警）：直接用事件对象自己的字段
    if (typeof key === "object" && key) return {w, ids: new Set(ids.filter(Boolean).map(String)),
      facts: Object.assign(Data.alertPick(key), Data.alertPick(key.too), Data.alertPick(key.grb)),
      names: [key.display_name, key.official_name, key.grb_name, key.alert_name], arrival: U.ms(key.arrival_utc ?? key.received_utc)};
    return null;
  },
  alertInstrument(f){
    const s = [f.notice_type, f.instrument, f.source].filter(Boolean).join(" ");
    return /GBM/i.test(s) ? "GBM" : /\bLAT\b|FERMI_LAT/i.test(s) ? "Fermi-LAT" : /SWIFT|\bBAT\b|XRT|UVOT/i.test(s) ? "Swift"
      : /ICECUBE|AMON/i.test(s) ? "IceCube" : /LHAASO/i.test(s) ? "LHAASO" : /SVOM|ECLAIRS/i.test(s) ? "SVOM"
      : /EINSTEIN|\bEP\b|WXT|FXT/i.test(s) ? "EP" : /LVK|LIGO|VIRGO|KAGRA/i.test(s) ? "LVK" : (f.source || "");
  },
  alertSimulated(f, w){
    const m = w?.meta || {};
    return f.facts?.simulated === true || f.facts?.synthetic === true || m.synthetic_alert === true || m.replay?.synthetic === true
      || [...(f.ids || [])].some(id => /(^|[-_])(sim|demo)([-_]|$)/i.test(id));
  },
  alertLabel(key, w = Data.ws()){
    const f = Data.alertFacts(key, w); if (!f) return null;
    const x = f.facts, sim = Data.alertSimulated(f, f.w) ? "模拟 " : "";
    if (x.display_name) return x.display_name;
    const formal = f.names.find(n => !Data.internalName(n));
    if (formal) return sim + formal;
    const kind = String(x.project || x.too_kind || "").toLowerCase();
    const inst = Data.alertInstrument(x);
    const cat = {grb: "GRB", neutrino: "中微子", lhaaso: "告警", external: "ToO", gw: "引力波"}[kind] || (x.alert_class === "afterglow" ? "GRB 余辉" : "告警");
    const t = U.ms(x.trigger_utc) ?? f.arrival;
    return sim + [inst, cat].filter(Boolean).join(" ") + (t != null ? ` · ${U.md(U.ymd(t))} ${U.hm(t)}` : "");
  },
  // 内部编号放悬停用：告警编号 · 任务编号
  alertIds(key, w = Data.ws()){ const f = Data.alertFacts(key, w); return f ? [...f.ids].filter(id => !/^alert-event-/.test(id) || f.ids.size < 3).join(" · ") : String(key || ""); },
  // 到达时刻（最早一条通知到达；没有就用收到时刻）
  alertArrival(key, w = Data.ws()){ const f = Data.alertFacts(key, w); return f ? f.arrival : null; },
  // 铺场的场：tile4 → “场 5/7”（从 1 开始，和告警页、逐场表一致）；其他子编号照原样
  partName(part, t){
    const m = /^tile(\d+)$/i.exec(String(part || ""));
    if (m && t && Data.isAlertTask(t)) return ` · 场 ${+m[1] + 1}/${(t.fields || []).length || "?"}`;
    return part ? " " + part : "";
  },
  task(id, w){ const base = String(id || "").split(":")[0]; return Data.tasks(w).find(t => t.id === id || t.id === base) || null; },
  color(id, w){ const t = Data.task(id, w); return t ? t.color : "#8C948F"; },
  name(id, w){
    const [base, part] = String(id || "").split(":");
    // 这一版里没有这个任务（比如账本里前几夜的告警目标）时，到其他已读入的结果里找
    const t = Data.task(id, w) || Data.list.filter(v => v !== w && v.loaded).map(v => Data.task(id, v)).find(Boolean);
    const sub = part == null ? "" : Data.partName(part, t);
    if (t) return (t.name || t.id) + sub;
    const lab = /^alert_/.test(base) && Data.alertLabel(base, w);
    if (lab) return lab + sub;
    // 还是找不到：告警目标的编号是一长串哈希，只留类别和前 6 位
    const m = /^alert_(?:([a-z]+)_)?([0-9a-f]{6})[0-9a-f]*$/i.exec(String(id || "").split(":")[0]);
    if (m) return `${{neutrino: "中微子告警", grb: "GRB 告警"}[m[1]] || "告警目标"} ${m[2]}` + sub;
    return String(id || "—");
  },
  period(w){
    const p = Data.anyPlan(w);
    const pp = p && p.inputs && p.inputs.planning_period;
    return pp && pp.start ? pp : null;
  },
  site(w){ const p = Data.anyPlan(w); return (p && p.site) || WBPolicy.get("site"); },
  paramsVersion(w){ const p = Data.anyPlan(w); return (p && p.inputs && p.inputs.params_version) || null; },
  /* 求解质量摘要：证明最优的级数、差距最大的一级（有 gap_abs 时按分钟比），相对差 > 100% 时视为“值很小，不可比” */
  gapInfo(so){
    const lv = (so && so.levels) || [];
    const isOpt = l => /optimal/i.test(l.status || "") && !/not/i.test(l.status || "");
    const rel = l => l.final_gap ?? l.gap;
    const abs = l => l.gap_abs_min ?? (/min/.test(l.gap_abs_unit || "") ? l.gap_abs : null);
    const rows = lv.map(l => ({l, name: l.name, opt: isOpt(l), rel: rel(l), abs: abs(l), absRaw: l.gap_abs, absUnit: l.gap_abs_unit}));
    const notOpt = rows.filter(r => !r.opt);
    let worst = null;
    if (notOpt.some(r => U.fin(r.abs))) worst = notOpt.filter(r => U.fin(r.abs)).sort(U.by(r => -r.abs))[0];
    else if (notOpt.length) worst = notOpt.filter(r => U.fin(r.rel) && r.rel <= 1).sort(U.by(r => -r.rel))[0] || notOpt.sort(U.by(r => -(r.rel || 0)))[0];
    const relText = r => !r ? "—" : U.fin(r.abs) ? U.n(r.abs, 1) + " 分钟" : U.fin(r.rel) && r.rel > 1 ? "该级值很小，相对差不可比" : U.pct(r.rel, 1);
    return {n: lv.length, proven: rows.filter(r => r.opt).length, rows, worst, relText,
      summary: lv.length ? `${rows.filter(r => r.opt).length}/${lv.length} 级证明最优` + (worst ? ` · 差距最大：${Data.levelName(worst.name)} ${relText(worst)}` : "") : "—"};
  },
  levelName(n){
    const s = String(n || ""), m = s.match(/tier\s*(\d)/);
    if (/^expiring/.test(s)) { const t = s.match(/:\s*([^)]+)\)/); return "今晚到期" + (t ? "（" + t[1].trim().split(/\s*,\s*/).map(id => Data.name(id)).join("、") + "）" : ""); }
    if (/package|lower/.test(s)) return "保底（等级 " + (m ? m[1] : "?") + "）";
    if (/^tonight/.test(s)) return "今晚（等级 " + (m ? m[1] : "?") + "）";
    if (/^need/.test(s)) return "需求（等级 " + (m ? m[1] : "?") + "）";
    if (/^tier/.test(s)) return "等级 " + (m ? m[1] : "?");
    if (/over-target/.test(s)) return "超额观测";
    if (/overhead|tie/.test(s)) return "开销与状态偏好";
    if (/earlier/.test(s)) return "尽早完成";
    return s;
  },
  /* 暗时间利用 = 有观测墙钟（各组并集）÷ 暗时间 */
  darkUse(T){
    if (!T) return null;
    const iv = (T.visits || []).map(v => [U.ms(v.start_utc), U.ms(v.end_utc)]).sort((a, b) => a[0] - b[0]);
    let on = 0, cs = null, ce = null; for (const [a, b] of iv) { if (cs == null || a > ce) { if (cs != null) on += ce - cs; cs = a; ce = b; } else ce = Math.max(ce, b); } if (cs != null) on += ce - cs;
    const dw = (T.dark_windows_utc && T.dark_windows_utc.length ? T.dark_windows_utc : T.dark_utc ? [T.dark_utc] : []).reduce((a, p) => a + (U.ms(p[1]) - U.ms(p[0])), 0);
    return dw > 0 ? {on: on / 6e4, dark: dw / 6e4, f: on / dw} : null;
  },
  REPAIR: {not_needed: "不需要", applied: "已修补", repaired: "已修补", unresolved: "未修回", failed: "失败", timeout: "超时", time_limit: "超时", disabled: "未启用", skipped: "跳过", partial: "部分修回"},
  darkDef(){
    const cfg = Data.server.config, c = cfg && cfg.dark_def && (cfg.dark_def.code || cfg.dark_def);
    if (c && U.fin(c.sun_max_deg)) { const ms = cfg.moon_sep; return {sun: c.sun_max_deg, sep: U.fin(ms) ? ms : (ms && (ms.value ?? ms.code)), moonAlt: c.moon_max_alt_deg, src: "工作台登记表"}; }
    const reg = WBPolicy.get("dark_def");
    return {sun:reg?.sun_max_deg ?? null,sep:WBPolicy.get("moon_sep"),moonAlt:reg?.moon_max_alt_deg ?? null,src:"离线登记表"};
  },

  /* 后端合同逐项核对：给测试闭环用，告诉你后端哪些字段已经出现 */
  contract(w){
    w = w || Data.ws();
    const t = w && w.tonight, viz = w && w.viz, an = w && w.annual, p = w && Data.anyPlan(w);
    const visits = (t && t.visits) || [];
    const has = (o, k) => o && o[k] !== undefined && o[k] !== null;
    const sky = viz && viz.sky_samples && viz.sky_samples[0];
    const months = an && an.months;
    const items = [
      ["A1", "当夜可视化附件 <plan_id>.viz.json", !!viz],
      ["A1", "全年账 <plan_id>.annual.json", !!an],
      ["A2", "全年账自然月新字段 dark_min / capacity_min / no_target_min", !!(months && months[0] && has(months[0], "dark_min") && has(months[0], "capacity_min"))],
      ["A3", "源 × 自然月 task_months", !!(an && an.task_months)],
      ["A3", "已观测天顶角分档 task_zenith_hist", !!(an && an.task_zenith_hist)],
      ["A4", "当夜合格时段 eligible_tonight", !!(t && (t.eligible_tonight || (t.progress || []).some(r => r.eligible_tonight)))],
      ["A4", "最短访问/run 与最长转向 limits", !!(t && t.limits)],
      ["A5", "全年夜历 nights", !!(an && an.nights)],
      ["A6", "月亮方位 moon_az_deg 与照明 moon_illumination", !!(sky && has(sky, "moon_az_deg"))],
      ["A6", "未排进计划的源也有整夜轨迹", !!(viz && t && Data.tasks(w).every(tk => viz.source_tracks.some(s => s.task_id === tk.id)))],
      ["B1", "版本关系 parent_plan_id / revision_kind", !!(p && has(p, "revision_kind"))],
      ["B3", "告警决定 events", !!(t && Array.isArray(t.events))],
      ["B4", "访问的 run_id 贯通指向表与回报", !!(visits.length && visits.every(v => v.run_id || (v.runs || []).every(r => r.run_id)))],
      ["B6", "合法性审核记录 audit", !!(w && w.audits && w.audits.length) || !!(p && p.audit)],
      ["§3", "工作台版本库 /api/versions", !!(Data.server.on && Data.server.versions && Data.server.versions.length)],
      ["C2", "延展源分场 inputs.layouts", !!(p && p.inputs && p.inputs.layouts && Object.keys(p.inputs.layouts).length)],
      ["D0", "暗夜条件从登记表读出（/api/config dark_def）", Data.darkDef().src === "工作台登记表"],
    ];
    return items.map(([code, text, ok]) => ({code, text, ok}));
  }
};

"use strict";
/* 低精度天文（约 0.3°），只在后端没给可视化附件 / 夜历时用来画图，图上标“页面近似”。
   不参与任何排班、资格或记分。 */
const Astro = (() => {
  const R = Math.PI / 180, J2000 = Date.UTC(2000, 0, 1, 12);
  const days = ms => (ms - J2000) / 864e5;
  const norm = a => ((a % 360) + 360) % 360;
  const eps = 23.4393 * R;
  function eq(lam, beta){
    const l = lam * R, b = beta * R;
    const ra = Math.atan2(Math.sin(l) * Math.cos(eps) - Math.tan(b) * Math.sin(eps), Math.cos(l));
    const dec = Math.asin(Math.sin(b) * Math.cos(eps) + Math.cos(b) * Math.sin(eps) * Math.sin(l));
    return [norm(ra / R), dec / R];
  }
  function sunEcl(n){ const L = 280.460 + 0.9856474 * n, g = (357.528 + 0.9856003 * n) * R; return norm(L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)); }
  function moonEcl(n){
    const T = n / 36525, s = x => Math.sin(x * R);
    const lam = 218.32 + 481267.881 * T + 6.29 * s(135.0 + 477198.87 * T) - 1.27 * s(259.3 - 413335.36 * T) + 0.66 * s(235.7 + 890534.22 * T)
      + 0.21 * s(269.9 + 954397.74 * T) - 0.19 * s(357.5 + 35999.05 * T) - 0.11 * s(186.5 + 966404.03 * T);
    const beta = 5.13 * s(93.3 + 483202.02 * T) + 0.28 * s(228.2 + 960400.89 * T) - 0.28 * s(318.3 + 6003.15 * T) - 0.17 * s(217.6 - 407332.21 * T);
    return [norm(lam), beta];
  }
  const lst = (n, lon) => norm(280.46061837 + 360.98564736629 * n + lon);
  function altaz(ra, dec, ms, site){
    const n = days(ms), H = (lst(n, site.lon_deg) - ra) * R, d = dec * R, p = site.lat_deg * R;
    const sa = Math.sin(d) * Math.sin(p) + Math.cos(d) * Math.cos(p) * Math.cos(H);
    const alt = Math.asin(U.clamp(sa, -1, 1));
    const az = Math.atan2(-Math.sin(H) * Math.cos(d), Math.sin(d) * Math.cos(p) - Math.cos(d) * Math.sin(p) * Math.cos(H));
    return {alt: alt / R, az: norm(az / R)};
  }
  function sun(ms, site){ const [ra, dec] = eq(sunEcl(days(ms)), 0); return Object.assign(altaz(ra, dec, ms, site), {ra, dec}); }
  function moon(ms, site){
    const [l, b] = moonEcl(days(ms)), [ra, dec] = eq(l, b), h = altaz(ra, dec, ms, site);
    h.alt -= 0.9508 * Math.cos(h.alt * R); // 视差，地心→站心
    return Object.assign(h, {ra, dec});
  }
  function illum(ms){ const n = days(ms); const e = norm(moonEcl(n)[0] - sunEcl(n)); return (1 - Math.cos(e * R)) / 2; }
  function waxing(ms){ const n = days(ms); return norm(moonEcl(n)[0] - sunEcl(n)) < 180; }
  function sep(ra1, dec1, ra2, dec2){
    const c = Math.sin(dec1 * R) * Math.sin(dec2 * R) + Math.cos(dec1 * R) * Math.cos(dec2 * R) * Math.cos((ra1 - ra2) * R);
    return Math.acos(U.clamp(c, -1, 1)) / R;
  }
  /* 一个观测夜（北京时间日期 D 的傍晚到次日早晨）的日落、暗夜起止、日出、月升月落、照明 */
  const nightCache = new Map();
  function night(dateStr, site, sunMax){
    const key = dateStr + "|" + sunMax + "|" + site.lat_deg;
    if (nightCache.has(key)) return nightCache.get(key);
    const t0 = U.dayMs(dateStr) + 9 * 3600e3, step = 5 * 6e4, N = 16 * 12; // 北京 17:00 起 16 小时
    const sa = [], ma = [];
    for (let k = 0; k <= N; k++) { const t = t0 + k * step; sa.push(sun(t, site).alt); ma.push(moon(t, site).alt); }
    const at = k => t0 + k * step;
    const crossDown = (arr, lvl) => { for (let j = 1; j < arr.length; j++) if (arr[j - 1] >= lvl && arr[j] < lvl) return at(j - 1 + (arr[j - 1] - lvl) / (arr[j - 1] - arr[j])); return null; };
    const crossUpLast = (arr, lvl) => { for (let j = arr.length - 1; j > 0; j--) if (arr[j] >= lvl && arr[j - 1] < lvl) return at(j - 1 + (lvl - arr[j - 1]) / (arr[j] - arr[j - 1])); return null; };
    const res = {date: dateStr, sunset: crossDown(sa, -0.83), dusk: crossDown(sa, sunMax), dawn: crossUpLast(sa, sunMax), sunrise: crossUpLast(sa, -0.83)};
    // 月亮在地平线上的时段（只取暗夜内）
    // 月亮在地平线上的时段（只取暗夜内）：先找全部升落时刻，再与暗夜求交
    const up = []; let st = ma[0] > 0 ? at(0) : null;
    for (let k = 1; k <= N; k++) {
      if (ma[k - 1] <= 0 && ma[k] > 0) st = at(k - 1 + -ma[k - 1] / (ma[k] - ma[k - 1]));
      if (ma[k - 1] > 0 && ma[k] <= 0 && st != null) { up.push([st, at(k - 1 + ma[k - 1] / (ma[k - 1] - ma[k]))]); st = null; }
    }
    if (st != null) up.push([st, at(N)]);
    const iv = [];
    if (res.dusk != null && res.dawn != null) for (const [a, b] of up) { const s = Math.max(a, res.dusk), e = Math.min(b, res.dawn); if (e > s) iv.push([s, e]); }
    res.moonUp = iv;
    res.moonrise = (() => { for (let j = 1; j <= N; j++) if (ma[j - 1] <= 0 && ma[j] > 0) return at(j - 1 + -ma[j - 1] / (ma[j] - ma[j - 1])); return null; })();
    res.moonset = (() => { for (let j = 1; j <= N; j++) if (ma[j - 1] > 0 && ma[j] <= 0) return at(j - 1 + ma[j - 1] / (ma[j - 1] - ma[j])); return null; })();
    const mid = U.dayMs(dateStr) + 16 * 3600e3;
    res.illum = illum(mid); res.waxing = waxing(mid);
    res.darkMin = res.dusk != null && res.dawn != null ? (res.dawn - res.dusk) / 6e4 : 0;
    res.moonMin = iv.reduce((a, v) => a + (v[1] - v[0]) / 6e4, 0);
    nightCache.set(key, res);
    return res;
  }
  return {sun, moon, altaz, illum, sep, night};
})();

/* ==== 30-shell.js ==== */
"use strict";
/* 顶栏与抽屉（数据来源 / 操作人） */
/* 三组：准备（选源、填表）｜计划（全年、当夜、告警）｜事后（回报、审核）。null 是组间分隔 */
const NAV = [["windows", "源与窗口"], ["inputs", "源表与输入"], null, ["year", "全年"], ["tonight", "当夜"], ["alert", "告警"], null, ["report", "回报与账本"], ["audit", "审核"]];

const Shell = {
  /* 计划说明里常常逐段列出停观时刻（“11-03 20:37:00 至 11-03 20:56:31 天气停观 F32；…”）：页面上只写段数和分钟，逐段放悬停 */
  shortNote(text){
    const s = String(text || ""), re = /(\d{2}-\d{2}) (\d{2}:\d{2})(?::\d{2})? 至 (\d{2}-\d{2}) (\d{2}:\d{2})(?::\d{2})?/g;
    const seg = [...s.matchAll(re)];
    if (seg.length < 2) return U.esc(s);
    const y = String(Data.night()).slice(0, 4), ms = (d, t) => Date.parse(`${y}-${d}T${t}:00+08:00`);
    const mins = seg.reduce((a, m) => a + Math.max(0, (ms(m[3], m[4]) - ms(m[1], m[2])) / 6e4), 0);
    const head = s.slice(0, seg[0].index).replace(/[·\s（(北京时间)）]+$/u, "").trim();
    return `<span title="${U.esc(s)}">${U.esc(head || "计划了、没观测到")} · ${seg.length} 段，共 ${U.n(mins, 0)} 分钟<span class="muted">（悬停看逐段时刻）</span></span>`;
  },
  /* 逐夜回放的最后一夜是“今晚”：写明是今晚的计划和结果导出时刻 */
  tonightTag(w){
    if (!Data.replayView || !/-today/.test(String(w?.id || "")) && w?.meta?.version_label !== "当夜计划") return "";
    const g = U.ms(Data.replayView.generated_utc), cutoff = U.ms(Data.replayView.gcn_cutoff_utc);
    const moment = value => U.md(U.ymd(value)) + " " + U.hm(value);
    const timestamps = [cutoff != null ? "GCN 数据截至 " + moment(cutoff) : "", g != null ? "结果导出于 " + moment(g) : ""].filter(Boolean).join(" · ");
    return `<span class="pill" style="background:var(--accent-soft);color:var(--accent);font-weight:600">今晚</span>${timestamps ? `<span class="small muted">${timestamps}（北京时间）</span>` : ""}`;
  },
  /* 结果在页面上的名字：逐夜回放只写日期（今晚加“今晚”），不写“原计划 / 告警插入版 / 修正复验”这类版本名 */
  wsLabel(w){
    if (!w) return "";
    if (!Data.replayView) return w.label || "";
    const d = Data.workspaceNight(w) || w.meta?.date || "";
    return d + (Shell.tonightTag(w) ? " · 今晚" : "");
  },
  /* 计划说明去掉开头的版本名（“当夜计划 · …”），修正版自带的版本说明不显示 */
  planNote(w){
    const note = String(w?.meta?.planning_note || "");
    if (!note || String(w?.id || "").startsWith("correction:")) return "";
    const label = w.meta?.version_label;
    return label && note.startsWith(label) ? note.slice(label.length).replace(/^\s*·\s*/, "") : note;
  },
  replayNote(w){
    if(Data.replayView && !Data.isReplay(w)) {
      const note = Shell.planNote(w), tag = Shell.tonightTag(w);
      return note || tag ? `<p class="note" data-wb-replay-note>${tag} ${note ? Shell.shortNote(note) : ""}</p>` : "";
    }
    if(!Data.isReplay(w))return "";
    const info=w.meta.replay, closure=info.closure_utc, note=Shell.planNote(w), tag=Shell.tonightTag(w);
    const weather=Array.isArray(closure)&&closure.length===2&&closure.every(t=>U.ms(t)!=null)
      ? `<span class="pill sim" title="${U.esc(info.weather_note || "模拟天气")}">模拟天气停观 ${U.span(...closure)}</span>` : "";
    if (!weather && !note && !tag) return "";
    return `<p class="note" data-wb-replay-note style="margin:0 0 12px">${tag}${weather}${weather && note ? " · " : ""}${note ? Shell.shortNote(note) : ""}</p>`;
  },
  /* 有结果的夜：日期 → 这一夜有哪些版本（计划 / 回放） */
  knownNights(){
    const by = new Map();
    for (const item of Data.list) {
      const day = Data.workspaceNight(item);
      if (!U.isDay(day)) continue;
      const row = by.get(day) || {date: day, plans: 0, replay: 0};
      if (Data.isReplay(item)) row.replay++;
      if (!Data.isReplay(item) || item.meta?.plan_id) row.plans++;
      by.set(day, row);
    }
    return [...by.values()].sort((x, y) => y.date.localeCompare(x.date));
  },
  weekday(date){ return "周" + "日一二三四五六"[new Date(date + "T00:00:00Z").getUTCDay()]; },
  /* 每一夜的标记：有计划、已观测（实际 / 模拟）、天气停观（全夜 / 部分）、GCN 通报。都从已读入的结果和回放索引里取，不另算 */
  nightMarks(workspaces = Data.list){
    const by = new Map(), seen = new Set();
    const get = d => { if (!by.has(d)) by.set(d, {date: d, plans: 0, replay: 0, observed: null, weather: null, weatherNote: "", skipped: 0, simMin: null, planMin: null, gcn: [], gcnInserted: false, too: new Map()}); return by.get(d); };
    for (const w of workspaces) {
      const d = Data.workspaceNight(w);
      if (!U.isDay(d)) continue;
      const m = get(d);
      if (!Data.isReplay(w) || w.meta?.plan_id) m.plans++;
      for (const event of w.meta?.too || []) {
        const kind = event.source?.toLowerCase();
        if (event.synthetic === true && Shell.simTooLabels[kind]) m.too.set(event.event_id, kind);
      }
      if (Data.isReplay(w)) {
        const r = w.meta?.replay || {};
        m.replay++;
        m.simMin = r.simulated_on_union_min; m.planMin = r.planned_on_union_min;
        const skipped = (r.skipped_run_ids || []).length, shortened = (r.shortened_run_ids || []).length;
        const none = U.fin(r.simulated_on_union_min) && r.simulated_on_union_min <= 0;
        if (!none && m.observed !== "real") m.observed = "sim";
        if (none && (!Data.replayView || Array.isArray(r.closure_utc))) m.weather = "full";
        else if ((Array.isArray(r.closure_utc) && r.closure_utc.length) || skipped || shortened) m.weather = "part";
        m.weatherNote = r.weather_note || ""; m.skipped = skipped;
        // Older published shadow indexes only store admissions on the selected plan's notice summary.
        const inserted = r.gcn_inserted ?? (r.gcn || []).some(g =>
          g.decision === "admitted_run_boundary" || g.decision === "admitted_interrupt");
        if (w.meta?.preferred === true && inserted) m.gcnInserted = true;
        for (const g of r.gcn || []) {
          const day = U.isDay(g.date) ? g.date : d, key = day + "|" + (g.event || g.circular);
          if (!seen.has(key)) { seen.add(key); get(day).gcn.push(g); }
        }
      } else {
        const reps = w.reports?.reports || [];
        if (w.reports && w.reports.synthetic !== true && reps.some(x => x.simulation !== true)) m.observed = "real";
      }
    }
    return by;
  },
  markText(m){
    if (!m) return "";
    const decision = {rejected: "已筛掉", needs_information: "缺信息", accepted: "已接收", approved: "已批准"};
    return [
      m.plans ? "有计划" : "",
      m.observed === "real" ? "已观测（实际回报）" : m.observed === "sim"
        ? `已执行（模拟）${U.fin(m.simMin) && U.fin(m.planMin) ? " " + U.n(m.simMin, 0) + " / " + U.n(m.planMin, 0) + " 分钟" : ""}` : "",
      m.weather === "full" ? "天气停观，整夜没观测" : m.weather === "part" ? `部分停观${m.weatherNote ? "：" + m.weatherNote : ""}${m.skipped ? `，${m.skipped} 段没观测` : ""}` : "",
      ...[...m.too.values()].map(kind => Shell.simTooLabels[kind]),
      m.gcnInserted ? "GCN 已排入当夜计划（回放）" : m.gcn.length ? "仅有 GCN 通报，未排入当夜计划" : "",
      m.gcn.length ? "通报：" + m.gcn.map(g => g.event + (decision[g.decision] ? "（" + decision[g.decision] + "）" : "")).join("、") : "",
    ].filter(Boolean).join("\n");
  },
  simTooLabels: {grb:"模拟 GRB",neutrino:"模拟中微子"},
  calIcon(kind){
    if (kind === "sim-grb") return '<svg class="cm cm-grb cm-sim-grb" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0L1.5 5.8h3L4 10l4.5-6H5.8L7 0z"/></svg>';
    if (kind === "sim-neutrino") return '<svg class="cm cm-neutrino cm-sim-neutrino" width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path fill="none" stroke="var(--cat-fermi)" stroke-width="1.5" d="M5 1.3 8.7 5 5 8.7 1.3 5z"/><circle fill="var(--cat-fermi)" cx="5" cy="5" r="1.1"/></svg>';
    if (kind === "plan") return '<i class="cm cm-plan" aria-hidden="true"></i>';
    if (kind === "cloud" || kind === "cloud-part")
      return `<svg class="cm cm-cloud${kind === "cloud-part" ? " part" : ""}" viewBox="0 0 12 8" aria-hidden="true"><path d="M3.4 7.4h5.8a2.3 2.3 0 0 0 .1-4.6A3.1 3.1 0 0 0 3.3 3.3a2.05 2.05 0 0 0 .1 4.1z"/></svg>`;
    if (kind === "gcn-notice" || kind === "gcn-inserted")
      return `<svg class="cm cm-grb" data-gcn-state="${kind.slice(4)}" viewBox="-1 -1 12 12" aria-hidden="true"><path d="M5 0l1.3 3.7L10 5 6.3 6.3 5 10 3.7 6.3 0 5l3.7-1.3z"/></svg>`;
    return "";
  },
  /* 观测夜日历：一月一屏，周一开头；格子底色 = 已观测（斜纹为模拟），下面一排小记号 = 计划 / 停观 / GCN */
  calendar(ym){
    const date = Data.night(), today = Data.replayView?.default_date || U.ymd(Date.now());
    ym = /^\d{4}-\d{2}$/.test(ym || "") ? ym : date.slice(0, 7);
    const [y, mo] = ym.split("-").map(Number);
    const first = new Date(Date.UTC(y, mo - 1, 1)), days = new Date(Date.UTC(y, mo, 0)).getUTCDate();
    const lead = (first.getUTCDay() + 6) % 7, marks = Shell.nightMarks();
    const shift = k => { const t = new Date(Date.UTC(y, mo - 1 + k, 1)); return t.toISOString().slice(0, 7); };
    const cells = [];
    for (let i = 0; i < lead; i++) cells.push('<span class="ncal-pad"></span>');
    for (let d = 1; d <= days; d++) {
      const day = `${ym}-${String(d).padStart(2, "0")}`, m = marks.get(day);
      const icons = m ? (m.plans ? Shell.calIcon("plan") : "") + (m.weather ? Shell.calIcon(m.weather === "full" ? "cloud" : "cloud-part") : "") + (m.gcnInserted ? Shell.calIcon("gcn-inserted") : m.gcn.length ? Shell.calIcon("gcn-notice") : "") + [...new Set(m.too.values())].map(kind => Shell.calIcon("sim-" + kind)).join("") : "";
      const cls = ["ncal-d", m?.observed === "real" ? "obs" : m?.observed === "sim" ? "obs sim" : "", m?.weather === "full" ? "wx" : "",
        day === date ? "sel" : "", day === today ? "today" : "", m ? "has" : ""].filter(Boolean).join(" ");
      const tip = `${day} ${Shell.weekday(day)}${day === today ? " · 今天" : ""}${m ? "\n" + Shell.markText(m) : ""}`;
      cells.push(`<button type="button" class="${cls}" data-act="chooseNight" data-arg="${day}" title="${U.esc(tip)}" aria-label="${U.esc(tip.replace(/\n/g, "；"))}"${day === date ? ' aria-current="date"' : ""}><span class="ncal-n num">${d}</span><span class="ncal-m">${icons}</span></button>`);
    }
    const inMonth = [...marks.values()].filter(m => m.date.startsWith(ym)).length;
    const other = [...marks.keys()].filter(d => !d.startsWith(ym)).sort();
    const before = other.filter(d => d < ym).pop(), after = other.find(d => d > ym);
    return `<div class="ncal" data-ncal="${ym}">
      <div class="ncal-h">
        <button type="button" class="ncal-nav" data-act="calMonth" data-arg="${shift(-1)}" aria-label="上个月">‹</button>
        <b>${y} 年 ${mo} 月</b>
        <button type="button" class="ncal-nav" data-act="calMonth" data-arg="${shift(1)}" aria-label="下个月">›</button>
      </div>
      <div class="ncal-grid" role="group" aria-label="${y} 年 ${mo} 月的观测夜">${"一二三四五六日".split("").map(c => `<span class="ncal-wd">${c}</span>`).join("")}${cells.join("")}</div>
      ${inMonth ? "" : `<p class="ncal-empty small muted">这个月没有读入的结果。${before ? `<button type="button" class="linkbtn" data-act="calMonth" data-arg="${before.slice(0, 7)}">← ${before.slice(0, 7)}</button>` : ""} ${after ? `<button type="button" class="linkbtn" data-act="calMonth" data-arg="${after.slice(0, 7)}">${after.slice(0, 7)} →</button>` : ""}</p>`}
      <div class="ncal-legend small muted">
        <span><i class="ncal-sw obs" aria-hidden="true"></i>已观测</span><span><i class="ncal-sw obs sim" aria-hidden="true"></i>模拟执行</span>
        <span>${Shell.calIcon("plan")}有计划</span><span>${Shell.calIcon("cloud")}天气停观</span><span>${Shell.calIcon("cloud-part")}部分停观</span>${[...marks.values()].some(m => m.gcn.length || m.gcnInserted) ? `<span>${Shell.calIcon("gcn-notice")}仅有 GCN 通报</span><span>${Shell.calIcon("gcn-inserted")}GCN 已排入计划</span>` : ""}
        ${Object.entries(Shell.simTooLabels).filter(([kind]) => [...marks.values()].some(m => m.date.startsWith(ym) && [...m.too.values()].includes(kind)))
          .map(([kind,label]) => `<span>${Shell.calIcon("sim-" + kind)}${label}</span>`).join("")}
      </div>
    </div>`;
  },
  /* 没有内容的页面用：列出有结果的夜，点一下就过去 */
  nightChips(lead = "有结果的夜："){
    const nights = Shell.knownNights();
    if (!nights.length) return "";
    return `<div class="night-chips"><span class="small muted">${lead}</span>${nights.slice(0, 8).map(n =>
      `<button type="button" class="chip" data-act="chooseNight" data-arg="${n.date}"><b class="num">${n.date}</b> <span class="muted">${n.plans ? "计划" : ""}${n.plans && n.replay ? " · " : ""}${n.replay ? "回放" : ""}</span></button>`).join("")}</div>`;
