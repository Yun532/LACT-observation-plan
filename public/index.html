    key: null, rows: [], total: 0, waiting: false, error: null};
  const bayer = s => (String(s.name || "").replace(/^\*+\s*/, "").match(/^([a-z]+\.?)\d{0,2} ([A-Z][a-zA-Z]{2})\b/) || []).slice(1).join(" ");
  const label = s => {

  const deg = v => String(v).replace("-", "−") + "°";

  /* 月亮：这一晚（北京时间 18:00—次日 08:00）每 5 分钟的高度、在地平线上的时段（高度 0° 处插值）和照明。
     手排图（53-manual.js）也用它画月亮的天顶角曲线和底色。 */
  const moonMemo = new Map();
  function moonTrack(date) {
    if (moonMemo.has(date)) return moonMemo.get(date);
    let out = null;
    try {
      const site = WBPolicy.get("site"), [a, b] = WBPolicy.bounds(date), step = 5 * 60e3;
      const obs = new Astronomy.Observer(site.lat_deg, site.lon_deg, site.height_m), pts = [];
      for (let t = a; t <= b + 1; t += step) {
        const T = Astronomy.MakeTime(new Date(t)), eq = Astronomy.Equator("Moon", T, obs, true, true);
        pts.push({t, alt: Astronomy.Horizon(T, obs, eq.ra, eq.dec, "").altitude});
      }
      const cross = (p, q) => p.t + (0 - p.alt) / (q.alt - p.alt) * (q.t - p.t);
      const up = [];
      let start = pts[0].alt >= 0 ? a : null;
      for (let i = 1; i < pts.length; i++) {
        const p = pts[i - 1], q = pts[i];
        if (p.alt < 0 && q.alt >= 0) start = cross(p, q);
        if (p.alt >= 0 && q.alt < 0 && start != null) { up.push([start, cross(p, q)]); start = null; }
      }
      if (start != null) up.push([start, pts.at(-1).t]);
      const illum = Astronomy.Illumination("Moon", new Date((a + b) / 2)).phase_fraction, parts = [];
      for (const [u, v] of up) {
        if (u > a + 1) parts.push("月升 " + U.hm(u));
        if (v < pts.at(-1).t - 1) parts.push("月落 " + U.hm(v));
      }
      if (!up.length) parts.push("月亮整夜在地平线下");
      else if (!parts.length) parts.push("月亮整夜在天上");
      out = {pts, up, illum, text: parts.join("，") + "，照明 " + Math.round(illum * 100) + "%"};
    } catch (e) { out = null; }
    if (moonMemo.size > 60) moonMemo.clear();
    moonMemo.set(date, out);
    return out;
  }
  const moon = date => moonTrack(date)?.text || "";

  function compute(date) {
    const all = WBAtlas.starRows() || [], key = date + "|" + state.vmax + "|" + JSON.stringify(COND);

    const list = all.filter(s => U.fin(s.mag) && s.mag <= state.vmax);
    const rows = list.length ? WBGeo.night(date, list, preview(), false) : [];
    const byId = new Map(list.map(s => [s.id, s]));

  function axis(date) {

      return x == null || y == null || y <= x ? "" : `<i style="left:${x.toFixed(2)}%;width:${(y - x).toFixed(2)}%"></i>`; }).join("");
    const best = pct(r.best_utc);

    const moonUp = (moonTrack(r.night_local_date)?.up || []).map(([u, v]) => { const x = pct(u), y = pct(v);
      return x == null || y == null || y <= x ? "" : `<em class="sii-moon" style="left:${x.toFixed(2)}%;width:${(y - x).toFixed(2)}%"></em>`; }).join("");
    return `<span class="win-track" aria-hidden="true">${moonUp}${bars}${best == null ? "" : `<b style="left:${best.toFixed(2)}%"></b>`}</span>`;
  }
  const dur = m => m >= 60 ? `${Math.floor(m / 60)} h ${String(Math.round(m % 60)).padStart(2, "0")}` : `${Math.round(m)} 分`;

  function card(date) {
    if (typeof WBAtlas === "undefined" || typeof WBGeo === "undefined" || !WBPolicy.display()) return "";
    // 收起时：星表已经读进来（台站天空会读）就顺手写一句今晚能看几颗，不为这个去读星表
    let teaser = "";
    if (!state.open && WBAtlas.starRows()) { compute(date); teaser = ` · V ≤ ${state.vmax} 能看 ${state.rows.filter(r => r.geometry_min > 0).length} 颗`; }
    else if (!state.open && WBAtlas.starsLoading() && !state.waiting) {
      state.waiting = true;
      WBAtlas.loadStars().then(() => { state.waiting = false; App.render("windowStars"); }).catch(() => { state.waiting = false; });
    }
    const head = `<div class="card-h sii-head"><h2>这一晚能看哪些亮星</h2><span class="note">恒星强度干涉用${teaser}</span><span class="win-grow"></span>
      <button type="button" class="win-more" data-act="siiOpen" aria-expanded="${state.open}">${state.open ? "收起 ▴" : "展开 ▾"}</button></div>`;
    if (!state.open) return head;
    const controls = `<p class="note">只看几何（太阳、天顶角、离月），月光下也算能看。</p><div class="win-controls">
        <label>星等<select data-change="siiLimit">${LIMITS.map(v => `<option value="${v}"${v === state.vmax ? " selected" : ""}>V ≤ ${v}</option>`).join("")}</select></label>
        <label>排序<select data-change="siiSort">${[["start", "开始早"], ["mag", "最亮"], ["duration", "可见时间长"], ["zenith", "天顶角小"]]
          .map(([k, l]) => `<option value="${k}"${k === state.sort ? " selected" : ""}>${l}</option>`).join("")}</select></label>
        <label class="win-check"><input type="checkbox" data-change="siiInvisible"${state.invisible ? " checked" : ""}>也列出看不到的</label></div>`;
    if (!WBAtlas.starRows()) {
      if (!state.waiting) {
        state.waiting = true;
        WBAtlas.loadStars().then(() => { state.waiting = false; App.render("windowStars"); })
          .catch(e => { state.waiting = false; state.error = e?.message || String(e); App.render("windowStars"); });
      }
      return head + controls + `<p class="note" role="status">${state.error ? `<span class="danger">亮星表读不到：${U.esc(state.error)}</span>` : "正在读亮星表…"}</p>`;
    }
    compute(date);
    const ev = WBGeo.solarEvents(date), m = moon(date);
    const value = r => state.sort === "mag" ? r.star.mag : state.sort === "duration" ? -r.geometry_min :
      state.sort === "zenith" ? (r.best_zenith_deg ?? Infinity) : (U.ms(r.start_utc) ?? Infinity);
    const seen = state.rows.filter(r => r.geometry_min > 0);
    const shown = (state.invisible ? state.rows : seen).slice().sort((a, b) => value(a) - value(b) || a.star.mag - b.star.mag);
    const page = shown.slice(0, PAGE * state.page);
    const span = WBPolicy.bounds(date).map(t => U.hm(new Date(t).toISOString()));
    const plan = typeof WBManual !== "undefined" && WBManual.enabled();   // 公开版才有手排
    const info = [ev.darkStart && ev.darkEnd ? `天黑 ${U.hm(ev.darkStart)}—${U.hm(ev.darkEnd)}（太阳低于 ${deg(COND.sun)}）` : "这一晚没有太阳低于 " + deg(COND.sun) + " 的时段", m,
      `条件（占位）：天顶角 ≤ ${COND.zenith}°，月亮在地平线上时离月 ≥ ${COND.moon}°`, moonTrack(date)?.up?.length ? "时段条上灰蓝底是月亮在天上" : ""].filter(Boolean).join(" · ");
    return head + controls + `<p class="note">${U.esc(info)}</p>
      ${shown.length ? `<div class="scroll-x win-table-wrap"><table class="win-table sii-table"><thead><tr><th>星</th><th class="num">V</th>
        <th class="win-trackcell">可见时段 <span class="muted" style="font-weight:400">${span.join("—")}</span>${axis(date)}</th>
        <th class="num">时长</th><th class="num" title="可见时段里天顶角最小（星最高）的时刻">最小天顶角</th><th class="num">最小离月</th>${plan ? "<th></th>" : ""}</tr></thead><tbody>
        ${page.map(r => `<tr${r.geometry_min > 0 ? "" : ' class="sii-off"'}>
          <th scope="row">${U.esc(label(r.star))}</th><td class="num">${U.n(r.star.mag, 2)}</td>
          <td class="win-trackcell">${track(r)}<span class="tiny muted num">${r.windows?.length ? U.esc(r.windows.map(w => U.span(w.start_utc, w.end_utc)).join("、")) : U.esc(r.blocking || "看不到")}</span></td>
          <td class="num">${r.geometry_min > 0 ? dur(r.geometry_min) : "—"}</td>
          <td class="num" title="可见时段里天顶角最小的时刻">${U.fin(r.best_zenith_deg) ? `${U.n(r.best_zenith_deg, 0)}° · ${U.hm(r.best_utc)}` : "—"}</td>
          <td class="num">${U.fin(r.min_moon_sep_deg) ? U.n(r.min_moon_sep_deg, 0) + "°" : "—"}</td>
          ${plan ? `<td>${r.geometry_min > 0 ? `<button type="button" class="btn" data-act="mpAddStar" data-arg="${U.esc(r.id)}" title="放进上面“手排这一晚”的第一个空档">排入</button>` : ""}</td>` : ""}</tr>`).join("")}</tbody></table></div>` :
        `<p class="note">V ≤ ${state.vmax} 的亮星这一晚都看不到。</p>`}
      <div class="win-pagination"><span class="muted">全天 V ≤ ${state.vmax} 共 ${state.total} 颗，这一晚能看 ${seen.length} 颗 · 页面计算，1 分钟步长</span><span class="win-grow"></span>
        ${page.length < shown.length ? `<button type="button" class="btn" data-act="siiMore">再显示 ${Math.min(PAGE, shown.length - page.length)} 颗</button>` : ""}</div>`;
  }

  App.acts.siiLimit = v => { state.vmax = +v; U.store.set("sii-vmax", state.vmax); App.render("windowStars"); };
  App.acts.siiSort = v => { state.sort = v; U.store.set("sii-sort", v); state.page = 1; App.render("windowStars"); };
  App.acts.siiInvisible = (v, el) => { state.invisible = !!el?.checked; state.page = 1; App.render("windowStars"); };
  App.acts.siiMore = () => { state.page++; App.render("windowStars"); };
  App.acts.siiOpen = () => { state.open = !state.open; App.render("windowStars"); };
  // 给手排用：可见条件，和按 id 取一颗星（名字用表里同样的写法）
  function star(id) {
    const s = (WBAtlas.starRows() || []).find(x => x.id === id);
    return s ? {id: s.id, name: label(s), ra_deg: s.ra_deg ?? s.ra, dec_deg: s.dec_deg ?? s.dec, kind: "star", mag: s.mag} : null;
  }
  return {card, COND, preview, star, moonTrack};
})();

App.init();
</script>
</body>
</html>
